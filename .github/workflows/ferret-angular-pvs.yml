name: Ferret directional PVS - independent exact rejection experiment
on:
  pull_request:
    branches: [research-ferret-r09-reference-2dfd468]
    types: [opened, synchronize, reopened, edited]
    paths: ['.github/workflows/ferret-angular-pvs.yml','research/ferret-native/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ferret-angular-pvs-x360
  cancel-in-progress: true
jobs:
  x360:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research-ferret-angular-pvs-20261126')
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare private matched R04 and Alpha2 pose sets
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root="$HOME/.local/share/ferret-research"
          private="$root/angular-pvs/$GITHUB_RUN_ID"
          out="$RUNNER_TEMP/ferret-angular-pvs-$GITHUB_RUN_ID"
          mkdir -p "$private" "$out/public"
          echo "PRIVATE=$private" >> "$GITHUB_ENV"
          echo "OUT=$out" >> "$GITHUB_ENV"
          echo "ROOT=$root" >> "$GITHUB_ENV"
          echo "GCC68=$HOME/mars/m68k-elf/bin/m68k-elf-gcc" >> "$GITHUB_ENV"
          src="$root/r04/45818948354/dread"
          for v in r04-base r04-angle r04-legacy r04-base-screen r04-angle-screen alpha-base alpha-angle alpha-base-screen alpha-angle-screen alpha-sram; do
            mkdir -p "$private/$v"
            cp "$src/scene.h" "$src/scene.json" "$private/$v/"
          done
          python3 - "$private" <<'PY'
          import pathlib,re,sys
          root=pathlib.Path(sys.argv[1])
          poses=[(1056,-3616,41,90)]+[(2980,-3286,17,a) for a in (0,270,180,90)]
          poses=[p for p in poses for _ in range(2)]+[poses[0]]*2
          for d in root.glob("alpha-*"):
              path=d/"scene.h";h=path.read_text()
              s="static const int16_t sc_poses[48] = {\n"+",".join(str(z) for p in poses for z in p)+",\n};"
              h,n=re.subn(r"static const int16_t sc_poses\[48\] = \{[^}]*\};",s,h);assert n==1
              path.write_text(h)
          PY
      - name: Compile angle masks and all R09 control variants
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for n in 8 16 32; do
            python3 research/ferret-native/angular_pvs.py "$PRIVATE/r04-base/scene.h" "$PRIVATE/angle-$n.h" "$OUT/public/angle-$n.json" --bins "$n"
          done
          for v in r04-base r04-angle r04-legacy r04-base-screen r04-angle-screen alpha-base alpha-angle alpha-base-screen alpha-angle-screen alpha-sram; do
            flags=""
            case "$v" in
              *-angle*) flags="-DFR_ANGLE_PVS";;
              r04-legacy) flags="-DFR_ANGLE_PVS -DFR_SKY_LEGACY";;
              alpha-sram) flags="-DFR_FORCE_SRAM";;
            esac
            case "$v" in *-screen|r04-legacy) ;; *) flags="$flags -DFR_BENCH";; esac
            cp "$PRIVATE/angle-16.h" "$PRIVATE/$v/scene_angle.h"
            FR_EXTRA_CFLAGS="$flags" python3 research/ferret-native/build_demo.py "$PRIVATE/$v" "$GCC68" --label "FERRET-MD R09 $v"
            cp "$PRIVATE/$v/build.json" "$OUT/public/$v-build.json"
          done
          play="$ROOT/playtest/R09-audit-$GITHUB_RUN_ID"
          mkdir -p "$play"
          cp "$PRIVATE/r04-base/FERRET-MD-R01.bin" "$play/FERRET-MD-R09-BENCH.bin"
          cp "$PRIVATE/r04-base-screen/FERRET-MD-R01.bin" "$play/FERRET-MD-R09-VERIFY.bin"
          cp "$PRIVATE/r04-angle/FERRET-MD-R01.bin" "$play/FERRET-MD-R09-ANGLE-BENCH.bin"
      - name: Full state differential and counts per pose
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 research/ferret-native/test_angular_pvs.py "$PRIVATE/r04-base" "$PRIVATE/r04-angle" "$OUT/public/differential.json"
          python3 - "$PRIVATE" "$OUT/public/pose-census.json" <<'PY'
          import sys,json,pathlib
          sys.path.insert(0,"research/ferret-native")
          from test_angular_pvs import load
          from angular_pvs import arr
          p,o=map(pathlib.Path,sys.argv[1:]);result={}
          for group in ("r04","alpha"):
              a,ga=load(p/(group+"-base"));b,gb=load(p/(group+"-angle"))
              poses=arr((p/(group+"-base")/"scene.h").read_text(),"sc_poses").reshape(-1,4).tolist()
              rows=[]
              for i,v in enumerate(poses):
                  ra,sa,ma,ca=ga(v);rb,sb,mb,cb=gb(v)
                  assert ra==rb==0 and sa==sb and ma["projected"]==mb["projected"],(group,i)
                  rows.append({"pose":i,"camera":v,"candidates_before":ma["candidates"],"candidates_after":mb["candidates"],"removed":ma["candidates"]-mb["candidates"],"project_calls_before":ca,"project_calls_after":cb,"projected":ma["projected"]})
              result[group]=rows
          o.write_text(json.dumps(result,indent=2));print("R09 POSE CENSUS "+json.dumps(result))
          PY
      - name: Exact MAME render timing before and after
        shell: bash
        run: |
          set -euo pipefail
          export SDL_VIDEODRIVER=dummy
          for v in r04-base r04-angle alpha-base alpha-angle; do
            timeout 180 "$(command -v mame)" genesis -cart "$PRIVATE/$v/FERRET-MD-R01.bin" -video none -sound none -nothrottle -skip_gameinfo -seconds_to_run 300 -autoboot_script "$GITHUB_WORKSPACE/research/ferret-native/mame_render_time.lua" 2>&1 | grep RENDER_TIMES | sed "s/^/$v /" | tee -a "$OUT/public/render-times.txt"
          done
      - name: MAME actual screenshot and legacy mailbox parity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export SDL_VIDEODRIVER=dummy FR_POSES=12
          for v in r04-base-screen r04-angle-screen r04-legacy alpha-base-screen alpha-angle-screen; do
            export FR_SCREEN_DIR="$PRIVATE/$v"
            timeout 180 "$(command -v mame)" genesis -cart "$PRIVATE/$v/FERRET-MD-R01.bin" -video none -sound none -nothrottle -skip_gameinfo -seconds_to_run 300 -autoboot_script "$GITHUB_WORKSPACE/research/ferret-native/mame_r01.lua" > "$PRIVATE/$v/mame.log" 2>&1 || true
            python3 research/ferret-native/check_mame.py "$PRIVATE/$v" "$PRIVATE/$v/mame.log" "$OUT/public/$v-mame.json"
          done
          python3 - "$PRIVATE" "$ROOT/r04/45818948354/dread" "$OUT/public/screen-parity.json" <<'PY'
          import json,pathlib,sys
          from PIL import Image
          p,old,out=map(pathlib.Path,sys.argv[1:]);r={}
          def mailbox(d):
              return [[int(v,16) for v in s.split()[2:19]] for s in (d/"mame.log").read_text(errors="replace").splitlines() if s.startswith("PUBLISHED ")]
          def screen(a,b):
              x=Image.open(a).convert("RGB");y=Image.open(b).convert("RGB")
              assert x.size==y.size
              return sum(u!=v for u,v in zip(x.getdata(),y.getdata()))
          for group in ("r04","alpha"):
              a=p/(group+"-base-screen");b=p/(group+"-angle-screen");aa,bb=mailbox(a),mailbox(b)
              assert len(aa)==len(bb)==12
              diffs=[screen(a/f"pose-{i}.png",b/f"pose-{i}.png") for i in range(12)]
              assert not any(diffs),(group,diffs)
              assert all(all(x[k]==y[k] for k in range(17) if k!=7) for x,y in zip(aa,bb))
              r[group]={"screen_pixel_diffs":diffs,"candidate_counter_changes":[x[7]-y[7] for x,y in zip(aa,bb)]}
          a,b=mailbox(old),mailbox(p/"r04-legacy")
          assert len(a)==len(b)==12
          # Candidate count must change; state and image fields must not.
          assert all(all(x[k]==y[k] for k in range(17) if k!=7) for x,y in zip(a,b)),[(i,[k for k in range(17) if x[k]!=y[k]]) for i,(x,y) in enumerate(zip(a,b))]
          r["r04_legacy"]={"mailbox_equal_except_candidate_counter":12}
          out.write_text(json.dumps(r,indent=2));print("R09 SCREEN PARITY "+json.dumps(r))
          PY
      - name: Build same GPGX instrumented master-clock profiler
        if: always() && env.OUT != ''
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/ekeeke/Genesis-Plus-GX.git "$OUT/core"
          git -C "$OUT/core" checkout 2499cd3e3d1d8b7d0130d8b2825adb4cc608b2c0
          git -C "$OUT/core" apply --ignore-whitespace "$GITHUB_WORKSPACE/experiments/DREAD_MD/d01/gameplay/ferret/emulator-instrumentation.patch"
          python3 research/ferret-native/r09_gpgx_time.py patch "$OUT/core"
          make -C "$OUT/core" -f Makefile.libretro -j3 platform=unix > "$OUT/build-core.log" 2>&1 || { tail -60 "$OUT/build-core.log"; exit 1; }
      - name: R09 same-camera full frame and wall pipeline in GPGX
        if: always() && env.PRIVATE != ''
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          rc=0
          for spec in alpha-base:1 alpha-base:0 alpha-sram:0 alpha-angle:1; do
            v="${spec%:*}";mode="${spec#*:}"
            python3 research/ferret-native/r09_gpgx_time.py run "$OUT/core/genesis_plus_gx_libretro.so" "$PRIVATE/$v" "$OUT/public/$v-gpgx-mode$mode.json" "$mode" || rc=1
          done
          exit "$rc"
      - name: Numeric reports only
        if: always() && env.OUT != ''
        uses: actions/upload-artifact@v4
        with:
          name: ferret-angular-pvs-numeric
          path: ${{ runner.temp }}/ferret-angular-pvs-${{ github.run_id }}/public/*
          if-no-files-found: warn
