name: R53 Claudio 1-pixel microdither CRT test matrix

on:
  push:
    branches: [r53-microdither-research]
    paths:
      - '.github/workflows/r53-microdither-crt-matrix.yml'
      - 'src/r22_video.inc'
      - 'src/r22_benchmark.inc'
      - 'src/r22_pixel4.h'
      - 'src/r35_native4.inc'
      - 'scripts/lab/test_r48_pair_v.py'
      - 'scripts/lab/gen_r49_colormix.py'
      - 'scripts/lab/gen_r52_ab.py'
      - 'scripts/lab/gen_r52_claudio.py'
      - 'scripts/lab/gen_r53_micro.py'
      - 'scripts/lab/test_r53_micro.py'
      - 'scripts/lab/test_r52_claudio.py'
      - 'scripts/lab/test_r49_colormix.py'
      - 'scripts/lab/build_r35_linear.fish'
      - 'scripts/build_silent.fish'
      - 'scripts/set_rom_identity.py'
      - 'src/d_main.c'
      - 'src/d_main.h'
      - 'src/g_game.c'
      - 'src/i_system.h'
      - 'src/m_text.c'
      - 'src/i_genesis.c'
      - 'src/r_draw.c'
      - 'scripts/lab/gen_r52_ab.py'
  workflow_dispatch:

concurrency:
  group: r53-microdither-research
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-profile:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6

      - name: Preflight fish scripts syntax
        shell: bash
        run: |
          set -euo pipefail
          fish -n scripts/build_silent.fish
          fish -n scripts/lab/build_r35_linear.fish
          echo 'fish syntax PASS'

      - name: Toolchain and Pair-H oracle
        shell: bash
        run: |
          set -euo pipefail
          command -v fish
          command -v python3
          test -x "$HOME/mars/m68k-elf/bin/m68k-elf-size"
          test -x "$HOME/mars/m68k-elf/bin/m68k-elf-nm"
          mkdir -p dist/r53-micro
          python3 scripts/lab/test_r47a_plane_pair.py | tee dist/r53-micro/ORACLE-plane-pair.txt
          python3 scripts/lab/test_r48_pair_v.py | tee dist/r53-micro/ORACLE-pair-v.txt
          python3 scripts/lab/r47b_vdp_oracle.py --frames 48 --out dist/r53-micro/ORACLE-vdp.json

      - name: Restore pinned E1M1 VGM
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,lzma,pathlib
          p=pathlib.Path('assets/r18-e1m1.vgm.xz')
          data=lzma.decompress(p.read_bytes())
          assert hashlib.sha256(data).hexdigest()=='64a7a0748953a4bd35b75735b9f4b7c1c89c0f3f4aa43395485cadd7e88a8226'
          pathlib.Path('res/e1m1.vgm').write_bytes(data)
          PY

      - name: Verify or recover Doom shareware WAD
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,gzip,os,pathlib,shutil,urllib.request
          target=pathlib.Path('scripts/doom1.wad')
          target.parent.mkdir(parents=True,exist_ok=True)
          expected='1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771'
          expected_size=4196020
          home=pathlib.Path.home()
          candidates=[target,home/'Projetos/doom-assets/doom1.wad',home/'Projetos/doom-assets/DOOM1.WAD',home/'Downloads/doom1.wad']
          for top in (home/'Projetos',home/'Games',home/'Jogos'):
              if not top.is_dir(): continue
              depth=len(top.parts)
              for directory,subdirs,names in os.walk(top,followlinks=False):
                  if len(pathlib.Path(directory).parts)-depth>4:
                      subdirs[:]=[]; continue
                  subdirs[:]=[x for x in subdirs if not x.startswith('.')]
                  for name in names:
                      if name.lower()=='doom1.wad': candidates.append(pathlib.Path(directory)/name)
          for p in candidates:
              if not p.is_file(): continue
              raw=p.read_bytes()
              if len(raw)==expected_size and hashlib.sha256(raw).hexdigest()==expected:
                  if p.resolve()!=target.resolve(): shutil.copyfile(p,target)
                  print('Verified WAD from',p); break
          else:
              mirrors=[
                ('archive','https://archive.org/download/wadarchive/DATA/5b.zip/5b%2F2e249b9c5133ec987b3ea77596381dc0d6bc1d%2F5b2e249b9c5133ec987b3ea77596381dc0d6bc1d.wad.gz',True),
                ('aikernel','https://aikernel.net/demo/doom/DOOM1.WAD',False)]
              for name,url,compressed in mirrors:
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'MD-DOOM64KB pair boot fix'})
                      with urllib.request.urlopen(req,timeout=65) as response: raw=response.read(9_000_000)
                      if compressed: raw=gzip.decompress(raw)
                      if len(raw)==expected_size and hashlib.sha256(raw).hexdigest()==expected:
                          target.write_bytes(raw); print('Recovered WAD from',name); break
                  except Exception as e: print('mirror failed',name,str(e)[:100])
              else: raise SystemExit('Pinned shareware WAD unavailable')
          assert hashlib.sha256(target.read_bytes()).hexdigest()==expected
          PY

      - name: Preflight ColorMix source tables and fidelity oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/r53-micro
          python3 scripts/lab/gen_r22_pixel4.py
          python3 scripts/lab/gen_r49_colormix.py | tee dist/r53-micro/PREFLIGHT-generator.txt
          python3 scripts/lab/test_r49_colormix.py | tee dist/r53-micro/PREFLIGHT-color-oracle.txt
          cp src/r49_colormix_report.json dist/r53-micro/PREFLIGHT-color-report.json

      - name: Ensure NumPy for Cláudio palettes and microdither
        shell: bash
        run: |
          set -euo pipefail
          if python3 -c 'import numpy;print("numpy",numpy.__version__)'; then
            echo 'NumPy ready'
          else
            python3 -m venv "$RUNNER_TEMP/r53-venv"
            "$RUNNER_TEMP/r53-venv/bin/python3" -m pip install --disable-pip-version-check 'numpy>=2.2,<3'
            echo "$RUNNER_TEMP/r53-venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Audit 1-pixel VDP microdither and palette seeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/r53-micro
          python3 -m py_compile scripts/lab/gen_r53_micro.py scripts/lab/test_r53_micro.py
          python3 scripts/lab/gen_r52_claudio.py --repo . --out src --mode near25 --zero-policy forbid --no-preview
          python3 scripts/lab/test_r52_claudio.py src .
          for ratio in 25 50; do
            python3 scripts/lab/gen_r53_micro.py --repo . --out src --profile near25 --ratio "$ratio"
            python3 scripts/lab/test_r53_micro.py --src src --ratio "$ratio"
            cp src/r53_micro_report.json "dist/r53-micro/PREFLIGHT-R53-$ratio.json"
          done
          python3 - <<'PY'
          from pathlib import Path
          c=Path('src/r22_video.inc').read_text()
          assert 'R53_MicroRow' in c and 'r53_partner_even[base]' in c
          assert 'r53_partner_odd[base]' in c and 'R22_PAIR_TILE_BASE+256u+p' in c
          assert '0x2000u|R22_PAIR_TILE_BASE+256u' in c
          assert 'R47_LoadPairTiles();' in Path('src/r35_native4.inc').read_text()
          print('R53 dual-bank layout and return-from-title restoration source gate PASS')
          PY

      - name: Build 24 R53 PLAY/PERF CRT microdither ROMs
        shell: bash
        run: |
          set -euo pipefail
          D=dist/r53-micro
          mkdir -p "$D"
          export DOOM_R20_BGM_VGM="$GITHUB_WORKSPACE/res/e1m1.vgm"
          build () {
            local id="$1" mode="$2" palette="$3" zero="$4" ratio="$5"
            local bench=0 menu=0 static=0 reset=0
            if [[ "$mode" == play ]]; then bench=1; menu=1; static=1; reset=1; fi
            echo "=========== R53 $id $mode ($palette $zero / $ratio% micro) ==========="
            env DOOM_R35D_CHECKER=1 DOOM_R39C_VARIANT=mall \
              DOOM_R39D_DITHER_TOGGLE=0 DOOM_R39E_AUDIO_TOGGLES=1 \
              DOOM_R40_STAGE1=fast DOOM_R42_WALL_ASM=1 DOOM_R45_VARIANT=asm \
              DOOM_R47_PLANE_PAIR=1 DOOM_R47_FLAT_HOIST=1 \
              DOOM_R47_SPRITE_HOIST=1 DOOM_R48_PAIR_V=1 DOOM_R48_V_FAST=1 \
              DOOM_R49_COLORMIX=0 DOOM_R49_COMPLUT=0 DOOM_R49_RATIO=none \
              DOOM_R52_AB=1 DOOM_R52_CLAUDIO=1 DOOM_R52_AB_PROFILE="$palette" \
              DOOM_R52_ZERO_POLICY="$zero" DOOM_R52_CPLUT=1 \
              DOOM_R53_MICRO_RATIO="$ratio" \
              DOOM_R50_PLAY_BENCH="$bench" DOOM_R50_MENU_FREEZE="$menu" \
              DOOM_R50_STATIC_MENU="$static" DOOM_R50_HARD_REINIT="$reset" \
              DOOM_R50_RESET_SRAM=0 DOOM_R51_HW_WEAPON=0 DOOM_R51_NO_PSPRITE=0 \
              DOOM_R20_BGM_VGM="$DOOM_R20_BGM_VGM" DOOM_R53_BUILD="$id-$mode" \
              fish scripts/lab/build_r35_linear.fish "pixel4-$mode"
            local path="dist/r35/doom-md-r53-$id-$mode"
            cp "$path.bin" "$D/"
            cp "dist/r35/flags-doom-md-r53-$id-$mode.txt" "$D/"
            cp src/r52_ab_report.json "$D/PALETTE-$id-$mode.json"
            cp src/r53_micro_report.json "$D/MICRO-$id-$mode.json"
            "$HOME/mars/m68k-elf/bin/m68k-elf-size" -A "$path.elf" > "$D/size-$id-$mode.txt"
          }
          for mode in play perf; do
            for config in "n25f near25 forbid" "n25a near25 allow" \
                          "l32f luma32 forbid" "l32a luma32 allow" \
                          "freef free forbid" "freea free allow"; do
              read -r tag profile zero <<< "$config"
              for ratio in 25 50; do
                build "$tag-m$ratio" "$mode" "$profile" "$zero" "$ratio"
              done
            done
          done

      - name: Audit 24 ROMs, VRAM, WRAM and source palette reports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          d=Path('dist/r53-micro')
          roms=sorted(d.glob('doom-md-r53-*.bin'))
          assert len(roms)==24,('count',len(roms))
          records={}
          for f in roms:
              variant=f.stem.removeprefix('doom-md-r53-')
              bsspath=d/('size-'+variant+'.txt')
              m=re.search(r'^\.bss\s+(\d+)\s+',bsspath.read_text(),re.M)
              assert m,bsspath
              bss=int(m.group(1))
              assert bss<=57920,(f.name,bss)
              assert len(f.stem)<=30,f.stem
              mr=json.loads((d/('MICRO-'+variant+'.json')).read_text())
              pal=json.loads((d/('PALETTE-'+variant+'.json')).read_text())
              assert len(pal['per_subpalette'])==14
              assert mr['ratio_percent'] in (25,50)
              assert mr['palette_profile']==pal['args']['mode']
              assert mr['zero_policy']==pal['args']['zero_policy']
              assert mr['companion_maps']['even'][0]==0
              assert mr['companion_maps']['odd'][0]==0
              if mr['zero_policy']=='forbid':
                assert min(pal['parity_maps']['even']+pal['parity_maps']['odd'])>=1
              records[f.name]={'bss':bss,'size_bytes':f.stat().st_size,
                  'sha256':hashlib.sha256(f.read_bytes()).hexdigest(),
                  'micro_ratio':mr['ratio_percent']}
          (d/'BSS-AUDIT.json').write_text(json.dumps(records,indent=2)+'\n')
          print('PASS: 24 ROMs, BSS guard, palette reports, indices and identities')
          PY

      - name: BlastEm 800-frame boot smoke all R53 ROMs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,shutil,subprocess,time
          d=pathlib.Path('dist/r53-micro').resolve()
          exe=shutil.which('blastem') or next((str(p) for p in
              (pathlib.Path.home()/'Projetos').glob('**/blastem')
              if p.is_file() and os.access(p,os.X_OK)),None)
          assert exe,'BlastEm unavailable'
          env=os.environ.copy()
          env.update(SDL_AUDIODRIVER='dummy',SDL_VIDEODRIVER='dummy')
          rows=[]
          for rom in sorted(d.glob('*.bin')):
            t=time.monotonic()
            r=subprocess.run([exe,'-b','800',str(rom)],cwd=d,env=env,
                capture_output=True,text=True,errors='replace',timeout=45)
            msg=f'{rom.name} exit={r.returncode} wall={time.monotonic()-t:.2f}s'
            print(msg,flush=True);rows.append(msg)
            if r.returncode: raise SystemExit(msg+'\n'+r.stdout+r.stderr)
          assert len(rows)==24
          (d/'BLASTEM-SMOKE.txt').write_text('\n'.join(rows)+'\n')
          PY

      - name: Package R53 CRT visual and FPS test instructions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=Path('dist/r53-micro')
          reports=sorted(d.glob('MICRO-*.json'))
          (d/'MANIFEST.json').write_text(json.dumps({
              'branch':'r53-microdither-research',
              'baseline':'Use separate R52 Claudio 22-ROM artifacts, 5.46 FPS typical',
              'purpose':'1-pixel spatial microdither within individual PAL0/PAL1 4x4 cells; NOT per-physical-pixel cross-pal blending',
              'variants':'near25/luma32/free x forbid/allow x M25/M50 x PLAY/PERF',
              'warning':'CRT hardware still untested; SGDK init smoke cannot validate visual flicker or texture fidelity',
              'reports':len(reports)},indent=2)+'\n')
          (d/'README-CRT.txt').write_text(
              'R53 1PX MICRODITHER: CRT HARDWARE EXPERIMENT (24 ROMS)\n'
              'M25 = one companion physical pixel out of four (3:1), M50 = 1x1 checkerboard (2:2).\n'
              'Colours stay INSIDE each plane palette: not PAL0/PAL1 1px alternating.\n'
              'Preserves the R52 scene 4x4 raster and composed lookup.\n'
              'For best direct comparison, use corresponding R52 cl-n25, cl-l32, or cl-free SOLID PLAY ROM.\n'
              'On CRT: inspect E1M1 fixed camera, pillar, grays, blue floor, moving walls, flicker and moire.\n'
              'Then test damage flashes, TITLEPIC/Menu/New Game/reset, HUD numbers, gameplay.\n'
              'PERF DEMO3: 2134 frames, run at same BlastEm settings as R52 reference (~5.46 FPS).\n'
              'Hardware safety: test emulator first; do not flash over validated R50/R52 ROMs.\n')
          PY

      - name: Upload complete R53 microdither CRT matrix
        uses: actions/upload-artifact@v6
        with:
          name: doom-md-r53-microdither-crt-matrix
          path: dist/r53-micro/
          retention-days: 90
          if-no-files-found: error
