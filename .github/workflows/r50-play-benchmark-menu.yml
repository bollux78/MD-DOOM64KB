name: R50 PLAY on-demand DEMO3 + fast-menu A/B

on:
  push:
    branches: [r50-play-benchmark-menu]
    paths:
      - '.github/workflows/r50-play-benchmark-menu.yml'
      - 'src/r22_video.inc'
      - 'src/r22_benchmark.inc'
      - 'src/r22_pixel4.h'
      - 'src/r35_native4.inc'
      - 'scripts/lab/test_r48_pair_v.py'
      - 'scripts/lab/gen_r49_colormix.py'
      - 'scripts/lab/test_r49_colormix.py'
      - 'scripts/lab/build_r35_linear.fish'
      - 'scripts/build_silent.fish'
      - 'scripts/set_rom_identity.py'
      - 'src/d_main.c'
      - 'src/d_main.h'
      - 'src/g_game.c'
      - 'src/i_system.h'
      - 'src/m_text.c'
  workflow_dispatch:

concurrency:
  group: r50-play-benchmark-menu
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-profile:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6

      - name: Preflight fish scripts syntax
        shell: bash
        run: |
          set -euo pipefail
          fish -n scripts/build_silent.fish
          fish -n scripts/lab/build_r35_linear.fish
          echo 'fish syntax PASS'

      - name: Toolchain and Pair-H oracle
        shell: bash
        run: |
          set -euo pipefail
          command -v fish
          command -v python3
          test -x "$HOME/mars/m68k-elf/bin/m68k-elf-size"
          test -x "$HOME/mars/m68k-elf/bin/m68k-elf-nm"
          mkdir -p dist/r50-menu
          python3 scripts/lab/test_r47a_plane_pair.py | tee dist/r50-menu/ORACLE-plane-pair.txt
          python3 scripts/lab/test_r48_pair_v.py | tee dist/r50-menu/ORACLE-pair-v.txt
          python3 scripts/lab/r47b_vdp_oracle.py --frames 48 --out dist/r50-menu/ORACLE-vdp.json

      - name: Restore pinned E1M1 VGM
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,lzma,pathlib
          p=pathlib.Path('assets/r18-e1m1.vgm.xz')
          data=lzma.decompress(p.read_bytes())
          assert hashlib.sha256(data).hexdigest()=='64a7a0748953a4bd35b75735b9f4b7c1c89c0f3f4aa43395485cadd7e88a8226'
          pathlib.Path('res/e1m1.vgm').write_bytes(data)
          PY

      - name: Verify or recover Doom shareware WAD
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,gzip,os,pathlib,shutil,urllib.request
          target=pathlib.Path('scripts/doom1.wad')
          target.parent.mkdir(parents=True,exist_ok=True)
          expected='1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771'
          expected_size=4196020
          home=pathlib.Path.home()
          candidates=[target,home/'Projetos/doom-assets/doom1.wad',home/'Projetos/doom-assets/DOOM1.WAD',home/'Downloads/doom1.wad']
          for top in (home/'Projetos',home/'Games',home/'Jogos'):
              if not top.is_dir(): continue
              depth=len(top.parts)
              for directory,subdirs,names in os.walk(top,followlinks=False):
                  if len(pathlib.Path(directory).parts)-depth>4:
                      subdirs[:]=[]; continue
                  subdirs[:]=[x for x in subdirs if not x.startswith('.')]
                  for name in names:
                      if name.lower()=='doom1.wad': candidates.append(pathlib.Path(directory)/name)
          for p in candidates:
              if not p.is_file(): continue
              raw=p.read_bytes()
              if len(raw)==expected_size and hashlib.sha256(raw).hexdigest()==expected:
                  if p.resolve()!=target.resolve(): shutil.copyfile(p,target)
                  print('Verified WAD from',p); break
          else:
              mirrors=[
                ('archive','https://archive.org/download/wadarchive/DATA/5b.zip/5b%2F2e249b9c5133ec987b3ea77596381dc0d6bc1d%2F5b2e249b9c5133ec987b3ea77596381dc0d6bc1d.wad.gz',True),
                ('aikernel','https://aikernel.net/demo/doom/DOOM1.WAD',False)]
              for name,url,compressed in mirrors:
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'MD-DOOM64KB pair boot fix'})
                      with urllib.request.urlopen(req,timeout=65) as response: raw=response.read(9_000_000)
                      if compressed: raw=gzip.decompress(raw)
                      if len(raw)==expected_size and hashlib.sha256(raw).hexdigest()==expected:
                          target.write_bytes(raw); print('Recovered WAD from',name); break
                  except Exception as e: print('mirror failed',name,str(e)[:100])
              else: raise SystemExit('Pinned shareware WAD unavailable')
          assert hashlib.sha256(target.read_bytes()).hexdigest()==expected
          PY

      - name: Preflight ColorMix source tables and fidelity oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/r50-menu
          python3 scripts/lab/gen_r22_pixel4.py
          python3 scripts/lab/gen_r49_colormix.py | tee dist/r50-menu/PREFLIGHT-generator.txt
          python3 scripts/lab/test_r49_colormix.py | tee dist/r50-menu/PREFLIGHT-color-oracle.txt
          cp src/r49_colormix_report.json dist/r50-menu/PREFLIGHT-color-report.json

      - name: Build R50 PLAY/PERF controls and benchmark-menu variants
        shell: bash
        run: |
          set -euo pipefail
          D=dist/r50-menu
          mkdir -p "$D"
          export DOOM_R20_BGM_VGM="$GITHUB_WORKSPACE/res/e1m1.vgm"
          p4 () {
            local mode="$1" id="$2" mix="$3" lut="$4" bench="$5" freeze="$6"
            echo "====== R50 $id / $mode ======"
            env DOOM_R35D_CHECKER=1 DOOM_R39C_VARIANT=mall \
                DOOM_R39D_DITHER_TOGGLE=0 DOOM_R39E_AUDIO_TOGGLES=1 \
                DOOM_R40_STAGE1=fast DOOM_R42_WALL_ASM=1 DOOM_R45_VARIANT=asm \
                DOOM_R47_PLANE_PAIR=1 DOOM_R47_FLAT_HOIST=1 \
                DOOM_R47_SPRITE_HOIST=1 DOOM_R48_PAIR_V=1 DOOM_R48_V_FAST=1 \
                DOOM_R49_COLORMIX="$mix" DOOM_R49_COMPLUT="$lut" \
                DOOM_R49_RATIO=none DOOM_R50_PLAY_BENCH="$bench" \
                DOOM_R50_MENU_FREEZE="$freeze" \
                DOOM_R20_BGM_VGM="$DOOM_R20_BGM_VGM" DOOM_R50_BUILD="$id" \
                fish scripts/lab/build_r35_linear.fish "pixel4-$mode"
            cp "dist/r35/doom-md-r50-$id.bin" "$D/"
            cp "dist/r35/flags-doom-md-r50-$id.txt" "$D/"
            "$HOME/mars/m68k-elf/bin/m68k-elf-size" -A \
              "dist/r35/doom-md-r50-$id.elf" > "$D/size-$id.txt"
          }

          # Four PLAY comparisons isolate benchmark vs renderer freeze.
          p4 play vf-ctrl-play 0 0 0 0
          p4 play vf-bench-play 0 0 1 0
          p4 play vf-freeze-play 0 0 0 1
          p4 play vf-bench-freeze-play 0 0 1 1
          # Check optional PAL1 ColorMix also supports the menu benchmark.
          p4 play cm50l-bench-play 1 1 1 1
          # PERF controls remain unchanged: canonical fixed DEMO3 loop.
          p4 perf vf-ctrl-perf 0 0 0 0
          p4 perf cm50l-ctrl-perf 1 1 0 0

      - name: Audit BSS and ROM counts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          d=Path('dist/r50-menu')
          sizes={}
          for p in sorted(d.glob('size-*.txt')):
              m=re.search(r'^\.bss\s+(\d+)\s+',p.read_text(),re.M)
              if not m: raise SystemExit(f'No .bss measurement: {p.name}')
              b=int(m.group(1))
              if b>57920: raise SystemExit(f'Boot-risk BSS regression: {p.name} = {b}')
              sizes[p.stem[5:]]=b
          if len(sizes)!=7: raise SystemExit(f'Expected 7 ROMs, got {len(sizes)}')
          if sizes['vf-bench-play']-sizes['vf-ctrl-play']>64:
              raise SystemExit('PLAY on-demand benchmark uses too much extra BSS')
          (d/'BSS-AUDIT.json').write_text(json.dumps(sizes,indent=2)+'\n')
          print(json.dumps(sizes,indent=2))
          PY

      - name: BlastEm smoke tests for both PERF and PLAY variants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,shutil,subprocess,time
          d=Path('dist/r50-menu').resolve()
          exe=shutil.which('blastem') or next(
            (str(p) for p in (Path.home()/'Projetos').glob('**/blastem')
             if p.is_file() and os.access(p,os.X_OK)),None)
          if not exe: raise SystemExit('BlastEm not found')
          env=os.environ.copy();env.update(SDL_AUDIODRIVER='dummy', SDL_VIDEODRIVER='dummy')
          lines=[]
          for rom in sorted(d.glob('*.bin')):
              t=time.monotonic()
              try:
                  r=subprocess.run([exe,'-b','800',str(rom)],cwd=d,env=env,
                        stdout=subprocess.PIPE,stderr=subprocess.STDOUT,
                        text=True,errors='replace',timeout=35)
              except subprocess.TimeoutExpired:
                  raise SystemExit('BlastEm 800-frame hang: '+rom.name)
              msg=f'{rom.name}: exit={r.returncode} wall={time.monotonic()-t:.2f}s'
              lines.append(msg);print(msg,flush=True)
              if r.returncode: raise SystemExit(msg)
          (d/'BLASTEM-SMOKE.txt').write_text('\n'.join(lines)+'\n')
          PY

      - name: Manifest and manual QA instructions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          d=Path('dist/r50-menu')
          roms=[{'name':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
                for p in sorted(d.glob('*.bin'))]
          if len(roms)!=7: raise SystemExit(f'Expected 7 ROMs, got {len(roms)}')
          data={'reference':'R49 Pair-V Fast 5.31 FPS / 402.23s; R49 CM50+LUT 5.03 FPS',
                'feature':'PLAY main menu has Benchmark that runs DEMO3, displays same result screen and returns via Start',
                'modes':{'vf-ctrl-play':'old normal PLAY',
                    'vf-bench-play':'Benchmark enabled, original menu rendering',
                    'vf-freeze-play':'3D stops during menu, no Benchmark',
                    'vf-bench-freeze-play':'Both features',
                    'cm50l-bench-play':'both features and ColorMix/LUT',
                    'vf-ctrl-perf':'unchanged normal PERF',
                    'cm50l-ctrl-perf':'unchanged ColorMix/LUT PERF'},
                'validation':'build + BSS + BlastEm startup/800-frame smoke; interactive menu benchmark and return require manual test',
                'roms':roms}
          (d/'MANIFEST.json').write_text(json.dumps(data,indent=2)+'\n')
          (d/'README.txt').write_text(
            'R50 PLAY BENCHMARK / FAST MENU\n'
            'Compare vf-ctrl-play, vf-bench-play, vf-freeze-play, vf-bench-freeze-play.\n'
            'For benchmark PLAY: open main menu -> Benchmark -> DEMO3 -> result -> Start returns to menu.\n'
            'Compare FPS/time vs vf-ctrl-perf using the same BlastEm divisor 7.\n'
            'Check game paused menu responsiveness in simple and complex E1M1 scenes.\n'
            'Check entering Benchmark from title and from an ongoing E1M1 game.\n'
            'Check repeat benchmark twice, return, start New Game, sound and MENU/Window cleanup.\n'
            'No runtime-interactive verification has been performed by CI.\n')
          print(json.dumps({'rom_count':len(roms),'names':[p['name'] for p in roms]},indent=2))
          PY

      - name: Upload R50 PLAY benchmark menu matrix
        uses: actions/upload-artifact@v6
        with:
          name: doom-md-r50-play-benchmark-menu
          path: dist/r50-menu/
          retention-days: 90
          if-no-files-found: error
