name: R128 raw BG tile cache benchmark (E1M1)
on:
  push:
    branches: [exp-chatgpt-r128-raw-bg-cache]
permissions:
  contents: read
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[relocate-roms]') }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify runner dependencies
        shell: bash
        run: |
          set -euo pipefail
          for tool in fish java make patch cc curl xz unzip; do command -v "$tool" >/dev/null; done
          python3 -c 'import numpy, PIL'
      - name: Prepare the native SGDK 2.11 toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/mars" "$RUNNER_TEMP/sgdk-release"
          curl -fLsS --retry 3 https://github.com/andwn/marsdev/releases/download/v1.0.0-rc1/marsdev-v1.0.0-rc1-linux-x86_64.tar.xz -o "$RUNNER_TEMP/mars.tar.xz"
          tar -xJf "$RUNNER_TEMP/mars.tar.xz" -C "$RUNNER_TEMP/mars"
          compiler="$(find "$RUNNER_TEMP/mars" -name m68k-elf-gcc -print -quit)"
          test -x "$compiler"
          sdk="$(dirname "$(dirname "$compiler")")"
          curl -fLsS --retry 3 https://github.com/Stephane-D/SGDK/archive/ef9292c03fe33a2f8af3a2589ab856a53dcef35c.tar.gz -o "$RUNNER_TEMP/sgdk.tar.gz"
          tar -xzf "$RUNNER_TEMP/sgdk.tar.gz" -C "$RUNNER_TEMP/sgdk-release" --strip-components=1
          sgdk_source="$RUNNER_TEMP/sgdk-release"
          rm -rf "$sdk/inc" "$sdk/res" "$sdk/src"
          cp -a "$sgdk_source"/{inc,res,src,md.ld,makelib.gen,makefile.gen} "$sdk/"
          cp -a "$sgdk_source"/bin/*.jar "$sdk/bin/"
          sed -i 's/\r$//' "$sdk"/{makefile.gen,inc/dma.h,src/dma.c,res/libres.res}
          patch -d "$sdk" -p1 --fuzz=0 < scripts/lab/r128-shareware/sgdk211.patch
          export PATH="$sdk/bin:$PATH"
          rm -f "$sdk/lib/libmd.a"
          make -C "$sdk" -f makelib.gen GDK="$sdk" PREFIX=m68k-elf- EXTRA_FLAGS=-std=gnu11 -j2
          echo "R128_NATIVE_SGDK=$sdk" >> "$GITHUB_ENV"
      - name: Build the raw BG control and tile cache ROMs
        shell: bash
        env:
          R128_SGDK211_COMPAT: '1'
          R128_E1M1_MENU_BENCH: '1'
        run: |
          set -euo pipefail
          wad="$HOME/Projetos/doom-md/assets/wads/doom1.wad"
          if [[ ! -f "$wad" ]]; then
            mkdir "$RUNNER_TEMP/shareware"
            curl -fLsS --retry 3 https://deb.debian.org/debian/pool/non-free/d/doom-wad-shareware/doom-wad-shareware_1.9.fixed.orig.tar.gz -o "$RUNNER_TEMP/shareware.tar.gz"
            tar -xzf "$RUNNER_TEMP/shareware.tar.gz" -C "$RUNNER_TEMP/shareware"
            wad="$(find "$RUNNER_TEMP/shareware" -type f -iname doom1.wad -print -quit)"
          fi
          private="$HOME/Projetos/Personal/r128-raw-bg-cache/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$private"
          mkdir "$RUNNER_TEMP/r128-bench-builds" "$RUNNER_TEMP/e1m1-results"
          for mode in raw cache; do
            out="$RUNNER_TEMP/r128-bench-builds/$mode"
            R128_RAW_BG="$mode" bash scripts/lab/build_r128_shareware.sh "$wad" "$R128_NATIVE_SGDK" "$out"
            install -m 0600 "$out/doom-md-r60-r128-all-sw-pl.bin" "$private/doom-md-r128-bg-$mode.bin"
          done
      - name: Run the E1M1 menu benchmark and capture the result screens
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 https://buildbot.libretro.com/nightly/linux/x86_64/latest/genesis_plus_gx_libretro.so.zip -o "$RUNNER_TEMP/gpgx.zip"
          unzip -q "$RUNNER_TEMP/gpgx.zip" -d "$RUNNER_TEMP"
          python3 scripts/lab/r128-shareware/run_e1m1_benchmark.py \
            --core "$RUNNER_TEMP/genesis_plus_gx_libretro.so" \
            --builds "$RUNNER_TEMP/r128-bench-builds" \
            --nm "$R128_NATIVE_SGDK/bin/m68k-elf-nm" \
            --out "$RUNNER_TEMP/e1m1-results" --raw-bg
          cat "$RUNNER_TEMP/e1m1-results/results.json"
      - name: Upload E1M1 measurements and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r128-raw-bg-cache-e1m1
          path: ${{ runner.temp }}/e1m1-results/
          if-no-files-found: warn
          retention-days: 30
  relocate:
    if: ${{ contains(github.event.head_commit.message, '[relocate-roms]') }}
    permissions:
      actions: write
      contents: read
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43998127353
          name: r128-raw-bg-cache-e1m1
          path: ${{ runner.temp }}/r128-original-results
      - name: Preserve and verify the ROMs on the private runner
        shell: bash
        run: |
          set -euo pipefail
          private="$HOME/Projetos/Personal/r128-raw-bg-cache/run-43998127353-1"
          install -d -m 0700 "$private"
          source="$RUNNER_TEMP/r128-original-results"
          for rom in doom-md-r128-bg-raw.bin doom-md-r128-bg-cache.bin; do
            install -m 0600 "$source/$rom" "$private/$rom"
            cmp -s "$source/$rom" "$private/$rom"
          done
      - name: Upload only screenshots and benchmark measurements
        uses: actions/upload-artifact@v4
        with:
          name: r128-raw-bg-cache-e1m1-results
          path: |
            ${{ runner.temp }}/r128-original-results/*.png
            ${{ runner.temp }}/r128-original-results/results.json
          if-no-files-found: error
          retention-days: 30
      - name: Delete the artifact that included ROMs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null --request DELETE \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/14291161836"
