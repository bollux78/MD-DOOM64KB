name: R51 Weapon sprite HUD clipping, continuity and no-gun FPS ceiling

on:
  push:
    branches: [r51-hw-weapon-clip-fix]
    paths:
      - '.github/workflows/r51-hw-weapon-clip-fix.yml'
      - 'src/r22_video.inc'
      - 'src/r22_benchmark.inc'
      - 'src/r22_pixel4.h'
      - 'src/r35_native4.inc'
      - 'scripts/lab/test_r48_pair_v.py'
      - 'scripts/lab/gen_r49_colormix.py'
      - 'scripts/lab/test_r49_colormix.py'
      - 'scripts/lab/build_r35_linear.fish'
      - 'scripts/build_silent.fish'
      - 'scripts/set_rom_identity.py'
      - 'src/d_main.c'
      - 'src/d_main.h'
      - 'src/g_game.c'
      - 'src/i_system.h'
      - 'src/m_text.c'
      - 'src/i_genesis.c'
      - 'src/r_draw.c'
      - 'src/r51_weapon_hw.inc'
      - 'scripts/lab/gen_r51_hw_weapon.py'
  workflow_dispatch:

concurrency:
  group: r51-hw-weapon-clip-fix
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-profile:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6

      - name: Preflight fish scripts syntax
        shell: bash
        run: |
          set -euo pipefail
          fish -n scripts/build_silent.fish
          fish -n scripts/lab/build_r35_linear.fish
          echo 'fish syntax PASS'

      - name: Toolchain and Pair-H oracle
        shell: bash
        run: |
          set -euo pipefail
          command -v fish
          command -v python3
          test -x "$HOME/mars/m68k-elf/bin/m68k-elf-size"
          test -x "$HOME/mars/m68k-elf/bin/m68k-elf-nm"
          mkdir -p dist/r51-clip
          python3 scripts/lab/test_r47a_plane_pair.py | tee dist/r51-clip/ORACLE-plane-pair.txt
          python3 scripts/lab/test_r48_pair_v.py | tee dist/r51-clip/ORACLE-pair-v.txt
          python3 scripts/lab/r47b_vdp_oracle.py --frames 48 --out dist/r51-clip/ORACLE-vdp.json

      - name: Restore pinned E1M1 VGM
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,lzma,pathlib
          p=pathlib.Path('assets/r18-e1m1.vgm.xz')
          data=lzma.decompress(p.read_bytes())
          assert hashlib.sha256(data).hexdigest()=='64a7a0748953a4bd35b75735b9f4b7c1c89c0f3f4aa43395485cadd7e88a8226'
          pathlib.Path('res/e1m1.vgm').write_bytes(data)
          PY

      - name: Verify or recover Doom shareware WAD
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,gzip,os,pathlib,shutil,urllib.request
          target=pathlib.Path('scripts/doom1.wad')
          target.parent.mkdir(parents=True,exist_ok=True)
          expected='1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771'
          expected_size=4196020
          home=pathlib.Path.home()
          candidates=[target,home/'Projetos/doom-assets/doom1.wad',home/'Projetos/doom-assets/DOOM1.WAD',home/'Downloads/doom1.wad']
          for top in (home/'Projetos',home/'Games',home/'Jogos'):
              if not top.is_dir(): continue
              depth=len(top.parts)
              for directory,subdirs,names in os.walk(top,followlinks=False):
                  if len(pathlib.Path(directory).parts)-depth>4:
                      subdirs[:]=[]; continue
                  subdirs[:]=[x for x in subdirs if not x.startswith('.')]
                  for name in names:
                      if name.lower()=='doom1.wad': candidates.append(pathlib.Path(directory)/name)
          for p in candidates:
              if not p.is_file(): continue
              raw=p.read_bytes()
              if len(raw)==expected_size and hashlib.sha256(raw).hexdigest()==expected:
                  if p.resolve()!=target.resolve(): shutil.copyfile(p,target)
                  print('Verified WAD from',p); break
          else:
              mirrors=[
                ('archive','https://archive.org/download/wadarchive/DATA/5b.zip/5b%2F2e249b9c5133ec987b3ea77596381dc0d6bc1d%2F5b2e249b9c5133ec987b3ea77596381dc0d6bc1d.wad.gz',True),
                ('aikernel','https://aikernel.net/demo/doom/DOOM1.WAD',False)]
              for name,url,compressed in mirrors:
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'MD-DOOM64KB pair boot fix'})
                      with urllib.request.urlopen(req,timeout=65) as response: raw=response.read(9_000_000)
                      if compressed: raw=gzip.decompress(raw)
                      if len(raw)==expected_size and hashlib.sha256(raw).hexdigest()==expected:
                          target.write_bytes(raw); print('Recovered WAD from',name); break
                  except Exception as e: print('mirror failed',name,str(e)[:100])
              else: raise SystemExit('Pinned shareware WAD unavailable')
          assert hashlib.sha256(target.read_bytes()).hexdigest()==expected
          PY

      - name: Preflight ColorMix source tables and fidelity oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/r51-clip
          python3 scripts/lab/gen_r22_pixel4.py
          python3 scripts/lab/gen_r49_colormix.py | tee dist/r51-clip/PREFLIGHT-generator.txt
          python3 scripts/lab/test_r49_colormix.py | tee dist/r51-clip/PREFLIGHT-color-oracle.txt
          cp src/r49_colormix_report.json dist/r51-clip/PREFLIGHT-color-report.json

      - name: Verify source WAD pistol patch decoder and palette2 quantizer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/lab/gen_r51_hw_weapon.py
          python3 scripts/lab/gen_r51_hw_weapon.py
          python3 - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('src/r51_weapon_report.json').read_text())
          assert d['frames'], 'No PISG WAD sprites'
          assert d['palette2_distinct']>=12,d
          assert all(0<f['count']<=240 for f in d['frames'])
          assert all(len(f['blocks'])<=20 for f in d['frames'])
          assert 'static const uint32_t r51_weapon_patterns_' in Path('src/r51_weapon_assets.h').read_text()
          print('WAD pistol frames:',[(f['name'],f['w'],f['h'],f['count']) for f in d['frames']])
          print('Palette2 unique:',d['palette2_distinct'])
          PY
          cp src/r51_weapon_report.json dist/r51-clip/R51-WEAPON-REPORT.json

      - name: Assert ROM IDs, VDP hud-mask and optional no-gun ablation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          ids=['vf-soft-play','vf-old-play','vf-clip-play','vf-cont-play',
               'vf-neutral-play','cm50l-neut-play','vf-ctrl-perf','vf-nogun-perf']
          names=['doom-md-r51-'+x for x in ids]
          assert len(names)==len(set(names))==8
          assert all(len(s)<=30 for s in names),[(s,len(s)) for s in names]
          h=Path('src/r51_weapon_hw.inc').read_text()
          d=Path('src/r_draw.c').read_text()
          c=Path('scripts/lab/gen_r51_hw_weapon.py').read_text()
          assert 'VDP_setWindowVPos(TRUE,22)' in h
          assert 'VDP_setWindowHPos(FALSE,0)' in h
          assert 'PAL_setColor(49,0)' in h
          assert '0x6001u' in h
          assert '0x4000u+R51_PISTOL_TILE_BASE' in h
          assert 'DOOM_R51_HW_CONTINUOUS' in d
          assert 'DOOM_R51_NO_PSPRITE' in d
          assert 'DOOM_R51_WEAPON_NEUTRAL' in c
          print('R51 experimental flags, priorities, HUD map and ablation PASS')
          PY

      - name: Build R51 V2 A/B test matrix
        shell: bash
        run: |
          set -euo pipefail
          D=dist/r51-clip
          mkdir -p "$D"
          export DOOM_R20_BGM_VGM="$GITHUB_WORKSPACE/res/e1m1.vgm"
          p4 () {
            local mode="$1" id="$2" gun="$3" hud="$4" continuous="$5"
            local neutral="$6" mix="$7" lut="$8" nogun="$9"
            echo "====== R51 $id / $mode ======"
            env DOOM_R35D_CHECKER=1 DOOM_R39C_VARIANT=mall \
                DOOM_R39D_DITHER_TOGGLE=0 DOOM_R39E_AUDIO_TOGGLES=1 \
                DOOM_R40_STAGE1=fast DOOM_R42_WALL_ASM=1 DOOM_R45_VARIANT=asm \
                DOOM_R47_PLANE_PAIR=1 DOOM_R47_FLAT_HOIST=1 \
                DOOM_R47_SPRITE_HOIST=1 DOOM_R48_PAIR_V=1 DOOM_R48_V_FAST=1 \
                DOOM_R49_COLORMIX="$mix" DOOM_R49_COMPLUT="$lut" \
                DOOM_R49_RATIO=none DOOM_R50_PLAY_BENCH=1 \
                DOOM_R50_MENU_FREEZE=1 DOOM_R50_STATIC_MENU=1 \
                DOOM_R50_HARD_REINIT=1 DOOM_R50_RESET_SRAM=0 \
                DOOM_R51_HW_WEAPON="$gun" DOOM_R51_HW_HUD="$hud" \
                DOOM_R51_HW_CONTINUOUS="$continuous" DOOM_R51_WEAPON_NEUTRAL="$neutral" \
                DOOM_R51_NO_PSPRITE="$nogun" \
                DOOM_R20_BGM_VGM="$DOOM_R20_BGM_VGM" DOOM_R51_BUILD="$id" \
                fish scripts/lab/build_r35_linear.fish "pixel4-$mode"
            cp "dist/r35/doom-md-r51-$id.bin" "$D/"
            cp "dist/r35/flags-doom-md-r51-$id.txt" "$D/"
            "$HOME/mars/m68k-elf/bin/m68k-elf-size" -A \
                "dist/r35/doom-md-r51-$id.elf" > "$D/size-$id.txt"
            if [[ "$gun" == "1" ]]; then
              cp src/r51_weapon_report.json "$D/R51-WEAPON-REPORT-$id.json"
            fi
          }
          # First six isolate baseline, clipping, software gun fallback
          # during flash and bright-green palette quantization independently.
          p4 play vf-soft-play     0 0 0 0 0 0 0 0
          p4 play vf-old-play      1 0 0 0 0 0 0 0
          p4 play vf-clip-play     1 1 0 0 0 0 0 0
          p4 play vf-cont-play     1 1 1 0 0 0 0 0
          p4 play vf-neutral-play  1 1 1 1 0 0 0 0
          p4 play cm50l-neut-play 1 1 1 1 1 1 0 0

          # Two PERF builds have identical logic/timing, except the second
          # entirely skips R_DrawPlayerSprites. This is the theoretical
          # maximum CPU saving from moving *all* psprites off software raster.
          for variant in vf-ctrl-perf vf-nogun-perf; do
            nogun=0
            if [[ "$variant" == "vf-nogun-perf" ]]; then nogun=1; fi
            env DOOM_R35D_CHECKER=1 DOOM_R39C_VARIANT=mall \
                DOOM_R39D_DITHER_TOGGLE=0 DOOM_R39E_AUDIO_TOGGLES=1 \
                DOOM_R40_STAGE1=fast DOOM_R42_WALL_ASM=1 DOOM_R45_VARIANT=asm \
                DOOM_R47_PLANE_PAIR=1 DOOM_R47_FLAT_HOIST=1 \
                DOOM_R47_SPRITE_HOIST=1 DOOM_R48_PAIR_V=1 DOOM_R48_V_FAST=1 \
                DOOM_R49_COLORMIX=0 DOOM_R49_COMPLUT=0 DOOM_R49_RATIO=none \
                DOOM_R51_HW_WEAPON=0 DOOM_R51_NO_PSPRITE="$nogun" \
                DOOM_R20_BGM_VGM="$DOOM_R20_BGM_VGM" DOOM_R51_BUILD="$variant" \
                fish scripts/lab/build_r35_linear.fish pixel4-perf
            cp "dist/r35/doom-md-r51-$variant.bin" "$D/"
            cp "dist/r35/flags-doom-md-r51-$variant.txt" "$D/"
            "$HOME/mars/m68k-elf/bin/m68k-elf-size" -A \
                "dist/r35/doom-md-r51-$variant.elf" > "$D/size-$variant.txt"
          done

      - name: Audit VRAM/WRAM and compare ROM sizes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          d=Path('dist/r51-clip')
          sizes={}
          for p in sorted(d.glob('size-*.txt')):
              m=re.search(r'^\.bss\s+(\d+)\s+',p.read_text(),re.M)
              if not m:raise SystemExit('No BSS: '+p.name)
              b=int(m.group(1))
              if b>57920:raise SystemExit(f'Boot BSS over budget: {p.name} = {b}')
              sizes[p.stem[5:]]=b
          assert len(sizes)==8,sizes
          base=sizes['vf-soft-play']
          for name in ['vf-old-play','vf-clip-play','vf-cont-play','vf-neutral-play']:
              assert sizes[name]-base<=32,(name,base,sizes[name])
          for name in ['vf-old-play','vf-clip-play','vf-cont-play','vf-neutral-play','cm50l-neut-play']:
              report=json.loads((d/f'R51-WEAPON-REPORT-{name}.json').read_text())
              assert report['palette2_distinct']>=12
              assert all(0<f['count']<=240 and len(f['blocks'])<=20 for f in report['frames'])
          (d/'BSS-AUDIT.json').write_text(json.dumps(sizes,indent=2)+'\n')
          print(json.dumps(sizes,indent=2))
          PY

      - name: BlastEm smoke tests for both PERF and PLAY variants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,shutil,subprocess,time
          d=Path('dist/r51-clip').resolve()
          exe=shutil.which('blastem') or next(
            (str(p) for p in (Path.home()/'Projetos').glob('**/blastem')
             if p.is_file() and os.access(p,os.X_OK)),None)
          if not exe: raise SystemExit('BlastEm not found')
          env=os.environ.copy();env.update(SDL_AUDIODRIVER='dummy', SDL_VIDEODRIVER='dummy')
          lines=[]
          for rom in sorted(d.glob('*.bin')):
              t=time.monotonic()
              try:
                  r=subprocess.run([exe,'-b','800',str(rom)],cwd=d,env=env,
                        stdout=subprocess.PIPE,stderr=subprocess.STDOUT,
                        text=True,errors='replace',timeout=35)
              except subprocess.TimeoutExpired:
                  raise SystemExit('BlastEm 800-frame hang: '+rom.name)
              msg=f'{rom.name}: exit={r.returncode} wall={time.monotonic()-t:.2f}s'
              lines.append(msg);print(msg,flush=True)
              if r.returncode: raise SystemExit(msg)
          (d/'BLASTEM-SMOKE.txt').write_text('\n'.join(lines)+'\n')
          PY

      - name: Write QA instructions and artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          d=Path('dist/r51-clip')
          roms=[{'name':p.name,'bytes':p.stat().st_size,
                 'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
                for p in sorted(d.glob('*.bin'))]
          assert len(roms)==8,roms
          (d/'MANIFEST.json').write_text(json.dumps({
              'baseline':'R50 VF Fast on-demand benchmark ~5.30 FPS',
              'new_features':'HUD via lower-priority hardware pistol and opaque bottom Window plane, no H-INT',
              'ablation':'no-gun PERF omits all R_DrawPlayerSprites for maximum potential FPS gain',
              'color':'neutral penalty intended to reduce green/cyan speckles, to be validated visually',
              'ci_validated':'asset conversion, compile, WRAM, 800-frame BlastEm smoke',
              'not_automated':'physical scanline clipping, firing/muzzle flash, visually faithful color, gameplay FPS',
              'roms':roms},indent=2)+'\n')
          (d/'README.txt').write_text(
              'R51 V2 HARDWARE PISTOL: HUD MASK + NO-DOUBLE-GUN + NEUTRAL PALETTE\n'
              'V1 BASELINE: doom-md-r51-vf-old-play.bin\n'
              'SOFTWARE CTRL: doom-md-r51-vf-soft-play.bin\n'
              '1. Compare vf-old-play and vf-clip-play for gun/HUD overlap.\n'
              '2. vf-clip-play uses PAL2 low-priority sprite + Window bottom\n'
              '   opaque black; no H-INT is used.\n'
              '3. Compare vf-clip-play vs vf-cont-play while FIRING, moving.\n'
              '   vf-cont-play retains HW gun even while software muzzle flash\n'
              '   is drawn; check no double-gun/tearing.\n'
              '4. Compare vf-cont-play vs vf-neutral-play for green neon dots.\n'
              '5. Re-test title/menu, weapon bob, frame switching and reset.\n'
              '6. Benchmark vf-ctrl-perf vs vf-nogun-perf. No-gun excludes ALL\n'
              '   first-person software psprites: that FPS delta is the\n'
              '   optimistic upper bound on any hardware sprite CPU speedup.\n'
              '7. Compare ColorMix only AFTER neutral gun/HUD pass visual QA.\n'
              'CAUTION: the HUD Window mask and flash composition are new\n'
              'experimental effects; smoke tests do not validate pixels.\n')
          print('Eight ROMs:',[r['name'] for r in roms])
          PY

      - name: Upload R51 V2 gun mask and no-gun benchmark matrix
        uses: actions/upload-artifact@v6
        with:
          name: doom-md-r51-hw-weapon-clip-fix
          path: dist/r51-clip/
          retention-days: 90
          if-no-files-found: error
