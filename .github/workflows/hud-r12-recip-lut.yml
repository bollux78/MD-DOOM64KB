name: HUD24 R12 reciprocal LUT matrix
on:
  workflow_dispatch:
  push:
    branches: [fullscreen]
    paths:
      - '.github/workflows/hud-r12-recip-lut.yml'

permissions:
  contents: read

jobs:
  r12-recip-lut:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 80
    steps:
      - name: Checkout HUD renderer
        uses: actions/checkout@v4
        with:
          ref: hud
      - name: Check 68000 toolchain
        shell: bash
        run: |
          command -v fish
          command -v python3
          test -x "$HOME/mars/m68k-elf/bin/m68k-elf-gcc"
          test -f "$HOME/mars/m68k-elf/lib/libmd.a"
      - name: Exhaustive arithmetic test and compile five variants
        shell: bash
        run: fish scripts/lab/build_r12_recip_lut.fish
      - name: Publish ROMs, flags, logs, sizes and disassembly
        uses: actions/upload-artifact@v4
        with:
          name: doom-md-hud-r12-recip-lut-five-roms
          path: |
            dist/r12-recip/*.bin
            dist/r12-recip/*.elf
            dist/r12-recip/*.log
            dist/r12-recip/*.txt
          if-no-files-found: error
          retention-days: 30
