name: M14 native checkpoint private compile E1M1
on:
  push:
    branches: [exp-manifold-m14-native-save]
    paths: ['.github/workflows/manifold-m14-native-save-private-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-compile:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Find local SGDK, toolchain and shareware WAD
        shell: bash
        run: |
          set -euo pipefail
          test -x "$HOME/mars/m68k-elf/bin/m68k-elf-gcc"
          test -f /home/dan/Projetos/doom-md/assets/wads/doom1.wad
          for d in "$GITHUB_WORKSPACE/vendor/sgdk" "$HOME/Projetos/doom-md/vendor/sgdk" "$HOME/Projetos/MD-DOOM64KB/vendor/sgdk" "$HOME/mars/sgdk" "$HOME/mars/SGDK" "$HOME/sgdk" "/opt/sgdk"; do
            if test -f "$d/makefile.gen"; then echo "GDK=$d" >> "$GITHUB_ENV"; exit 0; fi
          done
          while IFS= read -r p; do
            if test -f "$p"; then echo "GDK=$(dirname "$p")" >> "$GITHUB_ENV"; exit 0; fi
          done < <(find "$HOME" /opt -maxdepth 9 -type f -name makefile.gen 2>/dev/null)
          echo '::error::Missing SGDK'; exit 1
      - name: Stage E1M1 with native SRAM save (private)
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/m14-native-save-$GITHUB_RUN_ID"
          mkdir -p "$scratch"
          echo "M14_TEST_STAGE=$scratch" >> "$GITHUB_ENV"
          git clone --quiet https://github.com/ehaliewicz/Manifold.git "$scratch/upstream"
          git -C "$scratch/upstream" checkout --quiet b6fe52a52344464de00bde4dc58a40f8b89cfc1a
          python3 -c 'import shapely,PIL' || python3 -m pip install --user -q shapely pillow
          MANIFOLD_MAP=E1M1 MANIFOLD_START_MENU=1 MANIFOLD_HUD=doom \
          MANIFOLD_BSP=1 MANIFOLD_RADIUS=1 MANIFOLD_STABLE_VIEW=1 MANIFOLD_OBJECTS=1 \
          MANIFOLD_MONSTERS=1 MANIFOLD_MONSTERS_INACTIVE=1 MANIFOLD_HAZARDS=0 MANIFOLD_MUSIC=0 MANIFOLD_WEAPONS=0 MANIFOLD_PERF=0 \
          MANIFOLD_DOORS=1 MANIFOLD_DYN_PARAMS=1 MANIFOLD_WEAPON_FIX=1 \
          MANIFOLD_INPUT_FIX=1 MANIFOLD_UNPACK_MAP=1 MANIFOLD_VG_MICRO=1 MANIFOLD_TEX_U=1 \
          MANIFOLD_SKY_MERGE=0 MANIFOLD_EYE=48 MANIFOLD_OBJ_HEIGHT_PCT=80 \
          MANIFOLD_WAD_SND=/home/dan/Projetos/doom-md/assets/wads/doom1.wad \
            python3 experiments/DOOM_Manifold_E1M1/m01/stage_rom.py \
              --source "$scratch/upstream" --wad /home/dan/Projetos/doom-md/assets/wads/doom1.wad \
              --out "$scratch/map" > "$scratch/stage.log" 2>&1 || {
                tail -55 "$scratch/stage.log"; exit 1; }
          grep -q 'M14 native save' "$scratch/stage.log"
          grep -q 'm14_checkpoint_load_current' "$scratch/map/src/game.c"
          grep -q 'm14_sram_save' "$scratch/map/src/doom_statusbar.c"
          if test ! -e "$scratch/map/src/math3D.h"; then ln -s math3d.h "$scratch/map/src/math3D.h"; fi
          echo 'PASS: private Manifold M14 E1M1 staging'
      - name: Cross compile the actual staged E1M1
        shell: bash
        run: |
          set -euo pipefail
          src="$M14_TEST_STAGE/map"
          cp experiments/DOOM_Manifold_E1M1/tools/m14/multimap/mk-split.gen "$M14_TEST_STAGE/mk-split.gen"
          sed -i "s@/home/claude/md-doom64kb@$GITHUB_WORKSPACE@g" "$M14_TEST_STAGE/mk-split.gen"
          tc="$HOME/mars/m68k-elf/bin/m68k-elf-"
          export PATH="$HOME/mars/m68k-elf/bin:$GDK/bin:$PATH"
          make -C "$src" -f "$M14_TEST_STAGE/mk-split.gen" -j2 release \
            OS=Linux GDK="$GDK" PREFIX="$tc" CC="$tc"gcc LD="$tc"ld \
            AR="$tc"ar NM="$tc"nm OBJCPY="$tc"objcopy \
            MAPEXTRA_ORG=0x280000 > "$M14_TEST_STAGE/build.log" 2>&1 || {
              grep -iEm25 'error|undefined|failed' "$M14_TEST_STAGE/build.log" || tail -80 "$M14_TEST_STAGE/build.log"
              exit 1
            }
          test -s "$src/out/release/rom.out"
          echo 'PASS: native save SGDK image compiled. No copyrighted ROM uploaded.'
      - name: Report errors only; never upload private assets
        if: failure()
        shell: bash
        run: |
          if test -f "$M14_TEST_STAGE/stage.log"; then tail -50 "$M14_TEST_STAGE/stage.log"; fi
          if test -f "$M14_TEST_STAGE/build.log"; then grep -iE -m20 'error|undefined' "$M14_TEST_STAGE/build.log" || true; fi
