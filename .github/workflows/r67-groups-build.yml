name: R67 aggressive 4 8 16 texture groups - build vs R66

on:
  push:
    branches: [exp-r67-aggressive-texture-groups]
    paths:
      - '.github/workflows/r67-groups-build.yml'
  workflow_dispatch:

concurrency:
  group: r67-groups-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-profile:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6

      - name: Preflight fish scripts syntax
        shell: bash
        run: |
          set -euo pipefail
          fish -n scripts/build_silent.fish
          fish -n scripts/lab/build_r35_linear.fish
          python3 - <<'CHECK'
          from pathlib import Path
          f=Path('scripts/lab/build_r35_linear.fish').read_text()
          assert f.count('set -gx DOOM_BUILD_ID $id')==1
          assert f.count('echo "READY: R35 4MiB linear')==1
          assert f.count('if set -q DOOM_R60_BUILD')==1
          assert f.count("set defs $defs '-DDOOM_R60_PAIR_ASM'")==1
          print('R60 fish structure PASS')
          CHECK
          echo 'fish syntax PASS'

      - name: Toolchain and Pair-H oracle
        shell: bash
        run: |
          set -euo pipefail
          command -v fish
          command -v python3
          test -x "$HOME/mars/m68k-elf/bin/m68k-elf-size"
          test -x "$HOME/mars/m68k-elf/bin/m68k-elf-nm"
          mkdir -p dist/r67
          python3 scripts/lab/test_r47a_plane_pair.py | tee dist/r67/ORACLE-plane-pair.txt
          python3 scripts/lab/test_r48_pair_v.py | tee dist/r67/ORACLE-pair-v.txt
          python3 scripts/lab/r47b_vdp_oracle.py --frames 48 --out dist/r67/ORACLE-vdp.json

      - name: Restore pinned E1M1 VGM
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,lzma,pathlib
          p=pathlib.Path('assets/r18-e1m1.vgm.xz')
          data=lzma.decompress(p.read_bytes())
          assert hashlib.sha256(data).hexdigest()=='64a7a0748953a4bd35b75735b9f4b7c1c89c0f3f4aa43395485cadd7e88a8226'
          pathlib.Path('res/e1m1.vgm').write_bytes(data)
          PY

      - name: Verify existing pinned shareware WAD (no home scan or network)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,pathlib,shutil
          target=pathlib.Path('scripts/doom1.wad')
          home=pathlib.Path.home()
          candidates=[target,home/'Projetos/doom-assets/doom1.wad',
              home/'Projetos/doom-assets/DOOM1.WAD',home/'Downloads/doom1.wad']
          wanted='1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771'
          for p in candidates:
              if p.is_file() and p.stat().st_size==4196020 and hashlib.sha256(p.read_bytes()).hexdigest()==wanted:
                  if p.resolve()!=target.resolve():
                      target.parent.mkdir(exist_ok=True,parents=True)
                      shutil.copyfile(p,target)
                  print('Pinned shareware WAD verified:',p.name);break
          else:
              import gzip,urllib.request
              mirrors=[
                  ('archive','https://archive.org/download/wadarchive/DATA/5b.zip/5b%2F2e249b9c5133ec987b3ea77596381dc0d6bc1d%2F5b2e249b9c5133ec987b3ea77596381dc0d6bc1d.wad.gz',True),
                  ('aikernel','https://aikernel.net/demo/doom/DOOM1.WAD',False)]
              for name,url,compressed in mirrors:
                  try:
                      request=urllib.request.Request(url,headers={'User-Agent':'MD-DOOM64KB R60 pinned WAD'})
                      with urllib.request.urlopen(request,timeout=65) as response:
                          data=response.read(9_000_001)
                      if len(data)>9_000_000:raise ValueError('download exceeds cap')
                      if compressed:data=gzip.decompress(data)
                      if len(data)==4196020 and hashlib.sha256(data).hexdigest()==wanted:
                          target.parent.mkdir(exist_ok=True,parents=True)
                          target.write_bytes(data)
                          print('Pinned shareware WAD hash verified from',name)
                          break
                  except Exception as exc:
                      print('WAD mirror failed',name,type(exc).__name__)
              else:raise SystemExit('Pinned shareware WAD unavailable or checksum mismatch')
          PY

      - name: Color-table generation preflight (same as R59 v3)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/r67
          python3 scripts/lab/gen_r22_pixel4.py
          python3 scripts/lab/gen_r49_colormix.py | tee dist/r67/PREFLIGHT-generator.txt
          python3 scripts/lab/test_r49_colormix.py | tee dist/r67/PREFLIGHT-color-oracle.txt
          cp src/r49_colormix_report.json dist/r67/PREFLIGHT-color-report.json

      - name: Ensure NumPy for Cláudio palettes and microdither
        shell: bash
        run: |
          set -euo pipefail
          if python3 -c 'import numpy;print("numpy",numpy.__version__)'; then
            echo 'NumPy ready'
          else
            python3 -m venv "$RUNNER_TEMP/r53-venv"
            "$RUNNER_TEMP/r53-venv/bin/python3" -m pip install --disable-pip-version-check 'numpy>=2.2,<3'
            echo "$RUNNER_TEMP/r53-venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Preflight Python scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/lab/gen_r57_colormatch.py scripts/lab/gen_r59_colorview.py scripts/lab/test_r59_colorview.py scripts/lab/build_r67.py scripts/lab/r64a_rsp_capture.py

      - name: Host pixel clipping and DMA bounds oracle
        shell: bash
        run: |
          python3 scripts/lab/test_r57_viewport.py
          python3 scripts/lab/test_r57_viewmenu.py

      - name: Build R66 PERF reference and R67 4 8 16 PERF PLAY
        shell: bash
        run: |
          set -euo pipefail
          export DOOM_R20_BGM_VGM="$GITHUB_WORKSPACE/res/e1m1.vgm"
          python3 scripts/lab/build_r67.py | tee dist/r67/BUILD.log
          cp docs/review-r59/R59-V3-SIX-MODES.md dist/r67/R59-COLOR-REFERENCE.md

      - name: Verify R66 vs R67 flags, identical PERF BSS and palette/ASM consistency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'CHECK'
          import hashlib,json,pathlib
          d=pathlib.Path('dist/r67')
          rows=json.loads((d/'MANIFEST.json').read_text())
          assert len(rows)==7 and len(list(d.glob('*.bin')))==7
          for r in rows:
              b=(d/r['rom']).read_bytes()
              assert len(b)==r['bytes'] and hashlib.sha256(b).hexdigest()==r['sha256']
              assert 0<r['bss_bytes']<=57920
              print(r['rom'],r['bytes'],'BSS',r['bss_bytes'])
          for table in ('r56_tables.h','r59_color_tables.h'):
              assert len({(d/(name+'-'+table)).read_bytes() for name in
                  ('r66-perf','r67-g4-perf','r67-g4-play','r67-g8-perf','r67-g8-play','r67-g16-perf','r67-g16-play')})==1,table
          print('PASS 7 ROMs, BSS, hashes, color tables')
          bss={r['rom']:r['bss_bytes'] for r in rows}
          assert all(bss[f'doom-md-r60-r67-g{n}-perf.bin']==bss['doom-md-r60-r66-perf.bin'] for n in (4,8,16)),'R67 must add zero BSS to PERF'
          CHECK

      - name: Require rebuilt R66 ROM byte-identical to previously measured 7.21 FPS control
        uses: actions/download-artifact@v4
        with:
          name: doom-md-r66-cl-approx-colpair-perf-play
          run-id: 40231459814
          github-token: ${{ github.token }}
          path: dist/r67/original-control

      - name: Exact original R66 control ROM binary comparison
        shell: bash
        run: |
          set -euo pipefail
          cmp dist/r67/doom-md-r60-r66-perf.bin \
              dist/r67/original-control/doom-md-r60-r66-perf.bin
          sha256sum dist/r67/doom-md-r60-r66-perf.bin
          echo 'PASS original R66 ROM reproduced byte for byte.'

      - name: BlastEm automated PERF-only regression matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures,csv,os,pathlib,shutil,subprocess,time
          d=pathlib.Path('dist/r67').resolve()
          exe=shutil.which('blastem') or next((str(p) for p in
              (pathlib.Path.home()/'Projetos').glob('**/blastem')
              if p.is_file() and os.access(p,os.X_OK)),None)
          assert exe,'BlastEm unavailable'
          roms=sorted(d.glob('*-perf.bin'))
          assert len(roms)==4,[p.name for p in roms]
          env=os.environ.copy()
          env.update(SDL_AUDIODRIVER='dummy',SDL_VIDEODRIVER='dummy')
          # PERF ROMs run DEMO3 automatically; PLAY requires controller input.
          # Keep PLAY artifacts for manual real-hardware validation.
          suites=((800,1),(10000,1))
          jobs=[(rom,frames,rep) for frames,repeats in suites
                for rep in range(1,repeats+1) for rom in roms]
          def check(job):
            rom,frames,rep=job
            t=time.monotonic()
            try:
              p=subprocess.run([exe,'-b',str(frames),str(rom)],cwd=d,
                  env=env,capture_output=True,text=True,errors='replace',timeout=120)
              return [rom.name,frames,rep,round(frames/60,2),
                      round(time.monotonic()-t,3),p.returncode,
                      (p.stderr or '')[-350:]]
            except subprocess.TimeoutExpired:
              return [rom.name,frames,rep,round(frames/60,2),
                      round(time.monotonic()-t,3),'TIMEOUT','120-second timeout']
          rows=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=1) as pool:
            for row in pool.map(check,jobs):
              rows.append(row)
              print(' | '.join(map(str,row[:6])),flush=True)
          with (d/'BLASTEM-PERF-REGRESSION.csv').open('w',newline='') as fp:
            w=csv.writer(fp)
            w.writerow(['rom','frames','repeat','emulated_seconds_60hz',
                        'wall_seconds','exit_code','stderr_tail'])
            w.writerows(rows)
          errors=[r for r in rows if r[5]!=0]
          print(f'BLASTEM MATRIX: {len(rows)} runs, '
                f'{sum(r[1] for r in rows):,} frames total, '
                f'{len(errors)} process errors')
          if errors:
            for r in errors:print('FAIL',r,flush=True)
            raise SystemExit('BlastEm matrix contains failed runs')
          PY

      - name: Upload original R66 PERF reference and R67 4 8 16 PERF PLAY variants
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: doom-md-r67-approx-texture-g4-g8-g16
          path: dist/r67/
          retention-days: 90
          if-no-files-found: error
