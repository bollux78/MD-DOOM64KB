name: R51 Hardware pistol sprites versus software raster

on:
  push:
    branches: [r51-hw-weapon-sprite]
    paths:
      - '.github/workflows/r51-hw-weapon-sprite.yml'
      - 'src/r22_video.inc'
      - 'src/r22_benchmark.inc'
      - 'src/r22_pixel4.h'
      - 'src/r35_native4.inc'
      - 'scripts/lab/test_r48_pair_v.py'
      - 'scripts/lab/gen_r49_colormix.py'
      - 'scripts/lab/test_r49_colormix.py'
      - 'scripts/lab/build_r35_linear.fish'
      - 'scripts/build_silent.fish'
      - 'scripts/set_rom_identity.py'
      - 'src/d_main.c'
      - 'src/d_main.h'
      - 'src/g_game.c'
      - 'src/i_system.h'
      - 'src/m_text.c'
      - 'src/i_genesis.c'
      - 'src/r_draw.c'
      - 'src/r51_weapon_hw.inc'
      - 'scripts/lab/gen_r51_hw_weapon.py'
  workflow_dispatch:

concurrency:
  group: r51-hw-weapon-sprite
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-profile:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6

      - name: Preflight fish scripts syntax
        shell: bash
        run: |
          set -euo pipefail
          fish -n scripts/build_silent.fish
          fish -n scripts/lab/build_r35_linear.fish
          echo 'fish syntax PASS'

      - name: Toolchain and Pair-H oracle
        shell: bash
        run: |
          set -euo pipefail
          command -v fish
          command -v python3
          test -x "$HOME/mars/m68k-elf/bin/m68k-elf-size"
          test -x "$HOME/mars/m68k-elf/bin/m68k-elf-nm"
          mkdir -p dist/r51-weapon
          python3 scripts/lab/test_r47a_plane_pair.py | tee dist/r51-weapon/ORACLE-plane-pair.txt
          python3 scripts/lab/test_r48_pair_v.py | tee dist/r51-weapon/ORACLE-pair-v.txt
          python3 scripts/lab/r47b_vdp_oracle.py --frames 48 --out dist/r51-weapon/ORACLE-vdp.json

      - name: Restore pinned E1M1 VGM
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,lzma,pathlib
          p=pathlib.Path('assets/r18-e1m1.vgm.xz')
          data=lzma.decompress(p.read_bytes())
          assert hashlib.sha256(data).hexdigest()=='64a7a0748953a4bd35b75735b9f4b7c1c89c0f3f4aa43395485cadd7e88a8226'
          pathlib.Path('res/e1m1.vgm').write_bytes(data)
          PY

      - name: Verify or recover Doom shareware WAD
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,gzip,os,pathlib,shutil,urllib.request
          target=pathlib.Path('scripts/doom1.wad')
          target.parent.mkdir(parents=True,exist_ok=True)
          expected='1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771'
          expected_size=4196020
          home=pathlib.Path.home()
          candidates=[target,home/'Projetos/doom-assets/doom1.wad',home/'Projetos/doom-assets/DOOM1.WAD',home/'Downloads/doom1.wad']
          for top in (home/'Projetos',home/'Games',home/'Jogos'):
              if not top.is_dir(): continue
              depth=len(top.parts)
              for directory,subdirs,names in os.walk(top,followlinks=False):
                  if len(pathlib.Path(directory).parts)-depth>4:
                      subdirs[:]=[]; continue
                  subdirs[:]=[x for x in subdirs if not x.startswith('.')]
                  for name in names:
                      if name.lower()=='doom1.wad': candidates.append(pathlib.Path(directory)/name)
          for p in candidates:
              if not p.is_file(): continue
              raw=p.read_bytes()
              if len(raw)==expected_size and hashlib.sha256(raw).hexdigest()==expected:
                  if p.resolve()!=target.resolve(): shutil.copyfile(p,target)
                  print('Verified WAD from',p); break
          else:
              mirrors=[
                ('archive','https://archive.org/download/wadarchive/DATA/5b.zip/5b%2F2e249b9c5133ec987b3ea77596381dc0d6bc1d%2F5b2e249b9c5133ec987b3ea77596381dc0d6bc1d.wad.gz',True),
                ('aikernel','https://aikernel.net/demo/doom/DOOM1.WAD',False)]
              for name,url,compressed in mirrors:
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'MD-DOOM64KB pair boot fix'})
                      with urllib.request.urlopen(req,timeout=65) as response: raw=response.read(9_000_000)
                      if compressed: raw=gzip.decompress(raw)
                      if len(raw)==expected_size and hashlib.sha256(raw).hexdigest()==expected:
                          target.write_bytes(raw); print('Recovered WAD from',name); break
                  except Exception as e: print('mirror failed',name,str(e)[:100])
              else: raise SystemExit('Pinned shareware WAD unavailable')
          assert hashlib.sha256(target.read_bytes()).hexdigest()==expected
          PY

      - name: Preflight ColorMix source tables and fidelity oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/r51-weapon
          python3 scripts/lab/gen_r22_pixel4.py
          python3 scripts/lab/gen_r49_colormix.py | tee dist/r51-weapon/PREFLIGHT-generator.txt
          python3 scripts/lab/test_r49_colormix.py | tee dist/r51-weapon/PREFLIGHT-color-oracle.txt
          cp src/r49_colormix_report.json dist/r51-weapon/PREFLIGHT-color-report.json

      - name: Verify source WAD pistol patch decoder and palette2 quantizer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/lab/gen_r51_hw_weapon.py
          python3 scripts/lab/gen_r51_hw_weapon.py
          python3 - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('src/r51_weapon_report.json').read_text())
          assert d['frames'], 'No PISG WAD sprites'
          assert d['palette2_distinct']>=12,d
          assert all(0<f['count']<=240 for f in d['frames'])
          assert all(len(f['blocks'])<=20 for f in d['frames'])
          assert 'static const uint32_t r51_weapon_patterns_' in Path('src/r51_weapon_assets.h').read_text()
          print('WAD pistol frames:',[(f['name'],f['w'],f['h'],f['count']) for f in d['frames']])
          print('Palette2 unique:',d['palette2_distinct'])
          PY
          cp src/r51_weapon_report.json dist/r51-weapon/R51-WEAPON-REPORT.json

      - name: Validate R51 layout, SAT ownership and ROM IDs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          ids=['vf-ctrl-play','vf-hw-play','cm50l-hw-play','vf-ctrl-perf']
          names=['doom-md-r51-'+x for x in ids]
          assert len(names)==len(set(names))==4
          assert all(len(n)<=30 for n in names),[(n,len(n)) for n in names]
          v=Path('src/r22_video.inc').read_text()
          h=Path('src/r51_weapon_hw.inc').read_text()
          r=Path('src/r_draw.c').read_text()
          assert 'VDP_setSpriteListAddress(0xF400)' in v
          assert 'VDP_setWindowAddress(0xD000)' in v
          assert 'R51_PISTOL_TILE_BASE 16u' in Path('src/r51_weapon_assets.h').read_text()
          assert 'VDP_WRITE_VRAM_ADDR(0xF400)' in h
          assert 'R51_WeaponPresent()' in v
          assert 'R51_WeaponInvalidate()' in v
          assert 'psp->state->sprite==SPR_PISG' in r
          print('Pair-V spare tile atlas and SAT ownership PASS')
          PY

      - name: Build R51 four-way PLAY/PERF weapon experiment
        shell: bash
        run: |
          set -euo pipefail
          D=dist/r51-weapon
          mkdir -p "$D"
          export DOOM_R20_BGM_VGM="$GITHUB_WORKSPACE/res/e1m1.vgm"
          p4 () {
            local mode="$1" id="$2" gun="$3" mix="$4" lut="$5"
            echo "====== R51 hardware pistol $id ======"
            env DOOM_R35D_CHECKER=1 DOOM_R39C_VARIANT=mall \
                DOOM_R39D_DITHER_TOGGLE=0 DOOM_R39E_AUDIO_TOGGLES=1 \
                DOOM_R40_STAGE1=fast DOOM_R42_WALL_ASM=1 DOOM_R45_VARIANT=asm \
                DOOM_R47_PLANE_PAIR=1 DOOM_R47_FLAT_HOIST=1 \
                DOOM_R47_SPRITE_HOIST=1 DOOM_R48_PAIR_V=1 DOOM_R48_V_FAST=1 \
                DOOM_R49_COLORMIX="$mix" DOOM_R49_COMPLUT="$lut" \
                DOOM_R49_RATIO=none DOOM_R50_PLAY_BENCH=1 \
                DOOM_R50_MENU_FREEZE=1 DOOM_R50_STATIC_MENU=1 \
                DOOM_R50_HARD_REINIT=1 DOOM_R50_RESET_SRAM=0 \
                DOOM_R51_HW_WEAPON="$gun" \
                DOOM_R20_BGM_VGM="$DOOM_R20_BGM_VGM" DOOM_R51_BUILD="$id" \
                fish scripts/lab/build_r35_linear.fish "pixel4-$mode"
            cp "dist/r35/doom-md-r51-$id.bin" "$D/"
            cp "dist/r35/flags-doom-md-r51-$id.txt" "$D/"
            "$HOME/mars/m68k-elf/bin/m68k-elf-size" -A \
                "dist/r35/doom-md-r51-$id.elf" > "$D/size-$id.txt"
            if [[ "$gun" == "1" ]]; then
              cp src/r51_weapon_report.json "$D/R51-WEAPON-REPORT-$id.json"
            fi
          }
          p4 play vf-ctrl-play 0 0 0
          p4 play vf-hw-play 1 0 0
          p4 play cm50l-hw-play 1 1 1
          # PURE PERF baseline, not polluted by interactive benchmark define.
          echo "====== R51 PERF reference ======"
          env DOOM_R35D_CHECKER=1 DOOM_R39C_VARIANT=mall \
              DOOM_R39D_DITHER_TOGGLE=0 DOOM_R39E_AUDIO_TOGGLES=1 \
              DOOM_R40_STAGE1=fast DOOM_R42_WALL_ASM=1 DOOM_R45_VARIANT=asm \
              DOOM_R47_PLANE_PAIR=1 DOOM_R47_FLAT_HOIST=1 \
              DOOM_R47_SPRITE_HOIST=1 DOOM_R48_PAIR_V=1 DOOM_R48_V_FAST=1 \
              DOOM_R49_COLORMIX=0 DOOM_R49_COMPLUT=0 DOOM_R49_RATIO=none \
              DOOM_R51_HW_WEAPON=0 DOOM_R20_BGM_VGM="$DOOM_R20_BGM_VGM" \
              DOOM_R51_BUILD=vf-ctrl-perf fish scripts/lab/build_r35_linear.fish pixel4-perf
          cp dist/r35/doom-md-r51-vf-ctrl-perf.bin "$D/"
          cp dist/r35/flags-doom-md-r51-vf-ctrl-perf.txt "$D/"
          "$HOME/mars/m68k-elf/bin/m68k-elf-size" -A \
              dist/r35/doom-md-r51-vf-ctrl-perf.elf > "$D/size-vf-ctrl-perf.txt"

      - name: Audit R51 WRAM, ROM count and sprite atlas size
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          d=Path('dist/r51-weapon')
          sizes={}
          for p in sorted(d.glob('size-*.txt')):
              m=re.search(r'^\.bss\s+(\d+)\s+',p.read_text(),re.M)
              if not m:raise SystemExit('No BSS: '+p.name)
              b=int(m.group(1))
              if b>57920:raise SystemExit(f'Pair-V boot BSS risk: {p.name} = {b}')
              sizes[p.stem[5:]]=b
          assert len(sizes)==4,sizes
          assert sizes['vf-hw-play']-sizes['vf-ctrl-play']<=32
          assert sizes['cm50l-hw-play']-sizes['vf-hw-play']<=16
          data=json.loads((d/'R51-WEAPON-REPORT-vf-hw-play.json').read_text())
          assert all(f['count']<=240 for f in data['frames'])
          (d/'BSS-AUDIT.json').write_text(json.dumps(sizes,indent=2)+'\n')
          print(json.dumps(sizes,indent=2))
          PY

      - name: BlastEm smoke tests for both PERF and PLAY variants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,shutil,subprocess,time
          d=Path('dist/r51-weapon').resolve()
          exe=shutil.which('blastem') or next(
            (str(p) for p in (Path.home()/'Projetos').glob('**/blastem')
             if p.is_file() and os.access(p,os.X_OK)),None)
          if not exe: raise SystemExit('BlastEm not found')
          env=os.environ.copy();env.update(SDL_AUDIODRIVER='dummy', SDL_VIDEODRIVER='dummy')
          lines=[]
          for rom in sorted(d.glob('*.bin')):
              t=time.monotonic()
              try:
                  r=subprocess.run([exe,'-b','800',str(rom)],cwd=d,env=env,
                        stdout=subprocess.PIPE,stderr=subprocess.STDOUT,
                        text=True,errors='replace',timeout=35)
              except subprocess.TimeoutExpired:
                  raise SystemExit('BlastEm 800-frame hang: '+rom.name)
              msg=f'{rom.name}: exit={r.returncode} wall={time.monotonic()-t:.2f}s'
              lines.append(msg);print(msg,flush=True)
              if r.returncode: raise SystemExit(msg)
          (d/'BLASTEM-SMOKE.txt').write_text('\n'.join(lines)+'\n')
          PY

      - name: Manifest and manual hardware weapon QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          d=Path('dist/r51-weapon')
          roms=[{'name':p.name,'bytes':p.stat().st_size,
                 'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
                for p in sorted(d.glob('*.bin'))]
          assert len(roms)==4,roms
          data={'baseline':'R50 Pair-V Fast 5.30 PLAY / 5.31 PERF',
                'experimental':'only normal PISG pistol frames use real VDP sprites, PAL2 and immutable ROM tiles',
                'other_weapons':'unchanged software rendering; muzzle flash and invisibility fallback to software',
                'controls':'vf-ctrl-play vs vf-hw-play, cm50l-hw-play for ColorMix and vf-ctrl-perf for benchmark',
                'validation':'WAD sprite decode, asset constraints, compile, BSS, BlastEm startup',
                'manual':'visual pistol alignment/bobbing, firing/recoil, HUD intrusion, sprite palette, perf, title artwork, reset',
                'roms':roms}
          (d/'MANIFEST.json').write_text(json.dumps(data,indent=2)+'\n')
          (d/'README.txt').write_text(
            'R51 HARDWARE PISTOL SPRITE PILOT - NO OTHER WEAPON CHANGES\n'
            'REFERENCE: doom-md-r51-vf-ctrl-play.bin\n'
            'EXPERIMENT: doom-md-r51-vf-hw-play.bin\n'
            'COLORMIX: doom-md-r51-cm50l-hw-play.bin\n'
            '1. Enter E1M1 at the same viewpoint in CTRL and HW builds.\n'
            '2. Compare pistol/hand detail, screen X/Y alignment and PAL2 colors.\n'
            '3. Walk to test weapon bob. Fire, reload, switch away and back.\n'
            '4. Check for tearing, HUD collision or sprites on the title/menu.\n'
            '5. Open and close the in-game menu, run DEMO3 benchmark twice.\n'
            '6. Compare 2134-frame DEMO3 FPS vs control: hardware may cost more\n'
            '   or less; no speed improvement is claimed before measurements.\n'
            '7. Check warm RESET, including during benchmark and native title.\n'
            'The pilot renders only PISG normal pistol with physical-pixel tiles;\n'
            'flash effects, invisible gun and other weapons use old software path.\n'
            'CI does NOT emulate player controls or inspect sprite composition.\n')
          print('R51 ROMs:',[r['name'] for r in roms])
          PY

      - name: Upload R51 hardware pistol sprite comparison ROMs
        uses: actions/upload-artifact@v6
        with:
          name: doom-md-r51-hw-weapon-sprite
          path: dist/r51-weapon/
          retention-days: 90
          if-no-files-found: error
