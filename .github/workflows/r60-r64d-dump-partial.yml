name: R60 R64D heap counters WRAM partial dump (BlastEm RSP)

on:
  push:
    branches: [exp-r60-r64a-prologue-memory-safe]
    paths: [.github/workflows/r60-r64d-dump-partial.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  counters:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: doom-md-r60-claudio-r64d-diag-heap
          run-id: 40215684973
          github-token: ${{ github.token }}
          path: dist/r64d-partial/zip
      - name: Decode WRAM via BlastEm debug protocol (no GDB package required)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/r64d-partial/evidence
          unzip -oq dist/r64d-partial/zip/MD_DOOM_R60_CLAUDIO_DIAG_HEAP.zip -d dist/r64d-partial/roms
          BLASTEM=$(command -v blastem || :)
          if test -z "$BLASTEM"; then BLASTEM=$(find "$HOME/Projetos" -name blastem -type f -executable -print -quit); fi
          test -n "$BLASTEM" && test -x "$BLASTEM"
          python3 scripts/lab/r64a_rsp_capture.py \
            --blastem "$BLASTEM" \
            --rom dist/r64d-partial/roms/doom-md-r60-diag-perf.bin \
            --elf dist/r64d-partial/roms/doom-md-r60-diag-perf.elf \
            --out dist/r64d-partial/evidence \
            --kind diag --diag-tic 128 --max-emulated-frames 10000 \
            | tee dist/r64d-partial/evidence/CAPTURE-LOG.txt
          cd dist/r64d-partial/roms
          python3 r64d_read.py ../evidence/WRAM_R64D_PARTIAL.bin \
            --header R64D-COUNTERS-HEADER.h --fps 6.72 --mhz 7.67 \
            | tee ../evidence/COUNTERS-PARTIAL.txt
          echo 'These are accumulated counters only through tic ~128; NOT full DEMO3.' > ../evidence/SCOPE.txt
      - name: Upload R64D counters plus full physical WRAM read
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doom-md-r60-r64d-128tic-wram
          path: dist/r64d-partial/evidence/
          if-no-files-found: warn
          retention-days: 90
