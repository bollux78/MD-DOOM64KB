name: Manifold M00-M14 local ROM archive
# Output is PRIVATE on self-hosted runner. No ROM or WAD is uploaded.
on:
  workflow_dispatch:
  push:
    branches: [exp-manifold-m14-e1m1]
    paths:
      - '.github/workflows/manifold-archive-roms.yml'
permissions:
  contents: read
concurrency:
  group: manifold-rom-archive-local
  cancel-in-progress: false
jobs:
  archive:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 180
    steps:
      - name: Checkout full historical repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify existing destination, WAD, and local toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -d /home/dan/Projetos/manifold-doom
          test -f /home/dan/Projetos/doom-md/assets/wads/doom1.wad
          test -x "$HOME/mars/m68k-elf/bin/m68k-elf-gcc"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path("/home/dan/Projetos/doom-md/assets/wads/doom1.wad")
          assert p.stat().st_size == 4196020
          assert hashlib.sha256(p.read_bytes()).hexdigest() == "1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771"
          print("Local shareware WAD OK (never uploaded)")
          PY
      - name: Find installed SGDK
        shell: bash
        run: |
          set -euo pipefail
          for d in "$GITHUB_WORKSPACE/vendor/sgdk" "$HOME/Projetos/doom-md/vendor/sgdk" "$HOME/Projetos/MD-DOOM64KB/vendor/sgdk" "$HOME/mars/sgdk" "$HOME/mars/SGDK" "$HOME/sgdk" "/opt/sgdk"; do
            if test -f "$d/makefile.gen"; then echo "GDK=$d" >> "$GITHUB_ENV"; exit 0; fi
          done
          while IFS= read -r f; do
            if test -f "$f"; then echo "GDK=${f%/makefile.gen}" >> "$GITHUB_ENV"; exit 0; fi
          done < <(find "$HOME" /opt -maxdepth 9 -type f -name makefile.gen 2>/dev/null)
          echo "::error::SGDK not installed on runner"; exit 1
      - name: Compile and archive historical ROMs locally
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/DOOM_Manifold_E1M1/tools/archive_rom_families.py
      - name: Summary (no ROMs in workflow artifacts)
        if: always()
        shell: bash
        run: |
          root=/home/dan/Projetos/manifold-doom/roms
          if test -d "$root"; then
            echo "ROMs stored privately on self-hosted runner: $root"
            find "$root" -mindepth 2 -maxdepth 2 -type f \( -name '*.bin' -o -name 'README.md' \) -printf '%P\n' | sort
          fi
          echo "No upload-artifact and no release publication."
