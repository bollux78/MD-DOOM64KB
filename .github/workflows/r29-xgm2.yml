name: R29 - XGM2 music experiments
on:
  push:
    branches: [r29-xgm2]
  workflow_dispatch:
concurrency:
  group: r29-xgm2
  cancel-in-progress: false
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v6
      - name: Restore original pinned E1M1 VGM
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,lzma,pathlib
          data=lzma.decompress(pathlib.Path('assets/r18-e1m1.vgm.xz').read_bytes())
          assert hashlib.sha256(data).hexdigest()=='64a7a0748953a4bd35b75735b9f4b7c1c89c0f3f4aa43395485cadd7e88a8226'
          pathlib.Path('res/e1m1.vgm').write_bytes(data)
          PY
      - name: Preflight, pinned audio hashes and XGM2 support
        shell: bash
        run: |
          fish -n scripts/lab/build_r29.fish
          python3 scripts/lab/test_r25_music.py
          python3 scripts/lab/test_r27_group.py
          test -f ~/mars/m68k-elf/lib/libmd.a
          test -f ~/mars/m68k-elf/inc/snd/xgm2.h
          grep -q 'XGM2_loadDriver' ~/mars/m68k-elf/inc/snd/xgm2.h
          java -version
          echo 'R29 preflight OK: scripts, source audio and XGM2 API'
      - name: Compile all six variants independently (keep partial successes)
        shell: bash
        run: |
          failed=0
          mkdir -p dist/r29
          : > dist/r29/BUILD-RESULTS.txt
          for variant in group-perf xgm2-low-fixed xgm2-low-group xgm2-single xgm2-multi xgm2-multi-play; do
            echo "=== START $variant ==="
            if DOOM_R20_BGM_VGM="$GITHUB_WORKSPACE/res/e1m1.vgm" fish scripts/lab/build_r29.fish "$variant"; then
              echo "$variant OK" | tee -a dist/r29/BUILD-RESULTS.txt
            else
              echo "$variant FAILED" | tee -a dist/r29/BUILD-RESULTS.txt
              failed=1
            fi
          done
          cat dist/r29/BUILD-RESULTS.txt
          exit "$failed"
      - name: Verify each ROM carried its intended renderer and audio flags
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist/r29')
          for rom in sorted(p.glob('doom-md-r29-*.bin')):
              stem=rom.stem
              flags=p/('flags-'+stem+'.txt')
              opts=flags.read_text() if flags.exists() else ''
              required=['-DDOOM_R25_MUSIC','-DDOOM_R27_GROUP_SIDE'] if 'group-perf' in stem else ['-DDOOM_R25_MUSIC']
              if 'xgm2-' in stem: required.append('-DDOOM_R29_XGM2')
              if 'xgm2-multi' in stem: required.append('-DDOOM_R29_MULTI')
              missing=[x for x in required if x not in opts]
              if missing:
                  print('INVALID FLAGS:',rom.name,missing,flush=True)
                  rom.unlink()
                  rom.with_suffix('.elf').unlink(missing_ok=True)
                  flags.unlink(missing_ok=True)
                  with (p/'BUILD-RESULTS.txt').open('a') as f:
                      f.write(stem+' INVALID_FLAGS '+','.join(missing)+'\n')
              else:
                  print('FLAGS VERIFIED:',rom.name,flush=True)
          PY
      - name: Record commit and compiler
        if: always()
        shell: bash
        run: |
          mkdir -p dist/r29
          echo "$GITHUB_SHA" > dist/r29/commit.txt
          ~/mars/m68k-elf/bin/m68k-elf-gcc --version > dist/r29/toolchain.txt
      - name: Publish build report on experimental branch
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib,os
          p=pathlib.Path('dist/r29')
          records=[]
          for f in sorted(p.glob('doom-md-r29-*.bin')):
            records.append(dict(name=f.name,bytes=f.stat().st_size,fits_2mib=f.stat().st_size<=2097152))
          summary=p/'BUILD-RESULTS.txt'
          results=summary.read_text().splitlines() if summary.exists() else []
          logs={}
          for f in sorted(p.glob('build-*.log')):
            lines=f.read_text(errors='replace').splitlines()
            logs[f.name]=lines[-15:]
          status=dict(run_id=os.environ.get('GITHUB_RUN_ID'),sha=os.environ.get('GITHUB_SHA'),
                      files=records,build_results=results,logs=logs)
          pathlib.Path('docs/review-r29/CI-LAST-RESULT.json').write_text(json.dumps(status,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(status,indent=2,ensure_ascii=False)[:3500])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/review-r29/CI-LAST-RESULT.json
          git commit -m "R29 report from self-hosted build [skip ci]" || true
          git push origin HEAD:r29-xgm2
      - name: Upload ROMs, matching ELF and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: doom-md-r29-xgm2
          path: dist/r29/
          if-no-files-found: warn
          retention-days: 90
