name: R46 M2A - Co-linked exact native projection ROM tables
on:
  # Re-enabled after explicit user approval, runner online.
  push:
    branches: [r46-m2a-projection-tables]
  workflow_dispatch:
concurrency:
  group: r46-m2a-projection-tables
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v6
      - name: Restore pinned XGM2 soundtrack input
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,lzma,pathlib
          data=lzma.decompress(pathlib.Path('assets/r18-e1m1.vgm.xz').read_bytes())
          assert hashlib.sha256(data).hexdigest()=='64a7a0748953a4bd35b75735b9f4b7c1c89c0f3f4aa43395485cadd7e88a8226'
          pathlib.Path('res/e1m1.vgm').write_bytes(data)
          PY
      - name: Recover pinned shareware DOOM1.WAD (not committed)
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip,hashlib,pathlib,urllib.request
          target=pathlib.Path('scripts/doom1.wad')
          expected_sha='1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771'
          size=4196020
          candidates=[
              ('ibiblio', 'https://distro.ibiblio.org/slitaz/sources/packages/d/doom1.wad',False),
              ('wad-archive', 'https://archive.org/download/wadarchive/DATA/5b.zip/5b%2F2e249b9c5133ec987b3ea77596381dc0d6bc1d%2F5b2e249b9c5133ec987b3ea77596381dc0d6bc1d.wad.gz',True),
              ('shareware-demo', 'https://aikernel.net/demo/doom/DOOM1.WAD',False)
          ]
          if target.is_file():
              b=target.read_bytes()
              if len(b)==size and hashlib.sha256(b).hexdigest()==expected_sha:
                  print('Verified pinned shareware WAD already present:',target)
                  raise SystemExit(0)
          for name,url,compressed in candidates:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'MD-DOOM64KB R31 build asset verifier/1.0'})
                  with urllib.request.urlopen(req,timeout=70) as response:
                      data=response.read(9000000)
                  if compressed:data=gzip.decompress(data)
                  sha=hashlib.sha256(data).hexdigest()
                  if len(data)!=size or sha!=expected_sha:
                      print(name,'unexpected content or checksum; rejecting',
                            len(data),sha)
                      continue
                  target.write_bytes(data)
                  print('Verified original shareware v1.9 from',name,
                        'size',len(data),'SHA256',sha)
                  break
              except Exception as e:
                  print('Shareware mirror unavailable:',name,str(e)[:200])
          else:
              print('Pinned Doom shareware download failed; original preflight will look for local source.')
          PY
      - name: Preflight - find authentic Doom DMX sounds on self-hosted runner
        shell: bash
        run: |
          mkdir -p dist/r35
          python3 - <<'PY'
          import pathlib,os,struct,hashlib,sys
          home=pathlib.Path.home()
          candidates=[
              pathlib.Path('scripts/doom1.wad'),
              home/'Projetos/doom-assets/doom1.wad',
              home/'Projetos/doom-assets/DOOM1.WAD',
              home/'Projetos/doom-assets/doom1.WAD',
              home/'Jogos/doom1.wad',
              home/'Games/doom1.wad',
              home/'Downloads/doom1.wad'
          ]
          # No external network or repo commit for copyright-protected WAD.
          for top in (home/'Projetos',home/'Games',home/'Jogos'):
              if not top.is_dir():continue
              root_depth=len(top.parts)
              for directory,subdirs,names in os.walk(top,followlinks=False):
                  if len(pathlib.Path(directory).parts)-root_depth>4:
                      subdirs[:]=[]
                      continue
                  subdirs[:]=[s for s in subdirs if not s.startswith('.')]
                  for n in names:
                      if n.lower()=='doom1.wad':
                          candidates.append(pathlib.Path(directory)/n)
          for f in candidates:
              if not f.is_file():continue
              try:
                  with f.open('rb') as fd:
                      h=fd.read(12)
                      if len(h)!=12 or h[:4] not in (b'IWAD',b'PWAD'):continue
                      count,offset=struct.unpack_from('<II',h,4)
                      if not 100<count<10000:continue
                      fd.seek(offset)
                      directory=fd.read(count*16)
                  sounds={directory[i+8:i+16].split(b'\0')[0]
                          for i in range(0,len(directory),16)}
                  if not {b'DSPISTOL',b'DSSHOTGN',b'DSOROPN'}.intersection(sounds):
                      continue
                  raw=f.read_bytes()
                  dest=pathlib.Path('scripts/doom1.wad')
                  if f.resolve()!=dest.resolve():dest.write_bytes(raw)
                  sha=hashlib.sha256(raw).hexdigest()
                  (pathlib.Path('dist/r35')/'SOURCE-STATUS.txt').write_text(
                      f'Genuine WAD source found: {str(f)}\nSHA256: {sha}\nBytes: {len(raw)}\n')
                  print('SFX input:',f,'bytes',len(raw),'SHA256',sha)
                  sys.exit(0)
              except (OSError,struct.error):continue
          status=('MISSING: authentic scripts/doom1.wad (DS* lumps) not found on runner.\n'
                  'Place your own doom1.wad in ~/Projetos/doom-assets/doom1.wad\n'
                  'No synthetic or silent SFX fallback is allowed for R31 PCM builds.\n')
          pathlib.Path('dist/r35/SOURCE-STATUS.txt').write_text(status)
          print(status,file=sys.stderr)
          sys.exit(3)
          PY
      - name: Verify R31 generator and build scripts
        shell: bash
        run: |
          fish -n scripts/lab/build_r35_linear.fish
          fish -n scripts/build_silent.fish
          python3 -m py_compile scripts/lab/gen_r31_sfx.py scripts/lab/gen_r30_native.py \
            scripts/lab/finish_r35_rom.py scripts/lab/audit_r35.py
          python3 scripts/lab/test_r25_music.py
          python3 scripts/lab/test_r27_group.py
          python3 - <<'PY'
          import importlib.util,struct
          spec=importlib.util.spec_from_file_location('sfx','scripts/lab/gen_r31_sfx.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          source=bytes((128+(i%20)) for i in range(11025))
          lump=struct.pack('<HHI',3,11025,len(source))+source
          low,*_=m.convert(lump,6650)
          high,*_=m.convert(lump,13300)
          assert len(low)%256==len(high)%256==0
          assert len(low)<len(high)
          assert len(m.SFX)==52
          print('R31 rate conversion, alignment, SFX enum count: OK')
          PY
          test -f ~/mars/m68k-elf/lib/libmd.a
          test -f ~/mars/m68k-elf/inc/snd/xgm2.h
      - name: Native 76x44 projection data and original R22 oracle
        shell: bash
        run: |
          fish -n scripts/lab/build_r35_linear.fish
          python3 -m py_compile scripts/lab/test_r46_m2a_projection.py
          python3 scripts/lab/test_r46_m1b_vram.py
          python3 scripts/lab/test_r46_m2a_projection.py
          python3 scripts/lab/test_r44_intermission_layout.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/r46_pixel4_projection.c').read_text()
          h=Path('src/r46_pixel4_projection.h').read_text()
          entry=Path('src/i_genesisv.c').read_text()
          assert '#include "r22_viewangletox.h"' in p
          assert '#include "r22_xtoviewangle.h"' in p
          assert 'r46_p4_xtoviewangle[77]' in p
          assert 'R46_P4_XToViewAngle(76)!=-8192' in p
          assert 'R46_P4_ProjectionValidate()' in entry
          assert 'R46_P4_VIEWWIDTH = 76' in h
          assert 'VIEWWINDOWWIDTH' not in p and 'VIEWWINDOWHEIGHT' not in p
          print('M2A: exact 77-edge native ROM geometry; active R39f renderer remains unchanged')
          PY
      - name: Compile 8x8 control and 4x4 projection co-linked ROMs
        shell: bash
        run: |
          mkdir -p dist/r35
          for spec in 'primary cell-perf' 'm2a cell-perf' 'm2a cell-play'; do
            read -r mode variant <<< "$spec"
            if [[ "$mode" == m2a ]]; then dual=1; else dual=0; fi
            echo "=== R46 M2A $mode $variant ==="
            env DOOM_R35D_CHECKER=1 DOOM_R37_BSP_PROFILE=0 DOOM_R38_TIME_PROFILE=0 DOOM_R39C_VARIANT=mall DOOM_R39D_DITHER_TOGGLE=1 DOOM_R39E_AUDIO_TOGGLES=1 DOOM_R39F_DITHER3=1 DOOM_R40_STAGE1=fast DOOM_R46_M1="$dual" DOOM_R46_M1B="$dual" DOOM_R46_M2A="$dual" DOOM_R46_BUILD="$mode" DOOM_R20_BGM_VGM="$GITHUB_WORKSPACE/res/e1m1.vgm" fish scripts/lab/build_r35_linear.fish "$variant"
            if [[ "$variant" == cell-perf ]]; then suffix=perf; else suffix=play; fi
            stem="doom-md-r46-$mode-$suffix"
            test -s "dist/r35/$stem.bin"
            python3 - "$mode" <<'PY'
          from pathlib import Path
          import subprocess,sys
          profile=sys.argv[1]
          elf=Path('out/release/rom.out')
          assert elf.is_file()
          tool=Path.home()/'mars/m68k-elf/bin'
          nm=subprocess.run([str(tool/'m68k-elf-nm'),str(elf)],text=True,capture_output=True,check=True).stdout
          assert '_s_screen' in nm
          names=('R46_P4_ViewAngleToX','R46_P4_XToViewAngle',
                 'R46_P4_ProjectionValidate','R46_P4_VramOps','R46_P4_Wall')
          for n in names: assert (n in nm)==(profile=='m2a'),(profile,n)
          d=Path('dist/r35')
          (d/f'R46-M2A-{profile}-nm.txt').write_text(nm)
          out=subprocess.run([str(tool/'m68k-elf-size'),str(elf)],text=True,capture_output=True,check=True).stdout
          (d/f'R46-M2A-{profile}-size.txt').write_text(out)
          print(profile,out)
          PY
          done
      - name: Audit memory, headers, flags and produce package
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct,json,zipfile,hashlib
          d=Path('dist/r35')
          def size(mode):
              v=(d/f'R46-M2A-{mode}-size.txt').read_text().strip().splitlines()[-1].split()
              return dict(text=int(v[0]),data=int(v[1]),bss=int(v[2]))
          control=size('primary'); mixed=size('m2a')
          assert mixed['bss']<=control['bss'],(control,mixed,'unexpected WRAM expansion')
          entries=[]
          for mode,suffix in [('primary','perf'),('m2a','perf'),('m2a','play')]:
              stem=f'doom-md-r46-{mode}-{suffix}'
              raw=(d/(stem+'.bin')).read_bytes()
              flags=set((d/(f'flags-{stem}.txt')).read_text().split())
              assert len(raw)<=4*1024*1024 and len(raw)%0x20000==0
              assert raw[0x100:0x110]==b'SEGA MEGA DRIVE '
              assert struct.unpack_from('>II',raw,0x1a0)==(0,len(raw)-1)
              assert ('-DDOOM_R46_M2A' in flags)==(mode=='m2a')
              assert ('-DDOOM_R46_M1B' in flags)==(mode=='m2a')
              assert '-DDOOM_R22_PIXEL4' not in flags
              assert ('-DTIMEDEMO' in flags)==(suffix=='perf')
              entries.append(dict(rom=stem+'.bin',bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),mode='8x8 active',native_4x4_projection_co_linked=mode=='m2a'))
          m=dict(roms=entries,control=control,m2a=mixed,bss_delta=mixed['bss']-control['bss'],
                 x_to_angle_edges=77,angle_to_x_entries=2032,
                 real_runtime_4x4_switch=False)
          (d/'R46-M2A-MANIFEST.json').write_text(json.dumps(m,indent=2)+'\n')
          with zipfile.ZipFile(d/'R46-M2A-PROJECTION-3ROMS.zip','w',compression=zipfile.ZIP_DEFLATED) as z:
              for e in entries:z.write(d/e['rom'],e['rom'])
              z.write(d/'R46-M2A-MANIFEST.json','R46-M2A-MANIFEST.json')
          print(json.dumps(m,indent=2))
          PY
      - name: BlastEm headless smoke of all M2A ROMs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil,os,subprocess
          exe=shutil.which('blastem') or next((str(x) for x in (Path.home()/'Projetos').glob('**/blastem') if x.is_file() and os.access(x,os.X_OK)),None)
          assert exe,'BlastEm missing'
          d=Path('dist/r35').resolve()
          env=os.environ.copy();env.update(SDL_AUDIODRIVER='dummy',SDL_VIDEODRIVER='dummy')
          for stem in ('doom-md-r46-primary-perf','doom-md-r46-m2a-perf','doom-md-r46-m2a-play'):
              run=subprocess.run([exe,'-b','300',str(d/(stem+'.bin'))],cwd=d,env=env,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,errors='replace',timeout=45)
              print(stem,run.returncode,run.stdout[-180:],flush=True)
              assert run.returncode==0
          PY
      - name: Upload R46 M2A exact projection stage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: doom-md-r46-m2a-projection
          path: dist/r35/
          if-no-files-found: warn
          retention-days: 90
