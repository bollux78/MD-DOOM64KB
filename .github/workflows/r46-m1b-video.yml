name: R46 M1B - Native 4x4 VRAM preparation with shared buffer
on:
  push:
    branches: [r46-m1b-video-prep]
  workflow_dispatch:
concurrency:
  group: r46-m1b-video-prep
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v6
      - name: Restore pinned XGM2 soundtrack input
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,lzma,pathlib
          data=lzma.decompress(pathlib.Path('assets/r18-e1m1.vgm.xz').read_bytes())
          assert hashlib.sha256(data).hexdigest()=='64a7a0748953a4bd35b75735b9f4b7c1c89c0f3f4aa43395485cadd7e88a8226'
          pathlib.Path('res/e1m1.vgm').write_bytes(data)
          PY
      - name: Recover pinned shareware DOOM1.WAD (not committed)
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip,hashlib,pathlib,urllib.request
          target=pathlib.Path('scripts/doom1.wad')
          expected_sha='1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771'
          size=4196020
          candidates=[
              ('ibiblio', 'https://distro.ibiblio.org/slitaz/sources/packages/d/doom1.wad',False),
              ('wad-archive', 'https://archive.org/download/wadarchive/DATA/5b.zip/5b%2F2e249b9c5133ec987b3ea77596381dc0d6bc1d%2F5b2e249b9c5133ec987b3ea77596381dc0d6bc1d.wad.gz',True),
              ('shareware-demo', 'https://aikernel.net/demo/doom/DOOM1.WAD',False)
          ]
          if target.is_file():
              b=target.read_bytes()
              if len(b)==size and hashlib.sha256(b).hexdigest()==expected_sha:
                  print('Verified pinned shareware WAD already present:',target)
                  raise SystemExit(0)
          for name,url,compressed in candidates:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'MD-DOOM64KB R31 build asset verifier/1.0'})
                  with urllib.request.urlopen(req,timeout=70) as response:
                      data=response.read(9000000)
                  if compressed:data=gzip.decompress(data)
                  sha=hashlib.sha256(data).hexdigest()
                  if len(data)!=size or sha!=expected_sha:
                      print(name,'unexpected content or checksum; rejecting',
                            len(data),sha)
                      continue
                  target.write_bytes(data)
                  print('Verified original shareware v1.9 from',name,
                        'size',len(data),'SHA256',sha)
                  break
              except Exception as e:
                  print('Shareware mirror unavailable:',name,str(e)[:200])
          else:
              print('Pinned Doom shareware download failed; original preflight will look for local source.')
          PY
      - name: Preflight - find authentic Doom DMX sounds on self-hosted runner
        shell: bash
        run: |
          mkdir -p dist/r35
          python3 - <<'PY'
          import pathlib,os,struct,hashlib,sys
          home=pathlib.Path.home()
          candidates=[
              pathlib.Path('scripts/doom1.wad'),
              home/'Projetos/doom-assets/doom1.wad',
              home/'Projetos/doom-assets/DOOM1.WAD',
              home/'Projetos/doom-assets/doom1.WAD',
              home/'Jogos/doom1.wad',
              home/'Games/doom1.wad',
              home/'Downloads/doom1.wad'
          ]
          # No external network or repo commit for copyright-protected WAD.
          for top in (home/'Projetos',home/'Games',home/'Jogos'):
              if not top.is_dir():continue
              root_depth=len(top.parts)
              for directory,subdirs,names in os.walk(top,followlinks=False):
                  if len(pathlib.Path(directory).parts)-root_depth>4:
                      subdirs[:]=[]
                      continue
                  subdirs[:]=[s for s in subdirs if not s.startswith('.')]
                  for n in names:
                      if n.lower()=='doom1.wad':
                          candidates.append(pathlib.Path(directory)/n)
          for f in candidates:
              if not f.is_file():continue
              try:
                  with f.open('rb') as fd:
                      h=fd.read(12)
                      if len(h)!=12 or h[:4] not in (b'IWAD',b'PWAD'):continue
                      count,offset=struct.unpack_from('<II',h,4)
                      if not 100<count<10000:continue
                      fd.seek(offset)
                      directory=fd.read(count*16)
                  sounds={directory[i+8:i+16].split(b'\0')[0]
                          for i in range(0,len(directory),16)}
                  if not {b'DSPISTOL',b'DSSHOTGN',b'DSOROPN'}.intersection(sounds):
                      continue
                  raw=f.read_bytes()
                  dest=pathlib.Path('scripts/doom1.wad')
                  if f.resolve()!=dest.resolve():dest.write_bytes(raw)
                  sha=hashlib.sha256(raw).hexdigest()
                  (pathlib.Path('dist/r35')/'SOURCE-STATUS.txt').write_text(
                      f'Genuine WAD source found: {str(f)}\nSHA256: {sha}\nBytes: {len(raw)}\n')
                  print('SFX input:',f,'bytes',len(raw),'SHA256',sha)
                  sys.exit(0)
              except (OSError,struct.error):continue
          status=('MISSING: authentic scripts/doom1.wad (DS* lumps) not found on runner.\n'
                  'Place your own doom1.wad in ~/Projetos/doom-assets/doom1.wad\n'
                  'No synthetic or silent SFX fallback is allowed for R31 PCM builds.\n')
          pathlib.Path('dist/r35/SOURCE-STATUS.txt').write_text(status)
          print(status,file=sys.stderr)
          sys.exit(3)
          PY
      - name: Verify R31 generator and build scripts
        shell: bash
        run: |
          fish -n scripts/lab/build_r35_linear.fish
          fish -n scripts/build_silent.fish
          python3 -m py_compile scripts/lab/gen_r31_sfx.py scripts/lab/gen_r30_native.py \
            scripts/lab/finish_r35_rom.py scripts/lab/audit_r35.py
          python3 scripts/lab/test_r25_music.py
          python3 scripts/lab/test_r27_group.py
          python3 - <<'PY'
          import importlib.util,struct
          spec=importlib.util.spec_from_file_location('sfx','scripts/lab/gen_r31_sfx.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          source=bytes((128+(i%20)) for i in range(11025))
          lump=struct.pack('<HHI',3,11025,len(source))+source
          low,*_=m.convert(lump,6650)
          high,*_=m.convert(lump,13300)
          assert len(low)%256==len(high)%256==0
          assert len(low)<len(high)
          assert len(m.SFX)==52
          print('R31 rate conversion, alignment, SFX enum count: OK')
          PY
          test -f ~/mars/m68k-elf/lib/libmd.a
          test -f ~/mars/m68k-elf/inc/snd/xgm2.h
      - name: M1B packing oracle and source protection
        shell: bash
        run: |
          fish -n scripts/lab/build_r35_linear.fish
          fish -n scripts/build_silent.fish
          python3 -m py_compile scripts/lab/audit_r46_dual_contract.py scripts/lab/test_r46_m1b_vram.py
          python3 scripts/lab/audit_r46_dual_contract.py --out r46-m1b-dependency-contract.json
          python3 scripts/lab/test_r42_wall.py
          python3 scripts/lab/test_r44_intermission_layout.py
          python3 scripts/lab/test_r46_m1b_vram.py
          python3 - <<'PY'
          from pathlib import Path
          core=Path('src/r46_pixel4_secondary.c').read_text()
          vram=Path('src/r46_pixel4_vram.c').read_text()
          main=Path('src/i_genesisv.c').read_text()
          assert '_s_screen[38 * 28]' in core and '_s_screen[38 * 28]' in vram
          assert 'R46_P4_Wall' in core and 'R46_P4_VramOps' in vram
          assert 'R46_P4_VramValidate()' in main
          assert 'R46_P4_MapRow' in vram and 'R46_P4_PatternRows' in vram
          assert 'VDP_' not in vram and 'PAL_' not in vram
          assert 'R46_P4_MapRow' in Path('src/r46_pixel4_vram.h').read_text()
          assert 'WI_TEXT_WIDTH 38' in Path('src/wi_libt.c').read_text()
          assert 'DOOM_R46_M1B' in Path('scripts/lab/build_r35_linear.fish').read_text()
          print('R46 M1B: packed 4x4 VRAM helpers coexist but cannot yet touch VDP')
          PY
      - name: Build primary baseline and M1B linked 8x8 variants
        shell: bash
        run: |
          mkdir -p dist/r35
          for spec in 'primary cell-perf' 'm1b cell-perf' 'm1b cell-play'; do
            read -r profile variant <<< "$spec"
            if [[ "$profile" == m1b ]]; then dual=1; pack=1; else dual=0; pack=0; fi
            echo "=== R46 M1B $profile $variant ==="
            env DOOM_R35D_CHECKER=1 DOOM_R37_BSP_PROFILE=0 DOOM_R38_TIME_PROFILE=0 DOOM_R39C_VARIANT=mall DOOM_R39D_DITHER_TOGGLE=1 DOOM_R39E_AUDIO_TOGGLES=1 DOOM_R39F_DITHER3=1 DOOM_R40_STAGE1=fast DOOM_R46_M1="$dual" DOOM_R46_M1B="$pack" DOOM_R46_BUILD="$profile" DOOM_R20_BGM_VGM="$GITHUB_WORKSPACE/res/e1m1.vgm" fish scripts/lab/build_r35_linear.fish "$variant"
            if [[ "$variant" == cell-perf ]]; then suffix=perf; else suffix=play; fi
            stem="doom-md-r46-$profile-$suffix"
            test -s "dist/r35/$stem.bin"
            python3 - "$profile" <<'PY'
          import pathlib,subprocess,sys
          profile=sys.argv[1]
          elf=pathlib.Path('out/release/rom.out')
          assert elf.is_file(),f'{elf} missing'
          bindir=pathlib.Path.home()/'mars/m68k-elf/bin'
          nm=bindir/'m68k-elf-nm'
          size=bindir/'m68k-elf-size'
          assert nm.is_file() and size.is_file()
          syms=subprocess.run([str(nm),str(elf)],text=True,capture_output=True,check=True).stdout
          assert '_s_screen' in syms
          required=('R46_P4_Ops','R46_P4_Wall','R46_P4_VramOps',
                    'R46_P4_TileAt','R46_P4_MapRow','R46_P4_PatternRows',
                    'R46_P4_VramValidate')
          if profile=='m1b':
              for sym in required:assert sym in syms,(profile,sym)
          else:
              assert all(sym not in syms for sym in required),(profile,'unexpected dual backend')
          dest=pathlib.Path('dist/r35')
          (dest/f'R46-M1B-{profile}-nm.txt').write_text(syms)
          (dest/f'R46-M1B-{profile}-size.txt').write_text(
              subprocess.run([str(size),str(elf)],text=True,capture_output=True,check=True).stdout)
          print(profile,'linked symbols verified',elf)
          PY
          done
      - name: Audit ROM headers, 4x4 VRAM symbols, BSS and manifest ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,struct,zipfile
          d=pathlib.Path('dist/r35')
          rows=[]
          for prof,suffix in [('primary','perf'),('m1b','perf'),('m1b','play')]:
              stem=f'doom-md-r46-{prof}-{suffix}'
              raw=(d/(stem+'.bin')).read_bytes()
              flags=set((d/(f'flags-{stem}.txt')).read_text().split())
              assert 0<len(raw)<=4*1024*1024 and len(raw)%0x20000==0,(stem,len(raw))
              assert raw[0x100:0x110]==b'SEGA MEGA DRIVE ',stem
              assert struct.unpack_from('>II',raw,0x1a0)==(0,len(raw)-1),stem
              required={'-DDOOM_R39C_MOVEP_CACHE','-DDOOM_R39C_MOVEP_MAP','-DDOOM_R39E_AUDIO_TOGGLES',
                  '-DDOOM_R39F_DITHER3','-DDOOM_R39D_DITHER_TOGGLE','-DDOOM_R20_REG_COLUMNS',
                  '-DVIEWWINDOWWIDTH=38','-DVIEWWINDOWHEIGHT=22','-DDOOM_R29_XGM2','-DDOOM_R31_SFX'}
              assert required<=flags,(stem,required-flags)
              assert ('-DDOOM_R46_M1' in flags)==(prof=='m1b'),stem
              assert ('-DDOOM_R46_M1B' in flags)==(prof=='m1b'),stem
              assert ('-DTIMEDEMO' in flags)==(suffix=='perf'),stem
              assert '-DDOOM_R22_PIXEL4' not in flags,stem
              rows.append(dict(rom=stem+'.bin',bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),
                  active_renderer='8x8 R39f',pixel4_kernels_and_packer_linked=prof=='m1b',
                  runtime_toggle=False,physical_vdp_presentation=False))
          def size(profile):
              lines=(d/f'R46-M1B-{profile}-size.txt').read_text().strip().splitlines()
              arr=lines[-1].split()
              return dict(text=int(arr[0]),data=int(arr[1]),bss=int(arr[2]))
          control=size('primary')
          mixed=size('m1b')
          assert mixed['bss']<=control['bss']+64,(control,mixed,'unexpected new WRAM buffer')
          manifest=dict(roms=rows,control_size=control,m1b_size=mixed,
                        bss_delta=mixed['bss']-control['bss'],
                        shared_8x8_buffer_bytes=2128,pixel4_framebuffer_bytes=1672,
                        pixel4_map_row_stack_bytes=76,
                        bank0_first_dynamic_tile=54,bank1_first_dynamic_tile=890,
                        bank1_last_dynamic_tile=1687,font_first_tile=1696,
                        stage='M1B prepared and co-linked; no real runtime resolution switch')
          (d/'R46-M1B-MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          with zipfile.ZipFile(d/'R46-M1B-VIDEO-3ROMS.zip','w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for ent in rows:z.write(d/ent['rom'],ent['rom'])
              z.write(d/'R46-M1B-MANIFEST.json','R46-M1B-MANIFEST.json')
              z.write('docs/review-r46/M1B-TOMORROW.md','README-R46-M1B.md')
          print(json.dumps(manifest,indent=2))
          PY
      - name: BlastEm 300-frame boot each M1B ROM
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,os,subprocess,shutil
          d=pathlib.Path('dist/r35').resolve()
          exe=shutil.which('blastem') or next((str(x) for x in (pathlib.Path.home()/'Projetos').glob('**/blastem') if x.is_file() and os.access(x,os.X_OK)),None)
          assert exe,'BlastEm missing on runner'
          env=os.environ.copy();env.update(SDL_AUDIODRIVER='dummy',SDL_VIDEODRIVER='dummy')
          for stem in ('doom-md-r46-primary-perf','doom-md-r46-m1b-perf','doom-md-r46-m1b-play'):
              proc=subprocess.run([exe,'-b','300',str(d/(stem+'.bin'))],cwd=d,env=env,
                  stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,errors='replace',timeout=45)
              print(stem,proc.returncode,proc.stdout[-170:],flush=True)
              assert proc.returncode==0,stem
          PY
      - name: Upload R46 M1B ROMs, audit and ZIP
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: doom-md-r46-m1b-video-prep
          path: dist/r35/
          retention-days: 90
          if-no-files-found: warn
