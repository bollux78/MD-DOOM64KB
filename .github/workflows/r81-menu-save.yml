name: R81 menu font cheats and SRAM save
on:
  push:
    branches: ['exp-chatgpt-r81-menu-save-*']
    paths: ['scripts/lab/*r81*', 'src/r81*', '.github/workflows/r81-menu-save.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r81-menu-save
  cancel-in-progress: true
jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in refs/heads/exp-chatgpt-*) ;; *) exit 1;; esac
          git merge-base --is-ancestor f5a9daa7a0bd7225bbc227630defc73c67c34f1e HEAD
          python3 -m py_compile scripts/lab/apply_r72_flat2d.py scripts/lab/apply_r73_r53.py scripts/lab/gen_r73_r53_fixed.py scripts/lab/apply_r74.py scripts/lab/gen_r74_flats.py scripts/lab/inject_r74_flats.py scripts/lab/apply_r75.py scripts/lab/gen_r75_hybrid.py scripts/lab/inject_r75_hybrid.py scripts/lab/apply_r76.py scripts/lab/gen_r76_profiles.py scripts/lab/test_r76_profiles.py scripts/lab/apply_r77.py scripts/lab/gen_r77_profiles.py scripts/lab/test_r77.py scripts/lab/gen_r78_art.py scripts/lab/apply_r78.py scripts/lab/test_r78_native.py scripts/lab/apply_r79.py scripts/lab/gen_r79_shadow.py scripts/lab/test_r79_shadow.py scripts/lab/test_r79_face.py
          python3 scripts/lab/test_r81_sram.py
          python3 scripts/lab/test_r81_codec.py
          python3 scripts/lab/test_r77.py
          python3 scripts/lab/gen_r78_art.py --verify-only
          python3 scripts/lab/test_r78_native.py
          fish -n scripts/build_silent.fish
          fish -n scripts/lab/build_r35_linear.fish
          python3 scripts/lab/test_r79_face.py
          python3 scripts/lab/test_gen_hud_wad.py
          python3 scripts/lab/test_hud_wad_logic.py
      - name: Restore VGM and pinned shareware WAD
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,hashlib,lzma,shutil
          v=lzma.decompress(pathlib.Path('assets/r18-e1m1.vgm.xz').read_bytes())
          assert hashlib.sha256(v).hexdigest()=='64a7a0748953a4bd35b75735b9f4b7c1c89c0f3f4aa43395485cadd7e88a8226'
          pathlib.Path('res/e1m1.vgm').write_bytes(v)
          source=pathlib.Path('/home/dan/Projetos/doom-md/assets/wads/doom1.wad')
          assert source.is_file() and source.stat().st_size==4196020
          assert hashlib.sha256(source.read_bytes()).hexdigest()=='1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771'
          pathlib.Path('scripts').mkdir(exist_ok=True)
          shutil.copyfile(source,'scripts/doom1.wad')
          PY
      - name: Generate artwork and preflight renderer palettes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lab/test_r79_face.py --wad scripts/doom1.wad
          mkdir -p dist/hud
          python3 scripts/lab/gen_r81_font.py --wad scripts/doom1.wad --out src/r81_menu_font.h --preview dist/hud/font-preview.png
          python3 scripts/lab/gen_r22_pixel4.py
          python3 scripts/lab/gen_r49_colormix.py
          python3 scripts/lab/test_r49_colormix.py
          python3 scripts/lab/gen_hud_wad.py --wad scripts/doom1.wad --out src/hud_wad_assets.h --preview dist/hud/hud-preview.png
      - name: Build R81 menu save and cheats
        shell: bash
        run: |
          set -euo pipefail
          export DOOM_R20_BGM_VGM="$GITHUB_WORKSPACE/res/e1m1.vgm"
          export HUD_WORK="$RUNNER_TEMP/r81-menu-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 scripts/lab/apply_r81.py
          python3 scripts/lab/build_r71a12mul_hud.py 2>&1 | tee dist/hud/BUILD.log
          sha256sum dist/hud/*.bin | tee dist/hud/ROM-SHA256.txt
      - name: Verify ROM sizes, BSS and hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,hashlib
          d=pathlib.Path('dist/hud')
          rows=json.loads((d/'MANIFEST.json').read_text())
          assert [r['variant'] for r in rows]==['r81-menu-'+s for s in ('pf','pl')]
          for r in rows:
              b=(d/r['rom']).read_bytes()
              assert len(b)==r['bytes'] and hashlib.sha256(b).hexdigest()==r['sha256']
              assert 0 < r['bss_bytes'] <= 57920
              assert len(b)<=4*1024*1024
              print(r)
          PY
      - name: BlastEm 800 frame smoke for both ROMs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,shutil,subprocess
          d=pathlib.Path('dist/hud').resolve()
          exe=shutil.which('blastem') or next((str(p) for p in (pathlib.Path.home()/'Projetos').glob('**/blastem') if p.is_file() and os.access(p,os.X_OK)),None)
          assert exe,'BlastEm unavailable'
          env=os.environ.copy();env.update(SDL_VIDEODRIVER='dummy',SDL_AUDIODRIVER='dummy')
          for rom in sorted(d.glob('*.bin')):
              r=subprocess.run([exe,'-b','800',str(rom)],env=env,cwd=d,capture_output=True,text=True,timeout=60)
              (d/('BLASTEM-800-'+rom.stem+'.txt')).write_text(r.stdout+r.stderr+'\nexit='+str(r.returncode)+'\n')
              assert r.returncode==0,(rom.name,r.stderr)
          print('PASS two ROM boots, 800 emulated frames each; not full benchmark/menu QA')
          PY
      - name: Real ROM save/load roundtrip on nine maps and three skills
        shell: bash
        run: |
          set -euo pipefail
          exe=$(command -v blastem || find /home/dan/Projetos -type f -name blastem -executable -print -quit)
          python3 scripts/lab/test_r81_rom.py --blastem "$exe" --rom dist/hud/doom-md-r60-r81-menu-pf.bin --elf dist/hud/doom-md-r60-r81-menu-pf.elf --out dist/hud/SAVE-ROUNDTRIP.json
      - name: Upload HUD ROMs and evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: doom-md-r81-menu-save-cheats
          path: dist/hud/
          retention-days: 90
          if-no-files-found: warn


