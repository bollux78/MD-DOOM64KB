name: R48 Pair-H vs Pair-V full experiment matrix

on:
  push:
    branches: [r48-hv-experiment-matrix]
    paths:
      - '.github/workflows/r48-hv-experiment-matrix.yml'
      - 'src/r22_video.inc'
      - 'src/r22_benchmark.inc'
      - 'src/r22_pixel4.h'
      - 'src/r35_native4.inc'
      - 'scripts/lab/test_r48_pair_v.py'
      - 'scripts/lab/build_r35_linear.fish'
      - 'scripts/set_rom_identity.py'
  workflow_dispatch:

concurrency:
  group: r48-hv-experiment-matrix
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-profile:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6

      - name: Toolchain and Pair-H oracle
        shell: bash
        run: |
          set -euo pipefail
          command -v fish
          command -v python3
          test -x "$HOME/mars/m68k-elf/bin/m68k-elf-size"
          test -x "$HOME/mars/m68k-elf/bin/m68k-elf-nm"
          mkdir -p dist/r48-hv
          python3 scripts/lab/test_r47a_plane_pair.py | tee dist/r48-hv/ORACLE-plane-pair.txt
          python3 scripts/lab/test_r48_pair_v.py | tee dist/r48-hv/ORACLE-pair-v.txt
          python3 scripts/lab/r47b_vdp_oracle.py --frames 48 --out dist/r48-hv/ORACLE-vdp.json

      - name: Restore pinned E1M1 VGM
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,lzma,pathlib
          p=pathlib.Path('assets/r18-e1m1.vgm.xz')
          data=lzma.decompress(p.read_bytes())
          assert hashlib.sha256(data).hexdigest()=='64a7a0748953a4bd35b75735b9f4b7c1c89c0f3f4aa43395485cadd7e88a8226'
          pathlib.Path('res/e1m1.vgm').write_bytes(data)
          PY

      - name: Verify or recover Doom shareware WAD
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,gzip,os,pathlib,shutil,urllib.request
          target=pathlib.Path('scripts/doom1.wad')
          target.parent.mkdir(parents=True,exist_ok=True)
          expected='1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771'
          expected_size=4196020
          home=pathlib.Path.home()
          candidates=[target,home/'Projetos/doom-assets/doom1.wad',home/'Projetos/doom-assets/DOOM1.WAD',home/'Downloads/doom1.wad']
          for top in (home/'Projetos',home/'Games',home/'Jogos'):
              if not top.is_dir(): continue
              depth=len(top.parts)
              for directory,subdirs,names in os.walk(top,followlinks=False):
                  if len(pathlib.Path(directory).parts)-depth>4:
                      subdirs[:]=[]; continue
                  subdirs[:]=[x for x in subdirs if not x.startswith('.')]
                  for name in names:
                      if name.lower()=='doom1.wad': candidates.append(pathlib.Path(directory)/name)
          for p in candidates:
              if not p.is_file(): continue
              raw=p.read_bytes()
              if len(raw)==expected_size and hashlib.sha256(raw).hexdigest()==expected:
                  if p.resolve()!=target.resolve(): shutil.copyfile(p,target)
                  print('Verified WAD from',p); break
          else:
              mirrors=[
                ('archive','https://archive.org/download/wadarchive/DATA/5b.zip/5b%2F2e249b9c5133ec987b3ea77596381dc0d6bc1d%2F5b2e249b9c5133ec987b3ea77596381dc0d6bc1d.wad.gz',True),
                ('aikernel','https://aikernel.net/demo/doom/DOOM1.WAD',False)]
              for name,url,compressed in mirrors:
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'MD-DOOM64KB pair boot fix'})
                      with urllib.request.urlopen(req,timeout=65) as response: raw=response.read(9_000_000)
                      if compressed: raw=gzip.decompress(raw)
                      if len(raw)==expected_size and hashlib.sha256(raw).hexdigest()==expected:
                          target.write_bytes(raw); print('Recovered WAD from',name); break
                  except Exception as e: print('mirror failed',name,str(e)[:100])
              else: raise SystemExit('Pinned shareware WAD unavailable')
          assert hashlib.sha256(target.read_bytes()).hexdigest()==expected
          PY

      - name: Build Pair-H and Pair-V PLAY/PERF matrix
        shell: bash
        run: |
          set -euo pipefail
          D=dist/r48-hv
          mkdir -p "$D"
          export DOOM_R20_BGM_VGM="$GITHUB_WORKSPACE/res/e1m1.vgm"
          p4 () {
            local mode="$1" id="$2" flat="$3" spr="$4" v="$5" fast="$6" ratio="$7"
            echo "====== R48 $id / $mode ======"
            env DOOM_R35D_CHECKER=1 DOOM_R39C_VARIANT=mall \
                DOOM_R39D_DITHER_TOGGLE=0 DOOM_R39E_AUDIO_TOGGLES=1 \
                DOOM_R40_STAGE1=fast DOOM_R42_WALL_ASM=1 DOOM_R45_VARIANT=asm \
                DOOM_R47_PLANE_PAIR=1 DOOM_R47_FLAT_HOIST="$flat" \
                DOOM_R47_SPRITE_HOIST="$spr" DOOM_R48_PAIR_V="$v" \
                DOOM_R48_V_FAST="$fast" DOOM_R48_V_DITHER50="$([ "$ratio" = 50 ] && echo 1 || echo 0)" \
                DOOM_R48_V_DITHER75A="$([ "$ratio" = 75a ] && echo 1 || echo 0)" \
                DOOM_R48_V_DITHER75B="$([ "$ratio" = 75b ] && echo 1 || echo 0)" \
                DOOM_R20_BGM_VGM="$DOOM_R20_BGM_VGM" DOOM_R48_BUILD="$id" \
                fish scripts/lab/build_r35_linear.fish "pixel4-$mode"
            cp -f "dist/r35/doom-md-r48-$id.bin" "$D/"
            cp -f "dist/r35/flags-doom-md-r48-$id.txt" "$D/"
            "$HOME/mars/m68k-elf/bin/m68k-elf-size" -A \
                "dist/r35/doom-md-r48-$id.elf" > "$D/size-$id.txt"
            "$HOME/mars/m68k-elf/bin/m68k-elf-nm" -S -n \
                "dist/r35/doom-md-r48-$id.elf" | grep -E 'r22_fb|r40b_native_bits|_bend|__stack|openings' \
                > "$D/symbols-$id.txt" || true
          }
          # Pair-H control and combinatorial effects: five ROMs.
          p4 perf h-pair-perf 0 0 0 0 none
          p4 perf h-flat-perf 1 0 0 0 none
          p4 perf h-spr-perf 0 1 0 0 none
          p4 perf h-all-perf 1 1 0 0 none
          p4 play h-all-play 1 1 0 0 none

          # Pair-V equivalent geometry: five ROMs.
          p4 perf v-pair-perf 0 0 1 0 none
          p4 perf v-flat-perf 1 0 1 0 none
          p4 perf v-spr-perf 0 1 1 0 none
          p4 perf v-all-perf 1 1 1 0 none
          p4 play v-all-play 1 1 1 0 none

          # Pair-V paired-byte kernel: five ROMs.
          p4 perf vf-pair-perf 0 0 1 1 none
          p4 perf vf-flat-perf 1 0 1 1 none
          p4 perf vf-spr-perf 0 1 1 1 none
          p4 perf vf-all-perf 1 1 1 1 none
          p4 play vf-all-play 1 1 1 1 none

          # Visual experiments, fixed partner map, NOT perceptually tuned.
          p4 perf vd50-perf 1 1 1 1 50
          p4 play vd50-play 1 1 1 1 50
          p4 perf vd75a-perf 1 1 1 1 75a
          p4 play vd75a-play 1 1 1 1 75a
          p4 perf vd75b-perf 1 1 1 1 75b
          p4 play vd75b-play 1 1 1 1 75b
          p4 perf vdu50-perf 1 1 1 0 50

      - name: Assert memory and build identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          d=Path('dist/r48-hv')
          audit=[]
          for p in sorted(d.glob('size-*.txt')):
              m=re.search(r'^\.bss\s+(\d+)\s+',p.read_text(),re.M)
              if not m: raise SystemExit('No BSS: '+p.name)
              bss=int(m.group(1))
              audit.append((p.name,bss))
              if bss>57920: raise SystemExit(f'BSS regression in {p.name}: {bss}')
          if len(audit)!=22: raise SystemExit(f'Expected 22 builds, saw {len(audit)}')
          if any('r40b_native_bits' in p.read_text() for p in d.glob('symbols-*.txt')):
              raise SystemExit('Native-text buffer duplicated in WRAM')
          (d/'BSS-AUDIT.txt').write_text('\n'.join(f'{n}: {b}' for n,b in audit)+'\n')
          print('\n'.join(f'{n}: {b}' for n,b in audit))
          PY

      - name: BlastEm startup and short-render smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,shutil,subprocess,time
          from pathlib import Path
          d=Path('dist/r48-hv').resolve()
          exe=shutil.which('blastem') or next((str(p) for p in (Path.home()/'Projetos').glob('**/blastem') if p.is_file() and os.access(p,os.X_OK)),None)
          if not exe: raise SystemExit('BlastEm missing on runner')
          env=os.environ.copy();env.update(SDL_AUDIODRIVER='dummy',SDL_VIDEODRIVER='dummy')
          report=[]
          for rom in sorted(d.glob('*.bin')):
              t=time.monotonic()
              try:
                  r=subprocess.run([exe,'-b','800',str(rom)],cwd=d,env=env,
                      stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,
                      errors='replace',timeout=35)
              except subprocess.TimeoutExpired:
                  raise SystemExit(rom.name+': HANG/TIMEOUT')
              result=f'{rom.name}: exit={r.returncode} wall={time.monotonic()-t:.2f}s'
              report.append(result);print(result,flush=True)
              if r.returncode: raise SystemExit(result)
          (d/'BLASTEM-SMOKE.txt').write_text('\n'.join(report)+'\n')
          PY

      - name: Build manifest and experiment notes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          d=Path('dist/r48-hv')
          roms=[{'name':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
                for p in sorted(d.glob('*.bin'))]
          assert len(roms)==22,len(roms)
          meta={
              'baseline':'R47 ALL Pair-H: 4.71 FPS / 453.22 seconds (historical, not claimed for new binaries)',
              'h-':'Original Pair-H (horizontal sample pairing, VScroll B -4)',
              'v-':'Pair-V (vertical sample pairing, HScroll B +4), baseline nibble RMW',
              'vf-':'Pair-V with whole-byte vertical-pair inner-loop stores',
              'vd50/vd75a/vd75b':'Experimental fixed-pattern 50/50, 75/25, 25/75 color mixtures, NOT perceptually optimized',
              'vdu50-':'Dither 50/50 with nonfast V column kernels',
              'validation':'host oracle and BlastEm 800-frame smoke; NOT full DEMO3 or real Mega Drive validation',
              'roms':roms
          }
          (d/'MANIFEST.json').write_text(json.dumps(meta,indent=2)+'\n')
          (d/'README.txt').write_text(
              'R48 Pair-H / Pair-V EXPERIMENT MATRIX\n'
              'ALL ROMs experimental except Pair-H historical reference.\n'
              'Compare h-all-perf, v-all-perf, vf-all-perf, vd50-perf, vd75a-perf, vd75b-perf.\n'
              'Run all PERF through full DEMO3 in BlastEm divisor 7; then test PLAY and hardware.\n'
              'Dither partner LUT is intentionally preliminary and must be judged visually.\n'
              'Oracles validate pixel geometry, not VDP timing or hardware compatibility.\n')
          print(json.dumps({'rom_count':len(roms),'roms':[r['name'] for r in roms]},indent=2))
          PY

      - name: Upload R48 Pair-H/Pair-V full matrix
        uses: actions/upload-artifact@v6
        with:
          name: doom-md-r48-pair-hv-full-matrix
          path: dist/r48-hv/
          retention-days: 90
          if-no-files-found: error
