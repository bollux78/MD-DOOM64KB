name: R36 Pixel4 runtime bisect (diagnostic)
on:
  push:
    branches: [r36-pixel4-bisect]
  workflow_dispatch:
concurrency:
  group: r36-pixel4-bisect
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  bisect:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Restore pinned shareware WAD and soundtrack without committing assets
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,lzma,urllib.request
          music=lzma.decompress(pathlib.Path('assets/r18-e1m1.vgm.xz').read_bytes())
          assert hashlib.sha256(music).hexdigest()=='64a7a0748953a4bd35b75735b9f4b7c1c89c0f3f4aa43395485cadd7e88a8226'
          pathlib.Path('res/e1m1.vgm').write_bytes(music)
          target=pathlib.Path('scripts/doom1.wad')
          expected='1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771'
          sources=[target]+[pathlib.Path.home()/rel for rel in
             ('Projetos/doom-assets/doom1.wad','Projetos/doom-assets/DOOM1.WAD','Jogos/doom1.wad','Downloads/doom1.wad')]
          for p in sources:
              if p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==expected:
                  if p!=target: target.write_bytes(p.read_bytes())
                  print('Pinned WAD verified:',p)
                  break
          else:
              for url in (
                'https://distro.ibiblio.org/slitaz/sources/packages/d/doom1.wad',
                'https://aikernel.net/demo/doom/DOOM1.WAD'):
                  try:
                      data=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'R36-Doom-MegaDrive'}),timeout=40).read(6000000)
                      if hashlib.sha256(data).hexdigest()!=expected:continue
                      target.write_bytes(data)
                      break
                  except Exception as e:print('Mirror unavailable:',str(e)[:150])
              else:raise SystemExit('Missing authentic Doom shareware WAD')
          PY
      - name: Build isolated Pixel4 perf ROMs (RAM / 5th bit / LUT)
        env:
          DOOM_R36_PIXEL4_DITHER: '1'
          DOOM_R35D_CHECKER: '0'
        shell: bash
        run: |
          set -e
          mkdir -p dist/r36-bisect
          for mode in 4 1 2 3; do
            echo "=== R36 DIAG MODE $mode ==="
            DOOM_R36_DIAG_MODE="$mode" DOOM_R20_BGM_VGM="$GITHUB_WORKSPACE/res/e1m1.vgm"               fish scripts/lab/build_r35_linear.fish pixel4-perf > "dist/r36-bisect/build-mode-$mode.log" 2>&1               || { tail -n 75 "dist/r36-bisect/build-mode-$mode.log"; exit 1; }
            cp dist/r35/doom-md-r36-pixel4-perf.bin "dist/r36-bisect/r36-mode-$mode-perf.bin"
            sha256sum "dist/r36-bisect/r36-mode-$mode-perf.bin"
          done
      - name: Run each ROM headlessly in installed BlastEm with hard timeout
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess,time,shutil
          root=pathlib.Path('dist/r36-bisect').resolve()
          blastem=shutil.which('blastem')
          if not blastem:
              paths=list((pathlib.Path.home()/'Projetos').glob('**/blastem'))
              blastem=next((str(p) for p in paths if p.is_file() and os.access(p,os.X_OK)),None)
          if not blastem: raise SystemExit('BlastEm not found: runtime checks cannot run')
          output=[]
          for mode in (4,1,2,3):
              path=root/f'r36-mode-{mode}-perf.bin'
              cmd=[blastem,'-b','300',str(path)]
              env=os.environ.copy();env.update({'SDL_AUDIODRIVER':'dummy','SDL_VIDEODRIVER':'dummy'})
              start=time.monotonic()
              try:
                  p=subprocess.run(cmd,env=env,cwd=str(root),stdout=subprocess.PIPE,
                                   stderr=subprocess.STDOUT,text=True,errors='replace',timeout=20)
                  result={'mode':mode,'status':'PASS' if p.returncode==0 else 'NONZERO',
                          'code':p.returncode,'tail':p.stdout[-1000:]}
              except subprocess.TimeoutExpired:
                  result={'mode':mode,'status':'HARD_TIMEOUT'}
              result['seconds']=round(time.monotonic()-start,2)
              output.append(result);print(json.dumps(result))
          (root/'R36-BISECT-RESULTS.json').write_text(json.dumps(output,indent=2)+'\n')
          PY
      - name: Upload diagnostic ROMs and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: doom-md-r36-pixel4-runtime-bisect
          path: dist/r36-bisect/
          retention-days: 30
