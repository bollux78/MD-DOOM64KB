name: Dread ordered wall streams - exact offline specialization
on:
  pull_request:
    branches: [research-dread-source-reference-4729ab3]
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/dread-ordered-lists.yml','research/ferret-native/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dread-ordered-lists-x360
  cancel-in-progress: true
jobs:
  x360:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research-dread-ordered-lists-20261126')
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare private matched scene sets
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root="$HOME/.local/share/ferret-research"
          private="$root/ordered-lists/$GITHUB_RUN_ID"
          out="$RUNNER_TEMP/dread-ordered-lists-$GITHUB_RUN_ID"
          mkdir -p "$private" "$out/public"
          echo "PRIVATE=$private" >> "$GITHUB_ENV"
          echo "OUT=$out" >> "$GITHUB_ENV"
          echo "ROOT=$root" >> "$GITHUB_ENV"
          echo "GCC68=$HOME/mars/m68k-elf/bin/m68k-elf-gcc" >> "$GITHUB_ENV"
          src="$root/r04/45818948354/dread"
          for v in r04-base r04-list alpha-base alpha-list r04-verify r04-list-verify; do
            mkdir -p "$private/$v"
            cp "$src/scene.h" "$src/scene.json" "$private/$v/"
          done
          python3 - "$private" <<'PY'
          import pathlib,re,sys
          p=pathlib.Path(sys.argv[1])
          poses=[(1056,-3616,41,90)]+[(2980,-3286,17,a) for a in (0,270,180,90)]
          poses=[v for v in poses for _ in range(2)]+[poses[0]]*2
          for d in p.glob("alpha-*"):
              path=d/"scene.h";s=path.read_text()
              s,n=re.subn(r"static const int16_t sc_poses\[48\] = \{[^}]*\};","static const int16_t sc_poses[48] = {\n"+",".join(str(x) for v in poses for x in v)+",\n};",s)
              assert n==1;path.write_text(s)
          PY
      - name: Compile exact ordered wall streams and six ROM variants
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 research/ferret-native/compile_ordered_lists.py "$PRIVATE/r04-base/scene.h" "$PRIVATE/scene_lists.h" "$OUT/public/format.json"
          for v in r04-base r04-list alpha-base alpha-list r04-verify r04-list-verify; do
            flags=""
            case "$v" in *-list*) flags="-DFR_ORDERED_LISTS";; esac
            case "$v" in *-verify) ;; *) flags="$flags -DFR_BENCH";; esac
            cp "$PRIVATE/scene_lists.h" "$PRIVATE/$v/scene_lists.h"
            FR_EXTRA_CFLAGS="$flags" python3 research/ferret-native/build_demo.py "$PRIVATE/$v" "$GCC68" --label "DREAD MD LIST $v"
            cp "$PRIVATE/$v/build.json" "$OUT/public/$v-build.json"
          done
      - name: Broad complete state differential
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 research/ferret-native/test_ordered_lists.py "$PRIVATE/r04-verify" "$PRIVATE/r04-list-verify" "$OUT/public/differential.json"
      - name: MAME exact stage3 to stage4 timing
        shell: bash
        run: |
          set -euo pipefail
          export SDL_VIDEODRIVER=dummy
          for v in r04-base r04-list alpha-base alpha-list; do
            timeout 180 "$(command -v mame)" genesis -cart "$PRIVATE/$v/FERRET-MD-R01.bin" -video none -sound none -nothrottle -skip_gameinfo -seconds_to_run 300 -autoboot_script "$GITHUB_WORKSPACE/research/ferret-native/mame_render_time.lua" 2>&1 | grep RENDER_TIMES | sed "s/^/$v /" | tee -a "$OUT/public/render-times.txt"
          done
          python3 - "$OUT/public/render-times.txt" "$OUT/public/timing.json" <<'PY'
          import json,sys,pathlib
          p,o=map(pathlib.Path,sys.argv[1:])
          t={s.split()[0]:[float(v) for v in s.split()[2:14]] for s in p.read_text().splitlines()}
          assert len(t)==4 and all(len(v)==12 for v in t.values())
          r={}
          for group,idx in (("r04",list(range(12))),("alpha",[1,3,5,7,9])):
              a,b=t[group+"-base"],t[group+"-list"]
              sa=sum(a[i] for i in idx);sb=sum(b[i] for i in idx)
              r[group]={"baseline_seconds":sa,"ordered_seconds":sb,"speedup":sa/sb,"poses":[{"pose":i,"baseline":a[i],"ordered":b[i]} for i in idx]}
          o.write_text(json.dumps(r,indent=2));print("ORDERED LIST TIMING "+json.dumps(r))
          PY
      - name: Build pinned Genesis Plus GX
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/ekeeke/Genesis-Plus-GX.git "$OUT/core"
          git -C "$OUT/core" checkout 2499cd3e3d1d8b7d0130d8b2825adb4cc608b2c0
          git -C "$OUT/core" apply --ignore-whitespace "$GITHUB_WORKSPACE/experiments/DREAD_MD/d01/gameplay/ferret/emulator-instrumentation.patch"
          make -C "$OUT/core" -f Makefile.libretro -j3 platform=unix > "$OUT/build-core.log" 2>&1 || { tail -60 "$OUT/build-core.log"; exit 1; }
      - name: Actual VRAM and exact baseline counters on 68000
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - "$PRIVATE" "$OUT" <<'PY'
          import json,pathlib,sys
          sys.path.insert(0,"research/ferret-native")
          from test_demo import host,emulate
          p,o=map(pathlib.Path,sys.argv[1:]);results={}
          for v,mode in (("r04-verify",1),("r04-list-verify",1),("r04-list-verify",0),("r04-list-verify",2)):
              d=p/v;r=emulate(o/"core/genesis_plus_gx_libretro.so",d,mode,host(d),12000)
              for row in r.get("checks",[]):
                  row.pop("first_actual",None);row.pop("first_expected",None)
              k=v+"-mode"+str(mode);results[k]=r
              (o/"public"/(k+".json")).write_text(json.dumps(r,indent=2))
              print("ORDERED LIST VRAM "+k+" "+json.dumps({"pass":r["pass"],"matched":r["matched"],"expected":r["expected_poses"],"video_frames":r["video_frames"]}))
              assert r["pass"]
          a=results["r04-verify-mode1"]["checks"]
          for k,b in results.items():
              assert all(all(x[f]==y[f] for f in ("fb","tile","vram","candidates","projected","errors")) for x,y in zip(a,b["checks"])),k
          print("ORDERED LIST TARGET PARITY 48/48")
          PY
      - name: Numeric reports only
        if: always() && env.OUT != ''
        uses: actions/upload-artifact@v4
        with:
          name: dread-ordered-lists-numeric
          path: ${{ runner.temp }}/dread-ordered-lists-${{ github.run_id }}/public/*
          if-no-files-found: warn
