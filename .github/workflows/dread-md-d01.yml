name: DREAD-MD D01 (Dread-style renderer, E1M1)
on:
  push:
    branches: [exp-dread-md-d01]
    paths:
      - 'experiments/DREAD_MD/**'
  workflow_dispatch:
permissions:
  contents: write
env:
  WAD: /home/dan/Projetos/doom-md/assets/wads/doom1.wad
  BLASTEM: /home/dan/Projetos/blastem64-1.0.0/blastem
jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Convert E1M1 and build ROM
        shell: bash
        run: |
          set -euo pipefail
          test -f "$WAD"
          D=experiments/DREAD_MD/d01
          stage="$RUNNER_TEMP/dread-d01-$GITHUB_RUN_ID"
          rm -rf "$stage"; mkdir -p "$stage/src" "$stage/res" "$stage/inc"
          cp $D/src/*.c $D/src/*.h $D/src/*.s "$stage/src/"
          DREAD_NPAL=1 python3 $D/tools/conv.py "$WAD" E1M1 "$stage/src" | tee "$stage/conv.log"
          gcc -O2 -DPVS_GEN -DMAXV=4096 -I$D/src -o "$stage/pvsgen" $D/tools/pvsgen.c $D/src/render.c "$stage/src/mapdata.c"
          "$stage/pvsgen" "$stage/src/pvs.c" | tee -a "$stage/conv.log"
          gdk=""
          for d in "$HOME/Projetos/doom-md/vendor/sgdk" "$HOME/Projetos/MD-DOOM64KB/vendor/sgdk" "$HOME/mars/sgdk" "$HOME/mars/SGDK" "$HOME/sgdk" "/opt/sgdk"; do
            if test -f "$d/makefile.gen"; then gdk="$d"; break; fi
          done
          if test -z "$gdk"; then
            while IFS= read -r f; do gdk="${f%/makefile.gen}"; break; done < <(find "$HOME" /opt -maxdepth 9 -type f -name makefile.gen 2>/dev/null | head -5)
          fi
          test -n "$gdk"; echo "SGDK: $gdk"
          hdr="$(find "$gdk" -path '*boot/rom_header.c' | head -1)"
          if [ -n "$hdr" ]; then dst="$stage/src/rom_header.c"; else hdr="$(find "$gdk" -path '*boot/rom_head.c' | head -1)"; mkdir -p "$stage/src/boot"; dst="$stage/src/boot/rom_head.c"; cp "$(dirname "$hdr")/sega.s" "$stage/src/boot/"; fi
          echo "header: $hdr -> $dst"; cp "$hdr" "$dst"
          python3 - "$dst" <<'PY'
          import re,sys,pathlib
          p=pathlib.Path(sys.argv[1]); s=p.read_text()
          strs=re.findall(r'"([^"]*)"',s)
          for old in strs:
              if len(old)==48 and old.strip():
                  s=s.replace('"%s"'%old,'"%s"'%"DREAD-MD D01 E1M1".ljust(48),1)
          p.write_text(s)
          PY
          grep -n "DREAD" "$dst" | head -3
          tc="$HOME/mars/m68k-elf/bin/m68k-elf-"
          mk="$stage/makefile.gen"
          python3 - "$gdk/makefile.gen" "$mk" <<'PY'
          import pathlib,sys
          s=pathlib.Path(sys.argv[1]).read_text()
          s=s.replace("-flto -flto=auto -ffat-lto-objects","-fno-lto")
          pathlib.Path(sys.argv[2]).write_text(s)
          PY
          export GDK="$gdk" PATH="$HOME/mars/m68k-elf/bin:$gdk/bin:$PATH"
          make -C "$stage" -f "$mk" -j4 release EXTRA_FLAGS="-ffreestanding -g -DNPAL=1" OS=Linux PREFIX="$tc" CC="${tc}gcc" LD="${tc}ld" AR="${tc}ar" NM="${tc}nm" OBJCPY="${tc}objcopy" 2>&1 | tail -25
          test -s "$stage/out/rom.bin"
          out="$HOME/Projetos/Personal/dread-md/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          cp "$stage/out/rom.bin" "$out/dread-md-d01-e1m1.bin"
          ls -l "$out"
          echo "OUT=$out" >> "$GITHUB_ENV"
          echo "STAGE=$stage" >> "$GITHUB_ENV"
          # variant: 3 view palettes (tile ownership + remap)
          s3="$stage-3pal"; rm -rf "$s3"; cp -r "$stage" "$s3"; rm -rf "$s3/out"
          DREAD_NPAL=3 python3 $D/tools/conv.py "$WAD" E1M1 "$s3/src" > "$s3/conv.log"
          gcc -O2 -DPVS_GEN -DMAXV=4096 -I$D/src -o "$s3/pvsgen" $D/tools/pvsgen.c $D/src/render.c "$s3/src/mapdata.c"
          "$s3/pvsgen" "$s3/src/pvs.c" >> "$s3/conv.log"
          d3="${dst/$stage/$s3}"; sed -i 's/DREAD-MD D01 E1M1     /DREAD-MD D01 E1M1 3PAL/' "$d3" || true
          if make -C "$s3" -f "$mk" -j4 release EXTRA_FLAGS="-ffreestanding -g -DNPAL=3 -DROM_TAG_3PAL" OS=Linux PREFIX="$tc" CC="${tc}gcc" LD="${tc}ld" AR="${tc}ar" NM="${tc}nm" OBJCPY="${tc}objcopy" > "$s3/build.log" 2>&1; then
            cp "$s3/out/rom.bin" "$out/dread-md-d01-e1m1-3pal.bin"
          else echo "::warning::3pal build failed"; tail -20 "$s3/build.log"; fi
          python3 -c "import zipfile,glob,os,sys; o=sys.argv[1]; z=zipfile.ZipFile(o+\"/dread-md-d01-roms.zip\",\"w\",zipfile.ZIP_DEFLATED); [z.write(f,os.path.basename(f)) for f in sorted(glob.glob(o+\"/dread-md-d01-e1m1*.bin\"))]; z.close()" "$out"
      - name: BlastEm bench route
        shell: bash
        run: |
          set -euo pipefail
          elf="$STAGE/out/release/rom.out"; test -s "$elf" || elf="$STAGE/out/rom.out"
          "$HOME/mars/m68k-elf/bin/m68k-elf-nm" -S --size-sort "$elf" | tail -12
          "$HOME/mars/m68k-elf/bin/m68k-elf-nm" "$elf" | grep -iE " _?(_bend|_end|__bss_end|_stack|__stack)$" || true
          python3 -c 'import PIL' 2>/dev/null || python3 -m pip install --user --break-system-packages -q pillow
          ADDR2LINE="$HOME/mars/m68k-elf/bin/m68k-elf-addr2line" NM="$HOME/mars/m68k-elf/bin/m68k-elf-nm" timeout 900 python3 experiments/DREAD_MD/d01/test_d01.py "$OUT/dread-md-d01-e1m1.bin" "$elf" "$OUT/bench" || echo "::warning::bench failed"
          "$HOME/mars/m68k-elf/bin/m68k-elf-objdump" -d "$elf" > "$OUT/rom.dis" || true; cp "$STAGE/conv.log" "$OUT/"; gzip -c "$STAGE/src/mapdata.c" > "$OUT/mapdata.c.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: dread-md-d01
          path: ${{ env.OUT }}
