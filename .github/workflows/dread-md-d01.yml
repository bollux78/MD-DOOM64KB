name: DREAD-MD D01 (Dread-style renderer, E1M1)
on:
  push:
    branches: [exp-dread-md-d01]
    paths:
      - 'experiments/DREAD_MD/**'
  workflow_dispatch:
permissions:
  contents: write
env:
  WAD: /home/dan/Projetos/doom-md/assets/wads/doom1.wad
  BLASTEM: /home/dan/Projetos/blastem64-1.0.0/blastem
jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Convert E1M1 and build ROMs (H40 row-doubled / column-doubled)
        shell: bash
        run: |
          set -euo pipefail
          test -f "$WAD"
          D=experiments/DREAD_MD/d01
          gdk=""
          for d in "$HOME/Projetos/doom-md/vendor/sgdk" "$HOME/Projetos/MD-DOOM64KB/vendor/sgdk" "$HOME/mars/sgdk" "$HOME/mars/SGDK" "$HOME/sgdk" "/opt/sgdk"; do
            if test -f "$d/makefile.gen"; then gdk="$d"; break; fi
          done
          if test -z "$gdk"; then
            while IFS= read -r f; do gdk="${f%/makefile.gen}"; break; done < <(find "$HOME" /opt -maxdepth 9 -type f -name makefile.gen 2>/dev/null | head -5)
          fi
          test -n "$gdk"; echo "SGDK: $gdk"
          tc="$HOME/mars/m68k-elf/bin/m68k-elf-"
          export GDK="$gdk" PATH="$HOME/mars/m68k-elf/bin:$gdk/bin:$PATH"
          out="$HOME/Projetos/Personal/dread-md/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          echo "OUT=$out" >> "$GITHUB_ENV"
          base="$RUNNER_TEMP/dread-d01-$GITHUB_RUN_ID"
          echo "STAGE=$base" >> "$GITHUB_ENV"
          build() {   # build START_MODE NAME FILE
            local mode=$1 name=$2 file=$3 stage="$base-$1"
            rm -rf "$stage"; mkdir -p "$stage/src" "$stage/res" "$stage/inc"
            cp $D/src/*.c $D/src/*.h $D/src/*.s "$stage/src/"
            DREAD_NPAL=1 python3 $D/tools/conv.py "$WAD" E1M1 "$stage/src" > "$stage/conv.log"
            gcc -O2 -DCOLB0=1 -DPVS_GEN -DMAXV=4096 -I$D/src -o "$stage/pvsgen" $D/tools/pvsgen.c $D/src/render.c "$stage/src/mapdata.c"
            "$stage/pvsgen" "$stage/src/pvs.c" >> "$stage/conv.log"
            python3 $D/tools/gen_hud.py --wad "$WAD" --out "$stage/src/hud_assets.h" >> "$stage/conv.log"
            sed -i 's|#include <stdint.h>|#include "mapdata.h"|' "$stage/src/hud_assets.h"
            python3 $D/tools/gen_weapon.py "$WAD" "$stage/src/weapon.c" >> "$stage/conv.log"
            python3 $D/tools/gen_title.py "$stage/src/title.c" >> "$stage/conv.log"
            python3 $D/tools/gen_scalers.py "$stage/src/scalers.s" >> "$stage/conv.log"
            python3 $D/tools/gen_tables.py "$stage/src/tables.c" >> "$stage/conv.log"
            hdr="$(find "$gdk" -path '*boot/rom_header.c' | head -1)"
            local dst="$stage/src/rom_header.c"; cp "$hdr" "$dst"
            python3 - "$dst" "$name" <<'PY'
          import re,sys,pathlib
          p=pathlib.Path(sys.argv[1]); s=p.read_text()
          for old in re.findall(r'"([^"]*)"',s):
              if len(old)==48 and old.strip():
                  s=s.replace('"%s"'%old,'"%s"'%sys.argv[2].ljust(48)[:48],1)
          p.write_text(s)
          PY
            python3 - "$gdk/makefile.gen" "$stage/makefile.gen" <<'PY'
          import pathlib,sys
          s=pathlib.Path(sys.argv[1]).read_text()
          s=s.replace("-flto -flto=auto -ffat-lto-objects","-fno-lto")
          pathlib.Path(sys.argv[2]).write_text(s)
          PY
            make -C "$stage" -f "$stage/makefile.gen" -j4 release EXTRA_FLAGS="-ffreestanding -g -DNPAL=1 -DSTART_MODE=$mode" OS=Linux PREFIX="$tc" CC="${tc}gcc" LD="${tc}ld" AR="${tc}ar" NM="${tc}nm" OBJCPY="${tc}objcopy" > "$stage/build.log" 2>&1 || { tail -30 "$stage/build.log"; return 1; }
            cp "$stage/out/rom.bin" "$out/$file"
            cat "$stage/conv.log" | grep -E "^map|^pvs|^weapon|^title|^things" || true
          }
          build 0 "DREAD-MD D01 OBJETOS" dread-md-d01-objetos.bin
          # host renderer: close views of things (sprite conversion check), PNG
          gcc -O2 -I$D/src -I"$base-0/src" -o "$base-0/host" $D/host/host.c $D/src/render.c "$base-0/src/mapdata.c" "$base-0/src/pvs.c"
          mkdir -p "$out/things" && (cd "$out/things" && "$base-0/host" t things 24 > /dev/null; "$base-0/host" m things 12 m > /dev/null) && python3 -c "import glob,PIL.Image as I; [I.open(f).save(f[:-4]+'.png') for f in glob.glob('$out/things/*.ppm')]" && rm -f "$out"/things/*.ppm || echo "::warning::things views failed"
          build 1 "DREAD-MD D01 OBJETOS (BENCH COLUNAS)" bench-colunas.bin
          ls -l "$out"
          python3 -c "import zipfile,glob,os,sys; o=sys.argv[1]; z=zipfile.ZipFile(o+\"/dread-md-d01-roms.zip\",\"w\",zipfile.ZIP_DEFLATED); [z.write(f,os.path.basename(f)) for f in sorted(glob.glob(o+\"/dread-md-d01-objetos.bin\"))]; z.close()" "$out"
      - name: BlastEm bench route (both)
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import PIL' 2>/dev/null || python3 -m pip install --user --break-system-packages -q pillow
          for v in 0 1; do
            f=$([ $v = 0 ] && echo linhas || echo colunas)
            rom=$([ $v = 0 ] && echo dread-md-d01-objetos.bin || echo bench-colunas.bin)
            elf="$STAGE-$v/out/release/rom.out"; test -s "$elf" || elf="$STAGE-$v/out/rom.out"
            COLB=$((v+1)) ADDR2LINE="$HOME/mars/m68k-elf/bin/m68k-elf-addr2line" NM="$HOME/mars/m68k-elf/bin/m68k-elf-nm" timeout 900 python3 experiments/DREAD_MD/d01/test_d01.py "$OUT/$rom" "$elf" "$OUT/bench-$f" | sed "s/^/[$f] /" || echo "::warning::bench $f failed"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dread-md-d01
          path: ${{ env.OUT }}
