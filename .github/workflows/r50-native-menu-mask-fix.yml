name: R50 Menu mask preservation and full soft reboot

on:
  push:
    branches: [r50-native-menu-mask-fix]
    paths:
      - '.github/workflows/r50-native-menu-mask-fix.yml'
      - 'src/r22_video.inc'
      - 'src/r22_benchmark.inc'
      - 'src/r22_pixel4.h'
      - 'src/r35_native4.inc'
      - 'scripts/lab/test_r48_pair_v.py'
      - 'scripts/lab/gen_r49_colormix.py'
      - 'scripts/lab/test_r49_colormix.py'
      - 'scripts/lab/build_r35_linear.fish'
      - 'scripts/build_silent.fish'
      - 'scripts/set_rom_identity.py'
      - 'src/d_main.c'
      - 'src/d_main.h'
      - 'src/g_game.c'
      - 'src/i_system.h'
      - 'src/m_text.c'
      - 'src/i_genesis.c'
  workflow_dispatch:

concurrency:
  group: r50-native-menu-mask-fix
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-profile:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6

      - name: Preflight fish scripts syntax
        shell: bash
        run: |
          set -euo pipefail
          fish -n scripts/build_silent.fish
          fish -n scripts/lab/build_r35_linear.fish
          echo 'fish syntax PASS'

      - name: Toolchain and Pair-H oracle
        shell: bash
        run: |
          set -euo pipefail
          command -v fish
          command -v python3
          test -x "$HOME/mars/m68k-elf/bin/m68k-elf-size"
          test -x "$HOME/mars/m68k-elf/bin/m68k-elf-nm"
          mkdir -p dist/r50-mask
          python3 scripts/lab/test_r47a_plane_pair.py | tee dist/r50-mask/ORACLE-plane-pair.txt
          python3 scripts/lab/test_r48_pair_v.py | tee dist/r50-mask/ORACLE-pair-v.txt
          python3 scripts/lab/r47b_vdp_oracle.py --frames 48 --out dist/r50-mask/ORACLE-vdp.json

      - name: Restore pinned E1M1 VGM
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,lzma,pathlib
          p=pathlib.Path('assets/r18-e1m1.vgm.xz')
          data=lzma.decompress(p.read_bytes())
          assert hashlib.sha256(data).hexdigest()=='64a7a0748953a4bd35b75735b9f4b7c1c89c0f3f4aa43395485cadd7e88a8226'
          pathlib.Path('res/e1m1.vgm').write_bytes(data)
          PY

      - name: Verify or recover Doom shareware WAD
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,gzip,os,pathlib,shutil,urllib.request
          target=pathlib.Path('scripts/doom1.wad')
          target.parent.mkdir(parents=True,exist_ok=True)
          expected='1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771'
          expected_size=4196020
          home=pathlib.Path.home()
          candidates=[target,home/'Projetos/doom-assets/doom1.wad',home/'Projetos/doom-assets/DOOM1.WAD',home/'Downloads/doom1.wad']
          for top in (home/'Projetos',home/'Games',home/'Jogos'):
              if not top.is_dir(): continue
              depth=len(top.parts)
              for directory,subdirs,names in os.walk(top,followlinks=False):
                  if len(pathlib.Path(directory).parts)-depth>4:
                      subdirs[:]=[]; continue
                  subdirs[:]=[x for x in subdirs if not x.startswith('.')]
                  for name in names:
                      if name.lower()=='doom1.wad': candidates.append(pathlib.Path(directory)/name)
          for p in candidates:
              if not p.is_file(): continue
              raw=p.read_bytes()
              if len(raw)==expected_size and hashlib.sha256(raw).hexdigest()==expected:
                  if p.resolve()!=target.resolve(): shutil.copyfile(p,target)
                  print('Verified WAD from',p); break
          else:
              mirrors=[
                ('archive','https://archive.org/download/wadarchive/DATA/5b.zip/5b%2F2e249b9c5133ec987b3ea77596381dc0d6bc1d%2F5b2e249b9c5133ec987b3ea77596381dc0d6bc1d.wad.gz',True),
                ('aikernel','https://aikernel.net/demo/doom/DOOM1.WAD',False)]
              for name,url,compressed in mirrors:
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'MD-DOOM64KB pair boot fix'})
                      with urllib.request.urlopen(req,timeout=65) as response: raw=response.read(9_000_000)
                      if compressed: raw=gzip.decompress(raw)
                      if len(raw)==expected_size and hashlib.sha256(raw).hexdigest()==expected:
                          target.write_bytes(raw); print('Recovered WAD from',name); break
                  except Exception as e: print('mirror failed',name,str(e)[:100])
              else: raise SystemExit('Pinned shareware WAD unavailable')
          assert hashlib.sha256(target.read_bytes()).hexdigest()==expected
          PY

      - name: Preflight ColorMix source tables and fidelity oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/r50-mask
          python3 scripts/lab/gen_r22_pixel4.py
          python3 scripts/lab/gen_r49_colormix.py | tee dist/r50-mask/PREFLIGHT-generator.txt
          python3 scripts/lab/test_r49_colormix.py | tee dist/r50-mask/PREFLIGHT-color-oracle.txt
          cp src/r49_colormix_report.json dist/r50-mask/PREFLIGHT-color-report.json

      - name: Validate menu-mask alias and reset-path invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          names=['vf-prev-play','vf-mask-play','vf-reinit-play',
                 'vf-both-play','cm50l-both-play']
          roms=['doom-md-r50-'+x for x in names]
          assert len(roms)==len(set(roms))==5
          assert all(len(x)<=30 for x in roms),[(x,len(x)) for x in roms]
          p=Path('src/r22_video.inc').read_text()
          n=Path('src/r35_native4.inc').read_text()
          c=Path('src/i_genesis.c').read_text()
          start=p.index('void V_ClearViewWindow(void){')
          end=p.index('void V_DrawBackground(',start)
          section=p[start:end]
          assert section.index('if(r35_native_active>=0)return;') < section.index('R47_ClearPairBuffer();')
          assert 'R40B_PruneNativeText()' in p
          assert 'R35_NativeMapWord(x,y)' in p
          assert 'R22_DrawText(VDP_BG_A,s' in p
          assert 'VDP_setWindowHPos(FALSE,0)' in n
          assert 'if(!hardReset)SYS_hardReset();' in c
          print('Menu mask lifetime + warm-reset reinit source checks PASS')
          PY

      - name: Build R50 corrected mask and reset A/B PLAY candidates
        shell: bash
        run: |
          set -euo pipefail
          D=dist/r50-mask
          mkdir -p "$D"
          export DOOM_R20_BGM_VGM="$GITHUB_WORKSPACE/res/e1m1.vgm"
          p4 () {
            local id="$1" mix="$2" lut="$3" art="$4" sram="$5" hard="$6"
            echo "====== R50 MENU / RESET $id ======"
            env DOOM_R35D_CHECKER=1 DOOM_R39C_VARIANT=mall \
                DOOM_R39D_DITHER_TOGGLE=0 DOOM_R39E_AUDIO_TOGGLES=1 \
                DOOM_R40_STAGE1=fast DOOM_R42_WALL_ASM=1 DOOM_R45_VARIANT=asm \
                DOOM_R47_PLANE_PAIR=1 DOOM_R47_FLAT_HOIST=1 \
                DOOM_R47_SPRITE_HOIST=1 DOOM_R48_PAIR_V=1 DOOM_R48_V_FAST=1 \
                DOOM_R49_COLORMIX="$mix" DOOM_R49_COMPLUT="$lut" \
                DOOM_R49_RATIO=none DOOM_R50_PLAY_BENCH=1 \
                DOOM_R50_MENU_FREEZE=1 DOOM_R50_STATIC_MENU="$art" \
                DOOM_R50_RESET_SRAM="$sram" DOOM_R50_HARD_REINIT="$hard" \
                DOOM_R20_BGM_VGM="$DOOM_R20_BGM_VGM" DOOM_R50_BUILD="$id" \
                fish scripts/lab/build_r35_linear.fish pixel4-play
            cp "dist/r35/doom-md-r50-$id.bin" "$D/"
            cp "dist/r35/flags-doom-md-r50-$id.txt" "$D/"
            "$HOME/mars/m68k-elf/bin/m68k-elf-size" -A \
              "dist/r35/doom-md-r50-$id.elf" > "$D/size-$id.txt"
          }
          # Previous experimental native menu and redundant SRAM reset guard.
          p4 vf-prev-play      0 0 1 1 0
          # Preserve R40b occupancy masks in native art (art-only fix).
          p4 vf-mask-play      0 0 1 0 0
          # Force complete SGDK initialized-data/WRAM reload on warm reset.
          p4 vf-reinit-play    0 0 0 0 1
          # Corrected menu + complete warm-reset reinit (recommended).
          p4 vf-both-play      0 0 1 0 1
          # Same combined fixes with ColorMix+LUT.
          p4 cm50l-both-play   1 1 1 0 1

      - name: Audit WRAM and renderer baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          d=Path('dist/r50-mask')
          sizes={}
          for p in sorted(d.glob('size-*.txt')):
              m=re.search(r'^\.bss\s+(\d+)\s+',p.read_text(),re.M)
              if not m: raise SystemExit('No BSS: '+p.name)
              b=int(m.group(1))
              if b>57920: raise SystemExit(f'Boot-risk BSS {p.name}: {b}')
              sizes[p.stem[5:]]=b
          assert len(sizes)==5,sizes
          base=sizes['vf-prev-play']
          for name in ['vf-mask-play','vf-reinit-play','vf-both-play']:
              if sizes[name]-base>16:
                  raise SystemExit(f'Unexpected WRAM change {name}: {sizes[name]-base}')
          (d/'BSS-AUDIT.json').write_text(json.dumps(sizes,indent=2)+'\n')
          print(json.dumps(sizes,indent=2))
          PY

      - name: BlastEm smoke tests for both PERF and PLAY variants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,shutil,subprocess,time
          d=Path('dist/r50-mask').resolve()
          exe=shutil.which('blastem') or next(
            (str(p) for p in (Path.home()/'Projetos').glob('**/blastem')
             if p.is_file() and os.access(p,os.X_OK)),None)
          if not exe: raise SystemExit('BlastEm not found')
          env=os.environ.copy();env.update(SDL_AUDIODRIVER='dummy', SDL_VIDEODRIVER='dummy')
          lines=[]
          for rom in sorted(d.glob('*.bin')):
              t=time.monotonic()
              try:
                  r=subprocess.run([exe,'-b','800',str(rom)],cwd=d,env=env,
                        stdout=subprocess.PIPE,stderr=subprocess.STDOUT,
                        text=True,errors='replace',timeout=35)
              except subprocess.TimeoutExpired:
                  raise SystemExit('BlastEm 800-frame hang: '+rom.name)
              msg=f'{rom.name}: exit={r.returncode} wall={time.monotonic()-t:.2f}s'
              lines.append(msg);print(msg,flush=True)
              if r.returncode: raise SystemExit(msg)
          (d/'BLASTEM-SMOKE.txt').write_text('\n'.join(lines)+'\n')
          PY

      - name: Manifest and reproducible manual QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          d=Path('dist/r50-mask')
          roms=[{'name':p.name,'bytes':p.stat().st_size,
                 'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
                for p in sorted(d.glob('*.bin'))]
          assert len(roms)==5,roms
          data={'baseline':'R50 Pair-V Fast 5.30 FPS on PLAY',
                'failure':'previous native-art menu leaves ghost menu text; soft reset black/unresponsive',
                'source_fix':'native 320x224 art keeps reused R40b occupancy masks when M_Drawer clears framebuffer',
                'reset_fix':'when SGDK main(FALSE) is called, SYS_hardReset() re-enters _start_entry to clear WRAM and initialized variables',
                'reset_limit':'does not recover SGDK internal_reset DMA hang before entering main',
                'ci_validation':'compile, BSS, BlastEm startup/800-frame smoke',
                'manual_only':'real-time cursor art restoration and emulator/hardware soft reset during demo',
                'roms':roms}
          (d/'MANIFEST.json').write_text(json.dumps(data,indent=2)+'\n')
          (d/'README.txt').write_text(
              'R50 NATIVE MENU MASK + WARM RESET - A/B VALIDATION\n'
              'RECOMMENDED: doom-md-r50-vf-both-play.bin\n'
              'TEST 1 TITLE: Start menu; move cursor through all items, including\n'
              '  submenus; do old labels remain drawn? Close and reopen menu.\n'
              'TEST 2 GAME: E1M1 Start menu must be responsive, then resume.\n'
              'TEST 3 BENCH: E1M1 -> Benchmark -> 2134 frames -> Start ->\n'
              '  title menu -> new game. Repeat.\n'
              'TEST 4 RESET: reset during DEMO3; verify fully functional Start\n'
              '  menu, then game. Compare vf-reinit-play against vf-prev-play.\n'
              'TEST 5 COLOR: compare cm50l-both-play against vf-both-play.\n'
              'IMPORTANT: soft reset can still fail before main if SGDK gets\n'
              '  stuck on an unfinished VDP DMA; inspect separately if black.\n')
          print('ROM count',len(roms))
          PY

      - name: Upload R50 corrected menu-mask and reboot experiments
        uses: actions/upload-artifact@v6
        with:
          name: doom-md-r50-native-menu-mask-fix
          path: dist/r50-mask/
          retention-days: 90
          if-no-files-found: error
