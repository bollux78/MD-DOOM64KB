name: R57 ColorMatch staged

on:
  push:
    branches: [exp-r57-colormatch-prepared]
    paths:
      - '.github/workflows/r57-colormatch.yml'
      - 'docs/R57_COLORMATCH_READY.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: contains(github.event.head_commit.message, '[run-r57]')
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          fish -n scripts/lab/build_r35_linear.fish
          python3 -m py_compile scripts/lab/gen_r57_colormatch.py
          python3 -c 'import numpy'
          python3 - <<'PY'
          import hashlib,pathlib,urllib.request
          wad=pathlib.Path('scripts/doom1.wad')
          target_sha='1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771'
          if not wad.is_file() or hashlib.sha256(wad.read_bytes()).hexdigest()!=target_sha:
              url='https://aikernel.net/demo/doom/DOOM1.WAD'
              request=urllib.request.Request(url,headers={'User-Agent':'MD-DOOM64KB-ci'})
              with urllib.request.urlopen(request,timeout=65) as response:
                  blob=response.read(5000000)
              assert len(blob)==4196020 and hashlib.sha256(blob).hexdigest()==target_sha
              wad.write_bytes(blob)
          print('Verified pinned shareware DOOM1.WAD')
          PY
          python3 - <<'PY'
          import hashlib,lzma,pathlib
          src=pathlib.Path('assets/r18-e1m1.vgm.xz')
          data=lzma.decompress(src.read_bytes())
          assert hashlib.sha256(data).hexdigest()=='64a7a0748953a4bd35b75735b9f4b7c1c89c0f3f4aa43395485cadd7e88a8226'
          pathlib.Path('res/e1m1.vgm').write_bytes(data)
          PY
      - name: Compile ColorMatch PLAY and PERF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/r57-colormatch
          for mode in play perf; do
            bench=0
            if [ "$mode" = play ]; then bench=1; fi
            env DOOM_R35D_CHECKER=1 DOOM_R39C_VARIANT=mall DOOM_R39D_DITHER_TOGGLE=0 \
              DOOM_R39E_AUDIO_TOGGLES=1 DOOM_R40_STAGE1=fast DOOM_R42_WALL_ASM=1 \
              DOOM_R45_VARIANT=asm DOOM_R47_PLANE_PAIR=1 DOOM_R47_FLAT_HOIST=1 \
              DOOM_R47_SPRITE_HOIST=1 DOOM_R48_PAIR_V=1 DOOM_R48_V_FAST=1 \
              DOOM_R49_COLORMIX=0 DOOM_R49_COMPLUT=0 DOOM_R49_RATIO=none \
              DOOM_R52_AB=1 DOOM_R52_CLAUDIO=1 DOOM_R52_AB_PROFILE=luma32 \
              DOOM_R52_ZERO_POLICY=forbid DOOM_R52_CPLUT=1 \
              DOOM_R56_DUAL_COLOR=1 DOOM_R56_CLAUDIO_PROFILE=a6 \
              DOOM_R57_COLORMATCH=1 DOOM_R57_BUILD="cm6-$mode" \
              DOOM_R50_PLAY_BENCH="$bench" DOOM_R50_MENU_FREEZE="$bench" \
              DOOM_R50_STATIC_MENU="$bench" DOOM_R50_HARD_REINIT="$bench" \
              DOOM_R50_RESET_SRAM=0 DOOM_R51_HW_WEAPON=0 DOOM_R51_NO_PSPRITE=0 \
              DOOM_R20_BGM_VGM="$GITHUB_WORKSPACE/res/e1m1.vgm" \
              fish scripts/lab/build_r35_linear.fish "pixel4-$mode"
            id="doom-md-r57-cm6-$mode"
            cp "dist/r35/$id.bin" dist/r57-colormatch/
            cp "dist/r35/flags-$id.txt" dist/r57-colormatch/
            cp src/r57_colormatch_report.json "dist/r57-colormatch/report-$mode.json"
          done
      - name: Check LUT invariants and short BlastEm smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lab/test_r56_dual_color.py src/r56_tables.h
          export SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy
          BLASTEM="$HOME/Projetos/blastem64-1.0.0/blastem"
          test -x "$BLASTEM"
          timeout 50s "$BLASTEM" -b 800 dist/r57-colormatch/doom-md-r57-cm6-perf.bin
      - uses: actions/upload-artifact@v6
        with:
          name: doom-md-r57-colormatch-staged
          path: dist/r57-colormatch/
          retention-days: 90
