name: DREAD C7 - optimization round (3 ROMs) and FPS comparison
# Explicitly requested test round: CONTROL, AI6, AI6S. No WAD/ELF publication.
# Explicit menu A/B test: BENCH COMBAT runs bench_req=2 (AI active, scripted gunfire).
on:
  push:
    branches: [exp-dread-c7-optimization-matrix-20261123]
    paths: ['.github/workflows/dread-c7-optimization-matrix.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dread-c7-optimization-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: "Build C7 ${{ matrix.variant }}"
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        variant: [CONTROL, AI6, AI6S]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile independent C7 NORMAL variant
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/dread-c7-opt-$GITHUB_RUN_ID-${{ matrix.variant }}"
          echo "C7_OUT=$out" >> "$GITHUB_ENV"
          echo "::notice::Compilando apenas ${{ matrix.variant }} na C7 experimental, sem SSF"
          bash experiments/DREAD_MD/d01/gameplay/optimization/compile_one.sh "${{ matrix.variant }}" "$out"
          echo "::notice::${{ matrix.variant }} compilada; aguardando benchmark independente"
      - name: Upload ROM, benchmark symbols and geometry (no ELF)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: C7ROM-${{ matrix.variant }}-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: ${{ env.C7_OUT }}/release/**

  benchmark:
    name: "MAME ${{ matrix.variant }}: render vs combat"
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [CONTROL, AI6, AI6S]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: C7ROM-${{ matrix.variant }}-${{ github.run_id }}
          path: ${{ runner.temp }}/rom
      - name: Install reference MAME
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mame python3-numpy python3-pil
      - name: Benchmark exact internal E1M1 route twice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/results"
          for mode in 1 2; do
            python3 experiments/DREAD_MD/d01/gameplay/optimization/bench_mame.py \
              --rom "$RUNNER_TEMP/rom/DREAD-C7-OPT-${{ matrix.variant }}.bin" \
              --symbols "$RUNNER_TEMP/rom/symbols-${{ matrix.variant }}.json" \
              --mode "$mode" \
              --result "$RUNNER_TEMP/results/${{ matrix.variant }}-bench-$mode.json"
          done
      - name: Save measured FPS and emulator diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: C7BENCH-${{ matrix.variant }}-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: ${{ runner.temp }}/results/*

  release:
    name: One ZIP with the round ROMs and comparative results
    needs: [build, benchmark]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          pattern: C7ROM-*-${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/roms
      - uses: actions/download-artifact@v4
        if: needs.benchmark.result == 'success'
        with:
          pattern: C7BENCH-*-${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/bench
      - name: Check ROMs, geometry and pack comparison ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bench"
          python3 experiments/DREAD_MD/d01/gameplay/optimization/pack_matrix.py \
            --roms "$RUNNER_TEMP/roms" --bench "$RUNNER_TEMP/bench" \
            --out "$RUNNER_TEMP/DREAD-C7-OTIMIZACOES.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: DREAD-C7-OTIMIZACOES-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/DREAD-C7-OTIMIZACOES.zip
            ${{ runner.temp }}/DREAD-C7-OTIMIZACOES.csv
            ${{ runner.temp }}/DREAD-C7-OTIMIZACOES.json
