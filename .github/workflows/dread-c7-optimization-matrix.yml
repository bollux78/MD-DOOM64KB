name: C7 Ferret nine-map experimental pipeline (authorized build)
on:
  push:
    branches: [exp-ferret-episode-20261125]
    paths:
      - "experiments/DREAD_MD/**"
      - ".github/workflows/dread-c7-optimization-matrix.yml"
  workflow_dispatch:
concurrency:
  group: c7-ferret-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  experiment:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        variant: [CONTROL, FERRET160, FERRET80]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare reproducible instrumented emulator
        shell: bash
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/ferret-core-$GITHUB_RUN_ID"
          if [[ ! -s "$core/genesis_plus_gx_libretro.so" ]]; then
            if [[ ! -d "$core/.git" ]]; then
              git clone https://github.com/ekeeke/Genesis-Plus-GX.git "$core"
            else
              git -C "$core" reset --hard 2499cd3e3d1d8b7d0130d8b2825adb4cc608b2c0
              git -C "$core" clean -fdx
            fi
            git -C "$core" checkout 2499cd3e3d1d8b7d0130d8b2825adb4cc608b2c0
            git -C "$core" apply --ignore-whitespace "$GITHUB_WORKSPACE/experiments/DREAD_MD/d01/gameplay/ferret/emulator-instrumentation.patch"
            make -C "$core" -f Makefile.libretro -j3 platform=unix
          fi
          echo "CORE=$core/genesis_plus_gx_libretro.so" >> "$GITHUB_ENV"
      - name: Build, verify all maps, test gameplay and measure NTSC
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ferret-$GITHUB_RUN_ID/$VARIANT"
          mkdir -p "$out"
          echo "OUT=$out" >> "$GITHUB_ENV"
          bash experiments/DREAD_MD/d01/gameplay/ferret/run_variant.sh "$VARIANT" "$out" "$CORE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: C7-FERRET-${{ matrix.variant }}-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
  package:
    needs: experiment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: C7-FERRET-*-${{ github.run_id }}
          path: results
      - run: python3 experiments/DREAD_MD/d01/gameplay/ferret/summarize.py results delivery
      - uses: actions/upload-artifact@v4
        with:
          name: C7-FERRET-CONSOLIDADO-${{ github.run_id }}
          path: delivery
