name: R105 Cell8 PLAY - current UI and protected SRAM
on:
  workflow_dispatch:
  push:
    branches: ['exp-chatgpt-r105-cell8-20261101']
    paths: ['.github/triggers/r105-cell8.trigger']
permissions:
  contents: read
concurrency:
  group: r105-cell8-${{ github.ref }}
  cancel-in-progress: false
env:
  BLASTEM: /home/dan/Projetos/blastem64-1.0.0/blastem
  OBJDUMP: /home/dan/mars/m68k-elf/bin/m68k-elf-objdump
jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in refs/heads/exp-claudio-*|refs/heads/exp-chatgpt-*) ;; *) exit 1;; esac
          git merge-base --is-ancestor f5a9daa7a0bd7225bbc227630defc73c67c34f1e HEAD
          test -x "$BLASTEM"; test -x "$OBJDUMP"
          python3 -m py_compile scripts/lab/apply_r83.py scripts/lab/test_r83.py scripts/lab/apply_r81.py scripts/lab/apply_r82_d8088.py scripts/lab/test_r82_d8088.py scripts/lab/apply_r80_performance.py scripts/lab/test_r80_pixofs.py scripts/lab/r82_stack_probe.py scripts/lab/r82_bsp_depth.py scripts/lab/r70_capture.py scripts/lab/r70_compare.py
          python3 scripts/lab/test_r83.py
          python3 scripts/lab/test_r88.py
          python3 scripts/lab/test_r89.py
          python3 scripts/lab/test_r89_routes.py
          python3 scripts/lab/test_r90.py
          python3 scripts/lab/test_r91.py
          python3 scripts/lab/test_r92.py
          python3 -m py_compile scripts/lab/apply_r95.py scripts/lab/apply_r96.py scripts/lab/apply_r97.py scripts/lab/apply_r98.py scripts/lab/apply_r99.py scripts/lab/apply_r100.py scripts/lab/r100_diag_read.py scripts/lab/r100_asm_metrics.py scripts/lab/r82_stack_probe.py scripts/lab/apply_r102.py scripts/lab/apply_r104.py
          cc -O2 -Iscripts/lab/r99 scripts/lab/r99/test_r99_recip.c -o "$RUNNER_TEMP/r99recip" && "$RUNNER_TEMP/r99recip"
          python3 -m py_compile scripts/lab/apply_r87.py scripts/lab/r87_compare.py
          python3 -m py_compile scripts/lab/apply_r85.py scripts/lab/apply_r84.py scripts/lab/gen_r84_columns.py scripts/lab/r84_texture_audit.py
          python3 scripts/lab/test_r81_sram.py
          python3 scripts/lab/test_r81_font.py
          python3 scripts/lab/test_r81_cheats.py
          python3 scripts/lab/test_r81_codec.py
          python3 scripts/lab/test_r77.py
          python3 scripts/lab/gen_r78_art.py --verify-only
          python3 scripts/lab/test_r78_native.py
          python3 scripts/lab/test_r105_cell8.py
          python3 -m py_compile scripts/lab/apply_r105_cell8.py
          fish -n scripts/build_silent.fish
          fish -n scripts/lab/build_r35_linear.fish
          python3 scripts/lab/test_r79_face.py
          python3 scripts/lab/test_gen_hud_wad.py
          python3 scripts/lab/test_hud_wad_logic.py
      - name: Restore VGM and pinned shareware WAD
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,hashlib,lzma,shutil
          v=lzma.decompress(pathlib.Path('assets/r18-e1m1.vgm.xz').read_bytes())
          assert hashlib.sha256(v).hexdigest()=='64a7a0748953a4bd35b75735b9f4b7c1c89c0f3f4aa43395485cadd7e88a8226'
          pathlib.Path('res/e1m1.vgm').write_bytes(v)
          source=pathlib.Path('/home/dan/Projetos/doom-md/assets/wads/doom1.wad')
          assert source.is_file() and source.stat().st_size==4196020
          assert hashlib.sha256(source.read_bytes()).hexdigest()=='1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771'
          pathlib.Path('scripts').mkdir(exist_ok=True)
          shutil.copyfile(source,'scripts/doom1.wad')
          PY
      - name: Generate artwork and preflight renderer palettes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lab/test_r79_face.py --wad scripts/doom1.wad
          mkdir -p dist/hud
          python3 scripts/lab/gen_r81_font.py --wad scripts/doom1.wad --out src/r81_menu_font.h --preview dist/hud/font-preview.png
          python3 scripts/lab/gen_r22_pixel4.py
          python3 scripts/lab/gen_r49_colormix.py
          python3 scripts/lab/test_r49_colormix.py
          python3 scripts/lab/gen_hud_wad.py --wad scripts/doom1.wad --out src/hud_wad_assets.h --preview dist/hud/hud-preview.png
      - name: Apply R105 twoface and Cell8 adapter
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lab/apply_r81.py
          R80_EXPERIMENTS=P1+F1 python3 scripts/lab/apply_r80_performance.py
          R83_CANDIDATE=sprites python3 scripts/lab/apply_r83.py
          R85_CANDIDATE=all python3 scripts/lab/apply_r85.py
          R88_CANDIDATE=ai python3 scripts/lab/apply_r88.py
          python3 scripts/lab/apply_r89.py
          R90_CANDIDATE=control python3 scripts/lab/apply_r90.py
          R91_CANDIDATE=sh1 python3 scripts/lab/apply_r91.py
          R92_CANDIDATE=toggle python3 scripts/lab/apply_r92.py
          R95_NAME=flat python3 scripts/lab/apply_r95.py
          R96_NAME=wall python3 scripts/lab/apply_r96.py
          R97_NAME=shasm python3 scripts/lab/apply_r97.py
          R98_CANDIDATE=sprmul python3 scripts/lab/apply_r98.py
          R100_MODE=f1t R100_PREFIX=r102 R100_NAME=twoface python3 scripts/lab/apply_r100.py
          R104_PREFIX=r105 R104_NAME=twoface python3 scripts/lab/apply_r104.py
          python3 scripts/lab/apply_r105_cell8.py
          python3 scripts/lab/test_r105_cell8.py
          python3 - <<'PY2'
          from pathlib import Path
          p=Path('scripts/lab/build_r71a12mul_hud.py');s=p.read_text()
          a="(('pl','play'),)";assert s.count(a)==1;s=s.replace(a,"(('pl','play'),('pf','perf'))")
          a="    assert len(records) == 1\n";assert s.count(a)==1;s=s.replace(a,"    assert len(records) == 2\n")
          p.write_text(s)
          PY2
      - name: Build PLAY and internal PERF validation twin
        shell: bash
        run: |
          set -euo pipefail
          export DOOM_R20_BGM_VGM="$GITHUB_WORKSPACE/res/e1m1.vgm"
          export HUD_WORK="$RUNNER_TEMP/cell8-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 scripts/lab/build_r71a12mul_hud.py 2>&1 | tee dist/hud/BUILD.log
      - name: Verify geometry, memory and identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import pathlib,json,hashlib,os
          d=pathlib.Path('dist/hud');rows=json.loads((d/'MANIFEST.json').read_text())
          assert [r['variant'] for r in rows]==['r105-cell8-pl','r105-cell8-pf']
          for r in rows:
              b=(d/r['rom']).read_bytes();flags=(d/('flags-'+r['rom'].replace('.bin','.txt'))).read_text()
              assert hashlib.sha256(b).hexdigest()==r['sha256'] and len(b)<=4194304 and r['bss_bytes']<=57920
              for f in ('-DVIEWWINDOWWIDTH=38','-DVIEWWINDOWHEIGHT=22','-DMAPWIDTH=38','-DDOOM_HUD_WAD'):
                  assert f in flags.split(),(f,flags)
              print(r)
          m={'base_sha':'9b5996d6a439dac7e1683f3a4d3d4d87efe88ac1','workflow_sha':os.environ['GITHUB_SHA'],'scene_samples':[38,22],
             'physical_sample_pixels':[8,8],'presentation':'R105 Pair-V A2/L3, current HUD/menu/static assets',
             'sram':'R104 interrupt masking retained','ai_default':'Normal','shadow_default':'Off',
             'roms':rows}
          (d/'CELL8-MANIFEST.json').write_text(json.dumps(m,indent=2)+'\n')
          PY2
      - name: PERF rendering smoke and 8px cell invariant
        shell: bash
        run: |
          set -euo pipefail
          rom=dist/hud/doom-md-r60-r105-cell8-pf.bin
          python3 scripts/lab/r70_capture.py --blastem "$BLASTEM" --rom "$rom" --elf "${rom%.bin}.elf" --out dist/cell8-off --label cell8-off --max-emulated-frames 8000 --max-breaks 3000 --timeout 600 > dist/hud/cell8-off.log 2>&1
          tail -n 3 dist/hud/cell8-off.log
          python3 - <<'PY2'
          import json,pathlib
          p=pathlib.Path('dist/cell8-off');print([x.name for x in p.iterdir()])
          rows=[json.loads(l) for l in (p/'frames.jsonl').read_text().splitlines() if l.strip()]
          assert len(rows)>20,('insufficient rendered frames',len(rows))
          raw=(p/'frames.bin').read_bytes();assert len(raw)==3344*len(rows)
          for i,r in enumerate(rows):
              if r.get('tic',0)<=1:continue
              frame=raw[i*3344:(i+1)*3344]
              for y in range(3,20):
                  for x in range(3,36):
                      for bank in (0,76):
                          c=frame[y*152+x*2+1+bank]
                          assert c>>4==c&15,('not a full 8px cell',i,x,y,bank,c)
          print('Rendered frames:',len(rows),'tic range:',rows[0].get('tic'),rows[-1].get('tic'),'8px invariant PASS')
          PY2
      - name: Shadow On rendering smoke (A2, post-pass)
        shell: bash
        run: |
          set -euo pipefail
          rom=dist/hud/doom-md-r60-r105-cell8-pf.bin
          python3 scripts/lab/r93b_capture.py --blastem "$BLASTEM" --rom "$rom" --elf "${rom%.bin}.elf" --out dist/cell8-on --mode 1 --max-emulated-frames 6000 > dist/hud/cell8-on.log 2>&1
          tail -n 3 dist/hud/cell8-on.log
          python3 - <<'PY2'
          import pathlib,json
          p=pathlib.Path('dist/cell8-on')
          rows=[json.loads(l) for l in (p/'frames.jsonl').read_text().splitlines() if l.strip()]
          assert len(rows)>20,('insufficient Shadow frames',len(rows))
          assert (p/'post.bin').stat().st_size==3344*len(rows)
          print('Shadow post-pass frames:',len(rows))
          PY2
      - name: Package playable ROM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/cell8-play
          cp dist/hud/doom-md-r60-r105-cell8-pl.bin dist/cell8-play/
          cp dist/hud/doom-md-r60-r105-cell8-pl.elf dist/cell8-play/
          cp dist/hud/CELL8-MANIFEST.json dist/cell8-play/
          cp dist/hud/flags-doom-md-r60-r105-cell8-pl.txt dist/cell8-play/
          cp dist/hud/cell8-*.log dist/cell8-play/
          cp docs/R105-CELL8.md dist/cell8-play/README.md
      - name: Upload PLAY
        uses: actions/upload-artifact@v6
        with:
          name: doom-md-r105-cell8-play
          path: dist/cell8-play/
          retention-days: 90
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: r105-cell8-failure
          path: |
            dist/hud/*.log
            dist/hud/SIZE-*.txt
            dist/cell8-off/frames.jsonl
            dist/cell8-on/frames.jsonl
          retention-days: 14
