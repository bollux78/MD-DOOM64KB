name: R19 Memory Diagnostic — DEMO3 43/40/38 KiB

on:
  push:
    branches:
      - r19-memdiag
  workflow_dispatch:

concurrency:
  group: r19-memdiag
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-r19-memdiag:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 100
    steps:
      - name: Checkout isolated R19 memory diagnostic branch
        uses: actions/checkout@v4
      - name: Restore uploaded E1M1 VGM and verify SHA256
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, lzma
          from pathlib import Path
          raw = lzma.decompress(Path('assets/r18-e1m1.vgm.xz').read_bytes())
          sha = hashlib.sha256(raw).hexdigest()
          expected = '64a7a0748953a4bd35b75735b9f4b7c1c89c0f3f4aa43395485cadd7e88a8226'
          if sha != expected:
              raise SystemExit(f'E1M1 SHA mismatch: {sha}')
          Path('res').mkdir(exist_ok=True)
          Path('res/e1m1.vgm').write_bytes(raw)
          print(f'Validated user-provided E1M1 VGM: {len(raw)} bytes, sha256={sha}')
          PY
      - name: Check R19 memory diagnostic code, build and VGM
        shell: bash
        run: |
          fish -n scripts/lab/build_r19_memdiag.fish
          python3 scripts/lab/test_r18_playable.py
          python3 scripts/lab/test_r19_flat_dbra.py
          python3 scripts/lab/test_r19_memdiag.py
          python3 scripts/lab/check_r18_vgm.py res/e1m1.vgm
      - name: Build three memory diagnostic DEMO3 ROMs (43/40/38 KiB)
        shell: bash
        run: |
          DOOM_R19_BGM_VGM="$GITHUB_WORKSPACE/res/e1m1.vgm" fish scripts/lab/build_r19_memdiag.fish
      - name: Upload three diagnostic ROMs and memory reports
        uses: actions/upload-artifact@v4
        with:
          name: doom-md-r19-memdiag-43-40-38
          path: |
            dist/r19-memdiag/*.bin
            dist/r19-memdiag/*.log
            dist/r19-memdiag/*.txt
          if-no-files-found: error
          retention-days: 90
