name: R47A - Pixel4 flat hoist controlled optimization and plane-pair host oracle
on:
  push:
    branches: [r47a-flat-hoist-plane-pair-oracle]
  workflow_dispatch:
concurrency:
  group: r47a-flat-hoist-plane-pair-oracle
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v6
      - name: Restore pinned XGM2 soundtrack input
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,lzma,pathlib
          data=lzma.decompress(pathlib.Path('assets/r18-e1m1.vgm.xz').read_bytes())
          assert hashlib.sha256(data).hexdigest()=='64a7a0748953a4bd35b75735b9f4b7c1c89c0f3f4aa43395485cadd7e88a8226'
          pathlib.Path('res/e1m1.vgm').write_bytes(data)
          PY
      - name: Recover pinned shareware DOOM1.WAD (not committed)
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip,hashlib,pathlib,urllib.request
          target=pathlib.Path('scripts/doom1.wad')
          expected_sha='1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771'
          size=4196020
          candidates=[
              ('ibiblio', 'https://distro.ibiblio.org/slitaz/sources/packages/d/doom1.wad',False),
              ('wad-archive', 'https://archive.org/download/wadarchive/DATA/5b.zip/5b%2F2e249b9c5133ec987b3ea77596381dc0d6bc1d%2F5b2e249b9c5133ec987b3ea77596381dc0d6bc1d.wad.gz',True),
              ('shareware-demo', 'https://aikernel.net/demo/doom/DOOM1.WAD',False)
          ]
          if target.is_file():
              b=target.read_bytes()
              if len(b)==size and hashlib.sha256(b).hexdigest()==expected_sha:
                  print('Verified pinned shareware WAD already present:',target)
                  raise SystemExit(0)
          for name,url,compressed in candidates:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'MD-DOOM64KB R31 build asset verifier/1.0'})
                  with urllib.request.urlopen(req,timeout=70) as response:
                      data=response.read(9000000)
                  if compressed:data=gzip.decompress(data)
                  sha=hashlib.sha256(data).hexdigest()
                  if len(data)!=size or sha!=expected_sha:
                      print(name,'unexpected content or checksum; rejecting',
                            len(data),sha)
                      continue
                  target.write_bytes(data)
                  print('Verified original shareware v1.9 from',name,
                        'size',len(data),'SHA256',sha)
                  break
              except Exception as e:
                  print('Shareware mirror unavailable:',name,str(e)[:200])
          else:
              print('Pinned Doom shareware download failed; original preflight will look for local source.')
          PY
      - name: Preflight - find authentic Doom DMX sounds on self-hosted runner
        shell: bash
        run: |
          mkdir -p dist/r35
          python3 - <<'PY'
          import pathlib,os,struct,hashlib,sys
          home=pathlib.Path.home()
          candidates=[
              pathlib.Path('scripts/doom1.wad'),
              home/'Projetos/doom-assets/doom1.wad',
              home/'Projetos/doom-assets/DOOM1.WAD',
              home/'Projetos/doom-assets/doom1.WAD',
              home/'Jogos/doom1.wad',
              home/'Games/doom1.wad',
              home/'Downloads/doom1.wad'
          ]
          # No external network or repo commit for copyright-protected WAD.
          for top in (home/'Projetos',home/'Games',home/'Jogos'):
              if not top.is_dir():continue
              root_depth=len(top.parts)
              for directory,subdirs,names in os.walk(top,followlinks=False):
                  if len(pathlib.Path(directory).parts)-root_depth>4:
                      subdirs[:]=[]
                      continue
                  subdirs[:]=[s for s in subdirs if not s.startswith('.')]
                  for n in names:
                      if n.lower()=='doom1.wad':
                          candidates.append(pathlib.Path(directory)/n)
          for f in candidates:
              if not f.is_file():continue
              try:
                  with f.open('rb') as fd:
                      h=fd.read(12)
                      if len(h)!=12 or h[:4] not in (b'IWAD',b'PWAD'):continue
                      count,offset=struct.unpack_from('<II',h,4)
                      if not 100<count<10000:continue
                      fd.seek(offset)
                      directory=fd.read(count*16)
                  sounds={directory[i+8:i+16].split(b'\0')[0]
                          for i in range(0,len(directory),16)}
                  if not {b'DSPISTOL',b'DSSHOTGN',b'DSOROPN'}.intersection(sounds):
                      continue
                  raw=f.read_bytes()
                  dest=pathlib.Path('scripts/doom1.wad')
                  if f.resolve()!=dest.resolve():dest.write_bytes(raw)
                  sha=hashlib.sha256(raw).hexdigest()
                  (pathlib.Path('dist/r35')/'SOURCE-STATUS.txt').write_text(
                      f'Genuine WAD source found: {str(f)}\nSHA256: {sha}\nBytes: {len(raw)}\n')
                  print('SFX input:',f,'bytes',len(raw),'SHA256',sha)
                  sys.exit(0)
              except (OSError,struct.error):continue
          status=('MISSING: authentic scripts/doom1.wad (DS* lumps) not found on runner.\n'
                  'Place your own doom1.wad in ~/Projetos/doom-assets/doom1.wad\n'
                  'No synthetic or silent SFX fallback is allowed for R31 PCM builds.\n')
          pathlib.Path('dist/r35/SOURCE-STATUS.txt').write_text(status)
          print(status,file=sys.stderr)
          sys.exit(3)
          PY
      - name: Verify R31 generator and build scripts
        shell: bash
        run: |
          fish -n scripts/lab/build_r35_linear.fish
          fish -n scripts/build_silent.fish
          python3 -m py_compile scripts/lab/gen_r31_sfx.py scripts/lab/gen_r30_native.py \
            scripts/lab/finish_r35_rom.py scripts/lab/audit_r35.py
          python3 scripts/lab/test_r25_music.py
          python3 scripts/lab/test_r27_group.py
          python3 - <<'PY'
          import importlib.util,struct
          spec=importlib.util.spec_from_file_location('sfx','scripts/lab/gen_r31_sfx.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          source=bytes((128+(i%20)) for i in range(11025))
          lump=struct.pack('<HHI',3,11025,len(source))+source
          low,*_=m.convert(lump,6650)
          high,*_=m.convert(lump,13300)
          assert len(low)%256==len(high)%256==0
          assert len(low)<len(high)
          assert len(m.SFX)==52
          print('R31 rate conversion, alignment, SFX enum count: OK')
          PY
          test -f ~/mars/m68k-elf/lib/libmd.a
          test -f ~/mars/m68k-elf/inc/snd/xgm2.h
      - name: R46 native plane BSP sprite culling host oracle
        shell: bash
        run: |
          fish -n scripts/lab/build_r35_linear.fish
          python3 -m py_compile scripts/lab/test_r46_m2b_vertical.py scripts/lab/test_r46_m2c_culling.py
          python3 scripts/lab/test_r46_m1b_vram.py
          python3 scripts/lab/test_r46_m2a_projection.py
          python3 scripts/lab/test_r46_m2b_vertical.py
          python3 scripts/lab/test_r46_m2c_culling.py
          python3 scripts/lab/test_r46_m2c_p2a.py
          python3 scripts/lab/test_r46_m2c_p2b.py
          python3 scripts/lab/test_r46_m2c_p2c.py
          python3 scripts/lab/test_r46_m2c_p2d.py
          python3 scripts/lab/test_r46_m2c_p2e.py
          python3 scripts/lab/test_r46_m2c_p2f.py
          python3 scripts/lab/test_r46_m2c_p2g.py
          python3 scripts/lab/test_r46_m2c_p2h.py
          python3 scripts/lab/test_r46_m2c_p2i.py
          python3 scripts/lab/test_r46_m3a.py
          python3 scripts/lab/test_r46_m3b.py
          python3 scripts/lab/test_r46_m3c.py
          python3 scripts/lab/test_r46_m3c_r2.py
          python3 scripts/lab/test_r46_m3c_r3.py
          python3 scripts/lab/test_r46_m3c_r5.py
          python3 scripts/lab/test_r46_m6a_layout.py
          python3 scripts/lab/test_r44_intermission_layout.py
          python3 - <<'PY'
          from pathlib import Path
          src=Path('src/r46_pixel4_culling.c').read_text()
          iface=Path('src/r46_pixel4_culling.h').read_text()
          parent=Path('src/r46_pixel4_vertical.c').read_text()
          entry=Path('src/i_genesisv.c').read_text()
          assert 'R46_P4_PlaneCanExtend' in src and 'R46_P4_BSPAnyOpen' in src
          assert 'R46_P4_SpriteBounds' in src and 'R46_P4_SpriteDepth' in src
          assert 'R46_P4_CullingValidate()' in entry and 'R46_P4_VerticalValidate()' in entry
          assert 'R46_P4_COLS = 76' in iface and 'R46_P4_SAMPLE_ROWS = 44' in iface
          assert 'R46_P4_SpansValidate()' in entry
          assert 'R46_P4_PlaneOwnerValidate()' in entry
          assert 'R46_P4_SpriteCameraValidate()' in entry
          assert 'R46_P4_WorldSpriteValidate()' in entry
          assert 'R46_P4_SpriteOcclusionValidate()' in entry
          assert 'R46_P4_SpriteRunsValidate()' in entry
          assert 'R46_P4_SpriteOrderValidate()' in entry
          assert 'R46_P4_SpriteMaskValidate()' in entry
          assert 'R46_P4_PipelineValidate()' in entry
          assert 'R46_P4_RasterValidate()' in entry
          assert 'R46_P4_CompositeValidate()' in entry
          assert 'R46_M3_OwnerValidate()' in entry
          assert 'R46_M3_TilesValidate()' in entry
          assert 'R46_M3B_PatternValidate()' in entry
          assert 'R46_M3C_BankValidate()' in entry
          assert 'R46_M3C_PatternValidate()' in entry
          assert 'R46_P4_ClipColumn' in parent
          assert 'MEM_alloc' not in src and 'VDP_' not in src and 'Z_Malloc' not in src
          assert 'WI_TEXT_WIDTH 38' in Path('src/wi_libt.c').read_text()
          print('R46 M2C P1: caller-owned planes/solidcol, sprite clipping/scale, no VDP switch')
          PY
      - name: R47A flat equivalence and plane-pair host-only compositor oracle
        shell: bash
        run: |
          gcc -O2 -std=c11 -Wall -Wextra -Werror scripts/lab/test_r47a_flat.c -o /tmp/test_r47a_flat
          /tmp/test_r47a_flat
          python3 scripts/lab/test_r47a_plane_pair.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/r22_video.inc').read_text()
          b=Path('scripts/lab/build_r35_linear.fish').read_text()
          assert 'DOOM_R47_FLAT_HOIST' in s and 'DOOM_R47_FLAT_HOIST' in b
          assert '#else\n    c=r22_color[c];for(int16_t y=v->yl;y<=v->yh;y++)R22_Plot(v->x,y,c);\n#endif' in s
          assert 'doom-md-r47a-flat-p4perf' in b and 'doom-md-r47a-flat-p4play' in b
          assert 'R20_VBlankVideo(void)' in s and 'R22_UploadBack(uint16_t bank)' in s
          print('R47A PASS: only flat path changes; original patterns/VDP path remain')
          PY
      - name: Build independent Primary, R45 ASM, R47A flats perf and play ROMs
        shell: bash
        run: |
          mkdir -p dist/r35
          for mode in primary r45p4 r47flat r47play; do
            if [[ "$mode" == primary ]]; then
              checker=1; dither=1; asm=0; pixel=0; flat=0; profile=primary; variant=cell-perf; r45=cell; identity=doom-md-r46-primary-perf
            else
              checker=0; dither=0; asm=1; pixel=1; profile=''; r45=asm
              if [[ "$mode" == r45p4 ]]; then flat=0;variant=pixel4-perf;identity=doom-md-r45-asm-p4perf
              elif [[ "$mode" == r47flat ]]; then flat=1;variant=pixel4-perf;identity=doom-md-r47a-flat-p4perf
              else flat=1;variant=pixel4-play;identity=doom-md-r47a-flat-p4play;fi
            fi
            echo "=== R47A $mode -> $identity ==="
            if [[ "$mode" == primary ]]; then export DOOM_R46_BUILD=primary; else unset DOOM_R46_BUILD; fi
            env DOOM_R35D_CHECKER="$checker" DOOM_R37_BSP_PROFILE=0 DOOM_R38_TIME_PROFILE=0 DOOM_R39C_VARIANT=mall DOOM_R39D_DITHER_TOGGLE="$dither" DOOM_R39E_AUDIO_TOGGLES=1 DOOM_R39F_DITHER3="$dither" DOOM_R42_WALL_ASM="$asm" DOOM_R43_GRAY_CRT=0 DOOM_R40_STAGE1=fast DOOM_R45_VARIANT="$r45" DOOM_R47_FLAT_HOIST="$flat" DOOM_R20_BGM_VGM="$GITHUB_WORKSPACE/res/e1m1.vgm" fish scripts/lab/build_r35_linear.fish "$variant"
            test -s "dist/r35/$identity.bin"
            cp "out/release/rom.out" "dist/r35/$identity-check.elf"
            "$HOME/mars/m68k-elf/bin/m68k-elf-size" "out/release/rom.out" > "dist/r35/size-$mode.txt"
          done
      - name: Verify R47A controls, ROM headers, flags, text/BSS and packages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,struct,json,zipfile
          d=Path('dist/r35')
          stems={
            'primary':'doom-md-r46-primary-perf',
            'r45p4':'doom-md-r45-asm-p4perf',
            'r47flat':'doom-md-r47a-flat-p4perf',
            'r47play':'doom-md-r47a-flat-p4play',
          }
          locked={
            'primary':'290677102bfb5a00b2a03f1150ba84204f903c51726ce78859a254128ac64c79',
            'r45p4':'7af79f3948ed09db201d66ca0e78c7da4009f835f394883238d9f6931d9d00f8',
          }
          entries={}
          for mode,stem in stems.items():
              data=(d/(stem+'.bin')).read_bytes()
              sha=hashlib.sha256(data).hexdigest()
              assert data[0x100:0x110]==b'SEGA MEGA DRIVE ',mode
              assert struct.unpack_from('>II',data,0x1a0)==(0,len(data)-1),(mode,len(data))
              assert len(data)<=4*1024*1024 and len(data)%0x20000==0,mode
              flags=set((d/f'flags-{stem}.txt').read_text().split())
              assert (('-DDOOM_R47_FLAT_HOIST' in flags)==mode.startswith('r47')),(mode,'feature gate')
              assert (('-DDOOM_R22_PIXEL4' in flags)==(mode!='primary')),(mode,'renderer')
              assert '-DDOOM_R21_FRAME_HASH' not in flags,mode
              vals=(d/f'size-{mode}.txt').read_text().splitlines()[-1].split()
              m={'text':int(vals[0]),'data':int(vals[1]),'bss':int(vals[2])}
              entries[mode]=dict(name=stem+'.bin',sha256=sha,bytes=len(data),memory=m)
              if mode in locked:
                  assert sha==locked[mode],(mode,'reference SHA changed',sha,locked[mode])
          assert entries['r47flat']['memory']['bss']<=entries['r45p4']['memory']['bss']+16,entries
          assert entries['r47flat']['memory']['text']!=entries['r45p4']['memory']['text'],('optimization absent',entries)
          manifest={'experiment':'R47A: independent flat-hoist pixel4; plane-pair is host-only simulation, NOT a hardware ROM',
                    'roms':entries,'controls_sha_verified':True,
                    'approval':'await user full DEMO3 and PLAY visual + hardware checks; CI smoke is not acceptance'}
          (d/'R47A-MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          with zipfile.ZipFile(d/'R47A-4ROMS.zip','w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for e in entries.values():z.write(d/e['name'],e['name'])
              z.write(d/'R47A-MANIFEST.json','MANIFEST.json')
              z.write('docs/review-r47/R47A-PLAN.md','README-R47A.md')
          print(json.dumps(manifest,indent=2))
          PY
      - name: BlastEm smoke on four ROMs, distinguishing CPU boot from full DEMO3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,os,shutil
          exe=shutil.which('blastem') or next((str(p) for p in (Path.home()/'Projetos').glob('**/blastem') if p.is_file() and os.access(p,os.X_OK)),None)
          assert exe,'BlastEm not found'
          d=Path('dist/r35').resolve()
          env=os.environ.copy()
          env.update(SDL_AUDIODRIVER='dummy',SDL_VIDEODRIVER='dummy')
          for stem in ('doom-md-r46-primary-perf','doom-md-r45-asm-p4perf','doom-md-r47a-flat-p4perf','doom-md-r47a-flat-p4play'):
              frames='800' if 'p4' in stem else '300'
              p=subprocess.run([exe,'-b',frames,str(d/(stem+'.bin'))],cwd=d,
                 env=env,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,
                 text=True,errors='replace',timeout=75)
              print(stem,p.returncode,p.stdout[-200:],flush=True)
              assert p.returncode==0,stem
          PY
      - name: Upload R47A four-ROM A/B package and host oracles
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: doom-md-r47a-flat-comparison
          path: dist/r35/
          retention-days: 90
          if-no-files-found: warn
