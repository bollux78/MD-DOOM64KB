name: C6 reference ROM for C7 debug
on:
  push:
    branches: [exp-dread-c7-easy-ai12-proj20-20261122]
    paths: ['.github/workflows/dread-c7-c6-reference.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/upload-artifact@v4
        with:
          name: DREAD-C6-REFERENCE-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 5
          path: experiments/DREAD_MD/d01/gameplay/releases/DREAD-C6-DUAS-VERSOES.zip
