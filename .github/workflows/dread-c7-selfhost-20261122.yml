name: DREAD C7 - legacy self-hosted build (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    name: Build C7 ROMs on configured self-hosted runner
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 120
    env:
      WAD: /home/dan/Projetos/doom-md/assets/wads/doom1.wad
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify toolchain and WAD
        shell: bash
        run: |
          set -euo pipefail
          test -s "$WAD"
          command -v python3
          command -v java
          python3 -c 'import numpy,PIL'
          test -x "$HOME/mars/m68k-elf/bin/m68k-elf-gcc"
          gdk=""
          for d in "$HOME/Projetos/marsdev/sgdk/SGDK" "$HOME/Projetos/doom-md/vendor/sgdk" "$HOME/mars/m68k-elf" "/opt/sgdk"; do
            if [[ -f "$d/makefile.gen" ]]; then gdk="$d"; break; fi
          done
          test -n "$gdk"
          echo "GDK=$gdk" >> "$GITHUB_ENV"
      - name: Compile both C7 variants from the same checkout
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/dread-c7-selfhost-$GITHUB_RUN_ID"
          mkdir -p "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          export GDK="$GDK" PATH="$HOME/mars/m68k-elf/bin:$GDK/bin:$PATH"
          export DREAD_TC="$HOME/mars/m68k-elf/bin/m68k-elf-"
          # Leave the SGDK boot assembly to the SDK's original build rules.
          # Copying sega.s manually caused a missing out/rom_header.bin failure.
          unset DREAD_COPY_SEGA_S
          export OPENBLAS_NUM_THREADS=1 DREAD_WEAPON_DITHER=1 DREAD_GRATE_HALF_RES=1
          unset DREAD_PREPARED_MAPS
          # The listener itself prints only job start/finish. Mirror only
          # a handful of concise build-status lines to its interactive terminal.
          # No per-file, compiler or map trace, and no new local log file.
          LISTENER_TTY=""
          for pid in $(pgrep -f 'Runner.Listener' || true); do
            [[ -r "/proc/$pid/comm" ]] || continue
            [[ "$(cat "/proc/$pid/comm" 2>/dev/null)" == Runner.Listener ]] || continue
            candidate="$(readlink "/proc/$pid/fd/1" 2>/dev/null || true)"
            if [[ "$candidate" == /dev/pts/* && -w "$candidate" ]]; then
              LISTENER_TTY="$candidate"
              break
            fi
          done
          console() {
            printf '[DREAD C7 %s] %s\n' "$(date +'%H:%M:%S')" "$*"
            if [[ -n "$LISTENER_TTY" ]]; then
              printf '[DREAD C7 %s] %s\n' "$(date +'%H:%M:%S')" "$*" > "$LISTENER_TTY" || true
            fi
          }
          if [[ -n "$LISTENER_TTY" ]]; then
            echo "Interactive runner terminal found: $LISTENER_TTY (progress mirrored; no local log files)"
          else
            echo "Listener is not attached to a writable interactive terminal; all details remain in Actions job output."
          fi
          console "Iniciando build C7 $GITHUB_RUN_ID / commit $GITHUB_SHA"
          for variant in NORMAL SSF; do
            mkdir -p "$OUT/$variant"
            if [[ "$variant" == SSF ]]; then
              export DREAD_SSF=1 DREAD_PAL_ROUNDS=1
              filename=DREAD-C7-PALETAS-SSF.bin
            else
              unset DREAD_SSF
              filename=DREAD-C7-NORMAL-4MiB.bin
            fi
            echo "::group::Compile $variant"
            console "Iniciando $variant: preparando mapas e assets; compilando ROM"
            # Keep verbose compiler output ONLY in GitHub Actions.
            # The runner's interactive terminal receives concise status lines
            # from console(): start, success or failure for each variant.
            if PYTHONUNBUFFERED=1 bash experiments/DREAD_MD/d01/gameplay/build.sh "$WAD" "$OUT/$variant" 2>&1; then
              console "$variant: compilacao concluida com sucesso"
            else
              console "$variant: FALHOU (detalhes no GitHub Actions)"
              echo "::error::C7 $variant failed; see the Actions log"
              exit 1
            fi
            cp "$OUT/$variant/EPISODE.bin" "$OUT/$filename"
            if [[ -f "$OUT/$variant/ssf-layout.json" ]]; then cp "$OUT/$variant/ssf-layout.json" "$OUT/ssf-layout.json"; fi
            stat -c "$filename = %s bytes" "$OUT/$filename"
            sha256sum "$OUT/$filename" >> "$OUT/SHA256SUMS.txt"
            console "$filename pronto - $(stat -c %s "$OUT/$filename") bytes"
            echo "::endgroup::"
          done
          console "NORMAL e SSF: compilacoes concluidas; criando ZIP"
          python3 - "$OUT" <<'PY'
          from pathlib import Path
          import sys,zipfile
          root=Path(sys.argv[1]); archive=root/"DREAD-C7-DUAS-VERSOES.zip"
          with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.glob("DREAD-C7-*.bin")): z.write(p,p.name)
              for fn in ("SHA256SUMS.txt","ssf-layout.json"):
                  p=root/fn
                  if p.is_file():z.write(p,p.name)
              # No extra local build logs: GitHub Actions stores streamed output.
          with zipfile.ZipFile(archive) as z: assert z.testzip() is None
          print("C7 ZIP",archive,archive.stat().st_size)
          PY
          console "SUCESSO: ZIP das duas ROMs criado; publicacao no GitHub Actions"
      - name: Upload ROMs (GitHub Actions keeps the console log)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DREAD-C7-DUAS-VERSOES-SELFHOST-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ env.OUT }}/DREAD-C7-*.bin
            ${{ env.OUT }}/DREAD-C7-DUAS-VERSOES.zip
            ${{ env.OUT }}/SHA256SUMS.txt
            ${{ env.OUT }}/ssf-layout.json
