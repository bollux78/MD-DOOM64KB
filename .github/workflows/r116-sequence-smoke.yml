name: R116 sequence handoff smoke (private ROM, no rebuild)
on:
  push:
    branches: ['exp-chatgpt-r116-demo-sequence-20261102']
    paths: ['.github/triggers/r116-sequence-smoke.trigger']
permissions:
  contents: read
  actions: read
jobs:
  blastem-sequence:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 25
    env:
      BLASTEM: /home/dan/Projetos/blastem64-1.0.0/blastem
      R116_PRIVATE_DIR: /home/dan/Projetos/Personal/r116-demotest/run-41566227364-1
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check private ROM and emulator
        shell: bash
        run: |
          set -euo pipefail
          test -x "$BLASTEM"
          test -s "$R116_PRIVATE_DIR/doom-md-r60-r116-demotest-pf.bin"
          test -s "$R116_PRIVATE_DIR/doom-md-r60-r116-demotest-pf.elf"
          python3 -m py_compile scripts/lab/r116_sequence_smoke.py
      - name: Verify automatic E1M8-to-E1M9 handoff and AI Normal persistence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/ab
          python3 scripts/lab/r116_sequence_smoke.py \
            --blastem "$BLASTEM" \
            --rom "$R116_PRIVATE_DIR/doom-md-r60-r116-demotest-pf.bin" \
            --elf "$R116_PRIVATE_DIR/doom-md-r60-r116-demotest-pf.elf" \
            --out dist/ab/r116-sequence-smoke.json \
            --max-emulated-frames 9950 \
            --timeout 900
      - name: Upload report only (no private binaries/demos)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: r116-sequence-smoke-report
          path: dist/ab/r116-sequence-smoke.json
          if-no-files-found: warn
          retention-days: 90
