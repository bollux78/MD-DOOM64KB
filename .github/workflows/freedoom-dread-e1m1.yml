name: Freedoom DREAD E1M1 - clean build (no Doom assets)
on:
  push:
    branches: [exp-freedoom-dread-clean-20261124]
    paths: ['.github/workflows/freedoom-dread-e1m1.yml']
  workflow_dispatch:
    inputs:
      merge:
        description: 'merge floor steps up to N units (0 = off)'
        default: '0'
      aggressive:
        description: 'aggressive map simplification (1 = on): steps 24, loose light/flats, ceilings 64, narrow protection, wall join 16'
        default: '0'
permissions:
  contents: read
jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Obtain official Freedoom 0.13.0 and convert/build E1M1
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/freedoom-dread-$GITHUB_RUN_ID"
          echo "FD_OUT=$OUT" >> "$GITHUB_ENV"
          mkdir -p "$OUT/release" "$OUT/input" "$OUT/build/previews"
          curl --fail --location --retry 3 https://github.com/freedoom/freedoom/releases/download/v0.13.0/freedoom-0.13.0.zip -o "$OUT/input/freedoom.zip"
          unzip -q "$OUT/input/freedoom.zip" -d "$OUT/input"
          wad="$OUT/input/freedoom-0.13.0/freedoom1.wad"
          test -s "$wad"
          cp "$OUT/input/freedoom-0.13.0/"{COPYING,CREDITS,CREDITS-MUSIC}.txt "$OUT/release/"
          GDK="$HOME/Projetos/marsdev/sgdk/SGDK"
          test -f "$GDK/makefile.gen"
          export GDK DREAD_TC="$HOME/mars/m68k-elf/bin/m68k-elf-"
          export PATH="$HOME/mars/m68k-elf/bin:$GDK/bin:$PATH"
          export DREAD_FREEDOOM=1 DREAD_MAP_LIST=1 DREAD_GREEN_ACCENT=0 DREAD_WEAPON_PALETTIZED=0
          export DREAD_FREEDOOM_PREVIEWS="$OUT/build/previews" DREAD_ROM_LABEL="FREEDOOM DREAD E1M1"
          export DREAD_OPT_FLAGS="-DDREAD_VALIDATION_TEST"
          unset DREAD_SSF DREAD_COPY_SEGA_S DREAD_PREPARED_MAPS
          export OPENBLAS_NUM_THREADS=1
          MERGE="${{ inputs.merge || '0' }}"; SUF=""
          if [ "$MERGE" != "0" ]; then export DREAD_RENDER_GEOMETRY=merge DREAD_MERGE_STEPS="$MERGE" DREAD_MERGE_FLATS=1 DREAD_OPT_REPORTS=1; SUF="-STEPS$MERGE"; fi
          if [ "${{ inputs.aggressive || '0' }}" = "1" ]; then export DREAD_RENDER_GEOMETRY=merge DREAD_MERGE_STEPS=24 DREAD_MERGE_FLATS=1 DREAD_MERGE_LOOSE=1 DREAD_MERGE_CEIL=64 DREAD_NARROW_PROTECT=1 DREAD_JOIN_TOL=16 DREAD_OPT_REPORTS=1; SUF="-AGRESSIVO"; fi
          echo "SUF=$SUF" >> "$GITHUB_ENV"
          root=experiments/DREAD_MD/d01
          python3 -m py_compile "$root/tools/"{freedoom_art,studio_quantizer,gen_gameplay_assets,gen_demo3}.py
          bash "$root/gameplay/build.sh" "$wad" "$OUT/build"
          cp "$OUT/build/EPISODE.bin" "$OUT/release/FREEDOOM-DREAD-E1M1$SUF.bin"
          [ -d "$OUT/build/geometry" ] && cp -r "$OUT/build/geometry" "$OUT/release/geometry" || true
          test "$(stat -c %s "$OUT/release/FREEDOOM-DREAD-E1M1$SUF.bin")" -le 4194304
          cp -r "$OUT/build/previews" "$OUT/release/"
          (cd "$OUT/release" && sha256sum FREEDOOM-DREAD-E1M1$SUF.bin) > "$OUT/release/SHA256.txt"
          echo "Freedoom 0.13.0 phase 1, E1M1 only; DREAD C7 base 254c3df; static screens converted by the author from Freedoom TITLEPIC/INTERPIC; no Doom assets." > "$OUT/release/BUILD.txt"
          (cd "$OUT/release" && python3 -m zipfile -c ../FREEDOOM-DREAD-E1M1$SUF.zip .)
          cp "$OUT/FREEDOOM-DREAD-E1M1$SUF.zip" "$GITHUB_WORKSPACE/FREEDOOM-DREAD-E1M1$SUF.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Freedoom-DREAD-E1M1${{ inputs.aggressive == '1' && '-AGRESSIVO' || (inputs.merge && inputs.merge != '0' && format('-STEPS{0}', inputs.merge)) || '' }}
          path: FREEDOOM-DREAD-E1M1*.zip
          if-no-files-found: error
