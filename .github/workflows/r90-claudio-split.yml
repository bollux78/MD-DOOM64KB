name: R90 Claudio split palettes (prototype A)
# R89 control vs R90 split: lower half of the 3D view on PAL2/PAL3 (HUD palettes restored by HInt).
# Same-job capture: upper half must be byte-identical; final judgement on CRT by the user.
on:
  workflow_dispatch:
  push:
    branches: ['exp-claudio-*', 'exp-chatgpt-*']
    paths: ['.github/triggers/r90-claudio-split.trigger']
permissions:
  contents: read
  actions: read
concurrency:
  group: r90-claudio-split-${{ github.ref }}
  cancel-in-progress: false
env:
  BLASTEM: /home/dan/Projetos/blastem64-1.0.0/blastem
  OBJDUMP: /home/dan/mars/m68k-elf/bin/m68k-elf-objdump
  AB_FRAMES: '4000'
  AB_SETS: 'control split'
jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in refs/heads/exp-claudio-*|refs/heads/exp-chatgpt-*) ;; *) exit 1;; esac
          git merge-base --is-ancestor f5a9daa7a0bd7225bbc227630defc73c67c34f1e HEAD
          test -x "$BLASTEM"; test -x "$OBJDUMP"
          python3 -m py_compile scripts/lab/apply_r83.py scripts/lab/test_r83.py scripts/lab/apply_r81.py scripts/lab/apply_r82_d8088.py scripts/lab/test_r82_d8088.py scripts/lab/apply_r80_performance.py scripts/lab/test_r80_pixofs.py scripts/lab/r82_stack_probe.py scripts/lab/r82_bsp_depth.py scripts/lab/r70_capture.py scripts/lab/r70_compare.py
          python3 scripts/lab/test_r83.py
          python3 scripts/lab/test_r88.py
          python3 scripts/lab/test_r89.py
          python3 -m py_compile scripts/lab/gen_r90_split.py scripts/lab/apply_r90_split.py scripts/lab/r90_split_compare.py scripts/lab/r90_color_analysis.py
          python3 -m py_compile scripts/lab/apply_r87.py scripts/lab/r87_compare.py
          python3 -m py_compile scripts/lab/apply_r85.py scripts/lab/apply_r84.py scripts/lab/gen_r84_columns.py scripts/lab/r84_texture_audit.py
          python3 scripts/lab/test_r81_sram.py
          python3 scripts/lab/test_r81_font.py
          python3 scripts/lab/test_r81_cheats.py
          python3 scripts/lab/test_r81_codec.py
          python3 scripts/lab/test_r77.py
          python3 scripts/lab/gen_r78_art.py --verify-only
          python3 scripts/lab/test_r78_native.py
          fish -n scripts/build_silent.fish
          fish -n scripts/lab/build_r35_linear.fish
          python3 scripts/lab/test_r79_face.py
          python3 scripts/lab/test_gen_hud_wad.py
          python3 scripts/lab/test_hud_wad_logic.py
      - name: Restore VGM and pinned shareware WAD
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,hashlib,lzma,shutil
          v=lzma.decompress(pathlib.Path('assets/r18-e1m1.vgm.xz').read_bytes())
          assert hashlib.sha256(v).hexdigest()=='64a7a0748953a4bd35b75735b9f4b7c1c89c0f3f4aa43395485cadd7e88a8226'
          pathlib.Path('res/e1m1.vgm').write_bytes(v)
          source=pathlib.Path('/home/dan/Projetos/doom-md/assets/wads/doom1.wad')
          assert source.is_file() and source.stat().st_size==4196020
          assert hashlib.sha256(source.read_bytes()).hexdigest()=='1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771'
          pathlib.Path('scripts').mkdir(exist_ok=True)
          shutil.copyfile(source,'scripts/doom1.wad')
          PY
      - name: Generate artwork and preflight renderer palettes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lab/test_r79_face.py --wad scripts/doom1.wad
          mkdir -p dist/hud
          python3 scripts/lab/gen_r81_font.py --wad scripts/doom1.wad --out src/r81_menu_font.h --preview dist/hud/font-preview.png
          python3 scripts/lab/gen_r22_pixel4.py
          python3 scripts/lab/gen_r49_colormix.py
          python3 scripts/lab/test_r49_colormix.py
          python3 scripts/lab/gen_hud_wad.py --wad scripts/doom1.wad --out src/hud_wad_assets.h --preview dist/hud/hud-preview.png
      - name: Build control and candidate in separate disposable copies
        shell: bash
        run: |
          set -euo pipefail
          export DOOM_R20_BGM_VGM="$GITHUB_WORKSPACE/res/e1m1.vgm"
          mkdir -p dist/ab
          for set in $AB_SETS; do
            if [ "$set" = control ]; then lab=control; else lab="c-${set//+/_}"; fi
            w="$RUNNER_TEMP/r83-ab-$lab-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            test ! -e "$w"
            python3 -c 'import shutil,sys;shutil.copytree(sys.argv[1],sys.argv[2],ignore=shutil.ignore_patterns(".git","dist","__pycache__"),symlinks=True)' "$GITHUB_WORKSPACE" "$w"
            mkdir -p "$w/dist/hud"
            ( cd "$w"
              python3 scripts/lab/apply_r81.py
              python3 scripts/lab/test_r80_pixofs.py --src src
              R80_EXPERIMENTS="P1+F1" python3 scripts/lab/apply_r80_performance.py
              R83_CANDIDATE=sprites python3 scripts/lab/apply_r83.py
              R85_CANDIDATE=all python3 scripts/lab/apply_r85.py
              R88_CANDIDATE=ai python3 scripts/lab/apply_r88.py
              python3 scripts/lab/apply_r89.py
              if [ "$set" = split ]; then R90_NAME=split python3 scripts/lab/apply_r90_split.py; fi
              # Verification only: a PERF (timedemo DEMO3) twin of each ROM; the deliverable is the PLAY ROM.
              python3 - <<'PY2'
          from pathlib import Path
          p=Path('scripts/lab/build_r71a12mul_hud.py');s=p.read_text();a="(('pl','play'),)"
          assert s.count(a)==1;p.write_text(s.replace(a,"(('pl','play'),('pf','perf'))"))
          PY2
              HUD_WORK="$w-work" python3 scripts/lab/build_r71a12mul_hud.py 2>&1 | tee dist/hud/BUILD.log )
            mkdir -p "dist/ab/$lab"; cp -a "$w/dist/hud/." "dist/ab/$lab/"
          done
      - name: Verify ROM sizes, BSS, hashes and control reproducibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,hashlib,os
          sets=os.environ['AB_SETS'].split()
          labs=[('control','r89-ai-menu-') if x=='control' else ('c-'+x,'r90-'+x+'-') for x in sets]
          ref={'r82-p1f1-pf':'cabdce1e8ad14ccdcd7f44db9a6377abd7b283a9dae94b093e8c1bb9519170ed','r82-p1f1-pl':'2c734fbbc2e97eb1a3dd3ea22f9f2fd08b767c64c9b1b0f163d5a8c1d9677e82'}
          for v,prefix in labs:
              d=pathlib.Path('dist/ab')/v
              rows=json.loads((d/'MANIFEST.json').read_text())
              assert [r['variant'] for r in rows]==[prefix+'pl',prefix+'pf'],rows
              for r in rows:
                  b=(d/r['rom']).read_bytes()
                  assert len(b)==r['bytes'] and hashlib.sha256(b).hexdigest()==r['sha256']
                  assert 0<r['bss_bytes']<=57920 and len(b)<=4*1024*1024
                  assert r['bss_bytes'] <= 57920, 'WRAM gate'
                  flags=(d/('flags-'+r['rom'][:-4]+'.txt')).read_text().split()
                  assert not any(x.startswith('-DDOOM_R79_SHADOW') for x in flags)
                  if v=='control' and r['variant'].endswith('-pl') and r['sha256']!='699c37b8639fc93b8fde88da0bd41f3e9b4cbbed64bfe02d0528439a2d595576': print('::warning title=control::control ROM differs from the published R89 build')
                  print('::notice title=%s %s::ROM %d B, BSS %d B (margin %d), sha256 %s'%(v,r['variant'],r['bytes'],r['bss_bytes'],57920-r['bss_bytes'],r['sha256'][:16]))
          PY
      - name: Same-job capture and split comparison
        shell: bash
        run: |
          set -euo pipefail
          AB_FRAMES=8000
          for v in control c-split; do
            rom=$(ls dist/ab/$v/*-pf.bin)
            python3 scripts/lab/r70_capture.py --blastem "$BLASTEM" --rom "$rom" --elf "${rom%.bin}.elf" --out "dist/ab/cap-$v" --label "$v" --max-emulated-frames "$AB_FRAMES" --max-breaks 3000 --timeout 600 > "dist/ab/cap-$v.log" 2>&1 || { cat "dist/ab/cap-$v.log"; exit 1; }
            tail -n 3 "dist/ab/cap-$v.log"
          done
          python3 scripts/lab/r90_split_compare.py dist/ab/r90-split-compare.json dist/ab/cap-control dist/ab/cap-c-split
          python3 -c "import json;r=json.load(open('dist/ab/r90-split-compare.json'));print('::notice title=R90 split A/B (PERF DEMO3)::'+json.dumps(r))"
          rom=$(ls dist/ab/c-split/*-pl.bin)
          python3 scripts/lab/r70_capture.py --blastem "$BLASTEM" --rom "$rom" --elf "${rom%.bin}.elf" --out dist/ab/smoke-c-split --label split-play --max-emulated-frames 800 --max-breaks 600 --timeout 120 > dist/ab/smoke-c-split.log 2>&1 || { cat dist/ab/smoke-c-split.log; exit 1; }
          tail -n 2 dist/ab/smoke-c-split.log
      - name: Bottom palette report
        shell: bash
        run: |
          set -euo pipefail
          r=$(ls dist/ab/c-split/*-r90-split-report.json)
          python3 -c "import json,sys;r=json.load(open(sys.argv[1]));[print('::notice title=R90 bottom mode %d::slots %d, walls %.1f->%.1f dE, floors %.1f->%.1f dE, regressions %d/%d, new grey %d, fallback %d'%(m['mode'],m['replaced_slots'],m['top_mean_err_w'],m['mean_err_w'],m['top_mean_err_f'],m['mean_err_f'],m['regress_w'],m['regress_f'],m['grey_new'],m['fallback'])) for m in r['modes']]" "$r"
      - name: Record SGDK makefile.gen compiler flags
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          g="${DOOM_MD_GDK:-$HOME/mars/m68k-elf}/makefile.gen"
          grep -nE "FLAGS|flto|-O[0-3s]" "$g" > dist/ab/makefile-gen-flags.txt 2>&1 || true
          head -c 3000 dist/ab/makefile-gen-flags.txt | python3 -c "import sys;t=sys.stdin.read().replace('%','%25').replace('\n','%0A');print('::notice title=SGDK makefile.gen flags::'+t)"
      - name: Disassembly of the changed functions
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          for d in dist/ab/control dist/ab/c-*; do
            v=$(basename "$d"); elf=$(ls $d/*-pl.elf); "$OBJDUMP" -d -z "$elf" > "dist/ab/objdump-$v-pf.txt" 2>/dev/null || true
          done
      - name: Upload A/B evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: doom-md-r90-split
          path: dist/ab/
          retention-days: 90
          if-no-files-found: warn

