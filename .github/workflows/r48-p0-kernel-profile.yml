name: R48 Pair-H baseline and P0 kernel profile

on:
  push:
    branches: [r48-p0-kernel-profile]
    paths:
      - '.github/workflows/r48-p0-kernel-profile.yml'
      - 'src/r22_video.inc'
      - 'src/r22_benchmark.inc'
      - 'scripts/lab/build_r35_linear.fish'
  workflow_dispatch:

concurrency:
  group: r48-p0-kernel-profile
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-profile:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Toolchain and Pair-H oracle
        shell: bash
        run: |
          set -euo pipefail
          command -v fish
          command -v python3
          test -x "$HOME/mars/m68k-elf/bin/m68k-elf-size"
          test -x "$HOME/mars/m68k-elf/bin/m68k-elf-nm"
          mkdir -p dist/r48-p0
          python3 scripts/lab/test_r47a_plane_pair.py | tee dist/r47-pair-fix/ORACLE-plane-pair.txt
          python3 scripts/lab/r47b_vdp_oracle.py --frames 48 --out dist/r47-pair-fix/ORACLE-vdp.json

      - name: Restore pinned E1M1 VGM
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,lzma,pathlib
          p=pathlib.Path('assets/r18-e1m1.vgm.xz')
          data=lzma.decompress(p.read_bytes())
          assert hashlib.sha256(data).hexdigest()=='64a7a0748953a4bd35b75735b9f4b7c1c89c0f3f4aa43395485cadd7e88a8226'
          pathlib.Path('res/e1m1.vgm').write_bytes(data)
          PY

      - name: Verify or recover Doom shareware WAD
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,gzip,os,pathlib,shutil,urllib.request
          target=pathlib.Path('scripts/doom1.wad')
          target.parent.mkdir(parents=True,exist_ok=True)
          expected='1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771'
          expected_size=4196020
          home=pathlib.Path.home()
          candidates=[target,home/'Projetos/doom-assets/doom1.wad',home/'Projetos/doom-assets/DOOM1.WAD',home/'Downloads/doom1.wad']
          for top in (home/'Projetos',home/'Games',home/'Jogos'):
              if not top.is_dir(): continue
              depth=len(top.parts)
              for directory,subdirs,names in os.walk(top,followlinks=False):
                  if len(pathlib.Path(directory).parts)-depth>4:
                      subdirs[:]=[]; continue
                  subdirs[:]=[x for x in subdirs if not x.startswith('.')]
                  for name in names:
                      if name.lower()=='doom1.wad': candidates.append(pathlib.Path(directory)/name)
          for p in candidates:
              if not p.is_file(): continue
              raw=p.read_bytes()
              if len(raw)==expected_size and hashlib.sha256(raw).hexdigest()==expected:
                  if p.resolve()!=target.resolve(): shutil.copyfile(p,target)
                  print('Verified WAD from',p); break
          else:
              mirrors=[
                ('archive','https://archive.org/download/wadarchive/DATA/5b.zip/5b%2F2e249b9c5133ec987b3ea77596381dc0d6bc1d%2F5b2e249b9c5133ec987b3ea77596381dc0d6bc1d.wad.gz',True),
                ('aikernel','https://aikernel.net/demo/doom/DOOM1.WAD',False)]
              for name,url,compressed in mirrors:
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'MD-DOOM64KB pair boot fix'})
                      with urllib.request.urlopen(req,timeout=65) as response: raw=response.read(9_000_000)
                      if compressed: raw=gzip.decompress(raw)
                      if len(raw)==expected_size and hashlib.sha256(raw).hexdigest()==expected:
                          target.write_bytes(raw); print('Recovered WAD from',name); break
                  except Exception as e: print('mirror failed',name,str(e)[:100])
              else: raise SystemExit('Pinned shareware WAD unavailable')
          assert hashlib.sha256(target.read_bytes()).hexdigest()==expected
          PY

      - name: Compile R48 control and instrumented Pair-H
        shell: bash
        run: |
          set -euo pipefail
          D=dist/r48-p0
          mkdir -p "$D"
          export DOOM_R20_BGM_VGM="$GITHUB_WORKSPACE/res/e1m1.vgm"

          p4 () {
            local mode="$1"; local id="$2"; shift 2
            env DOOM_R35D_CHECKER=1 DOOM_R39C_VARIANT=mall \
                DOOM_R39D_DITHER_TOGGLE=0 DOOM_R39E_AUDIO_TOGGLES=1 \
                DOOM_R40_STAGE1=fast DOOM_R42_WALL_ASM=1 DOOM_R45_VARIANT=asm \
                DOOM_R47_FLAT_HOIST=1 DOOM_R47_SPRITE_HOIST=1 DOOM_R47_PLANE_PAIR=1 \
                DOOM_R20_BGM_VGM="$DOOM_R20_BGM_VGM" DOOM_R48_BUILD="$id" "$@" \
                fish scripts/lab/build_r35_linear.fish "pixel4-$mode"
            cp -f "dist/r35/doom-md-r48-$id.bin" "$D/"
            cp -f "dist/r35/doom-md-r48-$id.elf" "$D/"
            cp -f "dist/r35/flags-doom-md-r48-$id.txt" "$D/"
            "$HOME/mars/m68k-elf/bin/m68k-elf-size" -A "dist/r35/doom-md-r48-$id.elf" > "$D/size-$id.txt"
          }

          p4 perf h-ctrl-perf
          p4 perf h-prof-perf DOOM_R48_P0_PROFILE=1
          p4 play h-all-play

      - name: Assert Pair-H WRAM and profiling overhead
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          d=Path('dist/r48-p0')
          sizes={}
          for ident in ('h-ctrl-perf','h-prof-perf','h-all-play'):
              s=(d/f'size-{ident}.txt').read_text()
              m=re.search(r'^\.bss\s+(\d+)\s+',s,re.M)
              assert m,(ident,s)
              sizes[ident]=int(m.group(1))
          print('R48 Pair-H BSS:',sizes)
          assert sizes['h-prof-perf']<=57920,sizes
          assert sizes['h-prof-perf']-sizes['h-ctrl-perf']<=40,sizes
          assert abs(sizes['h-all-play']-sizes['h-ctrl-perf'])<=10,sizes
          (d/'BSS-AUDIT.txt').write_text('\n'.join(f'{k}: {v} bytes' for k,v in sizes.items())+'\n')
          PY

      - name: BlastEm DEMO3 completion smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,shutil,subprocess,time
          d=Path('dist/r48-p0').resolve()
          exe=shutil.which('blastem') or next((str(p) for p in (Path.home()/'Projetos').glob('**/blastem') if p.is_file() and os.access(p,os.X_OK)),None)
          if not exe: raise SystemExit('BlastEm not found on runner')
          env=os.environ.copy();env.update(SDL_AUDIODRIVER='dummy',SDL_VIDEODRIVER='dummy')
          lines=[]
          for ident in ('h-ctrl-perf','h-prof-perf'):
              rom=d/f'doom-md-r48-{ident}.bin'
              started=time.monotonic()
              try:
                  p=subprocess.run([exe,'-b','800',str(rom)],cwd=d,env=env,
                      stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,errors='replace',timeout=35)
              except subprocess.TimeoutExpired: raise SystemExit(f'{ident}: emulator TIMEOUT')
              result=f'{ident}: exit={p.returncode} wall={time.monotonic()-started:.2f}s'
              lines.append(result);print(result,flush=True)
              if p.returncode: raise SystemExit(result)
          (d/'BLASTEM-SMOKE.txt').write_text('\n'.join(lines)+'\n')
          PY

      - name: Generate artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          d=Path('dist/r48-p0')
          roms=[{'file':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
              for p in sorted(d.glob('*.bin'))]
          assert len(roms)==3,roms
          obj={'baseline':'R47 ALL / Pair-H 4.71 FPS / 453.22s (historical)',
               'note':'P0 counts work and wait-loop spins, not CPU cycles; instrumented FPS is NOT baseline.',
               'roms':roms}
          (d/'MANIFEST.json').write_text(json.dumps(obj,indent=2)+'\n')
          (d/'README.txt').write_text('R48 P0 PAIR-H: run h-ctrl-perf first, then h-prof-perf and compare the 8 counts. The profiler perturbs FPS. Also includes h-all-play.\\n')
          print(json.dumps(obj,indent=2))
          PY

      - name: Upload R48 P0 ROMs
        uses: actions/upload-artifact@v6
        with:
          name: doom-md-r48-p0-kernel-profile
          path: dist/r47-pair-fix/
          retention-days: 90
          if-no-files-found: error
