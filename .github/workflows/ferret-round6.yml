name: Ferret round 6 - corrected raster differential
on:
  pull_request:
    branches: [research-ferret-round5-zigzag-20261125]
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/ferret-round6.yml','research/ferret-round6/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ferret-round6-x360
  cancel-in-progress: false
jobs:
  replay:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research-ferret-round6-fixes-20261125')
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Replay authenticated local captures from rounds 4 and 5
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root="$HOME/.local/share/ferret-research"
          out="$RUNNER_TEMP/ferret-r6-$GITHUB_RUN_ID"
          mkdir -p "$out/public"
          python3 research/ferret-round4/capture.py locate "$out/rom.path"
          python3 research/ferret-round6/replay.py "$root" "$(cat "$out/rom.path")" "$out/public/differential.json"
      - name: Publish aggregate evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ferret-round6-summary
          path: ${{ runner.temp }}/ferret-r6-${{ github.run_id }}/public/*.json
          if-no-files-found: warn
