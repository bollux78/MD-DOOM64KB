name: DREAD D01 precalc variants (2026-11-21)
on:
  push:
    branches: [exp-werk-dread-precalc-20261121]
    paths:
      - 'experiments/DREAD_MD/d01/**'
      - '.github/workflows/dread-d01-precalc-20261121.yml'
      - 'scripts/lab/bootstrap_marsdev.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install hosted build dependencies and shareware data
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential git make bison flex texinfo wget curl xz-utils unzip \
            python3 python3-numpy python3-pil python3-scipy python3-yaml \
            default-jre-headless libpng-dev zlib1g-dev libncurses-dev mame \
            doom-wad-shareware
          find /usr/share -iname 'doom1.wad' -type f -print
      - name: Cache Marsdev / SGDK from existing hosted lab
        id: mars-cache
        uses: actions/cache@v4
        with:
          path: ~/mars
          key: doom-md-marsdev-ubuntu2404-v1
      - name: Bootstrap m68k GCC and SGDK on cache miss
        if: steps.mars-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/lab/bootstrap_marsdev.sh
      - name: Inspect hosted SGDK and WAD
        shell: bash
        run: |
          set -euo pipefail
          test -x "$HOME/mars/m68k-elf/bin/m68k-elf-gcc"
          test -f "$HOME/mars/m68k-elf/makefile.gen"
          find "$HOME/mars" -maxdepth 7 -name 'makefile.gen' -print
          find "$HOME/mars" -maxdepth 7 -name 'rom_header.c' -print
          find /usr/share -iname doom1.wad -type f -print
      - name: Compile cached episode CONTROL, PATH, RAW and ALL
        shell: bash
        env:
          WAD: /usr/share/games/doom/doom1.wad
        run: |
          set -euo pipefail
          test -f "$WAD"
          gdk="$HOME/mars/m68k-elf"
          test -f "$gdk/makefile.gen"
          tc="$HOME/mars/m68k-elf/bin/m68k-elf-"
          test -x "${tc}gcc"
          export GDK="$gdk" DREAD_TC="$tc" DREAD_EP_MAPS=1 DREAD_COMBAT=1 DREAD_NPAL=1
          export PATH="$HOME/mars/m68k-elf/bin:$gdk/bin:$PATH" OPENBLAS_NUM_THREADS=1
          out="$RUNNER_TEMP/dread-fps-$GITHUB_RUN_ID"
          mkdir -p "$out"
          echo "OUT=$out" >> "$GITHUB_ENV"
          bash experiments/DREAD_MD/d01/tools/prepare_episode.sh "$WAD" "$out/prepared"
          export DREAD_PREPARED_MAPS="$out/prepared"
          build() {
            local tag="$1" flags="$2" romname="DREAD D01 FPS $1"
            mkdir -p "$out/$tag"
            echo "::group::Build $tag"
            if [[ "$tag" == "RAW" || "$tag" == "ALL" ]]; then export DREAD_PVS_RAW=1; else unset DREAD_PVS_RAW || :; fi
            DREAD_EXTRA_FLAGS="$flags" bash experiments/DREAD_MD/d01/tools/build_map.sh \
              "$WAD" EPISODE "$out/$tag" "$romname" > "$out/$tag/build.log" 2>&1 \
              || { tail -80 "$out/$tag/build.log"; return 1; }
            cp "$out/$tag/EPISODE.bin" "$out/DREAD-D01-FPS-$tag.bin"
            sha256sum "$out/DREAD-D01-FPS-$tag.bin" >> "$out/SHA256SUMS.txt"
            grep -Ei 'palette|textures|sprites|PVS|geometry|things:' "$out/$tag/build.log" | tail -12 || true
            echo "::endgroup::"
          }
          build CONTROL ""
          build PATH "-DDREAD_OPT_PATH_COMPRESS"
          build RAW "-DDREAD_PVS_RAW"
          build ALL "-DDREAD_OPT_PATH_COMPRESS -DDREAD_PVS_RAW"
          printf '%s\n' "CONTROL = unchanged renderer, menu shadow box corrected" \
            "PATH = alternate union-find path compression" \
            "RAW = read precomputed PVS directly from ROM, no decompress" \
            "ALL = PATH + RAW" \
            "Each name is included in filename, ROM header and opening screen." \
            "All four ROMs use the same graphics, map conversion, video and menu settings." \
            "Generated map resources shared across all four ROMs. Only compare FPS from identical benchmark routes." > "$out/README.txt"
      - name: MAME smoke test of ROMs (diagnostic, not FPS)
        continue-on-error: true
        shell: bash
        run: |
          set -u
          for tag in CONTROL PATH RAW ALL; do
            echo "::group::MAME $tag"
            if timeout 45 mame megadriv -cart "$OUT/DREAD-D01-FPS-$tag.bin" \
                -video none -sound none -plugins 0 -seconds_to_run 4 \
                -nothrottle -skip_gameinfo > "$OUT/bench-$tag.log" 2>&1; then
              echo "MAME $tag executed (no FPS assertion)"
            else
              echo "::warning::MAME $tag failed; ROMs remain available"
            fi
            tail -12 "$OUT/bench-$tag.log" || true
            echo "::endgroup::"
          done
      - name: Package ROMs and performance evidence
        if: always()
        shell: bash
        run: |
          if test -n "${OUT:-}" && test -d "$OUT" && compgen -G "$OUT/DREAD-D01-FPS-*.bin" >/dev/null; then
            python3 - "$OUT" <<'PY'
          import sys,zipfile,pathlib
          p=pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(p/"DREAD-D01-FPS-MATRIX.zip","w",zipfile.ZIP_DEFLATED) as z:
              for pattern in ("DREAD-D01-FPS-*.bin","README.txt","SHA256SUMS.txt","bench-*.log","bench-*/*.json"):
                  for f in sorted(p.glob(pattern)):
                      if f.is_file(): z.write(f,f.relative_to(p))
          PY
          else
            echo "::warning::No ROM binaries available: package not published"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DREAD-D01-FPS-MATRIX
          path: ${{ env.OUT }}/DREAD-D01-FPS-MATRIX.zip
          if-no-files-found: warn
