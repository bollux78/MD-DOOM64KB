name: HUD24 R9 geometry arithmetic matrix
on:
  workflow_dispatch:
  push:
    branches: [fullscreen]
    paths:
      - '.github/workflows/hud-r9-matrix.yml'

permissions:
  contents: read

jobs:
  r9-matrix:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    steps:
      - name: Checkout controlled HUD source
        uses: actions/checkout@v4
        with:
          ref: hud
      - name: Verify CachyOS toolchain
        shell: bash
        run: |
          command -v fish
          command -v python3
          test -x "$HOME/mars/m68k-elf/bin/m68k-elf-gcc"
          test -f "$HOME/mars/m68k-elf/lib/libmd.a"
      - name: Test exact arithmetic and build four ROMs
        shell: bash
        run: fish scripts/lab/build_r9_matrix.fish
      - name: Upload four R9 ROMs with disassembly
        uses: actions/upload-artifact@v4
        with:
          name: doom-md-hud-r9-four-roms
          path: |
            dist/r9/*.bin
            dist/r9/*.elf
            dist/r9/*.log
            dist/r9/*.txt
          if-no-files-found: error
          retention-days: 30
