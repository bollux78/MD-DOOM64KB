name: R47 plane-pair hard-hang diagnostics

on:
  push:
    branches: [r47-pair-diagnostic]
    paths:
      - '.github/workflows/r47-pair-diagnostic.yml'
      - 'src/r22_video.inc'
      - 'src/r22_pixel4.h'
      - 'src/r35_native4.inc'
      - 'scripts/lab/build_r35_linear.fish'
  workflow_dispatch:

concurrency:
  group: r47-pair-diagnostic
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pair-diagnostic:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Check tools
        shell: bash
        run: |
          set -euo pipefail
          command -v fish
          command -v python3
          command -v cc
          test -x "$HOME/mars/m68k-elf/bin/m68k-elf-size"
          test -x "$HOME/mars/m68k-elf/bin/m68k-elf-nm"
          test -x "$HOME/mars/m68k-elf/bin/m68k-elf-objdump"

      - name: Pair host oracles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/r47-pair-diag
          python3 scripts/lab/test_r47a_plane_pair.py | tee dist/r47-pair-diag/ORACLE-plane-pair.txt
          python3 scripts/lab/r47b_vdp_oracle.py --frames 48 --out dist/r47-pair-diag/ORACLE-vdp.json

      - name: Restore pinned E1M1 VGM
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,lzma,pathlib
          p=pathlib.Path('assets/r18-e1m1.vgm.xz')
          data=lzma.decompress(p.read_bytes())
          assert hashlib.sha256(data).hexdigest()=='64a7a0748953a4bd35b75735b9f4b7c1c89c0f3f4aa43395485cadd7e88a8226'
          pathlib.Path('res/e1m1.vgm').write_bytes(data)
          PY

      - name: Verify or recover Doom shareware WAD
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,gzip,os,pathlib,shutil,urllib.request
          target=pathlib.Path('scripts/doom1.wad')
          target.parent.mkdir(parents=True,exist_ok=True)
          expected='1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771'
          expected_size=4196020
          home=pathlib.Path.home()
          candidates=[target,home/'Projetos/doom-assets/doom1.wad',home/'Projetos/doom-assets/DOOM1.WAD',home/'Downloads/doom1.wad']
          for top in (home/'Projetos',home/'Games',home/'Jogos'):
              if not top.is_dir(): continue
              depth=len(top.parts)
              for directory,subdirs,names in os.walk(top,followlinks=False):
                  if len(pathlib.Path(directory).parts)-depth>4:
                      subdirs[:]=[]; continue
                  subdirs[:]=[x for x in subdirs if not x.startswith('.')]
                  for name in names:
                      if name.lower()=='doom1.wad': candidates.append(pathlib.Path(directory)/name)
          for p in candidates:
              if not p.is_file(): continue
              raw=p.read_bytes()
              if len(raw)==expected_size and hashlib.sha256(raw).hexdigest()==expected:
                  if p.resolve()!=target.resolve(): shutil.copyfile(p,target)
                  print('Verified WAD from',p); break
          else:
              mirrors=[
                ('ibiblio','https://distro.ibiblio.org/slitaz/sources/packages/d/doom1.wad',False),
                ('archive','https://archive.org/download/wadarchive/DATA/5b.zip/5b%2F2e249b9c5133ec987b3ea77596381dc0d6bc1d%2F5b2e249b9c5133ec987b3ea77596381dc0d6bc1d.wad.gz',True),
                ('aikernel','https://aikernel.net/demo/doom/DOOM1.WAD',False)]
              for name,url,compressed in mirrors:
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'MD-DOOM64KB pair diagnostic'})
                      with urllib.request.urlopen(req,timeout=65) as response: raw=response.read(9_000_000)
                      if compressed: raw=gzip.decompress(raw)
                      if len(raw)==expected_size and hashlib.sha256(raw).hexdigest()==expected:
                          target.write_bytes(raw); print('Recovered WAD from',name); break
                  except Exception as e: print('mirror failed',name,str(e)[:100])
              else: raise SystemExit('Pinned shareware WAD unavailable')
          assert hashlib.sha256(target.read_bytes()).hexdigest()==expected
          PY

      - name: Build Pair isolation ROMs
        shell: bash
        run: |
          set -euo pipefail
          D=dist/r47-pair-diag
          mkdir -p "$D"
          export DOOM_R20_BGM_VGM="$GITHUB_WORKSPACE/res/e1m1.vgm"
          p4 () {
            local id="$1"; shift
            echo "===== $id ====="
            env DOOM_R35D_CHECKER=1 DOOM_R39C_VARIANT=mall \
                DOOM_R39D_DITHER_TOGGLE=0 DOOM_R39E_AUDIO_TOGGLES=1 \
                DOOM_R40_STAGE1=fast DOOM_R42_WALL_ASM=1 DOOM_R45_VARIANT=asm \
                DOOM_R20_BGM_VGM="$DOOM_R20_BGM_VGM" "$@" \
                fish scripts/lab/build_r35_linear.fish pixel4-perf
            cp -f "dist/r35/doom-md-r47-$id.bin" "$D/"
            cp -f "dist/r35/doom-md-r47-$id.elf" "$D/"
            cp -f "dist/r35/flags-doom-md-r47-$id.txt" "$D/"
            "$HOME/mars/m68k-elf/bin/m68k-elf-size" -A "dist/r35/doom-md-r47-$id.elf" > "$D/size-$id.txt"
            "$HOME/mars/m68k-elf/bin/m68k-elf-nm" -S -n "dist/r35/doom-md-r47-$id.elf" \
              | grep -E 'r22_fb|r40b_native_bits|r22_map|_bend|__stack|heap|openings' > "$D/symbols-$id.txt" || true
          }

          # Known-good non-pair control from the user's benchmark family.
          p4 pd-goodfs DOOM_R47_FLAT_HOIST=1 DOOM_R47_SPRITE_HOIST=1 DOOM_R47_BUILD=pd-goodfs

          # Exact failing architecture, unchanged: reproducer/control.
          p4 pd-cur DOOM_R47_PLANE_PAIR=1 DOOM_R47_BUILD=pd-cur

          # P0: same Pair renderer/BSS/VRAM init, but zero per-frame map uploads.
          p4 pd-noup DOOM_R47_PLANE_PAIR=1 DOOM_R47_PAIR_NO_UPLOAD=1 DOOM_R47_BUILD=pd-noup

          # P1: manual DMA only to Plane A. If it works, B/second transfer is implicated.
          p4 pd-a DOOM_R47_PLANE_PAIR=1 DOOM_R47_PAIR_A_ONLY=1 DOOM_R47_BUILD=pd-a

          # P2: both planes copied by CPU, no VDP memory DMA for Pair maps.
          p4 pd-cpu DOOM_R47_PLANE_PAIR=1 DOOM_R47_PAIR_CPU_COPY=1 DOOM_R47_BUILD=pd-cpu

          # P3: both planes use SGDK's DMA_doDma, including its bank-boundary handling.
          p4 pd-sdk DOOM_R47_PLANE_PAIR=1 DOOM_R47_PAIR_SGDK_DMA=1 DOOM_R47_BUILD=pd-sdk

          # P4/P5: return 256/512 B of static Doom zone to SGDK pre-main heap.
          # If these boot, the hard hang is pre-main SGDK/font unpack pressure.
          p4 pd-br256 DOOM_R47_PLANE_PAIR=1 DOOM_R47_PAIR_BOOT_RESERVE=256 DOOM_R47_BUILD=pd-br256
          p4 pd-br512 DOOM_R47_PLANE_PAIR=1 DOOM_R47_PAIR_BOOT_RESERVE=512 DOOM_R47_BUILD=pd-br512

      - name: Compare ELF RAM layout
        shell: bash
        run: |
          set -euo pipefail
          D=dist/r47-pair-diag
          {
            echo 'R47 Pair ELF RAM/layout comparison'
            echo
            for f in "$D"/size-*.txt; do
              echo "===== $(basename "$f") ====="
              cat "$f"
            done
            echo
            for f in "$D"/symbols-*.txt; do
              echo "===== $(basename "$f") ====="
              cat "$f"
            done
          } > "$D/RAM-LAYOUT.txt"
          cat "$D/RAM-LAYOUT.txt"

      - name: BlastEm isolation smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,shutil,subprocess,time
          d=Path('dist/r47-pair-diag').resolve()
          exe=shutil.which('blastem') or next((str(p) for p in (Path.home()/'Projetos').glob('**/blastem') if p.is_file() and os.access(p,os.X_OK)),None)
          out=[]
          if not exe:
              out.append('BlastEm not found on runner; smoke skipped')
          else:
              env=os.environ.copy(); env.update(SDL_AUDIODRIVER='dummy',SDL_VIDEODRIVER='dummy')
              ids=['pd-goodfs','pd-cur','pd-noup','pd-a','pd-cpu','pd-sdk','pd-br256','pd-br512']
              for ident in ids:
                  rom=d/f'doom-md-r47-{ident}.bin'
                  t=time.monotonic()
                  try:
                      p=subprocess.run([exe,'-b','800',str(rom)],cwd=d,env=env,
                          stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,errors='replace',timeout=45)
                      dt=time.monotonic()-t
                      line=f'{ident}: return={p.returncode} wall={dt:.2f}s tail={p.stdout[-160:].replace(chr(10)," ")}'
                  except subprocess.TimeoutExpired as e:
                      dt=time.monotonic()-t
                      line=f'{ident}: TIMEOUT/HANG after {dt:.2f}s'
                  print(line,flush=True); out.append(line)
          (d/'BLASTEM-SMOKE.txt').write_text('\n'.join(out)+'\n')
          PY

      - name: Write test order
        if: always()
        shell: bash
        run: |
          cat > dist/r47-pair-diag/README-PAIR-DIAG.txt <<'EOF'
          R47 PLANE-PAIR HARD-HANG DIAGNOSTIC
          ===================================
          User evidence: every build containing DOOM_R47_PLANE_PAIR hangs BlastEm;
          flat/sprite/flat+sprite without Pair complete DEMO3.

          Test in this order:
          1. pd-noup  - Pair memory/init/render path, but no per-frame map transfer.
          2. pd-a     - original manual DMA, Plane A only.
          3. pd-cpu   - both Pair planes, CPU VRAM copy instead of VDP memory DMA.
          4. pd-sdk   - both Pair planes through SGDK DMA_doDma.
          5. pd-br256 - original Pair with 256 B returned to SGDK boot heap.
          6. pd-br512 - original Pair with 512 B returned to SGDK boot heap.
          7. pd-cur   - exact original failing Pair transfer, reproducer.
          8. pd-goodfs - non-Pair known-good control.

          Interpretation:
          - noupload hangs: fault precedes Pair map DMA (WRAM/init/renderer/transition).
          - noupload works, aonly hangs: first/manual DMA source or command is suspect.
          - aonly works, current hangs: Plane B/second transfer/dual-plane interaction.
          - cpucopy works, DMA variants hang: VDP memory-DMA path is implicated.
          - sgdkdma works, current hangs: our raw DMA sequence is implicated.
          - br256/br512 boot while current/noupload hang: pre-main SGDK heap is the cause.
          EOF

      - name: Upload Pair diagnostic lab
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: doom-md-r47-pair-hard-hang-diagnostic
          path: dist/r47-pair-diag/
          retention-days: 90
          if-no-files-found: error
