name: R56 Cláudio Werk Dual-Color Tiles PLAY PERF

on:
  push:
    branches: [r56-claudio-werk-dual-color-lab]
    paths:
      - '.github/workflows/r56-claudio-werk-dual-color.yml'
      - 'src/r22_video.inc'
      - 'src/r22_benchmark.inc'
      - 'src/r22_pixel4.h'
      - 'src/r35_native4.inc'
      - 'scripts/lab/test_r48_pair_v.py'
      - 'scripts/lab/gen_r49_colormix.py'
      - 'scripts/lab/gen_r52_ab.py'
      - 'scripts/lab/gen_r52_claudio.py'
      - 'scripts/lab/r55_werk_snapshot.py'
      - 'scripts/lab/r56_claudio_snapshot.py'
      - 'scripts/lab/r56_claudio_a4_snapshot.py'
      - 'scripts/lab/test_r56_dual_color.py'
      - 'scripts/lab/test_r53_micro.py'
      - 'scripts/lab/test_r52_claudio.py'
      - 'scripts/lab/test_r49_colormix.py'
      - 'scripts/lab/build_r35_linear.fish'
      - 'scripts/build_silent.fish'
      - 'scripts/set_rom_identity.py'
      - 'src/d_main.c'
      - 'src/d_main.h'
      - 'src/g_game.c'
      - 'src/i_system.h'
      - 'src/m_text.c'
      - 'src/i_genesis.c'
      - 'src/r_draw.c'
      - 'scripts/lab/gen_r52_ab.py'
  workflow_dispatch:

concurrency:
  group: r56-claudio-werk-dual-color-lab
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-profile:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6

      - name: Preflight fish scripts syntax
        shell: bash
        run: |
          set -euo pipefail
          fish -n scripts/build_silent.fish
          fish -n scripts/lab/build_r35_linear.fish
          echo 'fish syntax PASS'

      - name: Toolchain and Pair-H oracle
        shell: bash
        run: |
          set -euo pipefail
          command -v fish
          command -v python3
          test -x "$HOME/mars/m68k-elf/bin/m68k-elf-size"
          test -x "$HOME/mars/m68k-elf/bin/m68k-elf-nm"
          mkdir -p dist/r56-dual
          python3 scripts/lab/test_r47a_plane_pair.py | tee dist/r56-dual/ORACLE-plane-pair.txt
          python3 scripts/lab/test_r48_pair_v.py | tee dist/r56-dual/ORACLE-pair-v.txt
          python3 scripts/lab/r47b_vdp_oracle.py --frames 48 --out dist/r56-dual/ORACLE-vdp.json

      - name: Restore pinned E1M1 VGM
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,lzma,pathlib
          p=pathlib.Path('assets/r18-e1m1.vgm.xz')
          data=lzma.decompress(p.read_bytes())
          assert hashlib.sha256(data).hexdigest()=='64a7a0748953a4bd35b75735b9f4b7c1c89c0f3f4aa43395485cadd7e88a8226'
          pathlib.Path('res/e1m1.vgm').write_bytes(data)
          PY

      - name: Verify or recover Doom shareware WAD
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,gzip,os,pathlib,shutil,urllib.request
          target=pathlib.Path('scripts/doom1.wad')
          target.parent.mkdir(parents=True,exist_ok=True)
          expected='1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771'
          expected_size=4196020
          home=pathlib.Path.home()
          candidates=[target,home/'Projetos/doom-assets/doom1.wad',home/'Projetos/doom-assets/DOOM1.WAD',home/'Downloads/doom1.wad']
          for top in (home/'Projetos',home/'Games',home/'Jogos'):
              if not top.is_dir(): continue
              depth=len(top.parts)
              for directory,subdirs,names in os.walk(top,followlinks=False):
                  if len(pathlib.Path(directory).parts)-depth>4:
                      subdirs[:]=[]; continue
                  subdirs[:]=[x for x in subdirs if not x.startswith('.')]
                  for name in names:
                      if name.lower()=='doom1.wad': candidates.append(pathlib.Path(directory)/name)
          for p in candidates:
              if not p.is_file(): continue
              raw=p.read_bytes()
              if len(raw)==expected_size and hashlib.sha256(raw).hexdigest()==expected:
                  if p.resolve()!=target.resolve(): shutil.copyfile(p,target)
                  print('Verified WAD from',p); break
          else:
              mirrors=[
                ('archive','https://archive.org/download/wadarchive/DATA/5b.zip/5b%2F2e249b9c5133ec987b3ea77596381dc0d6bc1d%2F5b2e249b9c5133ec987b3ea77596381dc0d6bc1d.wad.gz',True),
                ('aikernel','https://aikernel.net/demo/doom/DOOM1.WAD',False)]
              for name,url,compressed in mirrors:
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'MD-DOOM64KB pair boot fix'})
                      with urllib.request.urlopen(req,timeout=65) as response: raw=response.read(9_000_000)
                      if compressed: raw=gzip.decompress(raw)
                      if len(raw)==expected_size and hashlib.sha256(raw).hexdigest()==expected:
                          target.write_bytes(raw); print('Recovered WAD from',name); break
                  except Exception as e: print('mirror failed',name,str(e)[:100])
              else: raise SystemExit('Pinned shareware WAD unavailable')
          assert hashlib.sha256(target.read_bytes()).hexdigest()==expected
          PY

      - name: Preflight ColorMix source tables and fidelity oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/r56-dual
          python3 scripts/lab/gen_r22_pixel4.py
          python3 scripts/lab/gen_r49_colormix.py | tee dist/r56-dual/PREFLIGHT-generator.txt
          python3 scripts/lab/test_r49_colormix.py | tee dist/r56-dual/PREFLIGHT-color-oracle.txt
          cp src/r49_colormix_report.json dist/r56-dual/PREFLIGHT-color-report.json

      - name: Ensure NumPy for Cláudio palettes and microdither
        shell: bash
        run: |
          set -euo pipefail
          if python3 -c 'import numpy;print("numpy",numpy.__version__)'; then
            echo 'NumPy ready'
          else
            python3 -m venv "$RUNNER_TEMP/r53-venv"
            "$RUNNER_TEMP/r53-venv/bin/python3" -m pip install --disable-pip-version-check 'numpy>=2.2,<3'
            echo "$RUNNER_TEMP/r53-venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Validate Werk offline palette snapshots
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/lab/r55_werk_snapshot.py
          python3 scripts/lab/gen_r52_claudio.py --repo . --out src --mode luma32 --zero-policy forbid --no-preview
          python3 scripts/lab/test_r52_claudio.py src .
          for kind in a4 a6; do
            python3 scripts/lab/r55_werk_snapshot.py --variant "$kind" --repo . --out src
            cp src/r52_ab_tables.h "dist/r56-dual/WORK-$kind.h"
          done

      - name: Verify Cláudio A4 and A6 tables and Pair-V geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lab/r56_claudio_a4_snapshot.py --out src/r56_tables.h
          python3 scripts/lab/test_r56_dual_color.py src/r56_tables.h | tee dist/r56-dual/R56-A4-PREFLIGHT.txt
          cp src/r56_tables.h dist/r56-dual/PALETTES-r56-a4-mixed.h
          python3 scripts/lab/r56_claudio_snapshot.py --out src/r56_tables.h
          python3 scripts/lab/test_r56_dual_color.py src/r56_tables.h | tee dist/r56-dual/R56-A6-PREFLIGHT.txt
          cp src/r56_tables.h dist/r56-dual/PALETTES-r56-a6-mixed.h

      - name: Build Cláudio A4 and A6 mixed PLAY and PERF ROMs
        shell: bash
        run: |
          set -euo pipefail
          D=dist/r56-dual
          mkdir -p "$D"
          export DOOM_R20_BGM_VGM="$GITHUB_WORKSPACE/res/e1m1.vgm"
          for prof in a4 a6; do
            for mode in play perf; do
              bench=0
              if [ "$mode" = play ]; then bench=1; fi
              id="${prof}m-$mode"
            echo "=========== R56 $id ==========="
            env -u DOOM_R53_MICRO_RATIO -u DOOM_R55_WERK_VARIANT \
              DOOM_R35D_CHECKER=1 DOOM_R39C_VARIANT=mall \
              DOOM_R39D_DITHER_TOGGLE=0 DOOM_R39E_AUDIO_TOGGLES=1 \
              DOOM_R40_STAGE1=fast DOOM_R42_WALL_ASM=1 DOOM_R45_VARIANT=asm \
              DOOM_R47_PLANE_PAIR=1 DOOM_R47_FLAT_HOIST=1 \
              DOOM_R47_SPRITE_HOIST=1 DOOM_R48_PAIR_V=1 DOOM_R48_V_FAST=1 \
              DOOM_R49_COLORMIX=0 DOOM_R49_COMPLUT=0 DOOM_R49_RATIO=none \
              DOOM_R52_AB=1 DOOM_R52_CLAUDIO=1 DOOM_R52_AB_PROFILE=luma32 \
              DOOM_R52_ZERO_POLICY=forbid DOOM_R52_CPLUT=1 \
              DOOM_R56_DUAL_COLOR=1 DOOM_R56_CLAUDIO_PROFILE="$prof" DOOM_R56_BUILD="$id" \
              DOOM_R50_PLAY_BENCH="$bench" DOOM_R50_MENU_FREEZE="$bench" \
              DOOM_R50_STATIC_MENU="$bench" DOOM_R50_HARD_REINIT="$bench" \
              DOOM_R50_RESET_SRAM=0 DOOM_R51_HW_WEAPON=0 DOOM_R51_NO_PSPRITE=0 \
              DOOM_R20_BGM_VGM="$DOOM_R20_BGM_VGM" \
              fish scripts/lab/build_r35_linear.fish "pixel4-$mode"
            path="dist/r35/doom-md-r56-$id"
            cp "$path.bin" "$D/"
            cp "dist/r35/flags-doom-md-r56-$id.txt" "$D/"
            cp src/r56_tables.h "$D/PALETTES-$id.h"
            "$HOME/mars/m68k-elf/bin/m68k-elf-size" -A "$path.elf" > "$D/size-$id.txt"
            done
          done

      - name: ROM identity and R56 invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          d=pathlib.Path('dist/r56-dual')
          roms=sorted(d.glob('*.bin'))
          assert len(roms)==4,[x.name for x in roms]
          for p in roms:
            b=p.read_bytes()
            assert 2*1024*1024<len(b)<=4*1024*1024,(p.name,len(b))
            print('VALID',p.name,len(b),b[0x120:0x150].decode('latin1',errors='replace'))
          PY
          python3 scripts/lab/test_r56_dual_color.py src/r56_tables.h

      - name: BlastEm 800-frame boot smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,shutil,subprocess,time
          d=pathlib.Path('dist/r56-dual').resolve()
          exe=shutil.which('blastem') or next((str(p) for p in
              (pathlib.Path.home()/'Projetos').glob('**/blastem')
              if p.is_file() and os.access(p,os.X_OK)),None)
          assert exe,'BlastEm unavailable'
          env=os.environ.copy()
          env.update(SDL_AUDIODRIVER='dummy',SDL_VIDEODRIVER='dummy')
          rows=[]
          for rom in sorted(d.glob('*.bin')):
            t=time.monotonic()
            r=subprocess.run([exe,'-b','800',str(rom)],cwd=d,env=env,
                capture_output=True,text=True,errors='replace',timeout=45)
            msg=f'{rom.name} exit={r.returncode} wall={time.monotonic()-t:.2f}s'
            print(msg,flush=True);rows.append(msg)
            if r.returncode: raise SystemExit(msg+'\n'+r.stdout+r.stderr)
          assert len(rows)==4
          (d/'BLASTEM-SMOKE.txt').write_text('\n'.join(rows)+'\n')
          PY

      - name: Hardware comparison instructions
        shell: bash
        run: |
          cat > dist/r56-dual/README-CRT.txt <<'EOF'
          R56 CLAUDIO+WERK A4/A6 MIXED: isolated dual-color Pair-V experiments.
          Four ROMs: A4/A6 each PLAY (fast START menu) and PERF (DEMO3 benchmark).
          R56 tiles: PAL0 ABABTTTT and PAL1 TTTTCDCD (both use left half,
          VDP shifts plane B right by 4 pixels). Pair codes != CRAM indices.
          Wall/sprites: r56_wall_even/odd with precomposed COLORMAP.
          Flats: r56_flat_even/odd use shared solid Werk anchors 1..6.
          Compare to existing R53 microdither 25%, R55 Werk A4/A6 and
          Cláudio/Werk offline previews. Test blue floor, gray ceiling,
          walls with brown/red and green gradients, gun, HUD, START menus.
          Offline metric and BlastEm boot do not certify CRT appearance.
          EOF

      - name: Upload R56 dual-color ROMs
        uses: actions/upload-artifact@v6
        with:
          name: doom-md-r56-claudio-werk-a4-a6-mixed-play-perf
          path: dist/r56-dual/
          retention-days: 90
          if-no-files-found: error
