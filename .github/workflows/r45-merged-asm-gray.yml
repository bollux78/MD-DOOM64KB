name: R45 - R39f plus R44 ASM and optional R43 gray
on:
  push:
    branches: [r45-merged-asm-gray-controls]
  workflow_dispatch:
concurrency:
  group: r45-merged-asm-gray-controls
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v6
      - name: Restore pinned XGM2 soundtrack input
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,lzma,pathlib
          data=lzma.decompress(pathlib.Path('assets/r18-e1m1.vgm.xz').read_bytes())
          assert hashlib.sha256(data).hexdigest()=='64a7a0748953a4bd35b75735b9f4b7c1c89c0f3f4aa43395485cadd7e88a8226'
          pathlib.Path('res/e1m1.vgm').write_bytes(data)
          PY
      - name: Recover pinned shareware DOOM1.WAD (not committed)
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip,hashlib,pathlib,urllib.request
          target=pathlib.Path('scripts/doom1.wad')
          expected_sha='1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771'
          size=4196020
          candidates=[
              ('ibiblio', 'https://distro.ibiblio.org/slitaz/sources/packages/d/doom1.wad',False),
              ('wad-archive', 'https://archive.org/download/wadarchive/DATA/5b.zip/5b%2F2e249b9c5133ec987b3ea77596381dc0d6bc1d%2F5b2e249b9c5133ec987b3ea77596381dc0d6bc1d.wad.gz',True),
              ('shareware-demo', 'https://aikernel.net/demo/doom/DOOM1.WAD',False)
          ]
          if target.is_file():
              b=target.read_bytes()
              if len(b)==size and hashlib.sha256(b).hexdigest()==expected_sha:
                  print('Verified pinned shareware WAD already present:',target)
                  raise SystemExit(0)
          for name,url,compressed in candidates:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'MD-DOOM64KB R31 build asset verifier/1.0'})
                  with urllib.request.urlopen(req,timeout=70) as response:
                      data=response.read(9000000)
                  if compressed:data=gzip.decompress(data)
                  sha=hashlib.sha256(data).hexdigest()
                  if len(data)!=size or sha!=expected_sha:
                      print(name,'unexpected content or checksum; rejecting',
                            len(data),sha)
                      continue
                  target.write_bytes(data)
                  print('Verified original shareware v1.9 from',name,
                        'size',len(data),'SHA256',sha)
                  break
              except Exception as e:
                  print('Shareware mirror unavailable:',name,str(e)[:200])
          else:
              print('Pinned Doom shareware download failed; original preflight will look for local source.')
          PY
      - name: Preflight - find authentic Doom DMX sounds on self-hosted runner
        shell: bash
        run: |
          mkdir -p dist/r35
          python3 - <<'PY'
          import pathlib,os,struct,hashlib,sys
          home=pathlib.Path.home()
          candidates=[
              pathlib.Path('scripts/doom1.wad'),
              home/'Projetos/doom-assets/doom1.wad',
              home/'Projetos/doom-assets/DOOM1.WAD',
              home/'Projetos/doom-assets/doom1.WAD',
              home/'Jogos/doom1.wad',
              home/'Games/doom1.wad',
              home/'Downloads/doom1.wad'
          ]
          # No external network or repo commit for copyright-protected WAD.
          for top in (home/'Projetos',home/'Games',home/'Jogos'):
              if not top.is_dir():continue
              root_depth=len(top.parts)
              for directory,subdirs,names in os.walk(top,followlinks=False):
                  if len(pathlib.Path(directory).parts)-root_depth>4:
                      subdirs[:]=[]
                      continue
                  subdirs[:]=[s for s in subdirs if not s.startswith('.')]
                  for n in names:
                      if n.lower()=='doom1.wad':
                          candidates.append(pathlib.Path(directory)/n)
          for f in candidates:
              if not f.is_file():continue
              try:
                  with f.open('rb') as fd:
                      h=fd.read(12)
                      if len(h)!=12 or h[:4] not in (b'IWAD',b'PWAD'):continue
                      count,offset=struct.unpack_from('<II',h,4)
                      if not 100<count<10000:continue
                      fd.seek(offset)
                      directory=fd.read(count*16)
                  sounds={directory[i+8:i+16].split(b'\0')[0]
                          for i in range(0,len(directory),16)}
                  if not {b'DSPISTOL',b'DSSHOTGN',b'DSOROPN'}.intersection(sounds):
                      continue
                  raw=f.read_bytes()
                  dest=pathlib.Path('scripts/doom1.wad')
                  if f.resolve()!=dest.resolve():dest.write_bytes(raw)
                  sha=hashlib.sha256(raw).hexdigest()
                  (pathlib.Path('dist/r35')/'SOURCE-STATUS.txt').write_text(
                      f'Genuine WAD source found: {str(f)}\nSHA256: {sha}\nBytes: {len(raw)}\n')
                  print('SFX input:',f,'bytes',len(raw),'SHA256',sha)
                  sys.exit(0)
              except (OSError,struct.error):continue
          status=('MISSING: authentic scripts/doom1.wad (DS* lumps) not found on runner.\n'
                  'Place your own doom1.wad in ~/Projetos/doom-assets/doom1.wad\n'
                  'No synthetic or silent SFX fallback is allowed for R31 PCM builds.\n')
          pathlib.Path('dist/r35/SOURCE-STATUS.txt').write_text(status)
          print(status,file=sys.stderr)
          sys.exit(3)
          PY
      - name: Verify R31 generator and build scripts
        shell: bash
        run: |
          fish -n scripts/lab/build_r35_linear.fish
          fish -n scripts/build_silent.fish
          python3 -m py_compile scripts/lab/gen_r31_sfx.py scripts/lab/gen_r30_native.py \
            scripts/lab/finish_r35_rom.py scripts/lab/audit_r35.py
          python3 scripts/lab/test_r25_music.py
          python3 scripts/lab/test_r27_group.py
          python3 - <<'PY'
          import importlib.util,struct
          spec=importlib.util.spec_from_file_location('sfx','scripts/lab/gen_r31_sfx.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          source=bytes((128+(i%20)) for i in range(11025))
          lump=struct.pack('<HHI',3,11025,len(source))+source
          low,*_=m.convert(lump,6650)
          high,*_=m.convert(lump,13300)
          assert len(low)%256==len(high)%256==0
          assert len(low)<len(high)
          assert len(m.SFX)==52
          print('R31 rate conversion, alignment, SFX enum count: OK')
          PY
          test -f ~/mars/m68k-elf/lib/libmd.a
          test -f ~/mars/m68k-elf/inc/snd/xgm2.h
      - name: Source and C-wall reference checks
        shell: bash
        run: |
          fish -n scripts/lab/build_r35_linear.fish
          fish -n scripts/build_silent.fish
          python3 -m py_compile scripts/gen_colormap_cells.py scripts/lab/gen_r43_gray.py scripts/lab/test_r42_wall.py scripts/lab/test_r44_intermission_layout.py
          python3 scripts/lab/test_r44_intermission_layout.py
          python3 scripts/lab/test_r22_pixel4.py
          python3 scripts/lab/test_r42_wall.py
          python3 scripts/lab/gen_r22_pixel4.py
          python3 scripts/lab/gen_r43_gray.py
          python3 - <<'PY'
          from pathlib import Path
          v=Path('src/i_genesisv.c').read_text()
          w=Path('src/r22_video.inc').read_text()
          wi=Path('src/wi_libt.c').read_text()
          d=Path('src/r39f_dither.h').read_text()
          assert 'r39f_colormap_cells_vertical' in v and 'index = 121;' in v
          assert 'R39F_SetDitherMode' in v and 'R39F_VERTICAL' in d
          assert 'r40b_native_prev' in w and 'R40B_PruneNativeText' in w
          assert 'R42_DrawPackedWall' in w and 'DOOM_R42_WALL_ASM' in w
          assert '#include "r43_gray_palette.h"' in w
          assert 'WI_TEXT_WIDTH 38' in wi and 'WI_TEXT_HEIGHT 22' in wi
          report=Path('src/r43_gray_palette_report.txt').read_text()
          print(report)
          print('R45 sources: 8x8 tri-dither, 4x4 R44 ASM/intermission, R43 gray optional verified')
          PY
      - name: Build six independent R45 regression and CRT comparison ROMs
        shell: bash
        run: |
          mkdir -p dist/r35
          for spec in 'cell cell-perf' 'cell cell-play' 'asm pixel4-perf' 'asm pixel4-play' 'gray pixel4-perf' 'gray pixel4-play'; do
            read -r mode variant <<< "$spec"
            if [[ "$mode" == cell ]]; then cell=1; pixel=0; asm=0; gray=0
            elif [[ "$mode" == asm ]]; then cell=0; pixel=1; asm=1; gray=0
            else cell=0; pixel=1; asm=1; gray=1; fi
            echo "=== R45 $mode $variant ==="
            env DOOM_R35D_CHECKER="$cell" DOOM_R37_BSP_PROFILE=0 DOOM_R38_TIME_PROFILE=0 DOOM_R39C_VARIANT=mall DOOM_R39D_DITHER_TOGGLE="$cell" DOOM_R39E_AUDIO_TOGGLES=1 DOOM_R39F_DITHER3="$cell" DOOM_R42_WALL_ASM="$asm" DOOM_R43_GRAY_CRT="$gray" DOOM_R40_STAGE1=fast DOOM_R45_VARIANT="$mode" DOOM_R20_BGM_VGM="$GITHUB_WORKSPACE/res/e1m1.vgm" fish scripts/lab/build_r35_linear.fish "$variant"
            if [[ "$mode" == cell ]]; then stem="doom-md-r45-$variant"; else
              if [[ "$variant" == pixel4-perf ]]; then suffix=p4perf; else suffix=p4play; fi
              stem="doom-md-r45-$mode-$suffix"
            fi
            test -s "dist/r35/$stem.bin"
            if [[ "$mode" == cell ]]; then
              cp src/colormap_cells.h "dist/r35/colormap-$stem.h"
              cp src/r20_colorcell.h "dist/r35/colorcell-$stem.h"
            fi
          done
          cp src/r43_gray_palette_report.txt dist/r35/R45-GRAY-COLOR-REPORT.txt
          cp src/r43_gray_palette.h dist/r35/R45-GRAY-COLOR-TABLES.h
      - name: Audit ROM identity, real sizes, 8x8/4x4 feature gates
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,struct,json,zipfile,re
          root=pathlib.Path('dist/r35')
          specs=[('cell','cell-perf'),('cell','cell-play'),('asm','pixel4-perf'),('asm','pixel4-play'),('gray','pixel4-perf'),('gray','pixel4-play')]
          entries=[]
          for mode,v in specs:
              stem=f'doom-md-r45-{v}' if mode=='cell' else f'doom-md-r45-{mode}-p4'+('perf' if v.endswith('perf') else 'play')
              raw=(root/(stem+'.bin')).read_bytes()
              flags=set((root/(f'flags-{stem}.txt')).read_text().split())
              assert 0<len(raw)<=4*1024*1024 and len(raw)%0x20000==0,(stem,len(raw))
              assert raw[0x100:0x110]==b'SEGA MEGA DRIVE ',stem
              assert struct.unpack_from('>II',raw,0x1a0)==(0,len(raw)-1),stem
              required={'-DDOOM_R39C_MOVEP_CACHE','-DDOOM_R39C_MOVEP_MAP','-DDOOM_R39E_AUDIO_TOGGLES','-DDOOM_R31_SFX','-DDOOM_R29_XGM2','-DDOOM_R35_ART_RAW'}
              assert required<=flags,(stem,required-flags)
              pixel=mode!='cell'
              assert ('-DDOOM_R22_PIXEL4' in flags)==pixel,stem
              assert ('-DDOOM_R42_WALL_ASM' in flags)==pixel,stem
              assert ('-DDOOM_R43_GRAY_CRT' in flags)==(mode=='gray'),stem
              assert ('-DDOOM_R39F_DITHER3' in flags)==(mode=='cell'),stem
              assert ('-DDOOM_R20_REG_COLUMNS' in flags)==(mode=='cell'),stem
              assert ('-DTIMEDEMO' in flags)==v.endswith('perf'),stem
              if pixel:
                  assert {'-DVIEWWINDOWWIDTH=76','-DVIEWWINDOWHEIGHT=44','-DDOOM_R22_SOLID_TILES'}<=flags,stem
              else:
                  assert {'-DVIEWWINDOWWIDTH=38','-DVIEWWINDOWHEIGHT=22'}<=flags,stem
                  h=(root/('colormap-'+stem+'.h')).read_text()
                  c=(root/('colorcell-'+stem+'.h')).read_text()
                  assert 'r39f_colormap_cells_vertical[32][256]' in h,stem
                  assert 'r39f_colorcell_vertical[256]' in c,stem
              entries.append({'filename':stem+'.bin','bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'renderer':'pixel4 native 76x44' if pixel else 'cell 38x22','palette':'R43 gray' if mode=='gray' else 'original','timedemo':v.endswith('perf'),'runtime_toggle':False})
          (root/'R45-MANIFEST.json').write_text(json.dumps(entries,indent=2)+'\n')
          with zipfile.ZipFile(root/'R45-CONTROLS-6ROMS.zip','w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for e in entries:z.write(root/e['filename'],e['filename'])
              z.write(root/'R45-MANIFEST.json','R45-MANIFEST.json')
              z.write(root/'R45-GRAY-COLOR-REPORT.txt','R45-GRAY-COLOR-REPORT.txt')
              z.write('docs/review-r45/README.md','README-R45.md')
          print(json.dumps(entries,indent=2))
          PY
      - name: BlastEm headless 300-frame boot all six variants
        shell: bash
        run: |
          python3 - <<'PY'
          import os,pathlib,shutil,subprocess
          exe=shutil.which('blastem') or next((str(p) for p in (pathlib.Path.home()/'Projetos').glob('**/blastem') if p.is_file() and os.access(p,os.X_OK)),None)
          assert exe,'BlastEm missing'
          d=pathlib.Path('dist/r35').resolve()
          env=os.environ.copy();env.update(SDL_AUDIODRIVER='dummy',SDL_VIDEODRIVER='dummy')
          for stem in ['doom-md-r45-cell-perf','doom-md-r45-cell-play','doom-md-r45-asm-p4perf','doom-md-r45-asm-p4play','doom-md-r45-gray-p4perf','doom-md-r45-gray-p4play']:
              p=subprocess.run([exe,'-b','300',str(d/(stem+'.bin'))],cwd=d,env=env,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,errors='replace',timeout=45)
              print(stem,p.returncode,p.stdout[-200:],flush=True)
              assert p.returncode==0,stem
          PY
      - name: Upload R45 ROMs and audits
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: doom-md-r45-asm-gray-m0-controls
          path: dist/r35/
          if-no-files-found: warn
          retention-days: 90
