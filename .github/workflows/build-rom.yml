name: Build Doom ROM (local toolchain)
on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: 'Build TIMEDEMO benchmark ROM'
        type: boolean
        required: false
        default: false
      routine_profiler:
        description: 'TIMEDEMO 4.0: renderer routine sampling'
        type: boolean
        required: false
        default: false
      profiler:
        description: 'TIMEDEMO 3.0: per-stage VBlank profiling'
        type: boolean
        required: false
        default: false

jobs:
  rom:
    # Only run trusted, manually dispatched code on the personal machine.
    runs-on: [self-hosted, linux, x64, doom-md]
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Check prerequisites
        shell: bash
        run: |
          command -v fish
          command -v python3
          command -v java
          test -x "$HOME/mars/m68k-elf/bin/m68k-elf-gcc"
          test -f "$HOME/mars/m68k-elf/lib/libmd.a"
      - name: Compile ROM
        shell: bash
        env:
          DOOM_TIMEDEMO: ${{ (inputs.benchmark || inputs.profiler || inputs.routine_profiler) && '1' || '0' }}
          DOOM_ROUTINE_PROFILE: ${{ inputs.routine_profiler && '1' || '0' }}
          DOOM_PROFILE: ${{ inputs.profiler && '1' || '0' }}
        run: fish scripts/build_silent.fish
      - name: Upload ROM
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.routine_profiler && 'doom-md-routine-profiler-rom' || (inputs.profiler && 'doom-md-profiler-rom' || (inputs.benchmark && 'doom-md-timedemo-rom' || 'doom-md-silent-rom')) }}
          path: out/rom.bin
          if-no-files-found: error
