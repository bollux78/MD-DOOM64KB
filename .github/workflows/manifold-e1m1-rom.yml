            timeout 60s env SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=dummy TERM=dumb stdbuf -oL -eL "$emu" -b 600 "$r" </dev/null 2>&1 | head -30
            echo "rc=${PIPESTATUS[0]}"
            echo "-- debugger transcript:"; head -40 "$BLASTEM_DBG_LOG"
          done
      - name: MAME trace + snapshots (megadriv, headless)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          shots="$RUNNER_TEMP/manifold-shots-$GITHUB_RUN_ID"
          mkdir -p "$shots/snap"
          echo "SHOTS_DIR=$shots" >> "$GITHUB_ENV"
          cat > "$shots/trace.lua" <<'LUA'
          local frame = 0
          local cpu = manager.machine.devices[":maincpu"]
          local scr = nil
          for k,v in pairs(manager.machine.screens) do scr = v end
          local pfx = os.getenv("SNAP_PREFIX") or "x"
          emu.register_frame_done(function()
            frame = frame + 1
            if frame % 30 == 0 or frame < 4 then
              local st = cpu.state
              local function g(n) local r = st[n]; if r then return r.value else return -1 end end
              local extra = ""
              local mem = cpu.spaces["program"]
              for name, addr in string.gmatch(os.getenv("WATCH") or "", "([%w_]+)=(%x+)") do
                local a = tonumber(addr, 16) & 0xFFFFFF
                extra = extra .. string.format(" %s=%08X", name, mem:read_u32(a))
              end
              print(string.format("%s F%04d PC=%06X SR=%04X SP=%08X D0=%08X A0=%08X%s",
                pfx, frame, g("PC"), g("SR"), g("SP"), g("D0"), g("A0"), extra))
            end
            if frame == 2 and pfx == "upstream" then
              for tag, port in pairs(manager.machine.ioport.ports) do
                local names = ""
                for n, f in pairs(port.fields) do names = names .. n .. "|" end
                print("PORT " .. tag .. " " .. names)
              end
            end
            if pfx == "e1m1" then
              local pad = manager.machine.ioport.ports[":ctrl1:mdpad:PAD"]
              if pad then
                for n, f in pairs(pad.fields) do
                  if n == "P1 Up" then f:set_value((frame > 320 and frame < 560) and 1 or 0) end
                  if n == "P1 Right" then f:set_value((frame > 600 and frame < 680) and 1 or 0) end
                  if n == "P1 Left" then f:set_value((frame > 760 and frame < 800) and 1 or 0) end
                end
              end
            end
            if pfx == "upstream" then
              local pad = manager.machine.ioport.ports[":ctrl1:mdpad:PAD"]
              if pad then
                local press = (frame % 90) >= 0 and (frame % 90) < 6 and frame > 150
                for n, f in pairs(pad.fields) do
                  if n == "P1 Start" or n == "Start" or n == "1 Player Start" then f:set_value(press and 1 or 0) end
                end
              end
            end
            if frame == 600 and pfx ~= "upstream" then
              local mem = cpu.spaces["program"]
              for name, addr in string.gmatch(os.getenv("WATCH") or "", "(bmp_buffer_%d)=(%x+)") do
                local ptr = mem:read_u32(tonumber(addr,16) & 0xFFFFFF) & 0xFFFFFF
                local nz, hist = 0, {}
                for i = 0, 128*144-1 do
                  local b = mem:read_u8(ptr + i)
                  if b ~= 0 then nz = nz + 1 end
                  hist[b] = (hist[b] or 0) + 1
                end
                local top = ""
                for k, v in pairs(hist) do if v > 200 then top = top .. string.format("%02X:%d ", k, v) end end
                print(string.format("%s BUF %s @%06X nonzero=%d top=%s", pfx, name, ptr, nz, top))
                local f = io.open(pfx .. "_" .. name .. ".bin", "wb")
                for i = 0, 128*144-1 do f:write(string.char(mem:read_u8(ptr + i))) end
                f:close()
              end
              for tag, dev in pairs(manager.machine.devices) do
                local sp = ""
                for n, _ in pairs(dev.spaces) do sp = sp .. n .. "," end
                if sp ~= "" then print("DEV " .. tag .. " spaces=" .. sp) end
              end
              for tag, sh in pairs(manager.machine.memory.shares) do print("SHARE " .. tag .. " size=" .. sh.size) end
              for tag, rg in pairs(manager.machine.memory.regions) do print("REGION " .. tag .. " size=" .. rg.size) end
              local src = nil
              for tag, sh in pairs(manager.machine.memory.shares) do
                if string.find(tag, "vram") and sh.size >= 0x10000 then src = sh end
              end
              if src then
                local f = io.open(pfx .. "_vram.bin", "wb")
                for i = 0, 0xFFFF do f:write(string.char(src:read_u8(i))) end
                f:close()
                print(pfx .. " VRAM dumped")
                for name, addr in string.gmatch(os.getenv("WATCH") or "", "(regValues)=(%x+)") do
                  local a = tonumber(addr,16) & 0xFFFFFF
                  local r = ""
                  for i = 0, 23 do r = r .. string.format("%02X ", cpu.spaces["program"]:read_u8(a+i)) end
                  print(pfx .. " REGS " .. r)
                end
              end
            end
            if pfx == "m11fixed" or pfx == "m11fogoff" or pfx == "m11cache" then
              if frame == 120 or frame == 330 or frame == 420 or frame == 630 or
                 frame == 720 or frame == 930 or frame == 1020 or frame == 1230 or
                 frame == 1320 or frame == 1530 or frame == 1620 or frame == 1830 then
                local addr = string.match(os.getenv("WATCH") or "", "dbg6=(%x+)")
                local camera = string.match(os.getenv("WATCH") or "", "m11_camera_index=(%x+)")
                if addr then
                  local value=cpu.spaces["program"]:read_u32(tonumber(addr,16) & 0xFFFFFF)
                  local cam=camera and cpu.spaces["program"]:read_u16(tonumber(camera,16) & 0xFFFFFF) or -1
                  print(string.format("M11_METRIC %s frame=%d camera=%d renders=%d",pfx,frame,cam,value))
                end
              end
            end
            if frame == 60 or frame == 180 or frame == 300 or frame == 420 or frame == 560 or frame == 700 or frame == 890 then
              scr:snapshot(string.format("%s_f%04d.png", pfx, frame))
            end
            if pfx == "m11fixed" or pfx == "m11fogoff" or pfx == "m11cache" then
              if frame == 180 or frame == 480 or frame == 780 or
                 frame == 1080 or frame == 1380 or frame == 1680 then
                scr:snapshot(string.format("%s_fixed_f%04d.png",pfx,frame))
              end
              if frame >= 1920 then manager.machine:exit() end
            elseif frame >= 900 then manager.machine:exit() end
          end)
          LUA
          cd "$shots"
          for pair in "upstream:megadriv:$MANIFOLD_STAGE/manifold/built_rom.bin" "e1m1:genesis:$ROM_PATH" "control:genesis:${CONTROL_ROM_PATH:-}" "controlnh:genesis:${CONTROLNH_ROM_PATH:-}" "autowalk:genesis:${AUTOWALK_ROM_PATH:-}" "tour:genesis:${TOUR_ROM_PATH:-}" "m10control:genesis:${M10_CONTROL_ROM_PATH:-}" "m10doom:genesis:${M10_DOOM_ROM_PATH:-}" "m11fogoff:genesis:${M11_FOGOFF_ROM_PATH:-}" "m11fixed:genesis:${M11_FIXED_ROM_PATH:-}" "m11cache:genesis:${M11_CACHE_ROM_PATH:-}"; do
            pfx="${pair%%:*}"; rest="${pair#*:}"; sys="${rest%%:*}"; rom="${rest#*:}"
            test -s "$rom" || continue
            echo "=== MAME $pfx ==="
            v=$(case $pfx in e1m1|e1m1pal) echo candidate;; *) echo $pfx;; esac)
            ELF="$MANIFOLD_STAGE/$v/out/release/rom.out"
            WATCH=""
            if test -s "$ELF"; then
              WATCH=$("$HOME/mars/m68k-elf/bin/m68k-elf-nm" "$ELF" | awk '$3=="vtimer"||$3=="vints"||$3=="vint_flipping"||$3=="intTrace"||$3=="objects"||$3=="bmp_buffer_0"||$3=="bmp_buffer_1"||$3=="bga_addr"||$3=="bgb_addr"||$3=="regValues"||$3=="manifold_bmp_plane_addr"||$3=="sectors_scanned"{printf "%s=%s,", $3, $1} $3=="manifold_dbg"{a=strtonum("0x"$1); for(i=0;i<7;i++) printf "dbg%d=%x,", i, a+4*i} $3=="m11_camera_index"{printf "m11_camera_index=%s,", $1} 0{printf "%s=%s,", $3, $1} $3=="cur_player_pos"{a=strtonum("0x"$1); printf "px=%x,py=%x,pz=%x,psec_ang=%x,", a, a+4, a+8, a+12}')
            fi
            echo "watch: $WATCH"
            export WATCH
            SNAP_PREFIX="$pfx" timeout 240s mame "$sys" -cart "$rom" -rompath /nonexistent \
              -video none -sound none -nothrottle -skip_gameinfo -noplugins -seconds_to_run 60 \
              -snapshot_directory "$shots/snap" -autoboot_script "$shots/trace.lua" \
              -nvram_directory "$shots/nv" -cfg_directory "$shots/cfg" 2>&1 | grep -v "^Warning: -video none" | tee "$RUNNER_TEMP/mame-$pfx.log" | tail -100
          done
          python3 - "$RUNNER_TEMP" "$shots" <<'PY'
          import csv,pathlib,re,sys
          source=pathlib.Path(sys.argv[1]); shots=pathlib.Path(sys.argv[2])
          pat=re.compile(r'M11_METRIC (m11fixed|m11fogoff|m11cache) frame=(\d+) camera=(\d+) renders=(\d+)')
          measurements={}
          for name in ('m11fixed','m11fogoff','m11cache'):
              p=source/f'mame-{name}.log'
              found={}
              for match in pat.finditer(p.read_text(errors='replace') if p.exists() else ''):
                  _,frame,cam,count=match.groups()
                  found[int(frame)]=(int(cam),int(count))
              measurements[name]=found
          starts=(120,420,720,1020,1320,1620)
          ends=(330,630,930,1230,1530,1830)
          labels=('E0','E1','S0','S1','S2','R0')
          rows=[]
          for ix,(start,end,label) in enumerate(zip(starts,ends,labels)):
              for name,log in measurements.items():
                  if start not in log or end not in log:
                      raise SystemExit(f'M11 missing sample: {name} {label}, frames {start}..{end}; found {sorted(log)}')
                  cam1,r1=log[start];cam2,r2=log[end]
                  if cam1!=ix or cam2!=ix:
                      raise SystemExit(f'M11 camera mismatch: {name} {label} cameras {cam1},{cam2}')
                  fps=60.0*(r2-r1)/(end-start)
                  rows.append((label,ix,name,r1,r2,r2-r1,round(fps,3)))
          with (shots/'m11-fixed-results.csv').open('w',newline='') as out:
              writer=csv.writer(out)
              writer.writerow(('camera','index','variant','render_start','render_end','rendered_frames','fps'))
              writer.writerows(rows)
          lines=['# M11 fixed-camera A/B', '',
              'Identical coordinates, sector, height and angle; 210 VBlank samples at 60 Hz.', '',
              '| Camera | Baseline FPS | Cache FPS | Fog off FPS | Cache vs baseline |',
              '|---|---:|---:|---:|---:|']
          for label in labels:
              r={t[2]:t[6] for t in rows if t[0]==label}
              base=r['m11fixed'];cache=r['m11cache'];fog=r['m11fogoff']
              change=100*(cache/base-1) if base else 0
              lines.append(f'| {label} | {base:.2f} | {cache:.2f} | {fog:.2f} | {change:+.1f}% |')
          (shots/'m11-fixed-results.md').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
          find "$shots/snap" -name '*.png' -exec cp {} "$shots/" \;
          python3 - "$shots" <<'PY'
          import sys,pathlib
          from PIL import Image
          for p in sorted(pathlib.Path(sys.argv[1]).glob("*_f*.png")):
              im=Image.open(p).convert("RGB")
              cols=im.getcolors(1<<20)
              print(p.name, im.size, "unique colors:", len(cols) if cols else ">1M")
              im.resize((im.width*3, im.height*3), Image.NEAREST).save(p.with_name("frame_"+p.name))
          PY
      - name: Visual capture (RetroArch + Genesis Plus GX headless, real frames)
        shell: bash
        run: |
          set -uo pipefail
          shots="$RUNNER_TEMP/manifold-shots-$GITHUB_RUN_ID"
          mkdir -p "$shots"
          echo "SHOTS_DIR=$shots" >> "$GITHUB_ENV"
          core=""
          for c in /usr/lib/libretro/genesis_plus_gx_libretro.so /usr/lib/x86_64-linux-gnu/libretro/genesis_plus_gx_libretro.so "$HOME/.config/retroarch/cores/genesis_plus_gx_libretro.so"; do
            if test -f "$c"; then core="$c"; break; fi
          done
          if test -z "$core" || ! command -v retroarch >/dev/null || ! command -v Xvfb >/dev/null || ! command -v ffmpeg >/dev/null; then
            echo "::warning::RetroArch/GPGX/Xvfb/ffmpeg missing; visual capture NOT RUN (core='$core')"
            exit 0
          fi
          cfg="$shots/ra.cfg"; rec="$shots/rec.cfg"; raw="$shots/raw.mkv"
          printf '%s\n' 'video_driver = "gl"' 'video_context_driver = "x"' 'input_driver = "x"' \
            'joystick_driver = "null"' 'audio_driver = "null"' 'menu_driver = "null"' \
            'config_save_on_exit = "false"' 'video_fullscreen = "false"' > "$cfg"
          printf '%s\n' 'format = matroska' 'vcodec = ffv1' 'acodec = flac' 'pix_fmt = bgr0' 'sample_rate = 44100' > "$rec"
          disp=":97"
          Xvfb "$disp" -screen 0 640x480x24 >"$shots/xvfb.log" 2>&1 &
          xpid=$!
          sleep 2
          DISPLAY="$disp" LIBGL_ALWAYS_SOFTWARE=1 timeout 120s retroarch -c "$cfg" -L "$core" \
            --record "$raw" --recordconfig "$rec" --size 320x224 --max-frames 900 "$ROM_PATH" \
            >"$shots/ra.log" 2>&1 || true
          kill "$xpid" 2>/dev/null || true
          if ! test -s "$raw"; then
            echo "::warning::capture failed"; tail -20 "$shots/ra.log"; exit 0
          fi
          for t in 1 3 5 8 14; do
            ffmpeg -loglevel error -y -ss "$t" -i "$raw" -frames:v 1 -vf scale=960:672:flags=neighbor "$shots/frame_${t}s.png" || true
          done
          rm -f "$raw"
          python3 - "$shots" <<'PY'
          import sys,pathlib,subprocess
          for p in sorted(pathlib.Path(sys.argv[1]).glob("frame_*.png")):
              print(p.name, p.stat().st_size, "bytes")
          PY
      - name: Symbolize MAME hang PCs (diagnostic)
        continue-on-error: true
        env:
          EXTRA_PCS: "003530 0086E6 00114A"
        shell: bash
        run: |
          set +e
          NM="$HOME/mars/m68k-elf/bin/m68k-elf-nm"; OD="$HOME/mars/m68k-elf/bin/m68k-elf-objdump"
          for v in candidate; do
            ELF="$MANIFOLD_STAGE/$v/out/release/rom.out"; test -s "$ELF" || ELF="$MANIFOLD_STAGE/$v/out/rom.out"
            echo "=== $v $ELF"
            pcs="$(grep -ho "PC=[0-9A-F]*" "$RUNNER_TEMP/mame-$v.log" 2>/dev/null | tail -6 | cut -d= -f2 | sort -u) ${EXTRA_PCS:-}"
            echo "hang PCs: $pcs"
            for pc in $pcs; do
              "$NM" -n -S "$ELF" | awk -v t=$((16#$pc)) '{a=strtonum("0x"$1); if(a<=t) last=$0} END{print "'"$pc"' in:", last}'
            done
            echo "-- disassembly of ZERO DIVIDE offset 0x3530 and hint 0x86E6 --"
            for target in 003530 0086E6; do
              echo "=== target 0x$target"
              t=$((16#$target))
              "$NM" -n -S "$ELF" | awk -v t="$t" '{a=strtonum("0x"$1); if (a<=t) prev=$0; else if (!next++) following=$0} END{print "preceding",prev;print "following",following}'
              "$OD" -d --start-address=$((t-0x70)) --stop-address=$((t+0x100)) "$ELF" | tail -140
            done
            first=$(echo ${EXTRA_PCS:-$pcs} | awk '{print $1}')
            test -n "$first" && "$OD" -d --start-address=$((16#$first - 0x60)) --stop-address=$((16#$first + 0x60)) "$ELF" | tail -70
          done
