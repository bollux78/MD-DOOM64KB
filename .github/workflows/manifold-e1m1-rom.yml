name: Manifold E1M1 M01 experimental ROM
on:
  push:
    branches: [exp-manifold-e1m1-m01]
    paths:
      - 'experiments/DOOM_Manifold_E1M1/m01/**'
      - '.github/workflows/manifold-e1m1-rom.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: contains(github.event.head_commit.message, '[manifold-rom]') || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify local private WAD (no uploads)
        shell: bash
        run: |
          set -euo pipefail
          export MANIFOLD_E1M1_WAD=/home/dan/Projetos/doom-md/assets/wads/doom1.wad
          python3 - <<'PY'
          import os,pathlib,hashlib
          p=pathlib.Path(os.environ["MANIFOLD_E1M1_WAD"])
          assert p.is_file() and p.stat().st_size==4196020
          assert hashlib.sha256(p.read_bytes()).hexdigest()=="1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771"
          print("Private E1M1 WAD pinned and present")
          PY
          echo "MANIFOLD_E1M1_WAD=$MANIFOLD_E1M1_WAD" >> "$GITHUB_ENV"
      - name: Fetch pinned Manifold upstream into isolated directory
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/manifold-e1m1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 experiments/DOOM_Manifold_E1M1/m01/bootstrap.py --out "$stage"
          echo "MANIFOLD_STAGE=$stage" >> "$GITHUB_ENV"
      - name: Convert actual E1M1 geometry and stage source
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/DOOM_Manifold_E1M1/m01/stage_rom.py \
            --source "$MANIFOLD_STAGE/manifold" \
            --wad "$MANIFOLD_E1M1_WAD" \
            --out "$MANIFOLD_STAGE/candidate"
      - name: Locate SDK and compile stand-alone Manifold ROM
        shell: bash
        run: |
          set -euo pipefail
          gdk=""
          for d in "$GITHUB_WORKSPACE/vendor/sgdk" "$HOME/Projetos/doom-md/vendor/sgdk" "$HOME/Projetos/MD-DOOM64KB/vendor/sgdk" "$HOME/mars/sgdk" "$HOME/mars/SGDK" "$HOME/sgdk" "/opt/sgdk"; do
            if test -f "$d/makefile.gen"; then gdk="$d"; break; fi
          done
          if test -z "$gdk"; then
            echo "Searching installed SGDK makefiles in HOME and /opt"
            while IFS= read -r sdkfile; do
              case "$sdkfile" in */makefile.gen) gdk="${sdkfile%/makefile.gen}"; break;; esac
            done < <(find "$HOME" /opt -maxdepth 9 -type f -name makefile.gen 2>/dev/null | head -30)
          fi
          if test -z "$gdk"; then
            echo "::error::SGDK makefile.gen not found on runner"; exit 1
          fi
          echo "Using SGDK: $gdk"
          export GDK="$gdk" PREFIX=m68k-elf-
          export PATH="$HOME/mars/m68k-elf/bin:$HOME/toolchains/mars/m68k-elf/bin:$GDK/bin:$PATH"
          if [ -f "$MANIFOLD_STAGE/candidate/src/math3d.h" ] && [ ! -e "$MANIFOLD_STAGE/candidate/src/math3D.h" ]; then
            ln -s math3d.h "$MANIFOLD_STAGE/candidate/src/math3D.h"
          fi
          # Installed libmd.a uses GCC LTO 13; GCC 15 creates incompatible LTO streams.
          # Probe independent installed toolchains; do not mutate the shared SDK.
          tc=""
          while IFS= read -r gcc; do
            test -x "$gcc" || continue
            ver="$("$gcc" -dumpfullversion -dumpversion 2>/dev/null || true)"
            echo "Found cross compiler: $gcc (GCC $ver)"
            if [[ "${ver%%.*}" == "13" ]]; then
              tc="${gcc%gcc}"
              break
            fi
          done < <(find "$HOME" /opt -maxdepth 12 \\( -type f -o -type l \\) -name m68k-elf-gcc 2>/dev/null | sort -u)
          if test -z "$tc"; then
            echo "::error::No matching GCC 13 toolchain found for SGDK libmd.a LTO 13"
            exit 1
          fi
          echo "Using compatible cross compiler: ${tc}gcc"
          make -C "$MANIFOLD_STAGE/candidate" -f "$GDK/makefile.gen" -j2 release \
            OS=Linux PREFIX="$tc" CC="${tc}gcc" LD="${tc}ld" AR="${tc}ar" \
            NM="${tc}nm" OBJCPY="${tc}objcopy"
          test -s "$MANIFOLD_STAGE/candidate/out/rom.bin"
          out="$HOME/Projetos/Personal/manifold-e1m1/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          cp "$MANIFOLD_STAGE/candidate/out/rom.bin" "$out/doom-md-manifold-e1m1-m01.bin"
          cp "$MANIFOLD_STAGE/e1m1-stage.json" "$out/stage.json"
          echo "ROM_PATH=$out/doom-md-manifold-e1m1-m01.bin" >> "$GITHUB_ENV"
          echo "Candidate ROM: $out/doom-md-manifold-e1m1-m01.bin"
      - name: Explicit validation verdicts
        if: always()
        shell: bash
        run: |
          echo "build/candidate: ${{ job.status }}"
          echo "blastem: NOT RUN — must not claim PASS"
          echo "physical console: NOT TESTED"
          echo "No binary or private WAD is uploaded to GitHub"
