      - name: Publish ROM to stable release (requires explicit approval)
        # Never overwrite the tested M06 release with an unreviewed experiment.
        # The runner integration also lacks release-write permission (HTTP 403).
        if: success() && github.ref_name == 'exp-manifold-e1m1-m01' && vars.MANIFOLD_RELEASE_APPROVED == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=manifold-e1m1-latest
          sha=$(sha256sum "$ROM_PATH" | cut -d' ' -f1)
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "Manifold E1M1 M02 experimental ROM (emulator-tested only; real console NOT tested)."
            echo
            echo "- Commit: ${{ github.sha }}"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- SHA-256: $sha"
            echo "- Controls: START enters the map; D-pad moves/turns."
            echo "- BlastEm scripted-walk test: ${AUTOWALK_VERDICT:-NOT_RUN}"
            echo "- Map geometry converted from the Doom shareware doom1.wad (E1M1); no WAD data/textures included. Renderer: Manifold (MIT) + SGDK 2.11 (MIT)."
            echo "- Details: experiments/DOOM_Manifold_E1M1/README.md"
          } > "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes --cleanup-tag
          fi
          gh release create "$tag" "$ROM_PATH" --target "${{ github.sha }}" \
            --title "Manifold E1M1 M02 (latest)" --notes-file "$notes" --prerelease
          echo "Stable URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/$tag/$(basename "$ROM_PATH")"
      - name: Explicit validation verdicts
        if: always()
        shell: bash
        run: |
          echo "build/candidate: ${{ job.status }}"
          echo "blastem: ${BLASTEM_VERDICT:-NOT_RUN}"
          echo "blastem autowalk: ${AUTOWALK_VERDICT:-NOT_RUN}"
          echo "physical console: NOT TESTED"
          echo "M06 stable release preserved; new experimental ROM stored in runner/artifacts"
          echo "No WAD uploaded; release update requires explicit MANIFOLD_RELEASE_APPROVED=true"
