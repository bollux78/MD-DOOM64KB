name: Manifold E1M1 M01 experimental ROM
on:
  push:
    branches: [exp-manifold-e1m1-m01, exp-manifold-m11-visual-perf]
    paths:
      - 'experiments/DOOM_Manifold_E1M1/m01/**'
      - '.github/workflows/manifold-e1m1-rom.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: contains(github.event.head_commit.message, '[manifold-rom]') || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify local private WAD (no uploads)
        shell: bash
        run: |
          set -euo pipefail
          export MANIFOLD_E1M1_WAD=/home/dan/Projetos/doom-md/assets/wads/doom1.wad
          python3 - <<'PY'
          import os,pathlib,hashlib
          p=pathlib.Path(os.environ["MANIFOLD_E1M1_WAD"])
          assert p.is_file() and p.stat().st_size==4196020
          assert hashlib.sha256(p.read_bytes()).hexdigest()=="1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771"
          print("Private E1M1 WAD pinned and present")
          PY
          echo "MANIFOLD_E1M1_WAD=$MANIFOLD_E1M1_WAD" >> "$GITHUB_ENV"
      - name: Fetch pinned Manifold upstream into isolated directory
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/manifold-e1m1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 experiments/DOOM_Manifold_E1M1/m01/bootstrap.py --out "$stage"
          echo "MANIFOLD_STAGE=$stage" >> "$GITHUB_ENV"
      - name: Convert actual E1M1 geometry and stage source
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import shapely' 2>/dev/null || python3 -m pip install --user --break-system-packages -q shapely || python3 -m pip install --user -q shapely
          python3 experiments/DOOM_Manifold_E1M1/m01/stage_rom.py \
            --source "$MANIFOLD_STAGE/manifold" \
            --wad "$MANIFOLD_E1M1_WAD" \
            --out "$MANIFOLD_STAGE/candidate"
          MANIFOLD_CAMERAS=fixed python3 experiments/DOOM_Manifold_E1M1/m01/stage_rom.py \
            --source "$MANIFOLD_STAGE/manifold" \
            --wad "$MANIFOLD_E1M1_WAD" \
            --out "$MANIFOLD_STAGE/m11fixed"
          MANIFOLD_CAMERAS=fixed MANIFOLD_VERT_CACHE=1 python3 experiments/DOOM_Manifold_E1M1/m01/stage_rom.py \
            --source "$MANIFOLD_STAGE/manifold" \
            --wad "$MANIFOLD_E1M1_WAD" \
            --out "$MANIFOLD_STAGE/m11cache"
          MANIFOLD_VERT_CACHE=1 python3 experiments/DOOM_Manifold_E1M1/m01/stage_rom.py \
            --source "$MANIFOLD_STAGE/manifold" \
            --wad "$MANIFOLD_E1M1_WAD" \
            --out "$MANIFOLD_STAGE/m11play"
          MANIFOLD_VERT_CACHE=1 MANIFOLD_EXTRA=autopilot_input python3 experiments/DOOM_Manifold_E1M1/m01/stage_rom.py \
            --source "$MANIFOLD_STAGE/manifold" \
            --wad "$MANIFOLD_E1M1_WAD" \
            --out "$MANIFOLD_STAGE/m11autowalk"
          MANIFOLD_SKIP=far_portal_fog MANIFOLD_CAMERAS=fixed python3 experiments/DOOM_Manifold_E1M1/m01/stage_rom.py \
            --source "$MANIFOLD_STAGE/manifold" \
            --wad "$MANIFOLD_E1M1_WAD" \
            --out "$MANIFOLD_STAGE/m11fogoff"
          python3 experiments/DOOM_Manifold_E1M1/m01/stage_rom.py \
            --source "$MANIFOLD_STAGE/manifold" \
            --wad "$MANIFOLD_E1M1_WAD" \
            --out "$MANIFOLD_STAGE/control" --control
          MANIFOLD_HUD=doom MANIFOLD_H32=0 python3 experiments/DOOM_Manifold_E1M1/m01/stage_rom.py \
            --source "$MANIFOLD_STAGE/manifold" \
            --wad "$MANIFOLD_E1M1_WAD" \
            --out "$MANIFOLD_STAGE/doomhud"
          MANIFOLD_HUD=manifold MANIFOLD_H32=0 python3 experiments/DOOM_Manifold_E1M1/m01/stage_rom.py \
            --source "$MANIFOLD_STAGE/manifold" \
            --wad "$MANIFOLD_E1M1_WAD" \
            --out "$MANIFOLD_STAGE/doomh32"
          MANIFOLD_HUD=doom MANIFOLD_EXTRA=autopilot_input python3 experiments/DOOM_Manifold_E1M1/m01/stage_rom.py \
            --source "$MANIFOLD_STAGE/manifold" \
            --wad "$MANIFOLD_E1M1_WAD" \
            --out "$MANIFOLD_STAGE/autowalk"
          MANIFOLD_TOUR_SKY=1 MANIFOLD_TOUR=tour_input python3 experiments/DOOM_Manifold_E1M1/m01/stage_rom.py \
            --source "$MANIFOLD_STAGE/manifold" \
            --wad "$MANIFOLD_E1M1_WAD" \
            --out "$MANIFOLD_STAGE/tour"
          MANIFOLD_EXTRA=keep_display_enabled_in_hblank python3 experiments/DOOM_Manifold_E1M1/m01/stage_rom.py \
            --source "$MANIFOLD_STAGE/manifold" \
            --wad "$MANIFOLD_E1M1_WAD" \
            --out "$MANIFOLD_STAGE/controlnh" --control
      - name: Locate SDK and compile stand-alone Manifold ROM
        shell: bash
        run: |
          set -euo pipefail
          gdk=""
          for d in "$GITHUB_WORKSPACE/vendor/sgdk" "$HOME/Projetos/doom-md/vendor/sgdk" "$HOME/Projetos/MD-DOOM64KB/vendor/sgdk" "$HOME/mars/sgdk" "$HOME/mars/SGDK" "$HOME/sgdk" "/opt/sgdk"; do
            if test -f "$d/makefile.gen"; then gdk="$d"; break; fi
          done
          if test -z "$gdk"; then
            echo "Searching installed SGDK makefiles in HOME and /opt"
            while IFS= read -r sdkfile; do
              case "$sdkfile" in */makefile.gen) gdk="${sdkfile%/makefile.gen}"; break;; esac
            done < <(find "$HOME" /opt -maxdepth 9 -type f -name makefile.gen 2>/dev/null | head -30)
          fi
          if test -z "$gdk"; then
            echo "::error::SGDK makefile.gen not found on runner"; exit 1
          fi
          echo "Using SGDK: $gdk"
          export GDK="$gdk" PREFIX=m68k-elf-
          export PATH="$HOME/mars/m68k-elf/bin:$HOME/toolchains/mars/m68k-elf/bin:$GDK/bin:$PATH"
          if [ -f "$MANIFOLD_STAGE/candidate/src/math3d.h" ] && [ ! -e "$MANIFOLD_STAGE/candidate/src/math3D.h" ]; then
            ln -s math3d.h "$MANIFOLD_STAGE/candidate/src/math3D.h"
          fi
          # SGDK libmd.a was compiled with GCC 13 but has -ffat-lto-objects:
          # link its native 68000 code with GCC 15, disabling cross-version LTO.
          # Patch a disposable copy of makefile.gen, never the installed SDK.
          tc="$HOME/mars/m68k-elf/bin/m68k-elf-"
          test -x "${tc}gcc" || { echo "::error::Cross compiler not found"; exit 1; }
          portable_makefile="$MANIFOLD_STAGE/makefile-no-cross-lto.gen"
          python3 - "$gdk/makefile.gen" "$portable_makefile" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text()
          pat="-flto -flto=auto -ffat-lto-objects"
          if s.count(pat)<2:
              raise SystemExit("unexpected SGDK LTO flags in makefile")
          pathlib.Path(sys.argv[2]).write_text(s.replace(pat,"-fno-lto"))
          PY
          if [ ! -f "$RUNNER_TEMP/sgdk-kit.tgz" ]; then
            tar -C "$gdk" -czf "$RUNNER_TEMP/sgdk-kit.tgz" lib inc res makefile.gen common.mk md.ld $(cd "$gdk" && ls bin/*.jar 2>/dev/null) 2>/dev/null || true
            echo "SGDK_KIT=$RUNNER_TEMP/sgdk-kit.tgz" >> "$GITHUB_ENV"
            tar -C "$HOME/mars" -czf "$RUNNER_TEMP/m68k-elf-kit.tgz" m68k-elf 2>/dev/null || true
            echo "TC_KIT=$RUNNER_TEMP/m68k-elf-kit.tgz" >> "$GITHUB_ENV"
          fi
          echo "Linking with original SGDK fat-object library, native 68000 fallback"
          make -C "$MANIFOLD_STAGE/candidate" -f "$portable_makefile" -j2 release \
            OS=Linux PREFIX="$tc" CC="${tc}gcc" LD="${tc}ld" AR="${tc}ar" \
            NM="${tc}nm" OBJCPY="${tc}objcopy"
          test -s "$MANIFOLD_STAGE/candidate/out/rom.bin"
          out="$HOME/Projetos/Personal/manifold-e1m1/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          cp "$MANIFOLD_STAGE/candidate/out/rom.bin" "$out/doom-md-manifold-e1m1-m02-hintfix.bin"
          cp "$MANIFOLD_STAGE/e1m1-stage.json" "$out/stage.json"
          echo "ROM_PATH=$out/doom-md-manifold-e1m1-m02-hintfix.bin" >> "$GITHUB_ENV"
          echo "Candidate ROM: $out/doom-md-manifold-e1m1-m02-hintfix.bin"
          [ -f "$MANIFOLD_STAGE/control/src/math3d.h" ] && [ ! -e "$MANIFOLD_STAGE/control/src/math3D.h" ] && ln -s math3d.h "$MANIFOLD_STAGE/control/src/math3D.h"
          # main/candidate ROM = unified default (H32 + Doom HUD). Controls from the same commit:
          #   m10-hud-doom.bin  = H40 + Doom HUD, h40-m08-control.bin = H40 + old inventory HUD
          cp "$out/doom-md-manifold-e1m1-m02-hintfix.bin" "$out/h32-doomhud-main.bin"
          [ ! -e "$MANIFOLD_STAGE/doomhud/src/math3D.h" ] && ln -s math3d.h "$MANIFOLD_STAGE/doomhud/src/math3D.h"
          if make -C "$MANIFOLD_STAGE/doomhud" -f "$portable_makefile" -j2 release \
            OS=Linux PREFIX="$tc" CC="${tc}gcc" LD="${tc}ld" AR="${tc}ar" \
            NM="${tc}nm" OBJCPY="${tc}objcopy" >"$out/doomhud-build.log" 2>&1; then
            cp "$MANIFOLD_STAGE/doomhud/out/rom.bin" "$out/m10-hud-doom.bin"
            echo "M10_DOOM_ROM_PATH=$out/m10-hud-doom.bin" >> "$GITHUB_ENV"
            sha256sum "$out/h32-doomhud-main.bin" "$out/m10-hud-doom.bin"
            [ ! -e "$MANIFOLD_STAGE/doomh32/src/math3D.h" ] && ln -s math3d.h "$MANIFOLD_STAGE/doomh32/src/math3D.h"
            if make -C "$MANIFOLD_STAGE/doomh32" -f "$portable_makefile" -j2 release \
              OS=Linux PREFIX="$tc" CC="${tc}gcc" LD="${tc}ld" AR="${tc}ar" \
              NM="${tc}nm" OBJCPY="${tc}objcopy" >"$out/doomh32-build.log" 2>&1; then
              cp "$MANIFOLD_STAGE/doomh32/out/rom.bin" "$out/h40-m08-control.bin"
              echo "M10_CONTROL_ROM_PATH=$out/h40-m08-control.bin" >> "$GITHUB_ENV"
              sha256sum "$out/h40-m08-control.bin"
            else
              echo "::warning::H40 control build failed"; grep -m20 -iE "error|undefined" "$out/doomh32-build.log"
            fi
          else
            echo "::error::M10 doom HUD build failed"; grep -m20 -iE "error|undefined" "$out/doomhud-build.log"; exit 1
          fi
          # M11 reproducible benchmark: same 6 fixed positions, exact angles,
          # no movement: regular portals vs fog off vs vertex-cache test.
          for variant in m11fixed m11cache m11play m11autowalk; do
            [ ! -e "$MANIFOLD_STAGE/$variant/src/math3D.h" ] && ln -s math3d.h "$MANIFOLD_STAGE/$variant/src/math3D.h"
            make -C "$MANIFOLD_STAGE/$variant" -f "$portable_makefile" -j2 release \
              OS=Linux PREFIX="$tc" CC="${tc}gcc" LD="${tc}ld" AR="${tc}ar" \
              NM="${tc}nm" OBJCPY="${tc}objcopy" >"$out/$variant-build.log" 2>&1 || {
                grep -m20 -iE "error|undefined" "$out/$variant-build.log"; exit 1;
              }
            cp "$MANIFOLD_STAGE/$variant/out/rom.bin" "$out/$variant-h32.bin"
          done
          echo "M11_FIXED_ROM_PATH=$out/m11fixed-h32.bin" >> "$GITHUB_ENV"
          echo "M11_CACHE_ROM_PATH=$out/m11cache-h32.bin" >> "$GITHUB_ENV"
          echo "M11_PLAY_ROM_PATH=$out/m11play-h32.bin" >> "$GITHUB_ENV"
          echo "M11_AW_ROM_PATH=$out/m11autowalk-h32.bin" >> "$GITHUB_ENV"
          python3 - "$out/m11autowalk-h32.bin" <<'PY'
          import struct,sys,pathlib
          p=pathlib.Path(sys.argv[1])
          b=bytearray(p.read_bytes())
          for vector in range(2,12):
              b[vector*4:vector*4+4]=struct.pack('>I',0x00C00020)
          p.write_bytes(b)
          PY
          # M11 visual A/B: H32 Doom HUD control (candidate) vs no distant portal fog.
          [ ! -e "$MANIFOLD_STAGE/m11fogoff/src/math3D.h" ] && ln -s math3d.h "$MANIFOLD_STAGE/m11fogoff/src/math3D.h"
          make -C "$MANIFOLD_STAGE/m11fogoff" -f "$portable_makefile" -j2 release \
            OS=Linux PREFIX="$tc" CC="${tc}gcc" LD="${tc}ld" AR="${tc}ar" \
            NM="${tc}nm" OBJCPY="${tc}objcopy" >"$out/m11fogoff-build.log" 2>&1 || {
              grep -m20 -iE "error|undefined" "$out/m11fogoff-build.log"; exit 1;
            }
          cp "$MANIFOLD_STAGE/m11fogoff/out/rom.bin" "$out/m11-fogoff-h32.bin"
          echo "M11_FOGOFF_ROM_PATH=$out/m11-fogoff-h32.bin" >> "$GITHUB_ENV"
          sha256sum "$out/doom-md-manifold-e1m1-m02-hintfix.bin" "$out/m11-fogoff-h32.bin"
          [ ! -e "$MANIFOLD_STAGE/tour/src/math3D.h" ] && ln -s math3d.h "$MANIFOLD_STAGE/tour/src/math3D.h"
          if make -C "$MANIFOLD_STAGE/tour" -f "$portable_makefile" -j2 release \
            OS=Linux PREFIX="$tc" CC="${tc}gcc" LD="${tc}ld" AR="${tc}ar" \
            NM="${tc}nm" OBJCPY="${tc}objcopy" >"$out/tour-build.log" 2>&1; then
            cp "$MANIFOLD_STAGE/tour/out/rom.bin" "$out/doom-md-manifold-e1m1-tour-m03.bin"
            echo "TOUR_ROM_PATH=$out/doom-md-manifold-e1m1-tour-m03.bin" >> "$GITHUB_ENV"
          else
            echo "::warning::tour build failed"; grep -m10 -i error "$out/tour-build.log"
          fi
          [ ! -e "$MANIFOLD_STAGE/autowalk/src/math3D.h" ] && ln -s math3d.h "$MANIFOLD_STAGE/autowalk/src/math3D.h"
          if make -C "$MANIFOLD_STAGE/autowalk" -f "$portable_makefile" -j2 release \
            OS=Linux PREFIX="$tc" CC="${tc}gcc" LD="${tc}ld" AR="${tc}ar" \
            NM="${tc}nm" OBJCPY="${tc}objcopy" >"$out/autowalk-build.log" 2>&1; then
            cp "$MANIFOLD_STAGE/autowalk/out/rom.bin" "$out/doom-md-manifold-e1m1-autowalk-m02.bin"
            # Test ROM only: point CPU exception vectors 2..11 at VDP I/O so any
            # exception becomes a hard BlastEm fatal instead of a debug screen.
            python3 - "$out/doom-md-manifold-e1m1-autowalk-m02.bin" <<'PY'
          import struct,sys
          p=sys.argv[1]; b=bytearray(open(p,'rb').read())
          for v in range(2,12): b[v*4:v*4+4]=struct.pack('>I',0x00C00020)
          open(p,'wb').write(b)
          PY
            echo "AUTOWALK_ROM_PATH=$out/doom-md-manifold-e1m1-autowalk-m02.bin" >> "$GITHUB_ENV"
          else
            echo "::warning::autowalk build failed"; grep -m10 -i error "$out/autowalk-build.log"
          fi
          [ ! -e "$MANIFOLD_STAGE/controlnh/src/math3D.h" ] && ln -s math3d.h "$MANIFOLD_STAGE/controlnh/src/math3D.h"
          if make -C "$MANIFOLD_STAGE/controlnh" -f "$portable_makefile" -j2 release \
            OS=Linux PREFIX="$tc" CC="${tc}gcc" LD="${tc}ld" AR="${tc}ar" \
            NM="${tc}nm" OBJCPY="${tc}objcopy" >"$out/controlnh-build.log" 2>&1; then
            cp "$MANIFOLD_STAGE/controlnh/out/rom.bin" "$out/doom-md-manifold-controlnh-m02.bin"
            echo "CONTROLNH_ROM_PATH=$out/doom-md-manifold-controlnh-m02.bin" >> "$GITHUB_ENV"
          fi
          if make -C "$MANIFOLD_STAGE/control" -f "$portable_makefile" -j2 release \
            OS=Linux PREFIX="$tc" CC="${tc}gcc" LD="${tc}ld" AR="${tc}ar" \
            NM="${tc}nm" OBJCPY="${tc}objcopy" >"$out/control-build.log" 2>&1; then
            cp "$MANIFOLD_STAGE/control/out/rom.bin" "$out/doom-md-manifold-control-m02.bin"
            echo "CONTROL_ROM_PATH=$out/doom-md-manifold-control-m02.bin" >> "$GITHUB_ENV"
            echo "Control ROM built"
          else
            echo "::warning::control build failed"; grep -m10 -i error "$out/control-build.log"
          fi
      - name: Decode 68000 address error from user screenshot
        shell: bash
        run: |
          set -euo pipefail
          ELF="$MANIFOLD_STAGE/candidate/out/release/rom.out"
          test -s "$ELF"
          NM="$HOME/mars/m68k-elf/bin/m68k-elf-nm"
          OBJDUMP="$HOME/mars/m68k-elf/bin/m68k-elf-objdump"
          echo "== Symbols around hint PC 0x008110 =="
          "$NM" -n "$ELF" | awk '
            /^[0-9a-fA-F]+ / {
              if (strtonum("0x"$1)<=strtonum("0x8110")) previous=$0;
              else if (!after++) next_symbol=$0;
            }
            END {print "nearest-before:", previous;print "nearest-after:", next_symbol}
          ' 2>/dev/null || true
          "$NM" -n "$ELF" | grep -i -B 9 -A 9 '^000081' || true
          echo "== Disassembly near 0x008110 =="
          "$OBJDUMP" -d --start-address=0x8000 --stop-address=0x8210 "$ELF" | tail -160
          echo "== Symbols near odd crash address 0x08001D =="
          "$NM" -n "$ELF" | grep -i -B 6 -A 6 '^000800' || true
          "$OBJDUMP" -d --start-address=0x7ffb0 --stop-address=0x80070 "$ELF" | tail -80
      - name: Verify ROM header and record digest
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$ROM_PATH" <<'PY'
          import hashlib, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          data = path.read_bytes()
          if len(data) < 131072 or len(data) % 131072:
              raise SystemExit(f"invalid aligned ROM size: {len(data)}")
          if data[0x100:0x104] != b"SEGA":
              raise SystemExit(f"invalid Sega ROM header: {data[0x100:0x104]!r}")
          print(f"ROM verification: size={len(data)}, sha256={hashlib.sha256(data).hexdigest()}")
          PY
      - name: BlastEm headless 90-frame boot smoke
        shell: bash
        run: |
          set -euo pipefail
          emu="$(command -v blastem || true)"
          if test -z "$emu"; then
            while IFS= read -r file; do
              if test -x "$file"; then emu="$file"; break; fi
            done < <(find "$HOME" /opt -maxdepth 8 -type f -name blastem 2>/dev/null | head -20)
          fi
          if test -z "$emu"; then
            echo "::warning::BlastEm executable not found; emulator smoke NOT RUN"
            echo "BLASTEM_VERDICT=NOT_RUN" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "BlastEm executable: $emu"
          set +e
          # BlastEm opens a terminal for KDebug text; give it a no-op one.
          fake="$RUNNER_TEMP/fakebin-smoke"; mkdir -p "$fake"
          printf '#!/bin/sh\nexit 0\n' > "$fake/x-terminal-emulator"; chmod +x "$fake/x-terminal-emulator"
          ( ulimit -v 1048576; PATH="$fake:$PATH" timeout 30s env SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=dummy "$emu" -b 90 "$ROM_PATH" </dev/null )
          rc=$?
          set -e
          if test "$rc" -ne 0; then
            echo "BLASTEM_VERDICT=FAIL" >> "$GITHUB_ENV"
            echo "::error::BlastEm 90-frame smoke failed: exit $rc"
            exit 1
          fi
          echo "BLASTEM_VERDICT=PASS_HEADLESS_90_FRAMES" >> "$GITHUB_ENV"
          echo "BlastEm 90 emulated frames: PASS (visual/gameplay not validated)"
      - name: BlastEm autowalk stress (scripted walking, strict)
        id: autowalk
        continue-on-error: true
        shell: bash
        run: |
          set +e
          emu="$HOME/Projetos/blastem64-1.0.0/blastem"
          test -s "${AUTOWALK_ROM_PATH:-}" || { echo "::error::autowalk ROM missing"; exit 1; }
          fake="$RUNNER_TEMP/fakebin-aw"; mkdir -p "$fake"
          export BLASTEM_DBG_LOG="$RUNNER_TEMP/blastem-autowalk-dbg.log"; : > "$BLASTEM_DBG_LOG"
          cat > "$fake/x-terminal-emulator" <<'SH'
          #!/bin/bash
          echo "ARGS: $*" >> "$BLASTEM_DBG_LOG"
          while [ $# -gt 0 ] && [ "$1" != "-e" ]; do shift; done
          shift
          printf 'bt\ndi\nq\n' | timeout 10s "$@" >> "$BLASTEM_DBG_LOG" 2>&1
          SH
          chmod +x "$fake/x-terminal-emulator"
          fail=0
          for n in 1500 3600; do
            outlog="$RUNNER_TEMP/aw-$n.log"
            for attempt in 1 2 3; do
              ( ulimit -v 1048576; PATH="$fake:$PATH" timeout 240s env SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=dummy TERM=dumb "$emu" -b $n "$AUTOWALK_ROM_PATH" </dev/null >"$outlog" 2>&1 )
              rc=$?
              # BlastEm host-JIT relocation glitch (ASLR), not a game fault: retry
              grep -q "out of range for a 32-bit displacement" "$outlog" || break
              echo "(BlastEm host JIT displacement glitch, retry $attempt)"
            done
            echo "== autowalk $n frames rc=$rc"; grep -v SRAM "$outlog" | head -20
            if [ $rc -ne 0 ] || grep -qiE "unmapped|fatal|exception|error|lock up" "$outlog" || [ -s "$BLASTEM_DBG_LOG" ]; then fail=1; fi
          done
          echo "-- debugger transcript:"; head -60 "$BLASTEM_DBG_LOG"
          if [ $fail -ne 0 ]; then
            echo "AUTOWALK_VERDICT=FAIL" >> "$GITHUB_ENV"
            echo "::error::BlastEm autowalk detected a crash/invalid access"; exit 1
          fi
          echo "AUTOWALK_VERDICT=PASS_3600_FRAMES_WALKING" >> "$GITHUB_ENV"
      - name: M11 optimized autowalk stress (3600 frames, strict)
        shell: bash
        run: |
          set -euo pipefail
          emu="$HOME/Projetos/blastem64-1.0.0/blastem"
          test -x "$emu"
          test -s "$M11_AW_ROM_PATH"
          fake="$RUNNER_TEMP/m11-fakebin"; mkdir -p "$fake"
          cat > "$fake/x-terminal-emulator" <<'SH'
          #!/bin/sh
          echo "M11_DEBUGGER_CALLED" >> "$M11_DEBUG_LOG"
          exit 0
          SH
          chmod +x "$fake/x-terminal-emulator"
          export M11_DEBUG_LOG="$RUNNER_TEMP/m11-debugger.log"
          : > "$M11_DEBUG_LOG"
          ( ulimit -v 1048576; PATH="$fake:$PATH" timeout 240s env SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=dummy "$emu" -b 3600 "$M11_AW_ROM_PATH" </dev/null >"$RUNNER_TEMP/m11-aw.log" 2>&1 ) || {
            tail -60 "$RUNNER_TEMP/m11-aw.log"; exit 1;
          }
          if grep -qiE 'unmapped|fatal|exception|error|lock up' "$RUNNER_TEMP/m11-aw.log" || test -s "$M11_DEBUG_LOG"; then
            tail -60 "$RUNNER_TEMP/m11-aw.log"; cat "$M11_DEBUG_LOG"; exit 1
          fi
          echo "M11_CACHE_AUTOWALK=PASS_3600_FRAMES"
      - name: Extended BlastEm 1200-frame stress smoke
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          emu="$HOME/Projetos/blastem64-1.0.0/blastem"
          if test ! -x "$emu"; then
            echo "::warning::BlastEm extended smoke unavailable"
            exit 0
          fi
          echo "Testing 1200 emulated frames with bounded time and memory"
          ( ulimit -v 1048576; timeout 45s env SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=dummy "$emu" -b 1200 "$ROM_PATH" )
          echo "BlastEm 1200 emulated frames: PASS (no visual validation)"
      - name: BlastEm stop reason (first 40 lines)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          emu="$HOME/Projetos/blastem64-1.0.0/blastem"
          fake="$RUNNER_TEMP/fakebin"; mkdir -p "$fake"
          cat > "$fake/x-terminal-emulator" <<'SH'
          #!/bin/bash
          echo "ARGS: $*" >> "$BLASTEM_DBG_LOG"
          while [ $# -gt 0 ] && [ "$1" != "-e" ]; do shift; done
          shift
          printf 'bt\ndi\nq\n' | timeout 10s "$@" >> "$BLASTEM_DBG_LOG" 2>&1
          SH
          chmod +x "$fake/x-terminal-emulator"
          export PATH="$fake:$PATH"
          for r in "$MANIFOLD_STAGE/manifold/built_rom.bin" "$ROM_PATH" "${CONTROL_ROM_PATH:-}"; do
            export BLASTEM_DBG_LOG="$RUNNER_TEMP/blastem-dbg-$(basename "$r").log"; : > "$BLASTEM_DBG_LOG"
            test -s "$r" || continue
