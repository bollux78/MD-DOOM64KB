            ${{ env.MANIFOLD_STAGE }}/m11fixed/out/release/symbol.txt
            ${{ env.MANIFOLD_STAGE }}/m11cache/out/release/symbol.txt
            ${{ env.MANIFOLD_STAGE }}/m11fogoff/out/release/symbol.txt
