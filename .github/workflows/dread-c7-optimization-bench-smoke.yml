name: DREAD C7 - preview MAME benchmarks GEO_SAFE
on:
  push:
    branches: [exp-dread-c7-optimization-matrix-20261123]
    paths: ['.github/workflows/dread-c7-optimization-bench-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: C7ROM-GEO_SAFE-45104053039
          run-id: 45104053039
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/rom
      - name: Install reference emulator MAME
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mame python3-numpy python3-pil
      - name: Early verification of MAME performance collection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bench"
          for mode in 1 2; do
            python3 experiments/DREAD_MD/d01/gameplay/optimization/bench_mame.py \
              --rom "$RUNNER_TEMP/rom/DREAD-C7-OPT-GEO_SAFE.bin" \
              --symbols "$RUNNER_TEMP/rom/symbols-GEO_SAFE.json" \
              --mode "$mode" \
              --result "$RUNNER_TEMP/bench/GEO_SAFE-bench-$mode.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: C7-GEO_SAFE-BENCH-SMOKE-${{ github.run_id }}
          retention-days: 15
          if-no-files-found: warn
          path: ${{ runner.temp }}/bench/*
