name: DREAD C7 - black screen diagnosis C6 vs C7
on:
  push:
    branches: [exp-dread-c7-easy-ai12-proj20-20261122]
    paths: ['.github/workflows/dread-c7-black-screen-diag.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  boot:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DREAD-C7-DUAS-VERSOES-SELFHOST-45044466617
          run-id: 45044466617
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/c7-artifact
      - name: Compare boots and record real screenshots
        shell: bash
        env:
          OUT: ${{ runner.temp }}/c7-boot-diag
          ART: ${{ runner.temp }}/c7-artifact
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 - <<'PY'
          import os,sys,zipfile,hashlib,struct,subprocess
          from pathlib import Path
          home=Path.home(); out=Path(os.environ["OUT"]);art=Path(os.environ["ART"])
          repo=Path.cwd();c6=repo/"experiments/DREAD_MD/d01/gameplay/releases/DREAD-C6-DUAS-VERSOES.zip"
          print("C6 archive:",c6,c6.exists(),flush=True)
          with zipfile.ZipFile(c6) as z:
              print("C6 members:",[(i.filename,i.file_size) for i in z.infolist()],flush=True)
              for i in z.infolist():
                  if i.filename.endswith(".bin") and i.file_size>=524288:
                      name="C6-"+("SSF" if "SSF" in i.filename.upper() else "NORMAL")
                      (out/(name+".bin")).write_bytes(z.read(i))
          for p in sorted(art.glob("**/*.bin")):
              name="C7-"+("SSF" if "SSF" in p.name.upper() else "NORMAL")
              (out/(name+".bin")).write_bytes(p.read_bytes())
          for p in sorted(out.glob("*.bin")):
              b=p.read_bytes();print("ROM",p.name,"size",len(b),
                  "sha256",hashlib.sha256(b).hexdigest()[:20],
                  "SP",hex(struct.unpack_from(">I",b,0)[0]),
                  "PC",hex(struct.unpack_from(">I",b,4)[0]),
                  "boot",b[0x200:0x210].hex(),"ID",repr(b[0x100:0x110]),flush=True)
          sys.path.insert(0,str(repo/"experiments/DREAD_MD/d01/native-perspective"))
          from libretro_runner import Emulator
          cores=[]
          for top in [home/"Projetos",home/".config",Path("/usr/lib"),Path("/opt")]:
              if top.is_dir():
                  try:
                      cores.extend(p for p in top.rglob("*genesis*plus*gx*.so") if p.is_file())
                  except OSError: pass
          print("CORE CANDIDATES:",cores[:12],flush=True)
          if not cores:
              print("NO_CORE: screenshot validation unavailable; headers compared",flush=True)
              sys.exit(0)
          import numpy as np
          core=cores[0];records={}
          for rom in sorted(out.glob("*.bin")):
              try:
                  e=Emulator(core,rom)
                  for n in (120,360,900):
                      e.step(n-(0 if n==120 else 120 if n==360 else 360),capture=True)
                      im=e.screenshot(); a=np.asarray(im)
                      nonblack=int(np.count_nonzero(np.any(a[:,:,:3]>8,axis=2)))
                      distinct=int(len(np.unique(a.reshape(-1,3),axis=0)))
                      print("VIDEO",rom.stem,"frame",n,"nonblack",nonblack,"colors",distinct,flush=True)
                      records[f"{rom.stem}-{n}"]={"nonblack":nonblack,"colors":distinct}
                      im.save(out/f"{rom.stem}-{n}.png")
                  e.close()
              except Exception as ex:
                  print("VIDEO_ERROR",rom.name,type(ex).__name__,str(ex),flush=True)
          (out/"findings.json").write_text(__import__('json').dumps(records,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: C7-BOOT-DIAG-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/c7-boot-diag/*.png
            ${{ runner.temp }}/c7-boot-diag/findings.json
