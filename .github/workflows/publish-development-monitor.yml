name: Publish DOOM-MD Development Monitor
on:
  push:
    branches: [doom-md-development-monitor]
    paths:
      - 'docs/monitor/**'
      - 'scripts/update_monitor_snapshot.py'
      - '.github/workflows/publish-development-monitor.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-monitor
  cancel-in-progress: true
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Update public fallback snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_monitor_snapshot.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/monitor
      - id: deployment
        uses: actions/deploy-pages@v4
