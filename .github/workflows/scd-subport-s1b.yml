      - name: Compare deterministic NTSC VBlank phase counters and packet bytes
        id: s2e_compare
        if: steps.s2d_blastem.outcome == 'success' && steps.s2e_blastem.outcome == 'success'
        shell: bash
        run: |
          python3 experiments/DOOM_SCD_SubPort/s2e/compare_perf.py "$S2D_OUT/live_report.json" "$S2E_OUT/live_report.json"

      - name: Z4 and Z5 runtime acceptance gate
        if: always()
        shell: bash
        run: |
          echo "Z4 strict build: ${{ steps.z4_build.outcome }}"
