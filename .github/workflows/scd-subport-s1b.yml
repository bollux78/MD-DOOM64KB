          python3 experiments/DOOM_SCD_SubPort/s1d/build_setup.py "$tree" "$S1A_OUT" "$ram" "$out" --live
      - name: S2d BlastEm exact applied camera and world without MD simulation
        id: s2d_blastem
        if: steps.s2d_build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/s2d.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/config/blastem" "$work/data"
