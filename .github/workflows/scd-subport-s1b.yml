      - name: S2e BlastEm exact applied camera and world without MD simulation
        id: s2e_blastem
        if: steps.s2e_build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/s2e.XXXXXX")
          trap 'rm -rf "$work"' EXIT
