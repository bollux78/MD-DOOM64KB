name: Sega CD S2e measured fast state bridge
on:
  workflow_dispatch:
  push:
    branches: ['exp-werk-scd-subport-s1s2']
    paths: ['experiments/DOOM_SCD_SubPort/s1b/**', 'experiments/DOOM_SCD_SubPort/s1c/**', 'experiments/DOOM_SCD_SubPort/s1d/**', 'experiments/DOOM_SCD_SubPort/s1e/**', 'experiments/DOOM_SCD_SubPort/s2a/**', 'experiments/DOOM_SCD_SubPort/s2b/**', 'experiments/DOOM_SCD_SubPort/s2c/**', 'experiments/DOOM_SCD_SubPort/s2d/**', 'experiments/DOOM_SCD_SubPort/s2e/**', 'experiments/DOOM_SCD_SubPort/scd_*.c', 'experiments/DOOM_SCD_SubPort/scd_proto.h', '.github/workflows/scd-subport-s1b.yml']
permissions:
  contents: read
env:
  BLASTEM: /home/dan/Projetos/blastem64-1.0.0/blastem
  M68K_OBJDUMP: /home/dan/mars/m68k-elf/bin/m68k-elf-objdump
  AB_SETS: all
  R116_DEMO_DIR: /home/dan/Projetos/Personal/demos
jobs:
  probe:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: S1d syntax preflight (before expensive full ROM build)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/DOOM_SCD_SubPort/s1d/logic_slice.py experiments/DOOM_SCD_SubPort/s1d/build_zone.py experiments/DOOM_SCD_SubPort/s1d/test_zone.py experiments/DOOM_SCD_SubPort/s1d/test_map.py experiments/DOOM_SCD_SubPort/s1d/test_live.py experiments/DOOM_SCD_SubPort/s1d/build_setup.py experiments/DOOM_SCD_SubPort/s1d/test_setup.py
      - name: Restore VGM and pinned shareware WAD
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,hashlib,lzma,shutil
          v=lzma.decompress(pathlib.Path('assets/r18-e1m1.vgm.xz').read_bytes())
          assert hashlib.sha256(v).hexdigest()=='64a7a0748953a4bd35b75735b9f4b7c1c89c0f3f4aa43395485cadd7e88a8226'
          pathlib.Path('res/e1m1.vgm').write_bytes(v)
          source=pathlib.Path('/home/dan/Projetos/doom-md/assets/wads/doom1.wad')
          assert source.is_file() and source.stat().st_size==4196020
          assert hashlib.sha256(source.read_bytes()).hexdigest()=='1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771'
          pathlib.Path('scripts').mkdir(exist_ok=True)
          shutil.copyfile(source,'scripts/doom1.wad')
          PY
      - name: Generate artwork and preflight renderer palettes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lab/test_r79_face.py --wad scripts/doom1.wad
          mkdir -p dist/hud
          python3 scripts/lab/gen_r81_font.py --wad scripts/doom1.wad --out src/r81_menu_font.h --preview dist/hud/font-preview.png
          python3 scripts/lab/gen_r22_pixel4.py
          python3 scripts/lab/gen_r49_colormix.py
          python3 scripts/lab/test_r49_colormix.py
          python3 scripts/lab/gen_hud_wad.py --wad scripts/doom1.wad --out src/hud_wad_assets.h --preview dist/hud/hud-preview.png
      - name: Build control and candidate in separate disposable copies
        shell: bash
        run: |
          set -euo pipefail
          export DOOM_R20_BGM_VGM="$GITHUB_WORKSPACE/res/e1m1.vgm"
          mkdir -p dist/ab
          for set in $AB_SETS; do
            lab="c-${set//+/_}"
            w="$RUNNER_TEMP/r92-shadow-$lab-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            test ! -e "$w"
            python3 -c 'import shutil,sys;shutil.copytree(sys.argv[1],sys.argv[2],ignore=shutil.ignore_patterns(".git","dist","__pycache__"),symlinks=True)' "$GITHUB_WORKSPACE" "$w"
            mkdir -p "$w/dist/hud"
            ( cd "$w"
              python3 scripts/lab/apply_r81.py
              python3 scripts/lab/test_r80_pixofs.py --src src
              R80_EXPERIMENTS="P1+F1" python3 scripts/lab/apply_r80_performance.py
              R83_CANDIDATE=sprites python3 scripts/lab/apply_r83.py
              R85_CANDIDATE=all python3 scripts/lab/apply_r85.py
              R88_CANDIDATE=ai python3 scripts/lab/apply_r88.py
              python3 scripts/lab/apply_r89.py
              R90_CANDIDATE=control python3 scripts/lab/apply_r90.py
              R91_CANDIDATE=sh1 python3 scripts/lab/apply_r91.py
              R92_CANDIDATE=toggle python3 scripts/lab/apply_r92.py
              R95_NAME=flat python3 scripts/lab/apply_r95.py
              R96_NAME=wall python3 scripts/lab/apply_r96.py
              R97_NAME=shasm python3 scripts/lab/apply_r97.py
              R98_CANDIDATE=sprmul python3 scripts/lab/apply_r98.py
              R100_MODE=f1t R100_PREFIX=r102 R100_NAME=twoface python3 scripts/lab/apply_r100.py; R104_PREFIX=r105 R104_NAME=twoface python3 scripts/lab/apply_r104.py
              python3 scripts/lab/apply_r107.py
              python3 scripts/lab/apply_r113.py
              python3 scripts/lab/apply_r115.py
              python3 scripts/lab/apply_r116.py
              python3 scripts/lab/apply_r117.py
              R118_MODE=mulvc python3 scripts/lab/apply_r118.py
              R119_MODE=both python3 scripts/lab/apply_r119.py
              python3 scripts/lab/apply_r122.py
              python3 scripts/lab/apply_r126.py
              if [ "$set" != control ]; then R128_MODE="$set" python3 scripts/lab/apply_r128.py; fi
              HUD_WORK="$w-work" python3 scripts/lab/build_r71a12mul_hud.py 2>&1 | tee dist/hud/BUILD.log )
            mkdir -p "dist/ab/$lab"; cp -a "$w/dist/hud/." "dist/ab/$lab/"
          done
      - name: S0 report (names and sizes only)
        shell: bash
        run: |
          set -euo pipefail
          stamp=$(ls -d "$RUNNER_TEMP"/r92-shadow-c-all-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-work/*/out/.render_options | head -1)
          tree=$(dirname "$(dirname "$stamp")")
          echo "work tree: $(basename "$tree")"
          out="$HOME/Projetos/Personal/scd-subport-s1b/s0-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          python3 experiments/DOOM_SCD_SubPort/s0_report.py "$tree" "$out" | tee "$out.txt"
      - name: S1c engine linkage diagnostic (non-runtime, report private)
        shell: bash
        run: |
          set -euo pipefail
          out="$HOME/Projetos/Personal/scd-subport-s1b/s0-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          diag="$HOME/Projetos/Personal/scd-subport-s1c/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 experiments/DOOM_SCD_SubPort/s1c/engine_probe.py "$out" "$diag"
      - name: S1d logic-only sub-CPU recompilation preflight
        shell: bash
        run: |
          set -euo pipefail
          stamp=$(ls -d "$RUNNER_TEMP"/r92-shadow-c-all-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-work/*/out/.render_options | head -1)
          tree=$(dirname "$(dirname "$stamp")")
          out="$HOME/Projetos/Personal/scd-subport-s1d/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 experiments/DOOM_SCD_SubPort/s1d/logic_slice.py "$tree" "$out"
      - name: Build S1b test ROM (private)
        shell: bash
        run: |
          set -euo pipefail
          stamp=$(ls -d "$RUNNER_TEMP"/r92-shadow-c-all-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-work/*/out/.render_options | head -1)
          tree=$(dirname "$(dirname "$stamp")")
          s0="$HOME/Projetos/Personal/scd-subport-s1b/s0-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          out="$HOME/Projetos/Personal/scd-subport-s1b/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 experiments/DOOM_SCD_SubPort/s1b/build.py "$tree" "$s0" "$out"
          echo "S1A_OUT=$out" >> "$GITHUB_ENV"
      - name: Run S1b in BlastEm (Sega CD)
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/s1b.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/config/blastem" "$work/data"
          cfg="$HOME/.config/blastem/blastem.cfg"
          if [ ! -f "$cfg" ]; then cfg="$(dirname "$BLASTEM")/default.cfg"; fi
          cp "$cfg" "$work/config/blastem/blastem.cfg"
          sed -i -E 's/(m68k_divider[[:space:]]+)[0-9]+/\17/' "$work/config/blastem/blastem.cfg"
          XDG_CONFIG_HOME="$work/config" XDG_DATA_HOME="$work/data" PYTHONPATH="$GITHUB_WORKSPACE/scripts/lab" \
            python3 experiments/DOOM_SCD_SubPort/s1b/test_s1b.py "$S1A_OUT/doom-md-scd-s1b.bin" "$S1A_OUT/doom-md-scd-s1b.elf"
      - name: S1d direct-RAM candidate compilation and dependency link
        shell: bash
        run: |
          set -euo pipefail
          stamp=$(ls -d "$RUNNER_TEMP"/r92-shadow-c-all-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-work/*/out/.render_options | head -1)
          tree=$(dirname "$(dirname "$stamp")")
          out="$HOME/Projetos/Personal/scd-subport-s1d-ram/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 experiments/DOOM_SCD_SubPort/s1d/logic_slice.py "$tree" "$out" --ram-only


      - name: S1d Z4 strict link and package actual P_SetupLevel geometry ROM
        id: z4_build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          stamp=$(ls -d "$RUNNER_TEMP"/r92-shadow-c-all-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-work/*/out/.render_options | head -1)
          tree=$(dirname "$(dirname "$stamp")")
          ram="$HOME/Projetos/Personal/scd-subport-s1d-ram/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          out="$HOME/Projetos/Personal/scd-subport-s1d-z4/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "S1D_Z4_OUT=$out" >> "$GITHUB_ENV"
          python3 experiments/DOOM_SCD_SubPort/s1d/build_setup.py "$tree" "$S1A_OUT" "$ram" "$out"
      - name: S1d Z4 BlastEm real P_SetupLevel geometry plus MD fallback
        id: z4_blastem
        if: steps.z4_build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/s1d-z4.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/config/blastem" "$work/data"
          cfg="$HOME/.config/blastem/blastem.cfg"
          if [ ! -f "$cfg" ]; then cfg="$(dirname "$BLASTEM")/default.cfg"; fi
          cp "$cfg" "$work/config/blastem/blastem.cfg"
          sed -i -E 's/(m68k_divider[[:space:]]+)[0-9]+/\17/' "$work/config/blastem/blastem.cfg"
          XDG_CONFIG_HOME="$work/config" XDG_DATA_HOME="$work/data" PYTHONPATH="$GITHUB_WORKSPACE/scripts/lab" \
            python3 experiments/DOOM_SCD_SubPort/s1d/test_setup.py "$S1D_Z4_OUT/doom-md-scd-s1d-z4.bin" "$S1D_Z4_OUT/doom-md-scd-s1d-z4.elf"

      - name: S1d Z5 full P_SetupLevel ROM strict build
        id: z5_build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          stamp=$(ls -d "$RUNNER_TEMP"/r92-shadow-c-all-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-work/*/out/.render_options | head -1)
          tree=$(dirname "$(dirname "$stamp")")
          ram="$HOME/Projetos/Personal/scd-subport-s1d-ram/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          out="$HOME/Projetos/Personal/scd-subport-s1d-z5/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "S1D_Z5_OUT=$out" >> "$GITHUB_ENV"
          python3 experiments/DOOM_SCD_SubPort/s1d/build_setup.py "$tree" "$S1A_OUT" "$ram" "$out" --full
      - name: S1d Z5 BlastEm full P_SetupLevel player and things plus MD fallback
        id: z5_blastem
        if: steps.z5_build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/s1d-z5.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/config/blastem" "$work/data"
          cfg="$HOME/.config/blastem/blastem.cfg"
          if [ ! -f "$cfg" ]; then cfg="$(dirname "$BLASTEM")/default.cfg"; fi
          cp "$cfg" "$work/config/blastem/blastem.cfg"
          sed -i -E 's/(m68k_divider[[:space:]]+)[0-9]+/\17/' "$work/config/blastem/blastem.cfg"
          XDG_CONFIG_HOME="$work/config" XDG_DATA_HOME="$work/data" PYTHONPATH="$GITHUB_WORKSPACE/scripts/lab" \
            python3 experiments/DOOM_SCD_SubPort/s1d/test_setup.py --full "$S1D_Z5_OUT/doom-md-scd-s1d-z5.bin" "$S1D_Z5_OUT/doom-md-scd-s1d-z5.elf"

      - name: S1e Z6 real P_Ticker 2600 strict build
        id: z6_build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          stamp=$(ls -d "$RUNNER_TEMP"/r92-shadow-c-all-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-work/*/out/.render_options | head -1)
          tree=$(dirname "$(dirname "$stamp")")
          ram="$HOME/Projetos/Personal/scd-subport-s1d-ram/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          out="$HOME/Projetos/Personal/scd-subport-s1e-z7/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "S1E_Z6_OUT=$out" >> "$GITHUB_ENV"
          python3 experiments/DOOM_SCD_SubPort/s1d/build_setup.py "$tree" "$S1A_OUT" "$ram" "$out" --compare
      - name: S1e Z6 BlastEm actual sub simulation and independent trace
        id: z6_blastem
        if: steps.z6_build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/s1e-z6.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/config/blastem" "$work/data"
          cfg="$HOME/.config/blastem/blastem.cfg"
          if [ ! -f "$cfg" ]; then cfg="$(dirname "$BLASTEM")/default.cfg"; fi
          cp "$cfg" "$work/config/blastem/blastem.cfg"
          sed -i -E 's/(m68k_divider[[:space:]]+)[0-9]+/\17/' "$work/config/blastem/blastem.cfg"
          XDG_CONFIG_HOME="$work/config" XDG_DATA_HOME="$work/data" PYTHONPATH="$GITHUB_WORKSPACE/scripts/lab" \
            python3 experiments/DOOM_SCD_SubPort/s1d/test_setup.py --ticker "$S1E_Z6_OUT/doom-md-scd-s1e-z7.bin" "$S1E_Z6_OUT/doom-md-scd-s1e-z7.elf"
          XDG_CONFIG_HOME="$work/config" XDG_DATA_HOME="$work/data" PYTHONPATH="$GITHUB_WORKSPACE/scripts/lab" \
            python3 experiments/DOOM_SCD_SubPort/s1e/test_md_trace.py "$S1E_Z6_OUT/doom-md-scd-s1e-z7.bin" "$S1E_Z6_OUT/doom-md-scd-s1e-z7.elf"
          python3 experiments/DOOM_SCD_SubPort/s1e/compare_logic.py "$S1E_Z6_OUT/md_trace.csv" "$S1E_Z6_OUT/sub_trace.csv" --out "$S1E_Z6_OUT/comparison.json"


      - name: S1e Z8 original G_Ticker P_Init and rebirth strict build
        id: z8_build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          stamp=$(ls -d "$RUNNER_TEMP"/r92-shadow-c-all-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-work/*/out/.render_options | head -1)
          tree=$(dirname "$(dirname "$stamp")")
          ram="$HOME/Projetos/Personal/scd-subport-s1d-ram/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          out="$HOME/Projetos/Personal/scd-subport-s1e-z8/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "S1E_Z8_OUT=$out" >> "$GITHUB_ENV"
          python3 experiments/DOOM_SCD_SubPort/s1d/build_setup.py "$tree" "$S1A_OUT" "$ram" "$out" --engine
      - name: S1e Z8 BlastEm original decoder full level ticker plus rebirth
        id: z8_blastem
        if: steps.z8_build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/s1e-z8.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/config/blastem" "$work/data"
          cfg="$HOME/.config/blastem/blastem.cfg"
          if [ ! -f "$cfg" ]; then cfg="$(dirname "$BLASTEM")/default.cfg"; fi
          cp "$cfg" "$work/config/blastem/blastem.cfg"
          sed -i -E 's/(m68k_divider[[:space:]]+)[0-9]+/\17/' "$work/config/blastem/blastem.cfg"
          XDG_CONFIG_HOME="$work/config" XDG_DATA_HOME="$work/data" PYTHONPATH="$GITHUB_WORKSPACE/scripts/lab" \
            python3 experiments/DOOM_SCD_SubPort/s1d/test_setup.py --engine "$S1E_Z8_OUT/doom-md-scd-s1e-z8.bin" "$S1E_Z8_OUT/doom-md-scd-s1e-z8.elf"
          python3 experiments/DOOM_SCD_SubPort/s1e/compare_logic.py "$S1E_Z6_OUT/md_trace.csv" "$S1E_Z8_OUT/sub_trace.csv" --out "$S1E_Z8_OUT/comparison.json"

      - name: S2a camera-only bridge strict build
        id: s2a_build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          stamp=$(ls -d "$RUNNER_TEMP"/r92-shadow-c-all-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-work/*/out/.render_options | head -1)
          tree=$(dirname "$(dirname "$stamp")")
          ram="$HOME/Projetos/Personal/scd-subport-s1d-ram/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          out="$HOME/Projetos/Personal/scd-subport-s2a-camera/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "S2A_OUT=$out" >> "$GITHUB_ENV"
          python3 experiments/DOOM_SCD_SubPort/s1d/build_setup.py "$tree" "$S1A_OUT" "$ram" "$out" --visual
      - name: S2a BlastEm real sub camera and MD renderer with no MD simulation
        id: s2a_blastem
        if: steps.s2a_build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/s2a.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/config/blastem" "$work/data"
          cfg="$HOME/.config/blastem/blastem.cfg"
          if [ ! -f "$cfg" ]; then cfg="$(dirname "$BLASTEM")/default.cfg"; fi
          cp "$cfg" "$work/config/blastem/blastem.cfg"
          sed -i -E 's/(m68k_divider[[:space:]]+)[0-9]+/\17/' "$work/config/blastem/blastem.cfg"
          XDG_CONFIG_HOME="$work/config" XDG_DATA_HOME="$work/data" PYTHONPATH="$GITHUB_WORKSPACE/scripts/lab" \
            python3 experiments/DOOM_SCD_SubPort/s1d/test_setup.py --visual "$S2A_OUT/doom-md-scd-s2a-camera.bin" "$S2A_OUT/doom-md-scd-s2a-camera.elf"
          XDG_CONFIG_HOME="$work/config" XDG_DATA_HOME="$work/data" PYTHONPATH="$GITHUB_WORKSPACE/scripts/lab" \
            python3 experiments/DOOM_SCD_SubPort/s2a/test_visual.py "$S2A_OUT/doom-md-scd-s2a-camera.bin" "$S2A_OUT/doom-md-scd-s2a-camera.elf"

      - name: S2b camera and sector-side bridge strict build
        id: s2b_build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          stamp=$(ls -d "$RUNNER_TEMP"/r92-shadow-c-all-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-work/*/out/.render_options | head -1)
          tree=$(dirname "$(dirname "$stamp")")
          ram="$HOME/Projetos/Personal/scd-subport-s1d-ram/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          out="$HOME/Projetos/Personal/scd-subport-s2b-world/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "S2B_OUT=$out" >> "$GITHUB_ENV"
          python3 experiments/DOOM_SCD_SubPort/s1d/build_setup.py "$tree" "$S1A_OUT" "$ram" "$out" --world
      - name: S2b BlastEm exact applied camera and world without MD simulation
        id: s2b_blastem
        if: steps.s2b_build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/s2b.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/config/blastem" "$work/data"
          cfg="$HOME/.config/blastem/blastem.cfg"
          if [ ! -f "$cfg" ]; then cfg="$(dirname "$BLASTEM")/default.cfg"; fi
          cp "$cfg" "$work/config/blastem/blastem.cfg"
          sed -i -E 's/(m68k_divider[[:space:]]+)[0-9]+/\17/' "$work/config/blastem/blastem.cfg"
          XDG_CONFIG_HOME="$work/config" XDG_DATA_HOME="$work/data" PYTHONPATH="$GITHUB_WORKSPACE/scripts/lab" \
            python3 experiments/DOOM_SCD_SubPort/s1d/test_setup.py --visual "$S2B_OUT/doom-md-scd-s2b-world.bin" "$S2B_OUT/doom-md-scd-s2b-world.elf"
          XDG_CONFIG_HOME="$work/config" XDG_DATA_HOME="$work/data" PYTHONPATH="$GITHUB_WORKSPACE/scripts/lab" \
            python3 experiments/DOOM_SCD_SubPort/s2a/test_visual.py --world "$S2B_OUT/doom-md-scd-s2b-world.bin" "$S2B_OUT/doom-md-scd-s2b-world.elf"

      - name: S2c camera and actor bridge strict build
        id: s2c_build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          stamp=$(ls -d "$RUNNER_TEMP"/r92-shadow-c-all-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-work/*/out/.render_options | head -1)
          tree=$(dirname "$(dirname "$stamp")")
          ram="$HOME/Projetos/Personal/scd-subport-s1d-ram/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          out="$HOME/Projetos/Personal/scd-subport-s2c-actors/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "S2C_OUT=$out" >> "$GITHUB_ENV"
          python3 experiments/DOOM_SCD_SubPort/s1d/build_setup.py "$tree" "$S1A_OUT" "$ram" "$out" --actors
      - name: S2c BlastEm exact applied camera and world without MD simulation
        id: s2c_blastem
        if: steps.s2c_build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
