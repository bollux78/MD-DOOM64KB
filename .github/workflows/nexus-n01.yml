name: NEXUS N01
on:
  push:
    branches: [exp-nexus-engine-n01]
    paths:
      - experiments/DOOM_NEXUS/**
      - .github/workflows/nexus-n01.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/exp-nexus-engine-n01'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: experiments/DOOM_NEXUS
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Import maps and compile N01
        env:
          DOOM1_WAD: /home/dan/Projetos/doom-md/assets/wads/doom1.wad
        run: |
          echo '1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771  /home/dan/Projetos/doom-md/assets/wads/doom1.wad' | sha256sum -c
          bash build.sh
      - name: Verify A/B parity and compare with reference
        env:
          DOOM1_WAD: /home/dan/Projetos/doom-md/assets/wads/doom1.wad
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Isrc tools/check_render.c src/nexus.c src/map_data.c -o out/check_render
          out/check_render > out/frames.idx
          echo 'A/B tile parity passed for every E1M1 pose.'
          python3 tools/reference.py "$DOOM1_WAD" out/frames.idx | tee out/reference.json
      - name: Archive build on the runner
        run: |
          dest="$HOME/Projetos/nexus-engine/roms/N01/${GITHUB_SHA:0:12}"
          install -d "$dest"
          install -m 644 out/nexus-n01.bin out/map-audit.json out/reference.json "$dest/"
          cmp out/nexus-n01.bin "$dest/nexus-n01.bin"
          echo "ROM: $dest/nexus-n01.bin"
          sha256sum "$dest/nexus-n01.bin"
      - name: Smoke test in BlastEm
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import shutil
          import subprocess
          emulator = shutil.which("blastem")
          if not emulator:
              emulator = next((str(p) for p in (pathlib.Path.home() / "Projetos").glob("**/blastem")
                               if p.is_file() and os.access(p, os.X_OK)), None)
          if not emulator:
              print("::warning::BlastEm unavailable on runner; boot unverified")
          else:
              env = dict(os.environ, SDL_VIDEODRIVER="dummy", SDL_AUDIODRIVER="dummy")
              subprocess.run([emulator, "-b", "800", "out/nexus-n01.bin"],
                             env=env, check=True, timeout=60)
              print("BlastEm smoke completed (800 emulated frames)")
          PY
