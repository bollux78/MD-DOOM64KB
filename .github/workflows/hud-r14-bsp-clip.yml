name: HUD24 R14 BSP and clip scan matrix
on:
  workflow_dispatch:
  push:
    branches: [fullscreen]
    paths:
      - '.github/workflows/hud-r14-bsp-clip.yml'

permissions:
  contents: read

jobs:
  r14-bsp-clip:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 80
    steps:
      - name: Checkout R12-based HUD renderer
        uses: actions/checkout@v4
        with:
          ref: hud
      - name: Check 68000 toolchain
        shell: bash
        run: |
          command -v fish
          command -v python3
          test -x "$HOME/mars/m68k-elf/bin/m68k-elf-gcc"
          test -f "$HOME/mars/m68k-elf/lib/libmd.a"
      - name: Test clipping equivalence and compile six R14 variants
        shell: bash
        run: fish scripts/lab/build_r14_bsp_clip.fish
      - name: Publish ROMs, flags, logs, sizes and disassembly
        uses: actions/upload-artifact@v4
        with:
          name: doom-md-hud-r14-bsp-clip-six-roms
          path: |
            dist/r14-bsp/*.bin
            dist/r14-bsp/*.elf
            dist/r14-bsp/*.log
            dist/r14-bsp/*.txt
          if-no-files-found: error
          retention-days: 30
