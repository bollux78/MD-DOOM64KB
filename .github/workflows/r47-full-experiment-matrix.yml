name: R47 full experimental ROM laboratory

on:
  push:
    branches: [r47-full-experiment-matrix]
    paths:
      - '.github/workflows/r47-full-experiment-matrix.yml'
  workflow_dispatch:

concurrency:
  group: r47-full-experiment-matrix
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-full-lab:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v6

      - name: Check local toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v fish
          command -v python3
          command -v cc
          test -x "$HOME/mars/m68k-elf/bin/m68k-elf-gcc"
          test -x "$HOME/mars/m68k-elf/bin/m68k-elf-objdump"
          test -f "$HOME/mars/m68k-elf/lib/libmd.a"
          test -f "$HOME/mars/m68k-elf/inc/snd/xgm2.h"

      - name: Run R47 host equivalence oracles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/r47-full
          cc -O2 -std=c11 scripts/lab/test_r47a_flat.c -o /tmp/r47-flat
          /tmp/r47-flat | tee dist/r47-full/ORACLE-flat.txt
          cc -O2 -std=c11 scripts/lab/test_r47_sprite_hoist.c -o /tmp/r47-sprite
          /tmp/r47-sprite | tee dist/r47-full/ORACLE-sprite.txt
          python3 scripts/lab/test_r47a_plane_pair.py | tee dist/r47-full/ORACLE-plane-pair.txt
          python3 scripts/lab/r47b_vdp_oracle.py --frames 48 --out dist/r47-full/ORACLE-vdp.json
          python3 scripts/lab/test_r47_mul.py | tee dist/r47-full/ORACLE-mul.txt

      - name: Restore pinned E1M1 XGM2 input
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,lzma,pathlib
          p=pathlib.Path('assets/r18-e1m1.vgm.xz')
          data=lzma.decompress(p.read_bytes())
          assert hashlib.sha256(data).hexdigest()=='64a7a0748953a4bd35b75735b9f4b7c1c89c0f3f4aa43395485cadd7e88a8226'
          pathlib.Path('res/e1m1.vgm').write_bytes(data)
          PY

      - name: Verify or recover pinned Doom shareware WAD
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, gzip, os, pathlib, shutil, urllib.request
          target=pathlib.Path('scripts/doom1.wad')
          target.parent.mkdir(parents=True,exist_ok=True)
          expected='1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771'
          expected_size=4196020
          home=pathlib.Path.home()
          candidates=[
              target,
              home/'Projetos/doom-assets/doom1.wad',
              home/'Projetos/doom-assets/DOOM1.WAD',
              home/'Projetos/doom-assets/doom1.WAD',
              home/'Jogos/doom1.wad',
              home/'Games/doom1.wad',
              home/'Downloads/doom1.wad'
          ]
          for top in (home/'Projetos',home/'Games',home/'Jogos'):
              if not top.is_dir():continue
              depth=len(top.parts)
              for directory,subdirs,names in os.walk(top,followlinks=False):
                  if len(pathlib.Path(directory).parts)-depth>4:
                      subdirs[:]=[]
                      continue
                  subdirs[:]=[x for x in subdirs if not x.startswith('.')]
                  for name in names:
                      if name.lower()=='doom1.wad':
                          candidates.append(pathlib.Path(directory)/name)
          for p in candidates:
              if not p.is_file():continue
              raw=p.read_bytes()
              sha=hashlib.sha256(raw).hexdigest()
              if len(raw)==expected_size and sha==expected:
                  if p.resolve()!=target.resolve():shutil.copyfile(p,target)
                  print('Verified pinned shareware WAD from',p,flush=True)
                  break
          else:
              mirrors=[
                ('ibiblio','https://distro.ibiblio.org/slitaz/sources/packages/d/doom1.wad',False),
                ('archive','https://archive.org/download/wadarchive/DATA/5b.zip/5b%2F2e249b9c5133ec987b3ea77596381dc0d6bc1d%2F5b2e249b9c5133ec987b3ea77596381dc0d6bc1d.wad.gz',True),
                ('aikernel','https://aikernel.net/demo/doom/DOOM1.WAD',False)
              ]
              for name,url,compressed in mirrors:
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'MD-DOOM64KB asset verifier/1.0'})
                      with urllib.request.urlopen(req,timeout=65) as response:
                          raw=response.read(9_000_000)
                      if compressed:raw=gzip.decompress(raw)
                      if len(raw)==expected_size and hashlib.sha256(raw).hexdigest()==expected:
                          target.write_bytes(raw);print('Recovered verified shareware WAD from',name);break
                  except Exception as e:
                      print('Mirror unavailable:',name,str(e)[:160])
              else:
                  raise SystemExit('Pinned shareware WAD unavailable')
          assert hashlib.sha256(target.read_bytes()).hexdigest()==expected
          PY

      - name: Build full R47 laboratory ROM set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/r47-full
          rm -f dist/r47-full/*.bin dist/r47-full/flags-*.txt
          export DOOM_R20_BGM_VGM="$GITHUB_WORKSPACE/res/e1m1.vgm"

          cell_play () {
            local label="$1"; shift
            echo "===== $label ====="
            env DOOM_R35D_CHECKER=1 DOOM_R37_BSP_PROFILE=0 DOOM_R38_TIME_PROFILE=0                 DOOM_R39C_VARIANT=mall DOOM_R39D_DITHER_TOGGLE=1                 DOOM_R39E_AUDIO_TOGGLES=1 DOOM_R39F_DITHER3=1                 DOOM_R40_STAGE1=fast DOOM_R20_BGM_VGM="$DOOM_R20_BGM_VGM"                 "$@" fish scripts/lab/build_r35_linear.fish cell-play
          }
          cell_perf () {
            local label="$1"; shift
            echo "===== $label ====="
            env DOOM_R35D_CHECKER=1 DOOM_R37_BSP_PROFILE=0 DOOM_R38_TIME_PROFILE=0                 DOOM_R39C_VARIANT=mall DOOM_R39D_DITHER_TOGGLE=1                 DOOM_R39E_AUDIO_TOGGLES=1 DOOM_R39F_DITHER3=1                 DOOM_R40_STAGE1=fast DOOM_R20_BGM_VGM="$DOOM_R20_BGM_VGM"                 "$@" fish scripts/lab/build_r35_linear.fish cell-perf
          }
          p4_play () {
            local label="$1"; shift
            echo "===== $label ====="
            env DOOM_R35D_CHECKER=1 DOOM_R39C_VARIANT=mall                 DOOM_R39D_DITHER_TOGGLE=0 DOOM_R39E_AUDIO_TOGGLES=1                 DOOM_R40_STAGE1=fast DOOM_R42_WALL_ASM=1 DOOM_R45_VARIANT=asm                 DOOM_R20_BGM_VGM="$DOOM_R20_BGM_VGM"                 "$@" fish scripts/lab/build_r35_linear.fish pixel4-play
          }
          p4_perf () {
            local label="$1"; shift
            echo "===== $label ====="
            env DOOM_R35D_CHECKER=1 DOOM_R39C_VARIANT=mall                 DOOM_R39D_DITHER_TOGGLE=0 DOOM_R39E_AUDIO_TOGGLES=1                 DOOM_R40_STAGE1=fast DOOM_R42_WALL_ASM=1 DOOM_R45_VARIANT=asm                 DOOM_R20_BGM_VGM="$DOOM_R20_BGM_VGM"                 "$@" fish scripts/lab/build_r35_linear.fish pixel4-perf
          }

          # R46 8x8 migration ladder: keep every previously validated stage.
          cell_play "R46 primary play" DOOM_R46_BUILD=primary
          cell_perf "R46 primary perf" DOOM_R46_BUILD=primary
          cell_play "R46 M1 play" DOOM_R46_M1=1 DOOM_R46_BUILD=m1
          cell_perf "R46 M1 perf" DOOM_R46_M1=1 DOOM_R46_BUILD=m1
          cell_play "R46 M1B play" DOOM_R46_M1=1 DOOM_R46_M1B=1 DOOM_R46_BUILD=m1b
          cell_perf "R46 M1B perf" DOOM_R46_M1=1 DOOM_R46_M1B=1 DOOM_R46_BUILD=m1b
          cell_play "R46 M2A play" DOOM_R46_M1=1 DOOM_R46_M1B=1 DOOM_R46_M2A=1 DOOM_R46_BUILD=m2a
          cell_perf "R46 M2A perf" DOOM_R46_M1=1 DOOM_R46_M1B=1 DOOM_R46_M2A=1 DOOM_R46_BUILD=m2a
          cell_play "R46 M2B play" DOOM_R46_M1=1 DOOM_R46_M1B=1 DOOM_R46_M2A=1 DOOM_R46_M2B=1 DOOM_R46_BUILD=m2b
          cell_perf "R46 M2B perf" DOOM_R46_M1=1 DOOM_R46_M1B=1 DOOM_R46_M2A=1 DOOM_R46_M2B=1 DOOM_R46_BUILD=m2b
          cell_play "R46 M2C play" DOOM_R46_M1=1 DOOM_R46_M1B=1 DOOM_R46_M2A=1 DOOM_R46_M2B=1 DOOM_R46_M2C=1 DOOM_R46_BUILD=m2c
          cell_perf "R46 M2C perf" DOOM_R46_M1=1 DOOM_R46_M1B=1 DOOM_R46_M2A=1 DOOM_R46_M2B=1 DOOM_R46_M2C=1 DOOM_R46_BUILD=m2c

          # R47B exact multiply experiments, individually and combined.
          cell_play "R47 mul-bsp play" DOOM_R47_MUL_BSP=1 DOOM_R47_BUILD=mul-bsp-play
          cell_perf "R47 mul-bsp perf" DOOM_R47_MUL_BSP=1 DOOM_R47_BUILD=mul-bsp-perf
          cell_play "R47 mul-logic play" DOOM_R47_MUL_LOGIC=1 DOOM_R47_BUILD=mul-logic-play
          cell_perf "R47 mul-logic perf" DOOM_R47_MUL_LOGIC=1 DOOM_R47_BUILD=mul-logic-perf
          cell_play "R47 mul-both play" DOOM_R47_MUL_BSP=1 DOOM_R47_MUL_LOGIC=1 DOOM_R47_BUILD=mul-both-play
          cell_perf "R47 mul-both perf" DOOM_R47_MUL_BSP=1 DOOM_R47_MUL_LOGIC=1 DOOM_R47_BUILD=mul-both-perf

          # End-state equivalence oracle: control and each multiply family.
          cell_perf "R47 state control" DOOM_R47_STATE_HASH=1 DOOM_R47_BUILD=state-control-perf
          cell_perf "R47 state mul-bsp" DOOM_R47_STATE_HASH=1 DOOM_R47_MUL_BSP=1 DOOM_R47_BUILD=state-mul-bsp-perf
          cell_perf "R47 state mul-logic" DOOM_R47_STATE_HASH=1 DOOM_R47_MUL_LOGIC=1 DOOM_R47_BUILD=state-mul-logic-perf
          cell_perf "R47 state mul-both" DOOM_R47_STATE_HASH=1 DOOM_R47_MUL_BSP=1 DOOM_R47_MUL_LOGIC=1 DOOM_R47_BUILD=state-mul-both-perf

          # 4x4 renderer factorial: baseline plus every Flat/Sprite/PlanePair combination.
          p4_play "R45 ASM p4 play control"
          p4_perf "R45 ASM p4 perf control"
          p4_play "R47 flat play" DOOM_R47_FLAT_HOIST=1 DOOM_R47_BUILD=flat-p4play
          p4_perf "R47 flat perf" DOOM_R47_FLAT_HOIST=1 DOOM_R47_BUILD=flat-p4perf
          p4_play "R47 sprite play" DOOM_R47_SPRITE_HOIST=1 DOOM_R47_BUILD=sprite-p4play
          p4_perf "R47 sprite perf" DOOM_R47_SPRITE_HOIST=1 DOOM_R47_BUILD=sprite-p4perf
          p4_play "R47 flat+sprite play" DOOM_R47_FLAT_HOIST=1 DOOM_R47_SPRITE_HOIST=1 DOOM_R47_BUILD=flat-sprite-p4play
          p4_perf "R47 flat+sprite perf" DOOM_R47_FLAT_HOIST=1 DOOM_R47_SPRITE_HOIST=1 DOOM_R47_BUILD=flat-sprite-p4perf
          p4_play "R47 plane-pair play" DOOM_R47_PLANE_PAIR=1 DOOM_R47_BUILD=pair-p4play
          p4_perf "R47 plane-pair perf" DOOM_R47_PLANE_PAIR=1 DOOM_R47_BUILD=pair-p4perf
          p4_play "R47 flat+pair play" DOOM_R47_FLAT_HOIST=1 DOOM_R47_PLANE_PAIR=1 DOOM_R47_BUILD=flat-pair-p4play
          p4_perf "R47 flat+pair perf" DOOM_R47_FLAT_HOIST=1 DOOM_R47_PLANE_PAIR=1 DOOM_R47_BUILD=flat-pair-p4perf
          p4_play "R47 sprite+pair play" DOOM_R47_SPRITE_HOIST=1 DOOM_R47_PLANE_PAIR=1 DOOM_R47_BUILD=sprite-pair-p4play
          p4_perf "R47 sprite+pair perf" DOOM_R47_SPRITE_HOIST=1 DOOM_R47_PLANE_PAIR=1 DOOM_R47_BUILD=sprite-pair-p4perf
          p4_play "R47 all p4 play" DOOM_R47_FLAT_HOIST=1 DOOM_R47_SPRITE_HOIST=1 DOOM_R47_PLANE_PAIR=1 DOOM_R47_BUILD=flat-sprite-pair-p4play
          p4_perf "R47 all p4 perf" DOOM_R47_FLAT_HOIST=1 DOOM_R47_SPRITE_HOIST=1 DOOM_R47_PLANE_PAIR=1 DOOM_R47_BUILD=flat-sprite-pair-p4perf

          # Existing heap/layout stress controls stay in the same giant pack.
          for mode in r5safe r5stress r6asafe r6astress; do
            safe=0; stress=0; audit=0
            [[ "$mode" == *safe ]] && safe=1
            [[ "$mode" == *stress ]] && stress=1
            [[ "$mode" == r6a* ]] && audit=1
            cell_perf "$mode"               DOOM_R46_M1=1 DOOM_R46_M1B=1 DOOM_R46_M2A=1 DOOM_R46_M2B=1 DOOM_R46_M2C=1               DOOM_R46_M3C_DIAG=1 DOOM_R46_M3C_SAFE_BLANK="$safe" DOOM_R46_M3C_STRESS="$stress"               DOOM_R46_M3C_FONT_RESTORE=1 DOOM_R46_M3C_LATE_BUFFER=1 DOOM_R46_M6A_LAYOUT="$audit"               DOOM_R46_BUILD=m2c
          done

          find dist/r35 -maxdepth 1 -type f \( -name '*.bin' -o -name 'flags-*.txt' \) -print -exec cp -f {} dist/r47-full/ \;

      - name: Audit linked multiplication libcalls
        shell: bash
        run: |
          set -euo pipefail
          OBJ="$HOME/mars/m68k-elf/bin/m68k-elf-objdump"
          : > dist/r47-full/LIBCALL-AUDIT.txt
          for elf in dist/r35/doom-md-r47-*.elf dist/r35/doom-md-r46-primary-perf.elf; do
            [[ -f "$elf" ]] || continue
            count=$("$OBJ" -d "$elf" | grep -Ec 'jsr.*__mulsi3|bsr.*__mulsi3' || true)
            printf '%-52s __mulsi3_calls=%s\n' "$(basename "$elf")" "$count" | tee -a dist/r47-full/LIBCALL-AUDIT.txt
          done

      - name: Generate full laboratory manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          d=Path('dist/r47-full')
          roms=[{'file':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
                for p in sorted(d.glob('*.bin'))]
          assert len(roms)>=42,(len(roms),[x['file'] for x in roms])
          notes={
            'purpose':'one large hardware/emulator test pack with every implemented R46/R47 standalone experiment',
            'rom_count':len(roms),
            'families':[
              'R46 primary through M2C play+perf',
              'R47 mul-bsp / mul-logic / combined play+perf',
              'R47 deterministic end-state hash control and multiply variants',
              'R45 ASM 4x4 control',
              'R47 flat-hoist, sprite-hoist, plane-pair and all factorial combinations play+perf',
              'R5/R6A safe/stress diagnostics'
            ],
            'plane_pair_policy':'gameplay WINDOW menus use black Plane B backing; native art mirrors A/B; pair patterns reload after static art',
            'not_faked_not_in_this_pack':[
              'R47 fixedmaps-8x8 own-ROM-font architecture',
              'R47D runtime 8x8 <-> plane-pair renderer toggle'
            ],
            'roms':roms
          }
          (d/'MANIFEST-R47-FULL.json').write_text(json.dumps(notes,indent=2)+'\n')
          (d/'README-TEST.txt').write_text(
              'R47 FULL LAB\n'
              'Test PLAY first for boot/menu/E1M1->E1M2/audio/graphics.\n'
              'Then run matching PERF ROMs to DEMO3 result screen.\n'
              'Highest-priority 4x4 chain: r45-asm -> flat -> pair -> flat-sprite-pair.\n'
              'State-hash ROMs are equivalence oracles; compare STATE HASH values, not FPS.\n'
          )
          print(json.dumps(notes,indent=2))
          PY

      - name: Upload one clean full artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: doom-md-r47-full-experiment-lab
          path: dist/r47-full/
          retention-days: 30
          if-no-files-found: error
          compression-level: 6
