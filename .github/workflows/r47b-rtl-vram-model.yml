name: R47B-RTL - upstream VRAM functional model and DMA write count
on:
  push:
    branches: [r47b-rtl-ym7101-busbench]
    paths:
      - 'scripts/lab/r47b_ym7101_vram_model_tb.sv'
      - 'scripts/lab/r47b_vram_ip_model.sv'
      - '.github/workflows/r47b-rtl-vram-model.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r47b-rtl-vram-model
  cancel-in-progress: true
jobs:
  ym7101-vram-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install Icarus on disposable hosted runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y iverilog
      - name: Fetch two pinned RTL files and verify Git blob SHA-1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/r47b-rtl
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request
          revision='becbdee78c48e6eb536871cd03c869f43d7afa4d'
          manifest={'ym7101.v':'0862948114ddb7abec87e46fdbb16d4fa2172804',
                    'ym_lib.v':'26fce976757bda2612e7ec0effcc93868660e108',
                    'vram.v':'c6f0769fe871bb22ff09d2051ba348a5134f17cf'}
          for file,expected in manifest.items():
              source=f'https://raw.githubusercontent.com/MiSTer-devel/MegaDrive_MiSTer/{revision}/rtl/nuked-md/{file}'
              raw=urllib.request.urlopen(source,timeout=45).read(500000)
              actual=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              assert actual==expected,(file,actual)
              pathlib.Path('dist/r47b-rtl',file).write_bytes(raw)
              print(f'PINNED RTL VERIFIED {file} gitblob={actual} bytes={len(raw)}')
          PY
      - name: Elaborate complete YM7101 port map against real RTL
        shell: bash
        run: |
          set -euo pipefail
          iverilog -g2012 -Wall -s r47b_ym7101_vram_model \
            -o dist/r47b-rtl/ym7101-vram-model.vvp \
            scripts/lab/r47b_ym7101_vram_model_tb.sv \
            dist/r47b-rtl/ym7101.v dist/r47b-rtl/ym_lib.v \
            dist/r47b-rtl/vram.v scripts/lab/r47b_vram_ip_model.sv
      - name: Run RTL stimulus and retain waveform
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s vvp dist/r47b-rtl/ym7101-vram-model.vvp | tee dist/r47b-rtl/simulation.log
          grep -F 'PASS: real YM7101 + upstream VRAM model observed' dist/r47b-rtl/simulation.log
          test -s dist/r47b-rtl/r47b_ym7101_vram_model.vcd
      - name: Preserve reports and waveforms (not upstream RTL license copy)
        if: always()
        shell: bash
        run: |
          rm -f dist/r47b-rtl/ym7101.v dist/r47b-rtl/ym_lib.v dist/r47b-rtl/vram.v dist/r47b-rtl/ym7101-vram-model.vvp
      - name: Upload YM7101 RTL VCD and simulation logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: doom-md-r47b-rtl-vram-model
          path: dist/r47b-rtl/
          retention-days: 30
          if-no-files-found: warn
